---
- name: "Debug Keepalived — Diagnosticar estado MASTER/MASTER"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: "OBTENER HOSTNAME"
      ansible.builtin.shell: hostname
      changed_when: false
      register: out_hostname

    - name: "PROCESOS KEEPALIVED"
      ansible.builtin.shell: ps aux | grep keepalived | grep -v grep || echo "SIN PROCESOS"
      changed_when: false
      register: out_procesos

    - name: "CONTENIDO DE keepalived.conf"
      ansible.builtin.shell: cat /etc/keepalived/keepalived.conf
      changed_when: false
      register: out_config

    - name: "ESTADO DE SERVICIO"
      ansible.builtin.shell: systemctl status keepalived --no-pager -l 2>&1 | head -20
      changed_when: false
      register: out_servicio

    - name: "ULTIMOS LOGS"
      ansible.builtin.shell: journalctl -u keepalived -n 30 --no-pager 2>&1
      changed_when: false
      register: out_logs

    - name: "INTERFACE ENS38"
      ansible.builtin.shell: ip addr show ens38 2>&1
      changed_when: false
      register: out_ens38

    - name: "IPTABLES VRRP"
      ansible.builtin.shell: iptables -L INPUT -n | grep 112 ; iptables -L OUTPUT -n | grep 112 ; echo "DONE"
      changed_when: false
      register: out_iptables

    - name: "TCPDUMP VRRP"
      ansible.builtin.shell: timeout 5 tcpdump -i ens38 -nn 'proto 112' -c 5 2>&1 || echo "Sin paquetes capturados"
      changed_when: false
      register: out_tcpdump
      ignore_errors: true

    - name: "RUTA A 10.0.0.2"
      ansible.builtin.shell: ip route get 10.0.0.2 2>&1 || echo "SIN RUTA"
      changed_when: false
      register: out_ruta_peer

    - name: "DIAGNOSTICO FINAL"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "DIAGNOSTICO KEEPALIVED"
          - "============================================================"
          - ""
          - "HOSTNAME: {{ out_hostname.stdout }}"
          - ""
          - "ESTADO DE SERVICIO:"
          - "{{ out_servicio.stdout }}"
          - ""
          - "PROCESOS:"
          - "{{ out_procesos.stdout }}"
          - ""
          - "CONFIG keepalived.conf:"
          - "{{ out_config.stdout }}"
          - ""
          - "ENS38:"
          - "{{ out_ens38.stdout }}"
          - ""
          - "RUTA A 10.0.0.2:"
          - "{{ out_ruta_peer.stdout }}"
          - ""
          - "IPTABLES VRRP:"
          - "{{ out_iptables.stdout }}"
          - ""
          - "TCPDUMP VRRP:"
          - "{{ out_tcpdump.stdout }}"
          - ""
          - "LOGS:"
          - "{{ out_logs.stdout }}"
          - "============================================================"