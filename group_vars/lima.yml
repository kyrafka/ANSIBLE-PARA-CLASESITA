# --- Interlink entre Cores ---
interlink_subnet: "10.0.0.0/30"
core1_interlink: "10.0.0.1"
core2_interlink: "10.0.0.2"

# --- Interfaces Core 1 (Maestro) ---
core1_interfaces:
  nic_trunk1: "ens34"
  nic_trunk2: "ens42"
  nic_int: "ens36"
  bonded_nics: ["ens37", "ens40"]
  lan_ip: "192.168.10.20/24"

# --- Interfaces Core 2 (Backup) ---
core2_interfaces:
  nic_trunk1: "ens42"
  nic_trunk2: "ens34"
  nic_int: "ens36"
  bonded_nics: ["ens40", "ens39"]
  lan_ip: "192.168.10.30/24"

# --- Keepalived ---
keepalived_auth_pass: "AN3IBL3P4SS"
keepalived_unicast_src_core1: "10.0.0.1"
keepalived_unicast_peer_core1: "10.0.0.2"
keepalived_unicast_src_core2: "10.0.0.2"
keepalived_unicast_peer_core2: "10.0.0.1"

# --- OSPF ---
ospf_area: "0.0.0.0"
