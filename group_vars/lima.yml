---
# ============================================================================
# group_vars/lima.yml — Variables específicas de la sede Lima (Maestra)
# ============================================================================

sede: "lima"
sede_id: 1
site_code: "LIM"

# --- Rango DHCP de Lima ---
dhcp_ranges:
  - start: "192.168.12.50"
    end: "192.168.12.200"
    subnet: "192.168.12.0/25"
    gateway: "192.168.12.1"

# --- Rango de monitoreo ---
monitoring_subnet: "192.168.17.0/27"

# --- Servicios web en Lima ---
web_servers:
  - name: "vm-web01"
    ip: "192.168.11.11"
    vlans: [10, 30]

# --- VLANs de Lima con sus IPs fijas ---
vlans_lima:
