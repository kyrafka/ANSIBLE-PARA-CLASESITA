---
# ============================================================================
# tests/run_all.yml
# ============================================================================
# Ejecuta TODOS los tests unitarios en secuencia, uno por uno
# Uso:
#   ansible-playbook tests/run_all.yml -e "core_id=core1"
#   ansible-playbook tests/run_all.yml -e "core_id=core2"
#
# También podés ejecutar cada test INDIVIDUALMENTE:
#   ansible-playbook tests/networking/test_bridges.yml -e "core_id=core1"
#   ansible-playbook tests/ospf/test_ospf.yml -e "ospf_peer_ip=192.168.13.5"
#   ansible-playbook tests/keepalived/test_vrrp.yml -e "core_state=MASTER"
# ============================================================================

- name: "TEST — Suite completa de tests"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    core_id: "core1"
    ospf_peer: "{{ '192.168.13.5' if core_id == 'core1' else '192.168.13.4' }}"

  tasks:
    - name: "=========================================="
      ansible.builtin.debug:
        msg: "INICIANDO SUITE DE TESTS — Core: {{ core_id | upper }}"

    - name: "==> TEST 1/4: Redes (bridges, VLANs, IPs)"
      ansible.builtin.debug:
        msg: "==> TEST 1/4: Redes"

    - name: "TEST 1 — Ejecutar test de redes"
      ansible.builtin.shell: >
        sudo ansible-playbook
        tests/networking/test_bridges.yml
        -e "core_id={{ core_id }}"
        --connection=local
      register: result_bridges
      failed_when: false

    - name: "TEST 1 — Resultado"
      ansible.builtin.debug:
        msg: "{{ result_bridges.stdout_lines[-20:] | default(result_bridges.stdout) }}"

    - name: "=========================================="
      ansible.builtin.debug:
        msg: ""

    - name: "==> TEST 2/4: OSPF (vecino, rutas)"
      ansible.builtin.debug:
        msg: "==> TEST 2/4: OSPF"

    - name: "TEST 2 — Ejecutar test OSPF"
      ansible.builtin.shell: >
        sudo ansible-playbook
        tests/ospf/test_ospf.yml
        -e "ospf_peer_ip={{ ospf_peer }}"
        -e "core_id={{ core_id }}"
        --connection=local
      register: result_ospf
      failed_when: false

    - name: "TEST 2 — Resultado"
      ansible.builtin.debug:
        msg: "{{ result_ospf.stdout_lines[-20:] | default(result_ospf.stdout) }}"

    - name: "=========================================="
      ansible.builtin.debug:
        msg: ""

    - name: "==> TEST 3/4: VRRP (prioridades, split-brain)"
      ansible.builtin.debug:
        msg: "==> TEST 3/4: VRRP"

    - name: "TEST 3 — Ejecutar test VRRP en modo MASTER"
      ansible.builtin.shell: >
        sudo ansible-playbook
        tests/keepalived/test_vrrp.yml
        -e "core_state=MASTER"
        --connection=local
      register: result_vrrp
      failed_when: false

    - name: "TEST 3 — Resultado"
      ansible.builtin.debug:
        msg: "{{ result_vrrp.stdout_lines[-20:] | default(result_vrrp.stdout) }}"

    - name: "=========================================="
      ansible.builtin.debug:
        msg: ""

    - name: "==> TEST 4/4: FRR (rutas learned)"
      ansible.builtin.debug:
        msg: "==> TEST 4/4: FRR"

    - name: "TEST 4 — Ejecutar test FRR"
      ansible.builtin.shell: >
        sudo ansible-playbook
        tests/frr/test_frr.yml
        -e "core_id={{ core_id }}"
        --connection=local
      register: result_frr
      failed_when: false

    - name: "TEST 4 — Resultado"
      ansible.builtin.debug:
        msg: "{{ result_frr.stdout_lines[-20:] | default(result_frr.stdout) }}"

    - name: "=========================================="
      ansible.builtin.debug:
        msg: ""

    - name: "==> SUITE COMPLETA FINALIZADA"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════
          SUITE DE TESTS COMPLETADA
          Core: {{ core_id | upper }}
          Hora: {{ ansible_date_time.iso8601 }}
          ═══════════════════════════════════════════════════════════
          Revisar output de cada test.
          Si hay FAILs, ver docs/troubleshooting/split_brain.md