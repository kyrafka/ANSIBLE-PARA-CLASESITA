---
# ============================================================================
# tests/run_all.yml
# ============================================================================
# Ejecuta TODOS los tests unitarios en orden
# Uso:
#   ansible-playbook tests/run_all.yml
#   ansible-playbook tests/run_all.yml -e "core_id=core1"
# ============================================================================

- name: "TEST — Suite completa de tests"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    core_id: "core1"
    core_suffix: "{{ '4' if core_id == 'core1' else '5' }}"
    ospf_peer: "{{ '192.168.13.5' if core_id == 'core1' else '192.168.13.4' }}"

  tasks:
    - name: "============================================================="
      ansible.builtin.debug:
        msg: "╔═══════════════════════════════════════════════════════════════╗║  INICIANDO SUITE DE TESTS COMPLETA                                  ║║  Core: {{ core_id | upper }}                                                          ║╚═══════════════════════════════════════════════════════════════╝"

    - name: "============================================================="
      ansible.builtin.debug:
        msg: "--------------------------------------------------------------"
    - name: "==> TEST 1/3: Redes (bridges, VLANs, IPs)"
      ansible.builtin.debug:
        msg: "==> TEST 1/3: Redes (bridges, VLANs, IPs)"

    - name: "TEST 1 — Redes"
      ansible.builtin.include_tasks:
        file: networking/test_bridges.yml

    - name: "============================================================="
      ansible.builtin.debug:
        msg: "--------------------------------------------------------------"
    - name: "==> TEST 2/3: OSPF (vecino, rutas)"
      ansible.builtin.debug:
        msg: "==> TEST 2/3: OSPF (vecino, rutas)"

    - name: "TEST 2 — OSPF"
      ansible.builtin.include_tasks:
        file: ospf/test_ospf.yml

    - name: "============================================================="
      ansible.builtin.debug:
        msg: "--------------------------------------------------------------"
    - name: "==> TEST 3/3: VRRP (prioridades, split-brain)"
      ansible.builtin.debug:
        msg: "==> TEST 3/3: VRRP (prioridades, split-brain)"

    - name: "TEST 3 — VRRP"
      ansible.builtin.include_tasks:
        file: keepalived/test_vrrp.yml

    - name: "============================================================="
      ansible.builtin.debug:
        msg: "--------------------------------------------------------------"
    - name: "==> TEST 4/4: FRR (rutas learned)"
      ansible.builtin.debug:
        msg: "==> TEST 4/4: FRR (rutas learned)"

    - name: "TEST 4 — FRR"
      ansible.builtin.include_tasks:
        file: frr/test_frr.yml

    - name: "============================================================="
      ansible.builtin.debug:
        msg: "--------------------------------------------------------------"
    - name: "==> SUITE COMPLETA FINALIZADA"
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════════════════════════════════╗
          ║  SUITE DE TESTS COMPLETADA                                       ║
          ║  Core: {{ core_id | upper }} ({{ inventory_hostname }})                             ║
          ║  Hora: {{ ansible_date_time.iso8601 }}                                ║
          ║                                                                  ║
          ║  Revisar output de cada test para detalles.                      ║
          ║  Si hay FAILs, ver docs/troubleshooting/split_brain.md           ║
          ╚═══════════════════════════════════════════════════════════════════╝"