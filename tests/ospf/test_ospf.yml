---
# ============================================================================
# tests/ospf/test_ospf.yml
# ============================================================================
# Prueba unitaria: Verifica OSPF tiene vecino FULL y rutas aprendidas
# ============================================================================

- name: "TEST — OSPF: Verificar vecino y rutas"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Se pasa como: -e "ospf_peer_ip=192.168.13.5"
    ospf_peer_ip: "192.168.13.5"
    core_id: "core1"

  tasks:
    - name: "TEST OSPF — 1) FRR corriendo"
      ansible.builtin.systemd:
        name: frr
        state: started
      register: frr_service

    - name: "TEST OSPF — Estado"
      ansible.builtin.debug:
        msg: "FRR: {{ frr_service.status.ActiveState | default('unknown') }}"

    - name: "TEST OSPF — 2) Mostrar vecinos OSPF"
      ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
      changed_when: false
      register: ospf_neighbors

    - name: "TEST OSPF — Vecinos"
      ansible.builtin.debug:
        msg: "{{ ospf_neighbors.stdout }}"

    - name: "TEST OSPF — 3) Hay vecino FULL?"
      ansible.builtin.assert:
        that: "('Full' in ospf_neighbors.stdout or 'FULL' in ospf_neighbors.stdout)"
        fail_msg: "ERROR: No hay vecino OSPF FULL. Revisar interlink br30 y que FRR esté corriendo."
        success_msg: "OK: Vecino OSPF en estado FULL"

    - name: "TEST OSPF — 4) Rutas aprendidas"
      ansible.builtin.command: vtysh -c 'show ip ospf route'
      changed_when: false
      register: ospf_routes

    - name: "TEST OSPF — Rutas"
      ansible.builtin.debug:
        msg: "{{ ospf_routes.stdout }}"

    - name: "TEST OSPF — 5) Ping al peer OSPF por br30"
      ansible.builtin.command: "ping -c 3 -W 2 {{ ospf_peer_ip }}"
      changed_when: false
      register: ping_peer
      failed_when: false

    - name: "TEST OSPF — Ping result"
      ansible.builtin.debug:
        msg: "Ping a {{ ospf_peer_ip }}: {{ 'OK' if ping_peer.rc == 0 else 'FALLO' }}"

    - name: "TEST OSPF — RESULTADO"
      ansible.builtin.debug:
        msg: "TEST OSPF COMPLETADO para {{ core_id | upper }}"