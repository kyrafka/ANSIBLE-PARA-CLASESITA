---
# ============================================================================
# tests/networking/test_bridges.yml
# ============================================================================
# Prueba unitaria: Verifica que los bridges están levantados con las IPs correctas
# Ejecutar en cada Core después de aplicar netplan
# ============================================================================

- name: "TEST — Redes: Verificar bridges y IPs"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    expected_bridges:
      - {name: "br10", ip_prefix: "192.168.11.", vlan: 10}
      - {name: "br20", ip_prefix: "192.168.12.", vlan: 20}
      - {name: "br21", ip_prefix: "192.168.21.", vlan: 21}
      - {name: "br30", ip_prefix: "192.168.13.", vlan: 30}
      - {name: "br40", ip_prefix: "192.168.14.", vlan: 40}
      - {name: "br50", ip_prefix: "192.168.15.", vlan: 50}
      - {name: "br60", ip_prefix: "192.168.16.", vlan: 60}
      - {name: "br70", ip_prefix: "192.168.17.", vlan: 70}

    # Se pasa como: -e "core_id=core1" → suffix=4, core2 → suffix=5
    core_id: "core1"

  tasks:
    - name: "TEST — 1) Estado de interfaces"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: interfaces_raw

    - name: "TEST — Mostrar estado"
      ansible.builtin.debug:
        msg: "{{ interfaces_raw.stdout }}"

    - name: "TEST — 2) Verificar que cada bridge existe"
      ansible.builtin.assert:
        that:
          - "item.name in interfaces_raw.stdout"
        fail_msg: "BRIDGE FALLO: {{ item.name }} no existe"
        success_msg: "OK: {{ item.name }}"
      loop: "{{ expected_bridges }}"

    - name: "TEST — 3) Verificar IP correcta del core en cada bridge"
      ansible.builtin.assert:
        that:
          - "item.ip_prefix + ('4' if core_id == 'core1' else '5') in interfaces_raw.stdout"
        fail_msg: "{{ item.name }}: IP incorrecta. Esperado: {{ item.ip_prefix }}{{ '4' if core_id == 'core1' else '5' }}"
        success_msg: "{{ item.name }}: IP correcta"
      loop: "{{ expected_bridges }}"

    - name: "TEST — 4) Verificar VLAN sub-interfaces"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: vlan_check

    - name: "TEST — Todas las VLANs (10-70) presentes"
      ansible.builtin.assert:
        that: "item in vlan_check.stdout"
        fail_msg: "VLAN {{ item }} no encontrada"
        success_msg: "OK: VLAN {{ item }}"
      loop: [10, 20, 21, 30, 40, 50, 60, 70]

    - name: "TEST — RESULTADO FINAL"
      ansible.builtin.debug:
        msg: |
          TEST DE REDES COMPLETADO
          Core: {{ core_id | upper }}
          Esperado: .{{ '4' if core_id == 'core1' else '5' }}
          Bridges: {{ expected_bridges | map(attribute='name') | list }}