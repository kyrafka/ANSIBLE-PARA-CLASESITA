---
# ============================================================================
# tests/keepalived/test_vrrp_heartbeat.yml
# ============================================================================
# Test exhaustivo del flujo VRRP/heartbeat entre ambos Cores
# Detecta exactamente dónde se detiene o falla la comunicación
#
# Uso:
#   ansible-playbook tests/keepalived/test_vrrp_heartbeat.yml
#
# Ejecutar en AMBOS cores y comparar resultados
# ============================================================================

- name: "TEST VRRP — Diagnóstico completo de heartbeat"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    interlink_interface: "ens36"
    # Core1 → peer es 10.0.0.2 (Core2)
    # Core2 → peer es 10.0.0.1 (Core1)
    test_peer: "10.0.0.2"

  tasks:
    # =========================================================================
    # PASO 1 — Verificaciones de red básicas
    # =========================================================================

    - name: "TEST HB — 1.1) Interlinks y bridges"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: interfaces_raw

    - name: "TEST HB — Resultado"
      ansible.builtin.debug:
        msg: "{{ interfaces_raw.stdout }}"

    - name: "TEST HB — 1.2) Ping al peer por interlink"
      ansible.builtin.command: "ping -c 3 -W 2 -I ens36 {{ test_peer }}"
      changed_when: false
      register: ping_test
      failed_when: false

    - name: "TEST HB — Ping"
      ansible.builtin.debug:
        msg: "Ping a {{ test_peer }}: {{ 'OK' if ping_test.rc == 0 else 'FALLO' }}"

    - name: "TEST HB — Ping FALLA?"
      ansible.builtin.assert:
        that: "ping_test.rc == 0"
        fail_msg: "ERROR: El interlink no funciona."
        success_msg: "OK: Interlink funciona"

    # =========================================================================
    # PASO 2 — Firewall
    # =========================================================================

    - name: "TEST HB — 2.1) Reglas INPUT"
      ansible.builtin.shell: sudo iptables -L INPUT -n -v | head -20
      changed_when: false
      register: iptables_input
      failed_when: false

    - name: "TEST HB — INPUT"
      ansible.builtin.debug:
        msg: "{{ iptables_input.stdout }}"

    - name: "TEST HB — 2.2) Verificar proto 112 en firewall"
      ansible.builtin.shell: |
        sudo iptables -C INPUT -p 112 -j ACCEPT 2>/dev/null && echo "PERMITIDO" || echo "BLOQUEADO"
      changed_when: false
      register: vrrp_input_check
      failed_when: false

    - name: "TEST HB — VRRP en INPUT"
      ansible.builtin.debug:
        msg: "Proto 112 en INPUT: {{ vrrp_input_check.stdout }}"

    - name: "TEST HB — ABRIR firewall VRRP"
      ansible.builtin.shell: |
        sudo iptables -I INPUT -p 112 -j ACCEPT 2>/dev/null || true
        sudo iptables -I OUTPUT -p 112 -j ACCEPT 2>/dev/null || true
        echo "Firewall VRRP abierto"
      changed_when: false
      register: firewall_open
      failed_when: false

    - name: "TEST HB — Firewall"
      ansible.builtin.debug:
        msg: "{{ firewall_open.stdout }}"

    # =========================================================================
    # PASO 3 — Captura VRRP en interlink
    # =========================================================================

    - name: "TEST HB — 3.1) Capturar paquetes VRRP en interlink (5 segundos)"
      ansible.builtin.shell: |
        echo "Capturando VRRP en {{ interlink_interface }}..."
        sudo timeout 5 tcpdump -i {{ interlink_interface }} -c 10 -nn 'ip[9] == 112' 2>&1 | tee /tmp/vrrp_capture.log
        cat /tmp/vrrp_capture.log
      changed_when: false
      register: vrrp_capture
      failed_when: false

    - name: "TEST HB — Paquetes capturados"
      ansible.builtin.debug:
        msg: "{{ vrrp_capture.stdout }}"

    - name: "TEST HB — 3.2) Conteo de paquetes VRRP"
      ansible.builtin.shell: |
        count=$(grep -c "VRRP\|112" /tmp/vrrp_capture.log 2>/dev/null || echo 0)
        echo "Paquetes VRRP detectados: $count"
        if [ "$count" -gt 0 ]; then
          echo "RESULTADO:HAY_PAQUETES"
        else
          echo "RESULTADO:SIN_PAQUETES"
        fi
      changed_when: false
      register: vrrp_count
      failed_when: false

    - name: "TEST HB — Conteo"
      ansible.builtin.debug:
        msg: "{{ vrrp_count.stdout }}"

    - name: "TEST HB — 3.3) Resultado del capture"
      ansible.builtin.debug:
        msg: |
          {{ vrrp_count.stdout }}
          {{ 'ERROR: Sin paquetes VRRP detectados!' if 'SIN_PAQUETES' in vrrp_count.stdout else 'OK: Paquetes VRRP detectados' }}

    # =========================================================================
    # PASO 4 — Estado de Keepalived
    # =========================================================================

    - name: "TEST HB — 4.1) Servicio keepalived"
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: kal_status

    - name: "TEST HB — Estado"
      ansible.builtin.debug:
        msg: "Keepalived: {{ kal_status.status.ActiveState | default('unknown') }}"

    - name: "TEST HB — 4.2) Logs VRRP recientes"
      ansible.builtin.shell: sudo tail -100 /var/log/syslog | grep -i 'vrrp\|keepalived' | tail -20
      changed_when: false
      register: vrrp_logs
      failed_when: false

    - name: "TEST HB — Logs"
      ansible.builtin.debug:
        msg: "{{ vrrp_logs.stdout }}"

    - name: "TEST HB — 4.3) Transiciones a MASTER"
      ansible.builtin.shell: sudo tail -200 /var/log/syslog | grep -i 'master' | tail -10
      changed_when: false
      register: master_logs
      failed_when: false

    - name: "TEST HB — MASTER logs"
      ansible.builtin.debug:
        msg: "{{ master_logs.stdout }}"

    - name: "TEST HB — 4.4) Configuración VRRP instances"
      ansible.builtin.shell: sudo grep -A3 'vrrp_instance' /etc/keepalived/keepalived.conf | grep -E 'vrrp_instance|state|priority|interface' | head -40
      changed_when: false
      register: vrrp_instances
      failed_when: false

    - name: "TEST HB — VRRP instances"
      ansible.builtin.debug:
        msg: "{{ vrrp_instances.stdout }}"

    # =========================================================================
    # PASO 5 — VIPs actuales
    # =========================================================================

    - name: "TEST HB — 5.1) Bridges actuales"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: all_bridges

    - name: "TEST HB — Bridges"
      ansible.builtin.debug:
        msg: "{{ all_bridges.stdout }}"

    - name: "TEST HB — 5.2) VIPs activas"
      ansible.builtin.shell: ip -br a | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.1/[0-9]+'
      changed_when: false
      register: vips_active
      failed_when: false

    - name: "TEST HB — VIPs"
      ansible.builtin.debug:
        msg: "{{ vips_active.stdout | default('Ninguna') }}"

    # =========================================================================
    # PASO 6 — Reiniciar keepalived y verificar
    # =========================================================================

    - name: "TEST HB — 6.1) Reiniciar keepalived para forzar election"
      ansible.builtin.systemd:
        name: keepalived
        state: restarted
        daemon_reload: yes

    - name: "TEST HB — Esperar 8 segundos"
      ansible.builtin.pause:
        seconds: 8

    - name: "TEST HB — 6.2) Bridges después del restart"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: after_restart

    - name: "TEST HB — Resultado bridges"
      ansible.builtin.debug:
        msg: "{{ after_restart.stdout }}"

    - name: "TEST HB — 6.3) VIPs después del restart"
      ansible.builtin.shell: ip -br a | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.1/[0-9]+'
      changed_when: false
      register: vips_after
      failed_when: false

    - name: "TEST HB — VIPs finales"
      ansible.builtin.debug:
        msg: "{{ vips_after.stdout | default('Ninguna') }}"

    # =========================================================================
    # RESULTADO FINAL
    # =========================================================================

    - name: "TEST HB — RESUMEN"
      ansible.builtin.debug:
        msg: |
          ============================================================
          TEST DE HEARTBEAT VRRP
          ============================================================
          Peer: {{ test_peer }}
          Ping interlink: {{ 'OK' if ping_test.rc == 0 else 'FALLO' }}
          Paquetes VRRP: {{ vrrp_count.stdout }}
          VIPs (.1): {{ vips_after.stdout | default('Ninguna') }}
          Keepalived: {{ kal_status.status.ActiveState | default('unknown') }}
          ============================================================