---
# ============================================================================
# tests/keepalived/test_vrrp.yml
# ============================================================================
# Prueba unitaria: Verifica estado VRRP y detecta split-brain
#
# Usage:
#   ansible-playbook tests/keepalived/test_vrrp.yml -e "core_state=MASTER"  # En Core 1
#   ansible-playbook tests/keepalived/test_vrrp.yml -e "core_state=BACKUP"  # En Core 2
# ============================================================================

- name: "TEST — VRRP: Verificar estado y ausencia de split-brain"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    core_state: "MASTER"
    expected_priority: "{{ '200' if core_state == 'MASTER' else '100' }}"

  tasks:
    - name: "TEST VRRP — 1) Keepalived corriendo"
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: kal_service

    - name: "TEST VRRP — Estado"
      ansible.builtin.debug:
        msg: "Keepalived: {{ kal_service.status.ActiveState | default('unknown') }}"

    - name: "TEST VRRP — 2) Logs recientes de VRRP"
      ansible.builtin.shell: grep -i 'vrrp\|keepalived' /var/log/syslog | tail -20
      changed_when: false
      register: vrrp_logs
      failed_when: false

    - name: "TEST VRRP — Logs"
      ansible.builtin.debug:
        msg: "{{ vrrp_logs.stdout }}"

    - name: "TEST VRRP — 3) Todas las IPs en bridges"
      ansible.builtin.command: ip -br a
      changed_when: false
      register: all_ips

    - name: "TEST VRRP — IPs"
      ansible.builtin.debug:
        msg: "{{ all_ips.stdout }}"

    - name: "TEST VRRP — 4) VIPs activas (.1)"
      ansible.builtin.shell: ip -br a | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.1/[0-9]+'
      changed_when: false
      register: vip_addresses
      failed_when: false

    - name: "TEST VRRP — VIPs"
      ansible.builtin.debug:
        msg: "{{ vip_addresses.stdout | default('Ninguna') }}"

    - name: "TEST VRRP — 5) Prioridad configurada"
      ansible.builtin.shell: grep -E '^\s*priority\s+' /etc/keepalived/keepalived.conf | head -3
      changed_when: false
      register: priority_check
      failed_when: false

    - name: "TEST VRRP — Prioridad"
      ansible.builtin.debug:
        msg: "{{ priority_check.stdout | default('No encontrada') }}"

    - name: "TEST VRRP — 6) Validar según estado esperado"
      block:
        - name: "MASTER debe tener VIPs activas"
          ansible.builtin.assert:
            that: "'.1' in all_ips.stdout"
            fail_msg: "ALERTA: MASTER sin VIPs! Problema grave."
            success_msg: "OK: MASTER tiene VIPs activas"
          when: core_state == "MASTER"

        - name: "BACKUP NO debe tener VIPs"
          ansible.builtin.assert:
            that: "'.1' not in all_ips.stdout or vip_addresses.stdout == ''"
            fail_msg: |
              ALERTA SPLIT-BRAIN: BACKUP tiene VIPs activas!
              Esto significa que ambos cores están en MASTER.
              Solución: sudo systemctl restart systemd-networkd && sudo systemctl restart keepalived
            success_msg: "OK: BACKUP no tiene VIPs (correcto)"
          when: core_state == "BACKUP"
      rescue:
        - name: "TEST — ALERTA SPLIT-BRAIN"
          ansible.builtin.debug:
            msg: |
              PROBLEMA DETECTADO: Ambos cores tienen VIPs!
              Ejecutar en BACKUP: sudo systemctl restart systemd-networkd && sudo systemctl restart keepalived

    - name: "TEST VRRP — RESULTADO"
      ansible.builtin.debug:
        msg: |
          TEST VRRP COMPLETADO
          Core: {{ inventory_hostname }}
          Estado esperado: {{ core_state }}
          Prioridad esperada: {{ expected_priority }}
          VIPs activas: {{ vip_addresses.stdout_lines | length }}