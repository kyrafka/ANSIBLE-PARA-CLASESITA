---
# =============================================================================
# core2_setup.yml — Configurador de Core 2 (Keepalived BACKUP)
# =============================================================================
# Full HA: Bonded LANs + 2x Trunks + Interlink
# SWITCH L2 sin IPs en bridges — todo gateway es pfSense
# =============================================================================

- name: "Configura Core 2 — Keepalived BACKUP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core2"
    core_state: "BACKUP"
    core_priority: 100
    core_ip_suffix: 5

    # INTERFACES (Mapeo REAL de tu ESXi):
    nic_trunk1: "ens36"     # Trunk 1 — pfSense Master
    nic_trunk2: "ens37"     # Trunk 2 — pfSense Backup
    nic_int: "ens38"        # Interlink físico (Core 2 ↔ Core 1)

    # SWITCH L2: sin IPs en bridges, todo gateway es pfSense
    assign_bridge_ips: false

    # LAN INTERFACES (Bonding HA):
    bonded_nics:
      - "ens34"     # LAN-1 — pfSense
      - "ens35"     # LAN-2 — pfSense
    lan_ip: "192.168.10.30/24"
    lan_gateway: "192.168.10.1"

    # INTERLINK para monitoreo/estado HA del otro core:
    core_unicast_src_ip: "10.0.0.2"
    core_unicast_peer_ip: "10.0.0.1"

    # IDENTIDAD OSPF (solo para monitoreo LAN interna)
    core_router_id: "10.0.0.2"

  pre_tasks:
    - name: "NUCLEAR — Backup y destruir red actual completamente"
      ansible.builtin.shell: |
        # Backup
        BKP="/听众/netplan-nuclear-$(date +%s)"
        cp -r /etc/netplan "$BKP" 2>/dev/null || true
        echo "Backup en $BKP"
        
        # Destruir TODOS los bridges
        for br in $(ip link show type bridge 2>/dev/null | awk '/^[0-9]+: br/{print $2}' | sed 's/://'); do
          ip link set "$br" down 2>/dev/null || true
          ip link delete "$br" 2>/dev/null || true
        done
        
        # Destruir VLANs
        for vlan in $(ip link show type vlan 2>/dev/null | awk '/^[0-9]+: v/{print $2}' | sed 's/://'); do
          ip link delete "$vlan" 2>/dev/null || true
        done
        
        # Borrar TODA config netplan vieja
        rm -f /etc/netplan/*.yaml
        rm -f /run/systemd/network/*.network 2>/dev/null || true
        rm -f /etc/systemd/network/*.network 2>/dev/null || true
        
        # Reiniciar systemd para que olvide todo
        systemctl restart systemd-networkd 2>/dev/null || true
        
        echo "NUCLEAR-DONE"
      changed_when: false
      ignore_errors: true

  roles:
    - linux_core

  post_tasks:
    - name: "POST-APPLY — Reiniciar systemd-networkd para limpiar caché"
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
      ignore_errors: true