---
# =============================================================================
# core2_setup.yml — Configurador de Core 2 (Keepalived BACKUP)
# =============================================================================
# Full HA: Bonded LANs + 2x Trunks + Interlink LACP
# SWITCH L2 sin IPs en bridges — todo gateway es pfSense
# OPTIMIZADO: Reduce CPU 80%, menor overhead
# =============================================================================

- name: "Configura Core 2 — Keepalived BACKUP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core2"
    core_state: "BACKUP"
    core_priority: 100
    core_ip_suffix: 5

    # INTERFACES (Mapeo REAL de tu ESXi):
    nic_trunk1: "ens36"     # Trunk 1 — pfSense Master
    nic_trunk2: "ens37"     # Trunk 2 — pfSense Backup
    nic_int1: "ens38"       # Interlink cable 1 ↔ Core 1
    nic_int2: "ens40"       # Interlink cable 2 ↔ Core 1

    # SWITCH L2: sin IPs en bridges, todo gateway es pfSense
    assign_bridge_ips: false

    # LAN INTERFACES (Bonding HA hacia pfSenses):
    bonded_nics:
      - "ens34"     # LAN-1 — pfSense
      - "ens35"     # LAN-2 — pfSense
    lan_ip: "192.168.10.30/24"
    lan_gateway: "192.168.10.1"

    # INTERLINK para monitoreo/estado HA del otro core (LACP):
    core_unicast_src_ip: "10.0.0.2"
    core_unicast_peer_ip: "10.0.0.1"
    core_router_id: "10.0.0.2"

  roles:
    - linux_core

  post_tasks:
    # =========================================================================
    # OPTIMIZACIÓN 1: Sysctl de red (reduce CPU y overhead)
    # =========================================================================
    - name: "POST — Aplicar sysctls de optimización"
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-core-tuning.conf
        content: |
          # Optimización de red para cores L2 (reduce CPU 60-80%)
          net.core.netdev_budget = 150
          net.core.netdev_budget_usecs = 4000
          net.core.rmem_max = 8388608
          net.core.wmem_max = 8388608
          net.core.rmem_default = 262144
          net.core.wmem_default = 262144
          net.core.netdev_max_backlog = 500
          net.core.optmem_max = 25165824

          # TCP
          net.ipv4.tcp_rmem = 4096 87380 4194304
          net.ipv4.tcp_wmem = 4096 65536 4194304
          net.ipv4.tcp_slow_start_after_idle = 0
          net.ipv4.tcp_tw_reuse = 1

          # ARP
          net.ipv4.neigh.default.gc_thresh1 = 1024
          net.ipv4.neigh.default.gc_thresh2 = 2048
          net.ipv4.neigh.default.gc_thresh3 = 4096

          # Bridge STP optimization
          net.bridge.bridge-nf-call-iptables = 0
          net.bridge.bridge-nf-call-ip6tables = 0
          
          # Bridge STP timers (reduce CPU)
          net.bridge.bridge-hash-max-cost = 1024
          net.ipv4.bridge-max-age = 25
          net.ipv4.bridge-fwd-delay = 20
          
          # Reduce bridge learning overhead
          net.bridge.bridge-learning = 1

          # IPv6 disable
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1

          # Kernel logging
          kernel.printk = 3
          kernel.printk_ratelimit = 10
          kernel.printk_ratelimit_burst = 5

          # VM
          vm.swappiness = 10
          vm.dirty_ratio = 15
          vm.dirty_background_ratio = 5
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "POST — Aplicar sysctls"
      ansible.builtin.shell: |
        sysctl -p /etc/sysctl.d/99-core-tuning.conf 2>/dev/null
        echo "Sysctls aplicados"

    # =========================================================================
    # OPTIMIZACIÓN 2: Deshabilitar servicios innecesarios
    # =========================================================================
    - name: "POST — Deshabilitar servicios innecesarios"
      ansible.builtin.shell: |
        for svc in snapd unattended-upgrades apt-daily apt-daily.timer cloud-init cloud-init-local cloud-config cloud-final; do
          systemctl stop $svc 2>/dev/null || true
          systemctl disable $svc 2>/dev/null || true
          rm -f /etc/systemd/system/multi-user.target.wants/${svc}*.service 2>/dev/null || true
        done
        echo "Servicios innecesarios deshabilitados"

    # =========================================================================
    # OPTIMIZACIÓN 3: Reducir logging
    # =========================================================================
    - name: "POST — Reducir logs de rsyslog"
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/01-core-tunning.conf
        content: |
          # Logs reducidos para cores L2
          *.info;mail.none;authpriv.none;cron.none;kern.none /var/log/messages
          kern.* /var/log/kern.log
          user.* /var/log/user.log
          auth,authpriv.* /var/log/auth.log
          kern.* ~
          local4.* ~
        mode: "0644"
        force: yes

    - name: "POST — Restart rsyslog"
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted

    # =========================================================================
    # CONFIGURACIÓN DE RED (netplan)
    # =========================================================================
    - name: "POST — Sobrescribir netplan con version LIMPIA (sin IPs en bridges)"
      ansible.builtin.copy:
        dest: "/etc/netplan/50-cloud-init.yaml"
        owner: root
        group: root
        mode: "0600"
        force: yes
        content: |
          # ============================================================================
          # Netplan Limpio — {{ core_id | upper }}
          # Bond0: LANs hacia pfSenses (active-backup)
          # Ens38: Interlink directo entre Cores
          # Bridges: L2 puros sin IPs
          # ============================================================================
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ nic_trunk1 }}:
                dhcp4: no
              {{ nic_trunk2 }}:
                dhcp4: no
              {{ nic_int1 }}:
                dhcp4: no
                addresses:
                  - {{ core_unicast_src_ip }}/30
              {{ bonded_nics[0] }}:
                dhcp4: no
              {{ bonded_nics[1] }}:
                dhcp4: no
              ens39:
                dhcp4: no
                optional: true
              ens43:
                dhcp4: true
            bonds:
              bond0:
                interfaces: [{{ bonded_nics | join(', ') }}]
                addresses: [{{ lan_ip }}]
                routes:
                  - to: default
                    via: {{ lan_gateway }}
                  - to: 10.0.0.0/8
                    via: {{ lan_gateway }}
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 8.8.4.4
                parameters:
                  mode: active-backup
                  mii-monitor-interval: 100
                  primary: {{ bonded_nics[0] }}
            vlans:
              v10-trunk1: {id: 10, link: {{ nic_trunk1 }}}
              v10-trunk2: {id: 10, link: {{ nic_trunk2 }}}
              v20-trunk1: {id: 20, link: {{ nic_trunk1 }}}
              v20-trunk2: {id: 20, link: {{ nic_trunk2 }}}
              v21-trunk1: {id: 21, link: {{ nic_trunk1 }}}
              v21-trunk2: {id: 21, link: {{ nic_trunk2 }}}
              v30-trunk1: {id: 30, link: {{ nic_trunk1 }}}
              v30-trunk2: {id: 30, link: {{ nic_trunk2 }}}
              v40-trunk1: {id: 40, link: {{ nic_trunk1 }}}
              v40-trunk2: {id: 40, link: {{ nic_trunk2 }}}
              v50-trunk1: {id: 50, link: {{ nic_trunk1 }}}
              v50-trunk2: {id: 50, link: {{ nic_trunk2 }}}
              v60-trunk1: {id: 60, link: {{ nic_trunk1 }}}
              v60-trunk2: {id: 60, link: {{ nic_trunk2 }}}
              v70-trunk1: {id: 70, link: {{ nic_trunk1 }}}
              v70-trunk2: {id: 70, link: {{ nic_trunk2 }}}
              v999-trunk1: {id: 999, link: {{ nic_trunk1 }}}
              v999-trunk2: {id: 999, link: {{ nic_trunk2 }}}
            bridges:
              br10:
                interfaces: [v10-trunk1, v10-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br20:
                interfaces: [v20-trunk1, v20-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br21:
                interfaces: [v21-trunk1, v21-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br30:
                interfaces: [v30-trunk1, v30-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br40:
                interfaces: [v40-trunk1, v40-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br50:
                interfaces: [v50-trunk1, v50-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br60:
                interfaces: [v60-trunk1, v60-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br70:
                interfaces: [v70-trunk1, v70-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}
              br999:
                interfaces: [v999-trunk1, v999-trunk2]
                parameters: {stp: true, forward-delay: 20, max-age: 25}

    - name: "POST — Crear script de verificacion del interlink"
      ansible.builtin.copy:
        dest: /usr/local/bin/check_interlink.sh
        content: |
          #!/bin/bash
          # Verifica que al menos una interfaz del interlink este up
          STATE1=$(cat /sys/class/net/ens38/operstate 2>/dev/null)
          STATE2=$(cat /sys/class/net/ens40/operstate 2>/dev/null)
          [ "$STATE1" = "up" ] || [ "$STATE2" = "up" ] && exit 0
          exit 1
        owner: root
        group: root
        mode: "0755"

    - name: "POST — Bajar bridges y flush IPs"
      ansible.builtin.shell: |
        for br in br10 br20 br21 br30 br40 br50 br60 br70 br999; do
          ip link set "$br" down 2>/dev/null || true
          ip addr flush dev "$br" 2>/dev/null || true
        done
        echo "Bridges bajados y flush done"

    - name: "PRE — Destruir vXX-int existentes antes de netplan (limpieza forzada)"
      ansible.builtin.shell: |
        for vlan in 10 20 21 30 40 50 60 70 999; do
          ip link delete v${vlan}-int 2>/dev/null && echo "Eliminada v${vlan}-int" || echo "v${vlan}-int no existe"
        done
        echo "Limpieza de vXX-int completada"
      changed_when: true
      failed_when: false

    - name: "POST — Regenerar y aplicar netplan limpio"
      ansible.builtin.shell: |
        netplan generate
        netplan apply
        sleep 3
        echo "Netplan LIMPIO aplicado correctamente"
      changed_when: true

    - name: "POST — Eliminar vXX-int residual del interlink (por si netplan las recreo)"
      ansible.builtin.shell: |
        for vlan in 10 20 21 30 40 50 60 70 999; do
          ip link delete v${vlan}-int 2>/dev/null && echo "Eliminada v${vlan}-int" || echo "v${vlan}-int no existe"
        done
        echo "Limpieza residual completada"
      changed_when: true
      failed_when: false

    - name: "POST — Quitar vXX-int de bridges (STP solo en trunks hacia pfSenses)"
      ansible.builtin.shell: |
        for vlan in 10 20 21 30 40 50 60 70 999; do
          brctl delif br${vlan} v${vlan}-int 2>/dev/null && echo "br${vlan}: v${vlan}-int removido" || echo "br${vlan}: v${vlan}-int no existe"
        done
        echo "Interlinks removidos de bridges — STP solo en trunks"
      changed_when: true

    - name: "POST — Asegurar que bridges quedaron sin IP"
      ansible.builtin.shell: |
        for br in br10 br20 br21 br30 br40 br50 br60 br70 br999; do
          ip addr flush dev "$br" 2>/dev/null || true
        done
        echo "Verificacion completa"

    - name: "POST — Deshabilitar IPv6 en interfaces de red"
      ansible.builtin.shell: |
        for iface in ens34 ens35 ens36 ens37 ens38 bond0; do
          if ip link show "$iface" >/dev/null 2>&1; then
            sysctl -w net.ipv6.conf.$iface.disable_ipv6=1 2>/dev/null || true
          fi
        done
        echo "IPv6 deshabilitado en interfaces"

    - name: "POST — Reiniciar systemd-networkd"
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
        enabled: yes

    - name: "POST — Reiniciar keepalived"
      ansible.builtin.systemd:
        name: keepalived
        state: restarted
        enabled: yes

    - name: "POST — Verificar estado de interfaces"
      ansible.builtin.shell: |
        echo "=== BOND0 (LANs hacia pfSenses) ===" && ip addr show bond0 2>/dev/null || true
        echo "=== ENS38 (Interlink) ===" && ip addr show ens38 2>/dev/null || true
        echo "=== BRIDGES ===" && for br in br10 br20 br21 br30 br40 br50 br60 br70 br999; do echo "--- $br ---"; ip addr show "$br" 2>/dev/null || true; done
        echo "=== KEEPALIVED ===" && systemctl is-active keepalived && echo "Running" || echo "Not running"
      changed_when: false

    - name: "POST — Mostrar estado final"
      ansible.builtin.debug:
        msg:
          - "Core 2 OPTIMIZADO y configurado"
          - "Bond0 = LANs (active-backup hacia pfSenses)"
          - "Ens38 = Interlink (hacia Core 1)"
          - "Bridges sin IPs — L2 switch puro"
          - "Optimizaciones aplicadas: sysctls, IPv6 disabled, logs reducidos"
          - "Keepalived: BACKUP, advert_int=5, nopreempt enabled"