---
# =============================================================================
# core2_setup.yml — Configurador de Core 2 (Keepalived BACKUP)
# =============================================================================
# Pre-requisitos:
#   - Ejecutar con: sudo ansible-playbook core2_setup.yml
#   - Ubuntu 24 Server (netplan) instalado y con apt funcional
#   - Las NICs definidas aquí deben existir en el ESXi para Core 2
# =============================================================================

- name: "Configura Core 2 — Keepalived BACKUP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core2"
    core_state: "BACKUP"
    core_priority: 100
    core_ip_suffix: 5

    # INTERFACES REALES DE CORE 2:
    nic_fw: "ens34"         # Trunk 2 (Hacia pfSense Backup)
    nic_acc: "ens35"        # Puerto de Acceso
    nic_int: "ens36"        # Interlink fisico (Cruce directo al Core 1)
    nic_internet: "ens39"   # Internet momentaneo
    nic_trunk2: "ens40"     # Trunk 1 (Hacia pfSense Master) - para HA

    # LATIDOS KEEPALIVED (VRRP UNICAST):
    core_unicast_src_ip: "10.0.0.2"
    core_unicast_peer_ip: "10.0.0.1"

    # IDENTIDAD OSPF
    core_router_id: "10.0.0.2"

  roles:
    - linux_core