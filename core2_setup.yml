---
# =============================================================================
# core2_setup.yml — Configurador de Core 2 (Keepalived BACKUP)
# =============================================================================
# Pre-requisitos:
#   - Ejecutar con: sudo ansible-playbook core2_setup.yml
#   - Ubuntu 24 Server (netplan) instalado y con apt funcional
#   - Las 3 NICs definidas en vars/main.yml deben existir en el sistema
#
# ¿Qué hace?
#   1. Instala prerequisitos (bridge-utils, vlan, frr, keepalived)
#   2. Configura bridges + VLANs en netplan
#   3. Levanta OSPF vía FRR
#   4. Activa Keepalived en modo BACKUP con VIPs flotantes
# =============================================================================

- name: "Configura Core 2 — Keepalived BACKUP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core2"
    core_state: "BACKUP"
    core_priority: 100
    core_ip_suffix: 5
    # Interfaces de red específicas de Core 2:
    nic_fw: "ens34"         # trunk-2 (pfSense)
    nic_int: "ens36"        # Lima-ZyA-Acceso-back / int

  roles:
    - linux_core