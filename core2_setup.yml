---
# =============================================================================
# core2_setup.yml — Configurador de Core 2 (Keepalived BACKUP)
# =============================================================================
# Full HA: 2 Trunks + Bonded LANs + Interlink
# =============================================================================

- name: "Configura Core 2 — Keepalived BACKUP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core2"
    core_state: "BACKUP"
    core_priority: 100
    core_ip_suffix: 5

    # INTERFACES REALES DE CORE 2:
    nic_trunk1: "ens42"     # Trunk 1 (Hacia pfSense Master)
    nic_trunk2: "ens34"     # Trunk 2 (Hacia pfSense Backup) - HA
    nic_int: "ens36"        # Interlink físico (Cruce directo al Core 1)

    # LAN INTERFACES (HA por bonding):
    bonded_nics:
      - "ens40"     # LAN-1 → pfSense Master (192.168.10.1)
      - "ens39"     # LAN-2 → pfSense Backup (192.168.10.1)
    lan_ip: "192.168.10.30/24"
    lan_gateway: "192.168.10.1"

    # LATIDOS KEEPALIVED (VRRP UNICAST):
    core_unicast_src_ip: "10.0.0.2"
    core_unicast_peer_ip: "10.0.0.1"

    # IDENTIDAD OSPF
    core_router_id: "10.0.0.2"

  roles:
    - linux_core