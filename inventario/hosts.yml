# ============================================================================
# Inventario — 3 sitios: Lima (Maestra), Arequipa y Trujillo (Remotas)
# ============================================================================
# ESXi Host: 172.17.25.12:443
# Usuario:   root / qwe123$
# Dominio AD: AXIOM.LOCAL (realm), AXIOM (NetBIOS)
# ============================================================================

all:
  children:
    # -------------------------------------------------------------------------
    # LIMA — Sede Maestra con HA
    # -------------------------------------------------------------------------
    lima:
      children:
        lima_cores:
          hosts:
            core1:
              ansible_host: 192.168.1.10
              ansible_connection: local
              core_role: master
              site: lima
            core2:
              ansible_host: 192.168.1.11
              ansible_connection: local
              core_role: backup
              site: lima

        lima_servers:
          vars:
            ansible_user: ubuntu
            ansible_password: "123"
            ansible_become: true
            ansible_become_password: "123"
            ansible_python_interpreter: /usr/bin/python3
          hosts:
            vm-dc01:
              ansible_host: 192.168.16.10
              services: [samba4_ad, bind9_master, isc_dhcp_primary, chrony]
              site: lima
              vlans: [60]
              interfaces: bond0(ens34+ens35)

            vm-dns02:
              ansible_host: 192.168.16.11
              services: [bind9_slave, isc_dhcp_secondary, chrony, zabbix_agent2]
              site: lima
              vlans: [60]
              interfaces: bond0(ens34+ens35)

            vm-web01:
              ansible_host: 192.168.11.11
              services: [haproxy, apache, wordpress, zabbix_agent2]
              site: lima
              vlans: [10, 30]
              interfaces: bond0(ens34+ens35)
              ports: {haproxy: 80, apache: 8080, stats: 8404}

            vm-web02:
              ansible_host: 192.168.11.12
              services: [apache, wordpress_replica, zabbix_agent2]
              site: lima
              vlans: [10, 30]
              interfaces: bond0(ens34+ens35)
              ports: {apache: 8080}

            vm-services01:
              ansible_host: 192.168.13.11
              services: [postfix, dovecot, roundcube, dolibarr, mysql]
              site: lima
              vlans: [30]
              interfaces: bond0(ens34+ens35)
              ports: {smtp: 25, imap: 993, pop3: 995, http: 80}

            vm-storage01:
              ansible_host: 192.168.14.11
              services: [samba, nfs, winbind]
              site: lima
              vlans: [30, 40]
              interfaces: bond0(ens34+ens35)

            vm-docker01:
              ansible_host: 192.168.13.12
              services: [docker, grafana_docker, portainer, zabbix_agent2]
              site: lima
              vlans: [30]
              ram: "4GB"
              vcpus: 2
              interfaces: bond0(ens34+ens35)
              ports: {grafana: 3000, portainer_https: 9443, portainer_http: 9000}

            vm-voip01:
              ansible_host: 192.168.15.11
              services: [asterisk]
              site: lima
              vlans: [50]
              interfaces: bond0(ens34+ens35)

            vm-monitor01:
              ansible_host: 192.168.17.11
              services: [zabbix_server, grafana]
              site: lima
              vlans: [70]
              interfaces: bond0(ens34+ens35)

            vm-vpn01:
              ansible_host: localhost
              ansible_connection: local
              ansible_user: ubuntu
              ansible_become: true
              ansible_become_password: "123"
              ansible_python_interpreter: /usr/bin/python3
              services: [tailscale]
              site: lima
              vlans: [10, 20, 21, 30, 40, 50, 60, 70]

      vars:
        site_name: "Lima"
        site_code: "LIM"
        dns_master: "192.168.16.10"
        dns_backup: "192.168.16.11"
        domain_name: "AXIOM.LOCAL"

    # -------------------------------------------------------------------------
    # AREQUIPA — Sede Remota
    # -------------------------------------------------------------------------
    arequipa:
      children:
        arequipa_cores:
          hosts:
            core-aqp:
              ansible_host: 192.168.82.2
              ansible_connection: local
              site: arequipa
              ansible_user: sysadmin

        arequipa_servers:
          vars:
            site_name: "Arequipa"
            site_code: "AQP"
          hosts:
            aqp-server01:
              ansible_host: 192.168.82.10
              ansible_user: sysadmin
              site: arequipa
              vlans: [20]

      vars:
        dns_master: "192.168.16.10"

    # -------------------------------------------------------------------------
    # TRUJILLO — Sede Remota
    # -------------------------------------------------------------------------
    trujillo:
      children:
        trujillo_cores:
          hosts:
            core-tru:
              ansible_host: 192.168.92.2
              ansible_connection: local
              site: trujillo
              ansible_user: sysadmin

        trujillo_servers:
          vars:
            site_name: "Trujillo"
            site_code: "TRU"
          hosts:
            tru-server01:
              ansible_host: 192.168.92.10
              ansible_user: sysadmin
              site: trujillo
              vlans: [20]

      vars:
        dns_master: "192.168.16.10"
