# ============================================================================
# Inventario de máquinas virtuales — Laboratorio Core
# ============================================================================
# ESXi Host: 168.121.48.254:10112
# Usuario:   root
# Contraseña: qwe123$
#
# NOTA: vm-dc01 es Windows Server 2022 — NO se automatiza con Ansible
# ============================================================================

all:
  children:
    # -------------------------------------------------------------------------
    # Grupo: ubuntu_servers — Todas las VMs Ubuntu Server 24.04
    # -------------------------------------------------------------------------
    ubuntu_servers:
      hosts:
        vm-services01:
          ansible_host: 10.0.30.11
          ram: "1GB"
          vcpus: 2
          services:
            - samba
            - iredmail
          vlans:
            - 30

        vm-web01:
          ansible_host: 10.0.10.11
          ram: "512MB"
          vcpus: 2
          services:
            - nginx
            - haproxy
            - postgresql
          vlans:
            - 10
            - 30

        vm-voip01:
          ansible_host: 10.0.50.11
          ram: "512MB"
          vcpus: 2
          services:
            - freepbx
          vlans:
            - 30
            - 50

        vm-monitor01:
          ansible_host: 10.0.70.11
          ram: "1GB"
          vcpus: 2
          services:
            - zabbix
            - grafana
          vlans:
            - 70

        vm-storage01:
          ansible_host: 10.0.40.11
          ram: "512MB"
          vcpus: 2
          services:
            - nfs
            - pbs_proxmox_backup_server
            - rclone
          vlans:
            - 30
            - 40

        vm-docker01:
          ansible_host: 10.0.30.12
          ram: "512MB"
          vcpus: 2
          services:
            - docker
            - docker_compose
          vlans:
            - 30

      vars:
        ansible_user: sysadmin
        ansible_ssh_private_key_file: ~/.ssh/id_rsa_lab
        ansible_python_interpreter: /usr/bin/python3
        ansible_become: yes
        ansible_become_method: sudo

    # -------------------------------------------------------------------------
    # Grupo: windows_servers — SOLO para documentación, NO se automatiza
    # -------------------------------------------------------------------------
    windows_servers:
      hosts:
        vm-dc01:
          ansible_host: 10.0.60.11
          os: "Windows Server 2022"
          ram: "4GB"
          vcpus: 4
          services:
            - active_directory
            - dns
            - dhcp
            - gpo
            - ca
          vlans:
            - 30
            - 60
      vars:
        note: "WINDOWS — NO automatizar con este playbook. Gestionar manualmente."
