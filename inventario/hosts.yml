# ============================================================================
# Inventario — 3 sitios: Lima (Maestra), Arequipa y Trujillo (Remotas)
# ============================================================================
# ESXi Host: 168.121.48.254:10112
# Usuario:   root / qwe123$
#
# vm-dc01: Ubuntu Server + Samba 4 AD + DNS + DHCP
# ============================================================================

all:
  children:
    # -------------------------------------------------------------------------
    # LIMA — Sede Maestra con HA
    # -------------------------------------------------------------------------
    lima:
      children:
        lima_cores:
          hosts:
            core1:
              ansible_host: 192.168.1.10
              ansible_connection: local
              core_role: master
              site: lima
            core2:
              ansible_host: 192.168.1.11
              ansible_connection: local
              core_role: backup
              site: lima

        lima_servers:
          hosts:
            vm-dc01:
              ansible_host: 192.168.16.10
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              ansible_become: yes
              services: [samba4_ad, bind9_dns, isc_dhcp_server]
              site: lima
              vlans: [60]
              ram: "2GB"
              vcpus: 2
              bonding: true

            vm-services01:
              ansible_host: 192.168.16.11
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [samba_files, iredmail]
              site: lima
              vlans: [30]
              ram: "2GB"
              vcpus: 2

            vm-web01:
              ansible_host: 192.168.11.11
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [nginx, haproxy, postgresql]
              site: lima
              vlans: [10, 30]
              ram: "1GB"
              vcpus: 2

            vm-voip01:
              ansible_host: 192.168.50.11
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [freepbx, asterisk]
              site: lima
              vlans: [30, 50]
              ram: "1GB"
              vcpus: 2

            vm-monitor01:
              ansible_host: 192.168.17.11
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [zabbix, grafana]
              site: lima
              vlans: [70]
              ram: "2GB"
              vcpus: 2

            vm-storage01:
              ansible_host: 192.168.40.11
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [nfs, pbs_proxmox_backup_server, rclone]
              site: lima
              vlans: [30, 40]
              ram: "1GB"
              vcpus: 2

            vm-docker01:
              ansible_host: 192.168.30.12
              ansible_user: sysadmin
              ansible_python_interpreter: /usr/bin/python3
              services: [docker, docker_compose]
              site: lima
              vlans: [30]
              ram: "1GB"
              vcpus: 2

      vars:
        site_name: "Lima"
        site_code: "LIM"
        dns_master: "192.168.16.10"
        domain_name: "AJ.local"

    # -------------------------------------------------------------------------
    # AREQUIPA — Sede Remota (single core + DHCP local)
    # -------------------------------------------------------------------------
    arequipa:
      children:
        arequipa_cores:
          hosts:
            core-aqp:
              ansible_host: 192.168.82.2
              ansible_connection: local
              site: arequipa
              ansible_user: sysadmin

        arequipa_servers:
          vars:
            site_name: "Arequipa"
            site_code: "AQP"
          hosts:
            aqp-server01:
              ansible_host: 192.168.82.10
              ansible_user: sysadmin
              site: arequipa
              vlans: [20]

      vars:
        dns_master: "192.168.16.10"

    # -------------------------------------------------------------------------
    # TRUJILLO — Sede Remota (single core + DHCP local)
    # -------------------------------------------------------------------------
    trujillo:
      children:
        trujillo_cores:
          hosts:
            core-tru:
              ansible_host: 192.168.92.2
              ansible_connection: local
              site: trujillo
              ansible_user: sysadmin

        trujillo_servers:
          vars:
            site_name: "Trujillo"
            site_code: "TRU"
          hosts:
            tru-server01:
              ansible_host: 192.168.92.10
              ansible_user: sysadmin
              site: trujillo
              vlans: [20]

      vars:
        dns_master: "192.168.16.4"

    # -------------------------------------------------------------------------
    # Windows (solo documentación, NO automatizar)
    # -------------------------------------------------------------------------
    windows_servers:
      hosts:
        vm-dc01:
          ansible_host: 192.168.60.11
          ansible_user: administrator
          os: "Windows Server 2022"
          services: [active_directory, dns, dhcp]
          vlans: [30, 60]
          ram: "4GB"
          vcpus: 4
      vars:
        note: "WINDOWS — gestionar manualmente"