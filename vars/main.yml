# ============================================================================
# Linux Core 1 y Core 2 — Variables compartidas
# ============================================================================
# Ubuntu 24 Server con netplan
#
# MODIFICA esto según tu topología real. Se usan placeholders que se
# pueden sobre-escribir desde los playbooks o con extra-vars.
# ============================================================================

# ============================================================================
# DEFINICIÓN DE VLANs — Topología real del laboratorio
# ============================================================================
# Basado en tabla de VMs:
#   VLAN 10 = DMZ
#   VLAN 30 = Virtualización
#   VLAN 40 = Storage
#   VLAN 50 = VoIP
#   VLAN 60 = Gestión (Windows Server — NO se automatiza)
#   VLAN 70 = Monitoreo
#
# Nombres de NICs POR CORE (diferentes entre Core 1 y Core 2)
# ============================================================================

# --- Mapeo de interfaces por Core ---
# Core 1:
#   nic_wan:       ens34  (trunk-1)
#   nic_lan:       ens35  (Lima-ZyA-Acceso)
#   nic_interlink: ens36  (Interlink 10.0.0.1/30)
#   nic_internet:  ens37  (INTERNET — NO TOCAR)
#
# Core 2:
#   nic_wan:       ens34  (trunk-2)
#   nic_lan:       ens39  (Lima-ZyA-Acceso-back)
#   nic_interlink: ens36  (Interlink 10.0.0.2/30)
#   nic_internet:  ens35  (INTERNET — NO TOCAR)
# ---------------------------------------------------------------------------

# Nombres por defecto (se sobreescriben en cada playbook de core)
# Usar estructura de diccionario para diferenciar Core 1 y Core 2
nic_map:
  core1:
    wan: "ens34"
    lan: "ens35"
    interlink: "ens36"
    internet: "ens37"
  core2:
    wan: "ens34"
    lan: "ens39"
    interlink: "ens36"
    internet: "ens35"

# Nombres actuales (se setean en cada playbook según core_id)
# nic_wan: "{{ nic_map[core_id].wan }}"
# nic_lan: "{{ nic_map[core_id].lan }}"
# nic_interlink: "{{ nic_map[core_id].interlink }}"
# nic_internet: "{{ nic_map[core_id].internet }}"

# --- Red interlink entre Core 1 y Core 2 ---
interlink_net: "10.0.0.0/30"

# --- Definición de VLANs ---
# AÑADE, ELIMINA o MODIFICA según tu topología real.
# El campo 'name' es solo descriptivo.
# ---------------------------------------------------------------------------
vlans:
  - id: 10
    name: "dmz"
    subnet: "10.0.10.0/24"
    core1_ip: "10.0.10.2/24"
    core2_ip: "10.0.10.3/24"
    vip: "10.0.10.1/24"
    vrid: 10

  - id: 30
    name: "virtualizacion"
    subnet: "10.0.30.0/24"
    core1_ip: "10.0.30.2/24"
    core2_ip: "10.0.30.3/24"
    vip: "10.0.30.1/24"
    vrid: 30

  - id: 40
    name: "storage"
    subnet: "10.0.40.0/24"
    core1_ip: "10.0.40.2/24"
    core2_ip: "10.0.40.3/24"
    vip: "10.0.40.1/24"
    vrid: 40

  - id: 50
    name: "voip"
    subnet: "10.0.50.0/24"
    core1_ip: "10.0.50.2/24"
    core2_ip: "10.0.50.3/24"
    vip: "10.0.50.1/24"
    vrid: 50

  - id: 60
    name: "gestion"
    subnet: "10.0.60.0/24"
    core1_ip: "10.0.60.2/24"
    core2_ip: "10.0.60.3/24"
    vip: "10.0.60.1/24"
    vrid: 60

  - id: 70
    name: "monitoreo"
    subnet: "10.0.70.0/24"
    core1_ip: "10.0.70.2/24"
    core2_ip: "10.0.70.3/24"
    vip: "10.0.70.1/24"
    vrid: 70