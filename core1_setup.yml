---
# =============================================================================
# core1_setup.yml — Configurador de Core 1 (Keepalived MASTER)
# =============================================================================
# Full HA: Bonded LANs + 2x Trunks + Interlink
# =============================================================================

- name: "Configura Core 1 — Keepalived MASTER"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core1"
    core_state: "MASTER"
    core_priority: 200
    core_ip_suffix: 4

    # INTERFACES (Mapeo REAL de tu ESXi):
    nic_trunk1: "ens36"     # Trunk 1 — pfSense Master
    nic_trunk2: "ens37"     # Trunk 2 — pfSense Backup
    nic_int: "ens38"        # Interlink físico (Core 1 ↔ Core 2)

    # LAN INTERFACES (Bonding HA):
    bonded_nics:
      - "ens34"     # LAN-1 — pfSense Master (192.168.10.1)
      - "ens35"     # LAN-2 — pfSense Backup (192.168.10.1)
    lan_ip: "192.168.10.20/24"
    lan_gateway: "192.168.10.1"

    # LATIDOS KEEPALIVED (VRRP UNICAST):
    core_unicast_src_ip: "10.0.0.1"
    core_unicast_peer_ip: "10.0.0.2"

    # IDENTIDAD OSPF
    core_router_id: "10.0.0.1"

  roles:
    - linux_core
