---
# =============================================================================
# core1_setup.yml — Configurador de Core 1 (Keepalived MASTER)
# =============================================================================
# Pre-requisitos:
#   - Ejecutar con: sudo ansible-playbook core1_setup.yml
#   - Ubuntu 24 Server (netplan) instalado y con apt funcional
#   - Las NICs definidas aquí deben existir en el ESXi para Core 1
# =============================================================================

- name: "Configura Core 1 — Keepalived MASTER"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core1"
    core_state: "MASTER"
    core_priority: 200
    core_ip_suffix: 4
    
    # INTERFACES REALES (Mapeadas de tu ESXi):
    nic_fw: "ens34"         # Tu Trunk 1 (Hacia pfSense Master)
    nic_acc: "ens35"        # Tu puerto de Acceso
    nic_int: "ens36"        # Tu Interlink físico (Cruce directo al Core 2)
    nic_internet: "ens37"   # Tu Internet momentáneo en Core 1
    
    # LATIDOS KEEPALIVED (VRRP UNICAST):
    # Viajan directo por el cable físico ens36 usando tus IPs fijas /30
    core_unicast_src_ip: "10.0.0.1"   # IP física de este Core 1
    core_unicast_peer_ip: "10.0.0.2"  # IP física del vecino Core 2
    
    # IDENTIDAD OSPF (Router ID estable)
    core_router_id: "10.0.0.1"

  roles:
    - linux_core