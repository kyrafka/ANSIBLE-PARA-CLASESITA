---
# =============================================================================
# core1_setup.yml — Configurador de Core 1 (Keepalived MASTER)
# =============================================================================
# Pre-requisitos:
#   - Ejecutar con: sudo ansible-playbook core1_setup.yml
#   - Ubuntu 24 Server (netplan) instalado y con apt funcional
#   - Las 3 NICs definidas en vars/main.yml deben existir en el sistema
#
# ¿Qué hace?
#   1. Instala prerequisitos (bridge-utils, vlan, frr, keepalived)
#   2. Configura bridges + VLANs en netplan
#   3. Levanta OSPF vía FRR
#   4. Activa Keepalived en modo MASTER con VIPs flotantes
# =============================================================================

- name: "Configura Core 1 — Keepalived MASTER"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    core_id: "core1"
    core_state: "MASTER"
    core_priority: 200
    core_ip_suffix: 4
    # Interfaces de red específicas de Core 1:
    nic_fw: "ens364"        # trunk-1 (pfSense)
    nic_int: "ens36"        # Lima-ZyA-Acceso / int
    # IPs de Core 1 en br30 para VRRP unicast y OSPF
    core_unicast_src_ip: "192.168.13.4"
    core_unicast_peer_ip: "192.168.13.5"
    peer_vlan30_ip: "192.168.13.5"
    core_router_id: "192.168.11.4"

  roles:
    - linux_core