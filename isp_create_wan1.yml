---
- name: ISP_CREATE_WAN1
  hosts: localhost
  become: true

  tasks:
    - name: Blindar DNS temporalmente en resolv.conf (Evita fallos de APT)
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 1.1.1.1
        mode: "0644"

    - name: Instalar iptables-persistent (Con DNS ya funcionando)
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true

    - name: Escribir 50-cloud-init.yaml (Alineación YAML corregida)
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              ens34:
                dhcp4: false
                addresses:
                  - 172.17.25.49/24
                gateway4: 172.17.25.121
                nameservers:
                  addresses: [8.8.8.8, 1.1.1.1]
              ens35:
                dhcp4: false
                addresses:
                  - 192.168.2.1/24

    - name: Aplicar netplan
      ansible.builtin.command: netplan apply

    - name: Habilitar ip_forward
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^#?net\.ipv4\.ip_forward'
        line: "net.ipv4.ip_forward=1"
        state: present

    - name: Aplicar sysctl
      ansible.builtin.command: sysctl -p

    - name: Flush reglas FORWARD existentes
      ansible.builtin.command: iptables -F FORWARD

    - name: Flush reglas NAT existentes
      ansible.builtin.command: iptables -t nat -F POSTROUTING

    - name: NAT Masquerade en ens34
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: ens34
        jump: MASQUERADE

    - name: FORWARD de ens35 a ens34
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: ens35
        out_interface: ens34
        jump: ACCEPT

    - name: FORWARD retorno de ens34 a ens35
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: ens34
        out_interface: ens35
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Guardar reglas iptables
      ansible.builtin.command: netfilter-persistent save

    - name: Habilitar netfilter-persistent al arranque
      ansible.builtin.systemd:
        name: netfilter-persistent
        enabled: true
        state: started