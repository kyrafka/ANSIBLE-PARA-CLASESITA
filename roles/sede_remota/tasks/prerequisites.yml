---
# sede_remota/tasks/prerequisites.yml — Paquetes, kernel, sysctl
# ============================================================================

- name: "PRE — Validación de privilegios"
  ansible.builtin.fail:
    msg: "FATAL: Se requieren privilegios de root. Ejecuta con sudo."
  when: ansible_effective_user_id != 0

- name: "PRE — Verificar existencia de interfaces"
  ansible.builtin.stat:
    path: "/sys/class/net/{{ item }}"
  loop:
    - "{{ nic_wan }}"
    - "{{ nic_lan }}"
  register: nic_check

- name: "PRE — Abortar si alguna interfaz no existe"
  ansible.builtin.fail:
    msg: "FATAL: La interfaz {{ item.item }} no existe."
  loop: "{{ nic_check.results }}"
  when: not item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: "PRE — Cargar módulos de kernel"
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - 8021q
    - bridge
  ignore_errors: yes

- name: "PRE — Asegurar módulos en /etc/modules"
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    state: present
  loop:
    - 8021q
    - bridge

- name: "PRE — IP Forwarding"
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: yes

- name: "PRE — Instalar paquetes requeridos"
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: "PRE — Firewall base (iptables)"
  ansible.builtin.shell: |
    iptables -P INPUT ACCEPT
    iptables -P FORWARD ACCEPT
    iptables -P OUTPUT ACCEPT
    iptables -t nat -P POSTROUTING ACCEPT
    iptables -t mangle -P PREROUTING ACCEPT
    iptables -t mangle -P FORWARD ACCEPT
    iptables -t mangle -P OUTPUT ACCEPT
    iptables -t raw -P PREROUTING ACCEPT
    iptables -t raw -P OUTPUT ACCEPT
    echo "done"
  changed_when: false
  failed_when: false