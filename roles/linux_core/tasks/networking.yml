---
# linux_core/tasks/networking.yml — netplan, bridges, VLANs, interfaces
# ---------------------------------------------------------------------------

- name: "NET — Backup de configuración netplan existente"
  ansible.builtin.copy:
    src: "{{ netplan_config_file }}"
    dest: "{{ netplan_backup_file }}"
    remote_src: yes
    force: no
  when: netplan_config_file is file
  ignore_errors: yes

- name: "NET — Renderizar configuración de red"
  ansible.builtin.template:
    src: "netplan.yaml.j2"
    dest: "{{ netplan_config_file }}"
    owner: root
    group: root
    mode: "0600"
    backup: yes
  register: netplan_rendered

- name: "NET — Generar y validar configuración netplan"
  ansible.builtin.command: "netplan generate"
  changed_when: true
  register: netplan_generate
  failed_when: netplan_generate.rc != 0
  when: netplan_rendered.changed

- name: "NET — Aplicar configuración netplan"
  ansible.builtin.command: "netplan apply"
  changed_when: true
  register: netplan_apply
  failed_when: netplan_apply.rc != 0
  when: netplan_rendered.changed

- name: "NET — Verificar estado de systemd-networkd"
  ansible.builtin.systemd:
    name: systemd-networkd
    state: started
    enabled: yes

# ---------------------------------------------------------------------------
# AUTOMATIZACIÓN DE ALTA DISPONIBILIDAD (HA) — SCRIPTS COMPLEMENTARIOS
# ---------------------------------------------------------------------------

- name: "HA — FORZAR ACTUALIZACIÓN: Remover script de monitoreo anterior"
  ansible.builtin.file:
    path: "/usr/local/bin/check_peer.sh"
    state: absent

- name: "HA — Crear el script de monitoreo ICMP (check_peer.sh)"
  ansible.builtin.copy:
    dest: "/usr/local/bin/check_peer.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Generado automáticamente por Ansible — NO EDITAR A MANO
      # Script de salud para Keepalived (Vigilancia del vecino por Interlink)
      /usr/bin/ping -c 2 -W 1 "$1" > /dev/null 2>&1
      exit $?

# ---------------------------------------------------------------------------
# DIAGNÓSTICO FINAL DEL ENTORNO DE RED
# ---------------------------------------------------------------------------

- name: "NET — Mostrar resumen de interfaces configuradas"
  ansible.builtin.command: "ip -br a"
  changed_when: false
  register: ip_addr_result

- name: "NET — Debug de interfaces"
  ansible.builtin.debug:
    msg: "{{ ip_addr_result.stdout_lines }}"