---
# linux_core/tasks/networking.yml — netplan, bridges, VLANs
# ============================================================================
# Idempotente: siempre sobreescribe y aplica, funciona aunque ya esté configurado
# ---------------------------------------------------------------------------

- name: "NET — Backup de configuración netplan previa"
  ansible.builtin.copy:
    src: "{{ netplan_config_file | default('/etc/netplan/50-cloud-init.yaml') }}"
    dest: "{{ netplan_config_file | default('/etc/netplan/50-cloud-init.yaml') }}.bak-{{ ansible_date_time.iso8601_basic_short | default('backup') }}"
    remote_src: yes
    force: no
  ignore_errors: yes

- name: "NET — Renderizar configuración de red (sobrescribe siempre)"
  ansible.builtin.template:
    src: "netplan.yaml.j2"
    dest: "{{ netplan_config_file | default('/etc/netplan/50-cloud-init.yaml') }}"
    owner: root
    group: root
    mode: "0600"
    force: yes
    backup: yes

- name: "NET — Generar y validar configuración netplan"
  ansible.builtin.command: "netplan generate"
  changed_when: true
  register: netplan_generate
  failed_when: netplan_generate.rc != 0

- name: "NET — Aplicar netplan (SIEMPRE, idempotente)"
  ansible.builtin.command: "netplan apply"
  changed_when: true
  register: netplan_apply
  failed_when: netplan_apply.rc != 0

- name: "NET — Asegurar que systemd-networkd está corriendo"
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
    enabled: yes

- name: "NET - Desactivar multicast-snooping en bridges (sysctl)"
  ansible.builtin.shell: |
    for br in $(ls /sys/class/net/ | grep -E '^br[0-9]+'); do
      path="/sys/class/net/$br/bridge/multicast-snooping"
      if [ -d "/sys/class/net/$br/bridge" ]; then
        echo 0 | sudo tee "$path" > /dev/null 2>&1 || true
      fi
    done
  changed_when: false
  failed_when: false