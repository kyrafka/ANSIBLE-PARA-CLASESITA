---
# linux_core/tasks/frr.yml — Configuración de FRR (OSPF)
# ============================================================================

- name: "FRR — Renderizar configuración frr.conf (sobrescribe si existe)"
  ansible.builtin.template:
    src: "frr.conf.j2"
    dest: "{{ frr_config_file | default('/etc/frr/frr.conf') }}"
    owner: frr
    group: frr
    mode: "0640"
    force: yes
    backup: yes

- name: "FRR — Renderizar configuración daemons (habilitar ospfd)"
  ansible.builtin.template:
    src: "daemons.j2"
    dest: "{{ frr_daemons_file | default('/etc/frr/daemons') }}"
    owner: frr
    group: frr
    mode: "0640"
    force: yes
    backup: yes

- name: "FRR — Crear directorio de log si no existe"
  ansible.builtin.file:
    path: "/var/log/frr"
    state: directory
    owner: frr
    group: frr
    mode: "0755"

- name: "FRR — Asegurar que FRR está corriendo y habilitado"
  ansible.builtin.systemd:
    name: frr
    state: restarted
    enabled: yes
    daemon_reload: yes