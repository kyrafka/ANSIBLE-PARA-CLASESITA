---
# linux_core/tasks/prerequisites.yml — Paquetes, módulos kernel, sysctl
# ---------------------------------------------------------------------------

- name: "PRE — Validación de privilegios"
  block:
    - name: "Fail if not privileged (Verificación nativa)"
      ansible.builtin.fail:
        msg: |
          FATAL: Se requieren privilegios de root o sudo.
          Ejecuta tu comando anteponiendo 'sudo':
          sudo ansible-playbook <playbook>.yml
      when: ansible_effective_user_id != 0

- name: "PRE — Verificar existencia de interfaces de red"
  ansible.builtin.stat:
    path: "/sys/class/net/{{ item }}"
  loop:
    - "{{ nic_trunk1 }}"
    - "{{ nic_acc }}"
    - "{{ nic_int }}"
  register: nic_exists

- name: "PRE — Abortar si alguna interfaz no existe"
  ansible.builtin.fail:
    msg: "FATAL: La interfaz {{ item.item }} no existe en este sistema virtual."
  loop: "{{ nic_exists.results }}"
  when:
    - not item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: "PRE — Cargar módulos de kernel necesarios"
  block:
    - name: "Asegurar módulos en /etc/modules"
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        state: present
      loop:
        - "8021q"
        - "bridge"

    - name: "Cargar módulos de kernel en runtime"
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - "8021q"
        - "bridge"
      register: modprobe_result
      changed_when: true
      failed_when: modprobe_result.rc != 0
  rescue:
    - name: "Handle kernel module load failure"
      ansible.builtin.debug:
        msg: "WARNING: No se pudieron cargar módulos 8021q/bridge. Verifica si están ya cargados."

- name: "PRE — IP Forwarding"
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "^#?net.ipv4.ip_forward"
    line: "net.ipv4.ip_forward=1"
    state: present

- name: "PRE — Limpiar sysctl bridge lines problematicas"
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "^net.bridge.*"
    state: absent

- name: "PRE — Aplicar sysctl"
  ansible.builtin.command: "sysctl -p"
  changed_when: true
  failed_when: false

- name: "PRE — Instalar paquetes requeridos (solo si no existen)"
  ansible.builtin.shell: |
    for pkg in bridge-utils vlan frr keepalived iptables-persistent; do
      dpkg -l "$pkg" 2>/dev/null | grep -q "^ii" || MISSING="$MISSING $pkg"
    done
    if [ -n "$MISSING" ]; then
      apt-get update --fix-missing
      apt-get install -y --fix-missing $MISSING
    else
      echo "Todos los paquetes ya estan instalados"
    fi
  register: apt_result
  changed_when: "'ya estan instalados' not in apt_result.stdout"
  failed_when: false

- name: "PRE — Verificar estado de servicios críticos"
  ansible.builtin.systemd:
    name: "systemd-networkd"
    state: started
    enabled: yes
  failed_when: false