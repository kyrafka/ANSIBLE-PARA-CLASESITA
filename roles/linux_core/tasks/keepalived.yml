---
# linux_core/tasks/keepalived.yml — Configuracion de Keepalived (HA VIPs)
# ============================================================================

- name: "KAL - Renderizar keepalived.conf (sobrescribe si existe)"
  ansible.builtin.template:
    src: "keepalived.conf.j2"
    dest: "{{ keepalived_config_file | default('/etc/keepalived/keepalived.conf') }}"
    owner: root
    group: root
    mode: "0644"
    force: yes
    backup: yes

- name: "KAL - Permitir CARP/VRRP (proto 112) en INPUT"
  ansible.builtin.shell: |
    sudo iptables -C INPUT -p 112 -j ACCEPT 2>/dev/null || \
    sudo iptables -I INPUT -p 112 -j ACCEPT
    echo "done"
  changed_when: false
  failed_when: false

- name: "KAL - Permitir CARP/VRRP (proto 112) en OUTPUT"
  ansible.builtin.shell: |
    sudo iptables -C OUTPUT -p 112 -j ACCEPT 2>/dev/null || \
    sudo iptables -I OUTPUT -p 112 -j ACCEPT
    echo "done"
  changed_when: false
  failed_when: false

- name: "KAL - Hacer reglas iptables permanentes"
  ansible.builtin.shell: |
    sudo apt-get install -y iptables-persistent netfilter-persistent 2>/dev/null || true
    sudo netfilter-persistent save 2>/dev/null || true
    echo "done"
  changed_when: false
  failed_when: false