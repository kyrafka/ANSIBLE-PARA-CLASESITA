---
# linux_core/defaults/main.yml — valores por defecto del role
# -----------------------------------------------------------------------------
# Descomenta y modifica si quieres sobre-escribir sin tocar vars/main.yml
# ---------------------------------------------------------------------------

# Nombres de interfaces (sobre-escribibles via extra-vars)
# nic_wan: "eth0"
# nic_lan: "eth1"
# nic_interlink: "eth2"

# Fichero de configuración netplan
netplan_config_file: "/etc/netplan/50-cloud-init.yaml"
netplan_backup_file: "/etc/netplan/50-cloud-init.yaml.bak.{{ ansible_date_time.iso8601_basic_short | default(now()) }}"

# Configuración FRR
frr_config_file: "/etc/frr/frr.conf"
frr_daemons_file: "/etc/frr/daemons"

# Configuración Keepalived
keepalived_config_file: "/etc/keepalived/keepalived.conf"
keepalived_auth_pass: "AN3IBL3P4SS"  # CAMBIA ESTO en producción

# Parámetros OSPF
ospf_area: "0.0.0.0"

# Core específico (sobre-escriben los playbooks)
core_id: "core1"
core_state: "MASTER"
core_priority: 200
interlink_ip: "10.0.0.1"
interlink_peer: "10.0.0.2"