---
# ============================================================================
# zabbix_agents_remotecmds.yml
# Habilita Remote Commands en TODOS los Zabbix Agents
# NECESARIO para que Zabbix pueda reiniciar servicios remotamente
# ============================================================================

- name: "Habilitar Remote Commands en Zabbix Agents"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_server: "192.168.17.11"

  tasks:
    - name: "RCM — Verificar si existe config actual"
      ansible.builtin.shell: |
        if [ -f /etc/zabbix/zabbix_agentd.conf ]; then
          echo "EXISTS"
          grep -c "EnableRemoteCommands" /etc/zabbix/zabbix_agentd.conf || echo "0"
        else
          echo "NOEXIST"
        fi
      changed_when: false
      register: config_check

    - name: "RCM — Ver si está en Include"
      ansible.builtin.shell: |
        grep "Include" /etc/zabbix/zabbix_agentd.conf 2>/dev/null | head -3
        echo "---"
        ls /etc/zabbix/zabbix_agentd.conf.d/ 2>/dev/null || echo "No existe dir include"
      changed_when: false
      register: include_check

    - name: "RCM — Backup config actual"
      ansible.builtin.shell: |
        cp /etc/zabbix/zabbix_agentd.conf /etc/zabbix/zabbix_agentd.conf.bak.$(date +%Y%m%d%H%M%S)
        echo "Backup creado"
      changed_when: false
      failed_when: false

    - name: "RCM — Agregar EnableRemoteCommands al final"
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        line: "{{ item }}"
        state: present
      loop:
        - "# Remote Commands habilitadas por Ansible"
        - "EnableRemoteCommands=1"
        - "AllowRoot=1"

    - name: "RCM — Crear directorio para commands"
      ansible.builtin.file:
        path: /etc/zabbix/zabbix_agentd.conf.d
        state: directory
        mode: "0755"

    - name: "RCM — Crear archivo de permitidos"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf.d/remote_commands.conf
        content: |
          # Comandos permitidos para remote execution
          # SERVICIOS
          AllowKey=system.run[/usr/bin/systemctl restart apache2]
          AllowKey=system.run[/usr/bin/systemctl restart mariadb]
          AllowKey=system.run[/usr/bin/systemctl restart postfix]
          AllowKey=system.run[/usr/bin/systemctl restart dovecot]
          AllowKey=system.run[/usr/bin/systemctl restart asterisk]
          AllowKey=system.run[/usr/bin/systemctl restart smbd]
          AllowKey=system.run[/usr/bin/systemctl restart nfs-server]
          AllowKey=system.run[/usr/bin/systemctl restart zabbix-server]
          AllowKey=system.run[/usr/bin/systemctl restart keepalived]
          AllowKey=system.run[/usr/bin/systemctl restart networking]
          AllowKey=system.run[/usr/bin/systemctl restart frr]
          
          # EMERGENCIA - REBOOT
          AllowKey=system.run[/sbin/reboot]
          AllowKey=system.run[/sbin/shutdown -r now]
          AllowKey=system.run[/usr/bin/systemctl reboot --force]
          AllowKey=system.run[/bin/systemctl reboot --force]
          
          # POWER OFF
          AllowKey=system.run[/sbin/poweroff]
          AllowKey=system.run[/usr/bin/systemctl poweroff]
        mode: "0644"
        force: yes

    - name: "RCM — Agregar Include si no existe"
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        line: "Include=/etc/zabbix/zabbix_agentd.conf.d/*.conf"
        state: present
        regexp: "^Include=/etc/zabbix/zabbix_agentd.conf.d/"
      when: "'Include' not in include_check.stdout"

    - name: "RCM — Reiniciar agent"
      ansible.builtin.systemd:
        name: zabbix-agent
        state: restarted
        enabled: yes

    - name: "RCM — Verificar EnableRemoteCommands"
      ansible.builtin.shell: |
        echo "=== EnableRemoteCommands ==="
        grep "EnableRemoteCommands" /etc/zabbix/zabbix_agentd.conf || echo "NO ENCONTRADO"
        echo ""
        echo "=== AllowRoot ==="
        grep "AllowRoot" /etc/zabbix/zabbix_agentd.conf || echo "NO ENCONTRADO"
        echo ""
        echo "=== Include ==="
        grep "^Include" /etc/zabbix/zabbix_agentd.conf || echo "NO ENCONTRADO"
        echo ""
        echo "=== Agent Status ==="
        systemctl status zabbix-agent --no-pager | head -5
      changed_when: false
      register: verify

    - name: "RCM — Resultado"
      ansible.builtin.debug:
        msg:
          - "Remote Commands HABILITADO"
          - "Zabbix Agent puede ejecutar: systemctl restart [apache2|mariadb|postfix|dovecot|asterisk|smbd|zabbix-server|keepalived]"
          - ""
          - "{{ verify.stdout_lines }}"