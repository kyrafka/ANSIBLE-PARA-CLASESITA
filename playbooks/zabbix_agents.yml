---
# ============================================================================
# zabbix_agents.yml — Instalacion de Zabbix Agent + Hostname + Sudoers
# ============================================================================
# Este playbook:
# 1. Instala Zabbix Agent
# 2. Configura hostname del sistema
# 3. Agrega sudoers para auto-recovery de servicios
# 4. Crea script vm-poweron.sh
# ============================================================================

- name: "Instalar Zabbix Agent + Configurar Hostname"
  hosts: all
  connection: smart
  become: true

  vars:
    zabbix_server: "192.168.17.11"
    zabbix_version: "7.0-2+ubuntu24.04"
    hostname_map:
      vm-dc01: vm-dc01
      vm-services01: vm-services01
      vm-web01: vm-web01
      vm-voip01: vm-voip01
      vm-storage01: vm-storage01
      vm-docker01: vm-docker01
      vm-monitor01: vm-monitor01
      core1: core1
      core2: core2

  tasks:
    # =========================================================================
    # 0. CONFIGURAR HOSTNAME DEL SISTEMA
    # =========================================================================
    - name: "AGN — Configurar hostname del sistema"
      ansible.builtin.shell: |
        CURRENT_HOSTNAME=$(hostname -s)
        TARGET_HOSTNAME="{{ hostname_map[inventory_hostname] | default(inventory_hostname) }}"
        echo "Hostname actual: $CURRENT_HOSTNAME"
        echo "Hostname objetivo: $TARGET_HOSTNAME"
        if [ "$CURRENT_HOSTNAME" != "$TARGET_HOSTNAME" ]; then
          hostnamectl set-hostname "$TARGET_HOSTNAME"
          echo "$TARGET_HOSTNAME" > /etc/hostname
          sed -i "/^127.0.1.1/d" /etc/hosts
          echo "127.0.1.1 $TARGET_HOSTNAME" >> /etc/hosts
          echo "Hostname cambiado a: $TARGET_HOSTNAME"
        else
          echo "Hostname ya correcto"
        fi
        hostname -s
      changed_when: false
      register: hostname_result

    - name: "AGN — Mostrar resultado hostname"
      ansible.builtin.debug:
        msg: "{{ hostname_result.stdout_lines }}"

    # =========================================================================
    # 1. INSTALAR sshpass
    # =========================================================================
    - name: "AGN — Instalar sshpass (para vm-poweron.sh)"
      ansible.builtin.apt:
        name: sshpass
        state: present

    - name: "AGN — LIMPIEZA: Remover instalaciones anteriores de Zabbix"
      ansible.builtin.shell: |
        echo "=== LIMPIEZA DE ZABBIX ANTERIOR ==="
        
        # Detener cualquier proceso zabbix
        pkill -9 zabbix_agentd 2>/dev/null || true
        pkill -9 zabbix_agentd.conf 2>/dev/null || true
        
        # Desactivar y remover servicio
        systemctl stop zabbix-agent 2>/dev/null || true
        systemctl disable zabbix-agent 2>/dev/null || true
        systemctl daemon-reload
        
        # Remover paquetes completamente
        dpkg --remove --force-remove-reinstreq zabbix-agent zabbix-agent2 2>/dev/null || true
        apt-get purge -y zabbix-agent zabbix-agent2 zabbix-agent-config 2>/dev/null || true
        apt-get autoremove -y
        
        # Remover archivos de configuración
        rm -rf /etc/zabbix /etc/zabbix_agentd.conf.d /var/log/zabbix /run/zabbix
        rm -f /tmp/zabbix.deb /tmp/zabbix_agent.deb
        
        # Limpiar apt
        apt-get clean
        
        echo "LIMPIEZA COMPLETA"

    - name: "AGN — VERIFICAR: Estado actual"
      ansible.builtin.shell: |
        echo "=== VERIFICANDO ESTADO ACTUAL ==="
        echo "Binario zabbix_agentd: $(which zabbix_agentd 2>/dev/null || echo 'NO EXISTE')"
        echo "Servicio systemd: $(systemctl list-units --type=service --all 2>/dev/null | grep zabbix-agent || echo 'NO EXISTE')"
        echo "Paquetes instalados: $(dpkg -l 2>/dev/null | grep zabbix-agent || echo 'NINGUNO')"

    - name: "AGN — INSTALAR: Repo y paquete Zabbix Agent"
      ansible.builtin.shell: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        export APT_LISTCHANGES_FRONTEND=none
        
        echo "=== DESCARGANDO REPO ==="
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        echo "Repo descargado"
        
        echo "=== INSTALANDO REPO ==="
        dpkg -i /tmp/zabbix.deb || true
        
        echo "=== ACTUALIZANDO APT ==="
        apt-get update -qq
        
        echo "=== INSTALANDO ZABBIX-AGENT ==="
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          -o Dpkg::Options::="--force-confnew" \
          -o Dpkg::Options::="--force-confdef" \
          zabbix-agent
        
        echo "=== VERIFICANDO DESPUES DE INSTALAR ==="
        ls -la /usr/sbin/zabbix_agentd 2>/dev/null && echo "BINARIO OK" || echo "BINARIO FALLO"
        dpkg -l | grep zabbix-agent || echo "PAQUETE NO INSTALADO"
      register: install_output

    - name: "AGN — MOSTRAR resultado instalacion"
      ansible.builtin.debug:
        msg: "{{ install_output.stdout_lines }}"

    - name: "AGN — CREAR usuario zabbix"
      ansible.builtin.user:
        name: zabbix
        system: yes
        shell: /bin/bash
        create_home: no
        state: present
      failed_when: false

    - name: "AGN — Agregar zabbix a sudoers sin password (TODOS los servicios)"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zabbix
        content: |
          # Scripts
          zabbix ALL=(ALL) NOPASSWD: /usr/local/bin/vm-poweron.sh
          zabbix ALL=(ALL) NOPASSWD: /usr/local/bin/service-restart.sh

          # Zabbix Agent
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart zabbix-agent

          # Servicios WEB
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart apache2
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart nginx
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart php*-fpm

          # Bases de datos
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart mariadb
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart mysql

          # Correo
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart postfix
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart dovecot

          # VoIP
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart asterisk

          # File Server
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart smbd
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart nfs-server

          # Docker
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart docker

          # AD/DC
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart samba-ad-dc
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart named

          # DHCP
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart isc-dhcp-server

          # Monitoreo
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart zabbix-server
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart grafana-server

          # Red
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart keepalived
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart networking
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart frr

          # Emergencia
          zabbix ALL=(ALL) NOPASSWD: /sbin/reboot
          zabbix ALL=(ALL) NOPASSWD: /sbin/poweroff
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl reboot
        mode: "0440"
        force: yes

    - name: "AGN — Hacer script vm-poweron.sh ejecutable"
      ansible.builtin.shell: |
        chmod 755 /usr/local/bin/vm-poweron.sh 2>/dev/null || true
        chown zabbix:zabbix /usr/local/bin/vm-poweron.sh 2>/dev/null || true

    - name: "AGN — RECARGAR systemd y habilitar servicio"
      ansible.builtin.shell: |
        echo "=== RECARGANDO SYSTEMD ==="
        systemctl daemon-reload
        
        echo "=== HABILITANDO SERVICIO ==="
        systemctl enable zabbix-agent
        systemctl start zabbix-agent
        sleep 3
        
        echo "=== ESTADO DEL SERVICIO ==="
        systemctl status zabbix-agent --no-pager | head -15

    - name: "AGN — CREAR directorios necesarios"
      ansible.builtin.shell: |
        mkdir -p /run/zabbix /var/log/zabbix /etc/zabbix/zabbix_agentd.conf.d
        chown -R zabbix:zabbix /run/zabbix /var/log/zabbix 2>/dev/null || true
        chmod 755 /run/zabbix /var/log/zabbix
        ls -la /run/zabbix /var/log/zabbix

    - name: "AGN — SETEAR HOSTNAME"
      ansible.builtin.set_fact:
        zabbix_hostname: >-
          {% if inventory_hostname in ['localhost', 'all'] %}
            {% if ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined %}
              {% if ansible_default_ipv4.address == '192.168.17.11' %}vm-monitor01
              {% elif ansible_default_ipv4.address == '192.168.16.10' %}vm-dc01
              {% elif ansible_default_ipv4.address == '192.168.13.11' %}vm-services01
              {% elif ansible_default_ipv4.address == '192.168.11.11' %}vm-web01
              {% elif ansible_default_ipv4.address == '192.168.15.11' %}vm-voip01
              {% elif ansible_default_ipv4.address == '192.168.14.11' %}vm-storage01
              {% elif ansible_default_ipv4.address == '192.168.13.12' %}vm-docker01
              {% else %}{{ inventory_hostname }}
              {% endif %}
            {% else %}vm-monitor01{% endif %}
          {% else %}{{ inventory_hostname }}
          {% endif %}

    - name: "AGN — MOSTRAR hostname"
      ansible.builtin.debug:
        msg: "Hostname Zabbix: {{ zabbix_hostname }}"

    - name: "AGN — CONFIGURAR Zabbix Agent"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf
        content: |
          PidFile=/run/zabbix/zabbix_agentd.pid
          LogFile=/var/log/zabbix/zabbix_agentd.log
          LogFileSize=10
          Server={{ zabbix_server }},127.0.0.1
          ServerActive={{ zabbix_server }},127.0.0.1
          Hostname={{ zabbix_hostname }}
          TLSConnect=unencrypted
          TLSAccept=unencrypted
          ListenPort=10050
          RefreshActiveChecks=300
          Timeout=30
          BufferSend=10
          BufferSize=100
          MaxLinesPerSecond=100
          EnableRemoteCommands=1
          AllowRoot=1
          Include=/etc/zabbix/zabbix_agentd.conf.d/*.conf
        force: yes
        mode: "0644"

    - name: "AGN — Crear reglas de comandos permitidos"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf.d/remote_commands.conf
        content: |
          # Comandos permitidos para remote execution via Zabbix
          AllowKey=system.run[/usr/bin/systemctl restart apache2]
          AllowKey=system.run[/usr/bin/systemctl restart nginx]
          AllowKey=system.run[/usr/bin/systemctl restart php*-fpm]
          AllowKey=system.run[/usr/bin/systemctl restart mariadb]
          AllowKey=system.run[/usr/bin/systemctl restart mysql]
          AllowKey=system.run[/usr/bin/systemctl restart postfix]
          AllowKey=system.run[/usr/bin/systemctl restart dovecot]
          AllowKey=system.run[/usr/bin/systemctl restart asterisk]
          AllowKey=system.run[/usr/bin/systemctl restart smbd]
          AllowKey=system.run[/usr/bin/systemctl restart nfs-server]
          AllowKey=system.run[/usr/bin/systemctl restart docker]
          AllowKey=system.run[/usr/bin/systemctl restart samba-ad-dc]
          AllowKey=system.run[/usr/bin/systemctl restart named]
          AllowKey=system.run[/usr/bin/systemctl restart isc-dhcp-server]
          AllowKey=system.run[/usr/bin/systemctl restart zabbix-server]
          AllowKey=system.run[/usr/bin/systemctl restart grafana-server]
          AllowKey=system.run[/usr/bin/systemctl restart keepalived]
          AllowKey=system.run[/usr/bin/systemctl restart networking]
          AllowKey=system.run[/usr/bin/systemctl restart frr]
          AllowKey=system.run[/sbin/reboot]
          AllowKey=system.run[/sbin/shutdown -r now]
          AllowKey=system.run[/usr/bin/systemctl reboot --force]
          AllowKey=system.run[/bin/systemctl reboot --force]
          AllowKey=system.run[/sbin/poweroff]
          AllowKey=system.run[/usr/bin/systemctl poweroff]
        mode: "0644"
        force: yes

    - name: "AGN — Crear script vm-poweron.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/vm-poweron.sh
        content: |
          #!/bin/bash
          VM_NAME="$1"
          ESXI_HOST="168.121.48.254"
          ESXI_PORT="10112"
          ESXI_USER="root"
          ESXI_PASS="qwe123$"

          if [ -z "$VM_NAME" ]; then
              echo "ERROR: Falta nombre de VM"
              exit 1
          fi

          echo "AUTO-POWERON: Encendiendo '$VM_NAME' en $ESXI_HOST:$ESXI_PORT"

          VM_INFO=$(sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/getallvms" 2>/dev/null)

          VM_LINE=$(echo "$VM_INFO" | grep -i "$VM_NAME" | head -1)

          if [ -z "$VM_LINE" ]; then
              echo "ERROR: VM '$VM_NAME' no encontrada"
              exit 1
          fi

          VM_ID=$(echo "$VM_LINE" | awk '{print $1}')
          echo "Encontrada VM ID: $VM_ID"

          sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/power.on $VM_ID"

          echo "OK - VM debería encenderse en ~30 segundos"
        mode: "0755"
        owner: zabbix
        group: zabbix

    - name: "AGN — REINICIAR servicio con nueva config"
      ansible.builtin.shell: |
        echo "=== REINICIANDO ZABBIX AGENT ==="
        systemctl restart zabbix-agent 2>&1
        sleep 3

        echo "=== ESTADO FINAL ==="
        systemctl is-active zabbix-agent && echo "AGENT: OK" || echo "AGENT: FAIL"

        echo ""
        echo "=== ULTIMOS ERRORES DEL SERVICIO ==="
        journalctl -u zabbix-agent.service -n 10 --no-pager 2>/dev/null || echo "Sin errores en journal"

        echo ""
        echo "=== LOG DE ZABBIX AGENT ==="
        tail -20 /var/log/zabbix/zabbix_agentd.log 2>/dev/null || echo "Sin log"

    - name: "AGN — VERIFICACION FINAL Y RESUMEN"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "  RESUMEN INSTALACION ZABBIX AGENT"
        echo "=========================================="
        echo ""
        echo "=== IDENTIFICADORES ==="
        echo "Hostname Sistema: $(hostname -s)"
        echo "Hostname Zabbix (config): {{ zabbix_hostname }}"
        echo "IP Local: {{ ansible_default_ipv4.address | default('N/A') }}"
        echo "Zabbix Server: {{ zabbix_server }}"
        echo ""
        echo "=== ARCHIVO DE CONFIGURACION ==="
        if [ -f /etc/zabbix/zabbix_agentd.conf ]; then
          echo "Config existe: SI"
          echo "Hostname configurado:"
          grep "^Hostname=" /etc/zabbix/zabbix_agentd.conf | head -1
          echo "Server configurado:"
          grep "^Server=" /etc/zabbix/zabbix_agentd.conf | head -1
        else
          echo "Config existe: NO"
        fi
        echo ""
        echo "=== SERVICIO ==="
        systemctl is-active zabbix-agent && echo "Status: ACTIVO" || echo "Status: INACTIVO"
        systemctl status zabbix-agent --no-pager | head -5
        echo ""
        echo "=== PERMISOS SUDOERS ==="
        if [ -f /etc/sudoers.d/zabbix ]; then
          echo "sudoers zabbix: SI"
          grep -v "^#" /etc/sudoers.d/zabbix | grep -v "^$" | head -5
        else
          echo "sudoers zabbix: NO"
        fi
        echo ""
        echo "=== SCRIPT VM-POWERON ==="
        if [ -f /usr/local/bin/vm-poweron.sh ]; then
          echo "vm-poweron.sh: EXISTE"
          grep "GOVC_URL" /usr/local/bin/vm-poweron.sh | head -1
        else
          echo "vm-poweron.sh: NO EXISTE"
        fi
        echo ""
        echo "=== RED Y CONECTIVIDAD ==="
        ss -tlnp | grep 10050 || echo "Puerto 10050: no escuchando"
        timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>&1 && echo "Zabbix Server: ALCANZABLE" || echo "Zabbix Server: NO ALCANZABLE"
        echo ""
        echo "=== LOGS ZABBIX AGENT (ultimas 10 lineas) ==="
        tail -10 /var/log/zabbix/zabbix_agentd.log 2>/dev/null || echo "Sin logs aun"
        echo ""
        echo "=========================================="
        echo "  VALIDACION FINAL"
        echo "=========================================="

        ERRORS=0
        WARNINGS=0

        # Check 1: Service running
        if systemctl is-active zabbix-agent | grep -q "active"; then
          echo "✅ Servicio Zabbix Agent: ACTIVO"
        else
          echo "❌ Servicio Zabbix Agent: INACTIVO"
          ERRORS=$((ERRORS + 1))
        fi

        # Check 2: Config file exists
        if [ -f /etc/zabbix/zabbix_agentd.conf ]; then
          echo "✅ Archivo config: EXISTE"
        else
          echo "❌ Archivo config: NO EXISTE"
          ERRORS=$((ERRORS + 1))
        fi

        # Check 3: Hostname correct in config
        if grep -q "^Hostname={{ zabbix_hostname }}$" /etc/zabbix/zabbix_agentd.conf 2>/dev/null; then
          echo "✅ Hostname en config: {{ zabbix_hostname }}"
        elif grep -q "^Hostname=.*" /etc/zabbix/zabbix_agentd.conf 2>/dev/null; then
          echo "Hostname actual en config:"
          grep "^Hostname=" /etc/zabbix/zabbix_agentd.conf
          echo "⚠️ Hostname puede no coincidir con esperado ({{ zabbix_hostname }})"
          WARNINGS=$((WARNINGS + 1))
        else
          echo "❌ Hostname NO configurado"
          ERRORS=$((ERRORS + 1))
        fi

        # Check 4: Server connectivity
        if timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>/dev/null; then
          echo "✅ Conectividad Zabbix Server: OK"
        else
          echo "❌ Conectividad Zabbix Server: FALLO"
          ERRORS=$((ERRORS + 1))
        fi

        # Check 5: sudoers
        if [ -f /etc/sudoers.d/zabbix ]; then
          echo "✅ Sudoers zabbix: CONFIGURADO"
        else
          echo "⚠️ Sudoers zabbix: NO CONFIGURADO"
          WARNINGS=$((WARNINGS + 1))
        fi

        echo ""
        echo "=========================================="
        echo "RESUMEN: $ERRORS errores, $WARNINGS advertencias"
        echo "=========================================="
      changed_when: false
      register: verif

    - name: "AGN — RESULTADO"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"