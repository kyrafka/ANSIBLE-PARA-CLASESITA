---
# ============================================================================
# zabbix_agents.yml — Instalar Zabbix Agent (solo ejecución local)
# ============================================================================

- name: "Instalar Zabbix Agent"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_server: "192.168.17.11"

  tasks:
    - name: "AGN — Instalar Zabbix Agent"
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        
        # Verificar si ya existe
        if command -v zabbix_agentd &>/dev/null; then
          echo "YA INSTALADO: $(which zabbix_agentd)"
          zabbix_agentd -V 2>&1 | head -1
          exit 0
        fi
        
        echo "=== Instalando Zabbix Agent ==="
        
        # Descargar repo
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        dpkg -i /tmp/zabbix.deb
        
        apt-get update
        apt-get install -y zabbix-agent
        
        echo "=== Verificando instalacion ==="
        which zabbix_agentd
        dpkg -l | grep zabbix-agent

    - name: "AGN — Obtener hostname"
      ansible.builtin.shell: hostname -s
      changed_when: false
      register: host_name

    - name: "AGN — Configurar Zabbix Agent"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf
        content: |
          PidFile=/run/zabbix/zabbix_agentd.pid
          LogFile=/var/log/zabbix/zabbix_agentd.log
          LogFileSize=10
          Server={{ zabbix_server }}
          ServerActive={{ zabbix_server }}
          Hostname={{ host_name.stdout }}
          TLSConnect=unencrypted
          TLSAccept=unencrypted
          ListenPort=10050
          Include=/etc/zabbix/zabbix_agentd.conf.d/*.conf
        force: yes
        mode: "0644"

    - name: "AGN — Crear directorios"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: zabbix
        mode: "0755"
      loop:
        - /run/zabbix
        - /var/log/zabbix
        - /etc/zabbix/zabbix_agentd.conf.d

    - name: "AGN — Iniciar Zabbix Agent"
      ansible.builtin.shell: |
        systemctl enable zabbix-agent
        systemctl restart zabbix-agent
        sleep 3
        systemctl status zabbix-agent --no-pager

    - name: "AGN — Verificacion final"
      ansible.builtin.shell: |
        echo "=== Hostname: $(hostname -s) ==="
        systemctl is-active zabbix-agent && echo "Agent: OK" || echo "Agent: FAIL"
        ss -tlnp | grep 10050 || echo "Puerto 10050 no escuchando"
        tail -10 /var/log/zabbix/zabbix_agentd.log 2>/dev/null || echo "Sin logs"
      changed_when: false
      register: verif

    - name: "AGN — Resultado"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"