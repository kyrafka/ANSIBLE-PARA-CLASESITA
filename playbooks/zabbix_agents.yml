---
# ============================================================================
# zabbix_agents.yml — Instalación limpia de Zabbix Agent
# ============================================================================

- name: "Instalar Zabbix Agent"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_server: "192.168.17.11"
    zabbix_version: "7.0-2+ubuntu24.04"

  tasks:
    - name: "AGN — Instalar sshpass (para vm-poweron.sh)"
      ansible.builtin.apt:
        name: sshpass
        state: present

    - name: "AGN — LIMPIEZA: Remover instalaciones anteriores de Zabbix"
      ansible.builtin.shell: |
        echo "=== LIMPIEZA DE ZABBIX ANTERIOR ==="
        
        # Detener cualquier proceso zabbix
        pkill -9 zabbix_agentd 2>/dev/null || true
        pkill -9 zabbix_agentd.conf 2>/dev/null || true
        
        # Desactivar y remover servicio
        systemctl stop zabbix-agent 2>/dev/null || true
        systemctl disable zabbix-agent 2>/dev/null || true
        systemctl daemon-reload
        
        # Remover paquetes completamente
        dpkg --remove --force-remove-reinstreq zabbix-agent zabbix-agent2 2>/dev/null || true
        apt-get purge -y zabbix-agent zabbix-agent2 zabbix-agent-config 2>/dev/null || true
        apt-get autoremove -y
        
        # Remover archivos de configuración
        rm -rf /etc/zabbix /etc/zabbix_agentd.conf.d /var/log/zabbix /run/zabbix
        rm -f /tmp/zabbix.deb /tmp/zabbix_agent.deb
        
        # Limpiar apt
        apt-get clean
        
        echo "LIMPIEZA COMPLETA"

    - name: "AGN — VERIFICAR: Estado actual"
      ansible.builtin.shell: |
        echo "=== VERIFICANDO ESTADO ACTUAL ==="
        echo "Binario zabbix_agentd: $(which zabbix_agentd 2>/dev/null || echo 'NO EXISTE')"
        echo "Servicio systemd: $(systemctl list-units --type=service --all 2>/dev/null | grep zabbix-agent || echo 'NO EXISTE')"
        echo "Paquetes instalados: $(dpkg -l 2>/dev/null | grep zabbix-agent || echo 'NINGUNO')"

    - name: "AGN — INSTALAR: Repo y paquete Zabbix Agent"
      ansible.builtin.shell: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        export APT_LISTCHANGES_FRONTEND=none
        
        echo "=== DESCARGANDO REPO ==="
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        echo "Repo descargado"
        
        echo "=== INSTALANDO REPO ==="
        dpkg -i /tmp/zabbix.deb || true
        
        echo "=== ACTUALIZANDO APT ==="
        apt-get update -qq
        
        echo "=== INSTALANDO ZABBIX-AGENT ==="
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          -o Dpkg::Options::="--force-confnew" \
          -o Dpkg::Options::="--force-confdef" \
          zabbix-agent
        
        echo "=== VERIFICANDO DESPUES DE INSTALAR ==="
        ls -la /usr/sbin/zabbix_agentd 2>/dev/null && echo "BINARIO OK" || echo "BINARIO FALLO"
        dpkg -l | grep zabbix-agent || echo "PAQUETE NO INSTALADO"
      register: install_output

    - name: "AGN — MOSTRAR resultado instalacion"
      ansible.builtin.debug:
        msg: "{{ install_output.stdout_lines }}"

    - name: "AGN — CREAR usuario zabbix"
      ansible.builtin.user:
        name: zabbix
        system: yes
        shell: /bin/bash
        create_home: no
        state: present
      failed_when: false

    - name: "AGN — Agregar zabbix a sudoers sin password"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zabbix
        content: |
          zabbix ALL=(ALL) NOPASSWD: /usr/local/bin/vm-poweron.sh
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart zabbix-agent
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart apache2
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart mariadb
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart postfix
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart dovecot
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart asterisk
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart smbd
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart nfs-server
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart keepalived
          zabbix ALL=(ALL) NOPASSWD: /sbin/reboot
          zabbix ALL=(ALL) NOPASSWD: /sbin/poweroff
          zabbix ALL=(ALL) NOPASSWD: /usr/bin/systemctl reboot
        mode: "0440"
        force: yes

    - name: "AGN — Hacer script vm-poweron.sh ejecutable"
      ansible.builtin.shell: |
        chmod 755 /usr/local/bin/vm-poweron.sh 2>/dev/null || true
        chown zabbix:zabbix /usr/local/bin/vm-poweron.sh 2>/dev/null || true

    - name: "AGN — RECARGAR systemd y habilitar servicio"
      ansible.builtin.shell: |
        echo "=== RECARGANDO SYSTEMD ==="
        systemctl daemon-reload
        
        echo "=== HABILITANDO SERVICIO ==="
        systemctl enable zabbix-agent
        systemctl start zabbix-agent
        sleep 3
        
        echo "=== ESTADO DEL SERVICIO ==="
        systemctl status zabbix-agent --no-pager | head -15

    - name: "AGN — CREAR directorios necesarios"
      ansible.builtin.shell: |
        mkdir -p /run/zabbix /var/log/zabbix /etc/zabbix/zabbix_agentd.conf.d
        chown -R zabbix:zabbix /run/zabbix /var/log/zabbix 2>/dev/null || true
        chmod 755 /run/zabbix /var/log/zabbix
        ls -la /run/zabbix /var/log/zabbix

    - name: "AGN — OBTENER hostname"
      ansible.builtin.shell: hostname -s
      changed_when: false
      register: host_name

    - name: "AGN — CONFIGURAR Zabbix Agent"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf
        content: |
          PidFile=/run/zabbix/zabbix_agentd.pid
          LogFile=/var/log/zabbix/zabbix_agentd.log
          LogFileSize=10
          Server={{ zabbix_server }},127.0.0.1
          ServerActive={{ zabbix_server }},127.0.0.1
          Hostname={{ host_name.stdout }}
          TLSConnect=unencrypted
          TLSAccept=unencrypted
          ListenPort=10050
          RefreshActiveChecks=300
          Timeout=30
          BufferSend=10
          BufferSize=100
          MaxLinesPerSecond=100
          EnableRemoteCommands=1
          AllowRoot=1
          Include=/etc/zabbix/zabbix_agentd.conf.d/*.conf
        force: yes
        mode: "0644"

    - name: "AGN — Crear reglas de comandos permitidos"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf.d/remote_commands.conf
        content: |
          # Comandos permitidos para remote execution via Zabbix
          # SERVICIOS
          AllowKey=system.run[/usr/bin/systemctl restart apache2]
          AllowKey=system.run[/usr/bin/systemctl restart mariadb]
          AllowKey=system.run[/usr/bin/systemctl restart postfix]
          AllowKey=system.run[/usr/bin/systemctl restart dovecot]
          AllowKey=system.run[/usr/bin/systemctl restart asterisk]
          AllowKey=system.run[/usr/bin/systemctl restart smbd]
          AllowKey=system.run[/usr/bin/systemctl restart nfs-server]
          AllowKey=system.run[/usr/bin/systemctl restart zabbix-server]
          AllowKey=system.run[/usr/bin/systemctl restart keepalived]
          AllowKey=system.run[/usr/bin/systemctl restart networking]
          AllowKey=system.run[/usr/bin/systemctl restart frr]
          
          # EMERGENCIA - REBOOT
          AllowKey=system.run[/sbin/reboot]
          AllowKey=system.run[/sbin/shutdown -r now]
          AllowKey=system.run[/usr/bin/systemctl reboot --force]
          AllowKey=system.run[/bin/systemctl reboot --force]
          
          # POWER OFF (si es necesario)
          AllowKey=system.run[/sbin/poweroff]
          AllowKey=system.run[/usr/bin/systemctl poweroff]
        mode: "0644"
        force: yes

    - name: "AGN — Crear script vm-poweron.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/vm-poweron.sh
        content: |
          #!/bin/bash
          VM_NAME="$1"
          ESXI_HOST="168.121.48.254"
          ESXI_PORT="10112"
          ESXI_USER="root"
          ESXI_PASS="qwe123$"

          if [ -z "$VM_NAME" ]; then
              echo "ERROR: Falta nombre de VM"
              exit 1
          fi

          echo "AUTO-POWERON: Encendiendo '$VM_NAME' en $ESXI_HOST:$ESXI_PORT"

          VM_INFO=$(sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/getallvms" 2>/dev/null)

          VM_LINE=$(echo "$VM_INFO" | grep -i "$VM_NAME" | head -1)

          if [ -z "$VM_LINE" ]; then
              echo "ERROR: VM '$VM_NAME' no encontrada"
              exit 1
          fi

          VM_ID=$(echo "$VM_LINE" | awk '{print $1}')
          echo "Encontrada VM ID: $VM_ID"

          sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/power.on $VM_ID"

          echo "OK - VM debería encenderse en ~30 segundos"
        mode: "0755"
        owner: zabbix
        group: zabbix

    - name: "AGN — REINICIAR servicio con nueva config"
      ansible.builtin.shell: |
        echo "=== REINICIANDO ZABBIX AGENT ==="
        systemctl restart zabbix-agent
        sleep 3
        
        echo "=== ESTADO FINAL ==="
        systemctl is-active zabbix-agent && echo "AGENT: OK" || echo "AGENT: FAIL"
        ss -tlnp | grep 10050 || echo "PUERTO 10050: no escuchando"

    - name: "AGN — VERIFICACION FINAL"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "  RESUMEN INSTALACION ZABBIX AGENT"
        echo "=========================================="
        echo "Hostname: $(hostname -s)"
        echo "Zabbix Server: {{ zabbix_server }}"
        echo ""
        echo "=== SERVICIO ==="
        systemctl is-active zabbix-agent && echo "Status: ACTIVO" || echo "Status: INACTIVO"
        systemctl status zabbix-agent --no-pager | head -5
        echo ""
        echo "=== RED ==="
        ss -tlnp | grep 10050
        echo ""
        echo "=== CONECTIVIDAD AL SERVER ==="
        timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>&1 && echo "Zabbix Server: ALCANZABLE" || echo "Zabbix Server: NO ALCANZABLE"
        echo ""
        echo "=== LOGS (ultimas 10 lineas) ==="
        tail -10 /var/log/zabbix/zabbix_agentd.log 2>/dev/null || echo "Sin logs"
      changed_when: false
      register: verif

    - name: "AGN — RESULTADO"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"