---
- name: "Instalar Zabbix Agent"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_server: "192.168.17.11"

  tasks:
    - name: "AGN — Verificar si Zabbix Agent ya funciona"
      ansible.builtin.shell: |
        if [ -x /usr/sbin/zabbix_agentd ]; then
          echo "INSTALADO"
          /usr/sbin/zabbix_agentd -V 2>&1 | head -1
        else
          echo "NO_INSTALADO"
        fi
      changed_when: false
      register: check_agent

    - name: "AGN — Arreglar paquetes rotos de Zabbix"
      ansible.builtin.shell: |
        dpkg --configure -a 2>/dev/null || true
        dpkg --remove --force-remove-reinstreq zabbix-agent zabbix-agent-config 2>/dev/null || true
        echo "Paquetes rotos limpiados"

    - name: "AGN — Instalar Zabbix Agent si no existe"
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        export APT_LISTCHANGES_FRONTEND=none
        
        echo "=== Descargando repo Zabbix ==="
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        
        echo "=== Instalando repo ==="
        dpkg -i /tmp/zabbix.deb || true
        
        echo "=== Actualizando apt ==="
        apt-get update -qq
        
        echo "=== Instalando zabbix-agent (sin prompts) ==="
        DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confnew" zabbix-agent
        
        echo "=== Verificacion ==="
        ls -la /usr/sbin/zabbix_agentd
        /usr/sbin/zabbix_agentd -V 2>&1 | head -1
      when: check_agent.stdout == "NO_INSTALADO"
      register: install_result

    - name: "AGN — Obtener hostname"
      ansible.builtin.shell: hostname -s
      changed_when: false
      register: host_name

    - name: "AGN — Crear usuario zabbix"
      ansible.builtin.user:
        name: zabbix
        system: yes
        shell: /usr/sbin/nologin
        create_home: no
        state: present
      failed_when: false

    - name: "AGN — Crear directorios"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /run/zabbix
        - /var/log/zabbix
        - /etc/zabbix/zabbix_agentd.conf.d

    - name: "AGN — Asignar permisos"
      ansible.builtin.shell: |
        chown -R zabbix:zabbix /run/zabbix /var/log/zabbix 2>/dev/null || true
        echo "Permisos asignados"

    - name: "AGN — Configurar Zabbix Agent"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agentd.conf
        content: |
          PidFile=/run/zabbix/zabbix_agentd.pid
          LogFile=/var/log/zabbix/zabbix_agentd.log
          LogFileSize=10
          Server={{ zabbix_server }}
          ServerActive={{ zabbix_server }}
          Hostname={{ host_name.stdout }}
          TLSConnect=unencrypted
          TLSAccept=unencrypted
          ListenPort=10050
          Include=/etc/zabbix/zabbix_agentd.conf.d/*.conf
        force: yes
        mode: "0644"

    - name: "AGN — Iniciar Zabbix Agent"
      ansible.builtin.service:
        name: zabbix-agent
        enabled: yes
        state: restarted

    - name: "AGN — Verificacion final"
      ansible.builtin.shell: |
        echo "=== Hostname: $(hostname -s) ==="
        systemctl is-active zabbix-agent && echo "Agent: OK" || echo "Agent: FAIL"
        ss -tlnp | grep 10050 || echo "Puerto 10050 no escuchando"
        tail -5 /var/log/zabbix/zabbix_agentd.log 2>/dev/null || echo "Sin logs"
      changed_when: false
      register: verif

    - name: "AGN — Resultado"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"