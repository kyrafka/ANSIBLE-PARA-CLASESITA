---
# ============================================================================
# zabbix_hosts.yml — Agregar hosts a Zabbix via API
# ============================================================================

- name: "Agregar hosts a Zabbix"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_url: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_pass: "zabbix"

  tasks:
    - name: "ZBX — Obtener token de autenticación"
      ansible.builtin.shell: |
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d '{
            "jsonrpc": "2.0",
            "method": "user.login",
            "params": {"username": "{{ zabbix_user }}", "password": "{{ zabbix_pass }}"},
            "id": 1
          }'
      changed_when: false
      register: zbx_auth

    - name: "ZBX — Mostrar token"
      ansible.builtin.debug:
        msg: "{{ zbx_auth.stdout }}"

    - name: "ZBX — Agregar grupo Linux servers si no existe"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        
        # Verificar si el grupo ya existe
        GROUP_EXISTS=$(curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"hostgroup.get\",\"params\":{\"filter\":{\"name\":\"Linux servers\"}},\"auth\":\"$AUTH_TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['groupid'] if r else 'NOT_FOUND')" 2>/dev/null || echo "ERROR")
        
        echo "Grupo Linux servers: $GROUP_EXISTS"
        
        if [ "$GROUP_EXISTS" = "NOT_FOUND" ]; then
          echo "Creando grupo..."
          RESULT=$(curl -s -X POST "{{ zabbix_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"hostgroup.create\",\"params\":{\"name\":\"Linux servers\"},\"auth\":\"$AUTH_TOKEN\",\"id\":3}")
          echo "Grupo creado: $RESULT"
        else
          echo "Grupo ya existe con ID: $GROUP_EXISTS"
        fi
      changed_when: false
      register: zbx_group

    - name: "ZBX — Obtener template Linux"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        
        TEMPLATE_ID=$(curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"template.get\",\"params\":{\"filter\":{\"host\":\"Linux by Zabbix agent\"}},\"auth\":\"$AUTH_TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['templateid'] if r else 'NOT_FOUND')" 2>/dev/null || echo "ERROR")
        
        echo "Template Linux ID: $TEMPLATE_ID"
      changed_when: false
      register: zbx_template

    - name: "ZBX — Agregar host vm-voip01"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        GROUP_ID=$(curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"hostgroup.get\",\"params\":{\"filter\":{\"name\":\"Linux servers\"}},\"auth\":\"$AUTH_TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['groupid'] if r else '')" 2>/dev/null)
        
        TEMPLATE_ID=$(curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"template.get\",\"params\":{\"filter\":{\"host\":\"Linux by Zabbix agent\"}},\"auth\":\"$AUTH_TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['templateid'] if r else '')" 2>/dev/null)
        
        echo "Agregando vm-voip01..."
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-voip01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.15.11\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"$GROUP_ID\"}],
              \"templates\": [{\"templateid\": \"$TEMPLATE_ID\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 5
          }"
      changed_when: false
      register: zbx_add_voip

    - name: "ZBX — Mostrar resultado"
      ansible.builtin.debug:
        msg:
          - "Token: {{ zbx_auth.stdout }}"
          - "Grupo: {{ zbx_group.stdout_lines }}"
          - "Template: {{ zbx_template.stdout }}"
          - "Host voip01: {{ zbx_add_voip.stdout }}"