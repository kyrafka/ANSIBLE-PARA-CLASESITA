---
# ============================================================================
# zabbix_hosts.yml — Agregar hosts a Zabbix via API
# ============================================================================

- name: "Agregar hosts a Zabbix"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_url: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_pass: "zabbix"
    zbx_group_id: "2"
    zbx_template_id: "10001"

  tasks:
    - name: "ZBX — Login y obtener token"
      ansible.builtin.shell: |
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d '{
            "jsonrpc": "2.0",
            "method": "user.login",
            "params": {"username": "{{ zabbix_user }}", "password": "{{ zabbix_pass }}"},
            "id": 1
          }'
      changed_when: false
      register: zbx_auth

    - name: "ZBX — Agregar host vm-services01"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-services01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.13.11\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 2
          }"

    - name: "ZBX — Agregar host vm-storage01"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-storage01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.14.11\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 3
          }"

    - name: "ZBX — Agregar host vm-web01"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-web01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.11.11\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 4
          }"

    - name: "ZBX — Agregar host vm-monitor01"
      ansible.builtin.shell: |
