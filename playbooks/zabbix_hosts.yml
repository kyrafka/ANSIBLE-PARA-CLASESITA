          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-monitor01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.17.11\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 5
          }"

    - name: "ZBX — Agregar host vm-docker01"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"vm-docker01\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.13.12\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 6
          }"

    - name: "ZBX — Agregar host core1"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"core1\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.10.20\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 7
          }"

    - name: "ZBX — Agregar host core2"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"host.create\",
            \"params\": {
              \"host\": \"core2\",
              \"interfaces\": [{\"type\": 1, \"main\": 1, \"useip\": 1, \"ip\": \"192.168.10.30\", \"dns\": \"\", \"port\": \"10050\"}],
              \"groups\": [{\"groupid\": \"{{ zbx_group_id }}\"}],
              \"templates\": [{\"templateid\": \"{{ zbx_template_id }}\"}]
            },
            \"auth\": \"$AUTH_TOKEN\",
            \"id\": 8
          }"

    - name: "ZBX — Ver todos los hosts"
      ansible.builtin.shell: |
        AUTH_TOKEN=$(echo '{{ zbx_auth.stdout }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        echo "=== Hosts en Zabbix ==="
        curl -s -X POST "{{ zabbix_url }}" \
          -H "Content-Type: application/json" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\",\"ip\"]},\"auth\":\"$AUTH_TOKEN\",\"id\":9}" \
          | python3 -m json.tool
      changed_when: false
      register: zbx_all_hosts

    - name: "ZBX — Resultado"
      ansible.builtin.debug:
        msg: "{{ zbx_all_hosts.stdout_lines }}"