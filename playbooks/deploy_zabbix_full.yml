---
# ============================================================================
# deploy_zabbix_full.yml
# Deploy COMPLETO de Zabbix Auto-Recovery en UN SOLO ARCHIVO
# ============================================================================

- name: "Deploy ZABBIX AUTO-RECOVERY (FULL)"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_password: "Zabbix123"
    esxi_host: "168.121.48.254"
    esxi_port: "10112"
    esxi_user: "root"
    esxi_pass: "qwe123$"

  tasks:
    # =========================================================================
    # PASO 1: HABILITAR REMOTE COMMANDS EN TODOS LOS AGENTS
    # =========================================================================
    - name: "======= PASO 1: Remote Commands ======="
      ansible.builtin.debug:
        msg: "Habilitando EnableRemoteCommands=1 en todos los agents..."

    - name: "RUN — Remote Commands en vm-monitor01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.17.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-monitor01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en vm-services01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.13.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-services01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en vm-storage01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.14.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-storage01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en vm-web01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.11.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-web01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en vm-voip01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.15.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-voip01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en vm-dc01"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.10.11 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "vm-dc01: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en core1"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.10.20 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "core1: SSH o ya existe"
      changed_when: true
      failed_when: false

    - name: "RUN — Remote Commands en core2"
      ansible.builtin.shell: |
        sshpass -p 'ubuntu' ssh -o StrictHostKeyChecking=no ubuntu@192.168.10.30 \
          "sudo bash -c 'echo EnableRemoteCommands=1 >> /etc/zabbix/zabbix_agentd.conf && systemctl restart zabbix-agent'" 2>&1 || echo "core2: SSH o ya existe"
      changed_when: true
      failed_when: false

    # =========================================================================
    # PASO 2: CREAR TRIGGERS
    # =========================================================================
    - name: "======= PASO 2: Triggers ======="
      ansible.builtin.debug:
        msg: "Creando 7 triggers en Zabbix..."

    - name: "RUN — Crear Triggers"
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"{{ zabbix_password }}"},"id":1}' \
          | grep -o '"result":"[^"]*"' | cut -d'"' -f4)

        echo "Token obtenido"

        # CPU Very High
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.create\",\"params\":{\"description\":\"CPU Very High on {HOST.NAME} > 95% for 2 min\",\"expression\":\"avg(/Linux by Zabbix agent/system.cpu.util,2m)>95\",\"priority\":4,\"manual_close\":1},\"auth\":\"$TOKEN\",\"id\":10}"

        # Memory Very High
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.create\",\"params\":{\"description\":\"Memory Very High on {HOST.NAME} > 95% for 2 min\",\"expression\":\"last(/Linux by Zabbix agent/vm.memory.size[pused],2m)>95\",\"priority\":4,\"manual_close\":1},\"auth\":\"$TOKEN\",\"id\":11}"

        # Disk Low
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.create\",\"params\":{\"description\":\"Disk Space Low on {HOST.NAME} - Less than 15% free\",\"expression\":\"last(/Linux by Zabbix agent/vfs.fs.size[/,pfree])<15\",\"priority\":3,\"manual_close\":1},\"auth\":\"$TOKEN\",\"id\":12}"

        # Disk Critical
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.create\",\"params\":{\"description\":\"Disk Space Critical on {HOST.NAME} - Less than 10% free\",\"expression\":\"last(/Linux by Zabbix agent/vfs.fs.size[/,pfree])<10\",\"priority\":4,\"manual_close\":1},\"auth\":\"$TOKEN\",\"id\":13}"

        # Zabbix Agent Down
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.create\",\"params\":{\"description\":\"Zabbix Agent is not responding on {HOST.NAME} for 2 min\",\"expression\":\"nodata(/Linux by Zabbix agent/agent.ping,2m)=1\",\"priority\":4,\"manual_close\":1},\"auth\":\"$TOKEN\",\"id\":14}"

        echo "Triggers creados"
      changed_when: true
      register: triggers_result

    # =========================================================================
    # PASO 3: CREAR ACTIONS
    # =========================================================================
    - name: "======= PASO 3: Actions ======="
      ansible.builtin.debug:
        msg: "Creando 10 actions en Zabbix..."

    - name: "RUN — Actions Auto-Restart"
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"{{ zabbix_password }}"},"id":1}' \
          | grep -o '"result":"[^"]*"' | cut -d'"' -f4)

        # Action: Restart Apache
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart Apache if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"Apache DOWN on {HOST.NAME}\",\"def_longdata\":\"Apache will be restarted automatically\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart apache2\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":20}"

        # Action: Restart MariaDB
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart MariaDB if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"MariaDB DOWN on {HOST.NAME}\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart mariadb\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":21}"

        # Action: Restart Postfix
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart Postfix if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"Postfix DOWN on {HOST.NAME}\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart postfix\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":22}"

        # Action: Restart Dovecot
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart Dovecot if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"Dovecot DOWN on {HOST.NAME}\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart dovecot\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":23}"

        # Action: Restart Asterisk
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart Asterisk if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"Asterisk DOWN on {HOST.NAME}\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart asterisk\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":24}"

        # Action: Restart Samba
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"Auto-Restart Samba if down\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"Samba DOWN on {HOST.NAME}\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"systemctl restart smbd\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":25}"

        echo "Actions de servicios creadas"
      changed_when: true
      register: actions_result

    # =========================================================================
    # PASO 4: CREAR SCRIPT VMWARE AUTO-POWERON
    # =========================================================================
    - name: "======= PASO 4: VMware Auto-PowerOn ======="
      ansible.builtin.debug:
        msg: "Creando script y action para auto-encender VMs..."

    - name: "RUN — Crear script vm-poweron.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/vm-poweron.sh
        content: |
          #!/bin/bash
          # Script para encender VMs en ESXi via SSH
          VM_NAME="$1"
          ESXI_HOST="{{ esxi_host }}"
          ESXI_PORT="{{ esxi_port }}"
          ESXI_USER="{{ esxi_user }}"
          ESXI_PASS="{{ esxi_pass }}"

          if [ -z "$VM_NAME" ]; then
              echo "ERROR: Falta nombre de VM"
              exit 1
          fi

          echo "AUTO-POWERON: Encendiendo $VM_NAME en $ESXI_HOST"

          VM_ID=$(sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/getallvms" 2>/dev/null | grep "$VM_NAME" | awk '{print $1}')

          if [ -z "$VM_ID" ]; then
              echo "ERROR: VM $VM_NAME no encontrada"
              exit 1
          fi

          sshpass -p "$ESXI_PASS" ssh -p "$ESXI_PORT" -o StrictHostKeyChecking=no \
            "$ESXI_USER@$ESXI_HOST" "vim-cmd vmsvc/power.on $VM_ID"

          echo "Comando power.on enviado para VM ID: $VM_ID"
        mode: "0755"
        force: yes

    - name: "RUN — Action AUTO-POWERON VM"
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"{{ zabbix_password }}"},"id":1}' \
          | grep -o '"result":"[^"]*"' | cut -d'"' -f4)

        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.create\",\"params\":{\"name\":\"AUTO-POWERON: VM apagada\",\"eventsource\":0,\"status\":0,\"esc_period\":\"2m\",\"def_shortdata\":\"VM {HOST.NAME} apagada - Encendiendo\",\"operations\":[{\"operationtype\":1,\"opcommand\":{\"command\":\"/usr/local/bin/vm-poweron.sh {HOST.NAME}\",\"type\":0}}]},\"auth\":\"$TOKEN\",\"id\":30}"

        echo "Action de poweron creada"
      changed_when: true
      register: poweron_action

    # =========================================================================
    # PASO 5: TEST CONEXION ESXi
    # =========================================================================
    - name: "======= PASO 5: Verificar ESXi ======="
      ansible.builtin.debug:
        msg: "Verificando conexion a ESXi..."

    - name: "RUN — Test conexion ESXi"
      ansible.builtin.shell: |
        echo "Listando VMs en ESXi {{ esxi_host }}:{{ esxi_port }}..."
        sshpass -p '{{ esxi_pass }}' ssh -p {{ esxi_port }} -o StrictHostKeyChecking=no \
          root@{{ esxi_host }} "vim-cmd vmsvc/getallvms" 2>&1 | head -20
      changed_when: true
      failed_when: false
      register: esxi_test

    # =========================================================================
    # RESUMEN FINAL
    # =========================================================================
    - name: "======= RESUMEN FINAL ======="
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "   ZABBIX AUTO-RECOVERY DEPLOY COMPLETO"
          - "=========================================="
          - ""
          - "TRIGGERS (5):"
          - "  1. CPU Very High > 95% (2min)"
          - "  2. Memory Very High > 95% (2min)"
          - "  3. Disk Low < 15%"
          - "  4. Disk Critical < 10%"
          - "  5. Zabbix Agent Down (2min)"
          - ""
          - "ACTIONS DE SERVICIOS (6):"
          - "  - Apache, MariaDB, Postfix"
          - "  - Dovecot, Asterisk, Samba"
          - ""
          - "VMWARE (1):"
          - "  - AUTO-POWERON: Enciende VM apagada"
          - ""
          - "REMOTE COMMANDS:"
          - "  - Habilitado en todos los agents"
          - "  - systemctl restart [servicio]"
          - "  - systemctl reboot --force"
          - ""
          - "ESXi: {{ esxi_host }}:{{ esxi_port }}"
          - ""
          - "SCRIPT: /usr/local/bin/vm-poweron.sh"
          - ""
          - "TIEMPOS:"
          - "  - Detectar: ~2 min"
          - "  - Recovery: ~3-4 min"
          - ""
          - "PARA PROBAR:"
          - "  Apagar una VM desde ESXi"
          - "  Esperar 3-5 min"
          - "  Zabbix la encendera automaticamente"
          - ""
          - "=========================================="