---
# ============================================================================
# test_auto_recovery.yml — Test completo de auto-recovery
# ============================================================================

- name: "TEST — Auto Recovery completo"
  hosts: localhost
  connection: local
  become: true

  vars:
    esxi_host: "172.17.25.12"
    esxi_user: "root"
    esxi_pass: "qwe123$"
    test_vm: "vm-web01"

  tasks:
    # =========================================================================
    # 1. VERIFICAR ESTADO INICIAL
    # =========================================================================
    - name: "1. Estado inicial de la VM"
      shell: |
        export GOVC_URL="https://{{ esxi_user }}:{{ esxi_pass | replace('$', '\$') }}@{{ esxi_host }}:443"
        export GOVC_INSECURE=1
        export GOVC_DATA_DIR=/tmp/govc-test
        mkdir -p /tmp/govc-test

        echo "=========================================="
        echo "ESTADO INICIAL: {{ test_vm }}"
        echo "=========================================="
        govc vm.info "/ha-datacenter/vm/{{ test_vm }}" | grep -E "Name:|Power state:"

        echo ""
        echo "=========================================="
      changed_when: false
      register: estado_inicial

    - debug:
        var: estado_inicial.stdout_lines

    # =========================================================================
    # 2. VERIFICAR QUE EL SCRIPT FUNCIONA
    # =========================================================================
    - name: "2. Test script vm-poweron.sh"
      shell: |
        echo "=========================================="
        echo "TEST: Script vm-poweron.sh"
        echo "=========================================="
        sudo -u zabbix /usr/local/bin/vm-poweron.sh {{ test_vm }}
        echo "EXIT: $?"
        echo ""
        echo "=========================================="
      changed_when: false
      register: test_script

    - debug:
        var: test_script.stdout_lines

    # =========================================================================
    # 3. VERIFICAR TRIGGERS EN ZABBIX
    # =========================================================================
    - name: "3. Verificar trigger nodata para {{ test_vm }}"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")

        echo "=========================================="
        echo "TRIGGER: {{ test_vm }}"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"priority\",\"state\"],\"search\":{\"description\":\"{{ test_vm }}: Agent no responde\"}},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('['+t['priority']+']',t['description']) for t in d.get('result',[])]" || echo "NO HAY TRIGGER"

        echo ""
        echo "=========================================="
      changed_when: false
      register: verif_trigger

    - debug:
        var: verif_trigger.stdout_lines

    # =========================================================================
    # 4. VERIFICAR ACTION
    # =========================================================================
    - name: "4. Verificar action Auto PowerOn"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")

        echo "=========================================="
        echo "ACTIONS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"],\"name\":[\"AXIOM: Auto PowerOn\"]}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('[ON]' if a['status']=='0' else '[OFF]',a['name']) for a in d.get('result',[])]" || echo "NO HAY ACTION"

        echo ""
        echo "=========================================="
      changed_when: false
      register: verif_action

    - debug:
        var: verif_action.stdout_lines

    # =========================================================================
    # 5. ESPERAR Y VER SI PRENDE
    # =========================================================================
    - name: "5. Esperar 90 segundos"
      shell: |
        echo "=========================================="
        echo "ESPERANDO 90 segundos..."
        echo "Zabbix debe:"
        echo "  1. Detectar que agent.ping no responde (60s nodata)"
        echo "  2. Disparar trigger"
        echo "  3. Ejecutar action"
        echo "  4. Encender la VM"
        echo "=========================================="
        sleep 90
        echo "TIEMPO CUMPLIDO"
      changed_when: false

    # =========================================================================
    # 6. VERIFICAR ESTADO FINAL
    # =========================================================================
    - name: "6. Estado final de la VM"
      shell: |
        export GOVC_URL="https://{{ esxi_user }}:{{ esxi_pass | replace('$', '\$') }}@{{ esxi_host }}:443"
        export GOVC_INSECURE=1
        export GOVC_DATA_DIR=/tmp/govc-test
        mkdir -p /tmp/govc-test

        echo "=========================================="
        echo "ESTADO FINAL: {{ test_vm }}"
        echo "=========================================="
        govc vm.info "/ha-datacenter/vm/{{ test_vm }}" | grep -E "Name:|Power state:"

        echo ""
        echo "=========================================="
      changed_when: false
      register: estado_final

    - debug:
        var: estado_final.stdout_lines

    # =========================================================================
    # 7. VERIFICAR SI HAY PROBLEMA EN ZABBIX
    # =========================================================================
    - name: "7. Verificar problemas en Zabbix"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")

        echo "=========================================="
        echo "PROBLEMAS RELACIONADOS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":[\"name\",\"severity\"],\"search\":{\"name\":\"{{ test_vm }}\"}},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('['+str(p['severity'])+']',p['name'][:60]) for p in d.get('result',[])]" || echo "SIN PROBLEMAS"

        echo ""
        echo "=========================================="
      changed_when: false
      register: problemas

    - debug:
        var: problemas.stdout_lines

    # =========================================================================
    # 8. RESUMEN
    # =========================================================================
    - name: "8. RESUMEN"
      debug:
        msg:
          - "=========================================="
          - "RESUMEN TEST AUTO-RECOVERY"
          - "=========================================="
          - ""
          - "PASOS:"
          - "  1. VM estaba apagada"
          - "  2. Script vm-poweron.sh funciona"
          - "  3. Trigger nodata existe"
          - "  4. Action Auto PowerOn existe y esta ON"
          - "  5. Espero 90 segundos"
          - "  6. Verificar si Zabbix encendio la VM"
          - ""
          - "SI LA VM PRENDIO: El auto-recovery funciona"
          - "SI LA VM NO PRENDE: Ver logs de Zabbix"
          - ""
          - "COMANDOS:"
          - "  Journal: journalctl -u zabbix-server -n 50"
          - "  Log: tail -50 /var/log/zabbix/zabbix_server.log"
          - "=========================================="