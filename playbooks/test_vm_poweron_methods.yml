---
# ============================================================================
# test_vm_poweron_methods.yml — Probar diferentes formas de ejecutar vm-poweron.sh
# ============================================================================

- name: "TEST — Metodos de ejecucion vm-poweron.sh"
  hosts: localhost
  connection: local
  become: true

  vars:
    esxi_host: "172.17.25.12"
    esxi_port: "443"
    esxi_user: "root"
    esxi_pass: "qwe123$"

  tasks:
    - name: "TEST — Todos los metodos"
      ansible.builtin.shell: |
        echo "============================================"
        echo "TEST: Metodos de ejecucion vm-poweron.sh"
        echo "============================================"
        echo ""

        # Preparar govc
        export GOVC_URL="https://{{ esxi_user }}:{{ esxi_pass | replace('$', '\$') }}@{{ esxi_host }}:{{ esxi_port }}"
        export GOVC_INSECURE=1
        export GOVC_DATA_DIR=/tmp/govc-test
        mkdir -p /tmp/govc-test

        # Apagar vm-web01
        echo "Apagando vm-web01..."
        govc vm.power -off "/ha-datacenter/vm/vm-web01" 2>/dev/null
        sleep 2

        # Verificar estado
        echo ""
        echo "Estado inicial:"
        govc vm.info "/ha-datacenter/vm/vm-web01" | grep "Power state"

        # ============================================
        # METODO 1: Ejecucion directa
        # ============================================
        echo ""
        echo "=== METODO 1: Directo ==="
        echo "Comando: sudo -u zabbix /usr/local/bin/vm-poweron.sh vm-web01"
        sudo -u zabbix /usr/local/bin/vm-poweron.sh vm-web01 2>&1
        echo "EXIT: $?"
        sleep 3
        echo "Estado despues M1:"
        govc vm.info "/ha-datacenter/vm/vm-web01" | grep "Power state"

        # Apagar de nuevo
        govc vm.power -off "/ha-datacenter/vm/vm-web01" 2>/dev/null
        sleep 2

        # ============================================
        # METODO 2: Con bash -c y export HOME
        # ============================================
        echo ""
        echo "=== METODO 2: bash -c con HOME ==="
        echo "Comando: sudo -u zabbix bash -c 'export HOME=/var/lib/zabbix; ...'"
        sudo -u zabbix bash -c 'export HOME=/var/lib/zabbix; /usr/local/bin/vm-poweron.sh vm-web01' 2>&1
        echo "EXIT: $?"
        sleep 3
        echo "Estado despues M2:"
        govc vm.info "/ha-datacenter/vm/vm-web01" | grep "Power state"

        # Apagar de nuevo
        govc vm.power -off "/ha-datacenter/vm/vm-web01" 2>/dev/null
        sleep 2

        # ============================================
        # METODO 3: Con env completo
        # ============================================
        echo ""
        echo "=== METODO 3: Con env completo ==="
        echo "Comando: env HOME=/var/lib/zabbix GOVC_DATA_DIR=/tmp/govc sudo -u zabbix ..."
        env HOME=/var/lib/zabbix GOVC_DATA_DIR=/tmp/govc sudo -u zabbix /usr/local/bin/vm-poweron.sh vm-web01 2>&1
        echo "EXIT: $?"
        sleep 3
        echo "Estado despues M3:"
        govc vm.info "/ha-datacenter/vm/vm-web01" | grep "Power state"

        echo ""
        echo "============================================"
      changed_when: false
      register: all_tests

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ all_tests.stdout_lines }}"