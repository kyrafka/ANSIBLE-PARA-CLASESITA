---
# ============================================================================
# test_vm_poweron.yml — Diagnosticar método govc de PowerOn
# ============================================================================

- name: "TEST — Diagnosticar vm-poweron.sh (govc)"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    esxi_host: "168.121.48.254"
    esxi_port: "10112"
    esxi_user: "root"
    esxi_pass: "qwe123$"
    test_vm: "vm-web01"

  tasks:
    - name: "TEST 1 — Verificar script actual"
      ansible.builtin.shell: |
        echo "=== SCRIPT ACTUAL ==="
        cat /usr/local/bin/vm-poweron.sh 2>/dev/null || echo "SCRIPT NO EXISTE"
        echo ""
        ls -la /usr/local/bin/vm-poweron.sh 2>/dev/null || echo "ARCHIVO NO EXISTE"
      register: current_script

    - name: "RESULT 1"
      ansible.builtin.debug:
        msg: "{{ current_script.stdout_lines }}"

    # =========================================================================
    # MÉTODO govc — única versión que funciona (root SSH deshabilitado)
    # =========================================================================
    - name: "TEST 2 — Método govc"
      ansible.builtin.shell: |
        echo "=== METODO govc (SOLO FUNCIONA) ==="
        echo ""

        which govc && echo "govc: INSTALADO" || echo "govc: NO INSTALADO"
        govc version 2>/dev/null || echo "govc: FALLO AL EJECUTAR"
        echo ""

        export GOVC_URL="https://{{ esxi_user }}:{{ esxi_pass | replace('$', '\\$') }}@{{ esxi_host }}:{{ esxi_port }}"
        export GOVC_INSECURE=1

        echo "=== Variables govc ==="
        echo "GOVC_URL: https://{{ esxi_user }}:***@{{ esxi_host }}:{{ esxi_port }}"
        echo "GOVC_INSECURE: 1"
        echo ""

        echo "=== Test govc about ==="
        govc about 2>&1 || echo "govc about: FALLO"
        echo ""

        echo "=== Listando VMs en ESXi ==="
        govc vm.list 2>&1 || echo "govc vm.list: FALLO"
        echo ""

        echo "=== Info de {{ test_vm }} ==="
        govc vm.info "/ha-datacenter/vm/{{ test_vm }}" 2>&1 || echo "govc vm.info: FALLO"
        echo ""

        echo "=== Estado de {{ test_vm }} ==="
        POWER=$(govc vm.info "/ha-datacenter/vm/{{ test_vm }}" 2>/dev/null | grep "Power state" | awk '{print $3}')
        echo "Power state: ${POWER:-UNKNOWN}"
        echo ""

        if [ "$POWER" = "poweredOn" ]; then
          echo "✅ VM YA ESTÁ ENCENDIDA (govc)"
        else
          echo "=== INTENTANDO ENCENDER VM via govc ==="
          govc vm.power -on "/ha-datacenter/vm/{{ test_vm }}" 2>&1
          echo ""
          echo "=== Esperando 5 segundos ==="
          sleep 5
          echo ""
          echo "=== Estado después de PowerOn ==="
          POWER2=$(govc vm.info "/ha-datacenter/vm/{{ test_vm }}" 2>/dev/null | grep "Power state" | awk '{print $3}')
          echo "Power state: ${POWER2:-UNKNOWN}"
        fi
      register: govc_method
      changed_when: false
      ignore_errors: true

    - name: "RESULT govc"
      ansible.builtin.debug:
        msg:
          - "=== MÉTODO govc ==="
          - "{{ govc_method.stdout_lines }}"
          - "{{ govc_method.stderr_lines }}"

    # =========================================================================
    # VERIFICAR si el script actual usa govc o SSH
    # =========================================================================
    - name: "TEST 3 — Verificar tipo de script"
      ansible.builtin.shell: |
        echo "=== VERIFICANDO TIPO DE SCRIPT ==="

        if grep -q "govc" /usr/local/bin/vm-poweron.sh 2>/dev/null; then
          echo "✅ Script USA govc — CORRECTO"
        elif grep -q "vim-cmd\|sshpass" /usr/local/bin/vm-poweron.sh 2>/dev/null; then
          echo "❌ Script USA SSH/vim-cmd — NO FUNCIONARÁ (root SSH deshabilitado)"
          echo "RECOMENDACIÓN: Ejecutar zabbix_orchestrator.yml para sobreescribir con govc"
        else
          echo "⚠️ Script vacío o no existe"
        fi
      register: script_type
      changed_when: false

    - name: "RESULT tipo script"
      ansible.builtin.debug:
        msg: "{{ script_type.stdout_lines }}"

    # =========================================================================
    # RESUMEN
    # =========================================================================
    - name: "RESUMEN"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "RESUMEN DIAGNÓSTICO"
          - "=========================================="
          - "govc instalado: {{ 'SI' if 'INSTALADO' in govc_method.stdout else 'NO' }}"
          - "govc conecta: {{ 'SI' if 'VMware' in govc_method.stdout else 'NO' }}"
          - "vm-web01 estado: {{ 'ENCENDIDA' if 'poweredOn' in govc_method.stdout else 'APAGADA' }}"
          - ""
          - "NOTA: Si el script usa SSH/vim-cmd, ejecutar:"
          - "  ansible-playbook playbooks/zabbix_orchestrator.yml"
          - "para sobreescribir con la versión govc"