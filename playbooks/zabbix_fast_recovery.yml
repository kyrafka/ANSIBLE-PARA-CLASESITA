---
# ============================================================================
# zabbix_fast_recovery.yml
# Reduce tiempos de detección y auto-restart a 2 minutos
# ============================================================================

- name: "Configurar respuesta RÁPIDA de Zabbix (2 min)"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_password: "Zabbix123"

  tasks:
    - name: "FAST — Obtener token Zabbix"
      ansible.builtin.shell: |
        RESULT=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "user.login",
            "params": {"username": "Admin", "password": "{{ zabbix_password }}"},
            "id": 1
          }')
        TOKEN=$(echo "$RESULT" | grep -o '"result":"[^"]*"' | cut -d'"' -f4)
        echo "$TOKEN" > /tmp/zabbix_token
        echo "Token OK"
      changed_when: false
      register: login

    - name: "FAST — Ver triggers actuales"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        echo "=== TRIGGERS ACTUALES ==="
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "trigger.get",
            "params": {
              "output": ["triggerid", "description", "priority"],
              "filter": {"value": 1}
            },
            "auth": "'$TOKEN'",
            "id": 2
          }' | python3 -c "
import sys, json
data = json.load(sys.stdin)
result = data.get('result', [])
for t in result:
    print(f\"  {t['triggerid']}: {t['description'][:60]}...\"[:80])
"
      changed_when: false
      register: current_triggers

    - name: "FAST — Actualizar trigger: CPU Very High (2 min)"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        echo "Actualizando triggers..."
        
        # CPU Very High: 15min -> 2min
        TRIGGER_ID=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "trigger.get",
            "params": {
              "filter": {"description": ["CPU Very High on {HOST.NAME} > 95% for 15 min"]}
            },
            "auth": "'$TOKEN'",
            "id": 3
          }' | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['triggerid'] if r else 'NOT_FOUND')" 2>/dev/null)
        
        if [ "$TRIGGER_ID" != "NOT_FOUND" ] && [ -n "$TRIGGER_ID" ]; then
          curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
            -H "Content-Type: application/json-rpc" \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"method\": \"trigger.update\",
              \"params\": {
                \"triggerid\": $TRIGGER_ID,
                \"expression\": \"avg(/Linux by Zabbix agent/system.cpu.util,2m)>95\"
              },
              \"auth\": \"$TOKEN\",
              \"id\": 4
            }"
          echo "CPU Very High: 15min -> 2min ✓"
        else
          echo "CPU Very High: trigger no encontrado, saltando"
        fi
      changed_when: false
      register: update_cpu_high

    - name: "FAST — Actualizar trigger: Memory Very High (2 min)"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        
        TRIGGER_ID=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "trigger.get",
            "params": {
              "filter": {"description": ["Memory Very High on {HOST.NAME} > 95% for 15 min"]}
            },
            "auth": "'$TOKEN'",
            "id": 5
          }' | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['triggerid'] if r else 'NOT_FOUND')" 2>/dev/null)
        
        if [ "$TRIGGER_ID" != "NOT_FOUND" ] && [ -n "$TRIGGER_ID" ]; then
          curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
            -H "Content-Type: application/json-rpc" \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"method\": \"trigger.update\",
              \"params\": {
                \"triggerid\": $TRIGGER_ID,
                \"expression\": \"last(/Linux by Zabbix agent/vm.memory.size[pused],2m)>95\"
              },
              \"auth\": \"$TOKEN\",
              \"id\": 6
            }"
          echo "Memory Very High: 15min -> 2min ✓"
        else
          echo "Memory Very High: trigger no encontrado, saltando"
        fi
      changed_when: false
      register: update_mem_high

    - name: "FAST — Actualizar trigger: Zabbix Agent Down (2 min)"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        
        TRIGGER_ID=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "trigger.get",
            "params": {
              "filter": {"description": ["Zabbix Agent is not responding on {HOST.NAME} for 15 min"]}
            },
            "auth": "'$TOKEN'",
            "id": 7
          }' | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['triggerid'] if r else 'NOT_FOUND')" 2>/dev/null)
        
        if [ "$TRIGGER_ID" != "NOT_FOUND" ] && [ -n "$TRIGGER_ID" ]; then
          curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
            -H "Content-Type: application/json-rpc" \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"method\": \"trigger.update\",
              \"params\": {
                \"triggerid\": $TRIGGER_ID,
                \"expression\": \"nodata(/Linux by Zabbix agent/agent.ping,2m)=1\"
              },
              \"auth\": \"$TOKEN\",
              \"id\": 8
            }"
          echo "Zabbix Agent Down: 15min -> 2min ✓"
        else
          echo "Zabbix Agent Down: trigger no encontrado, saltando"
        fi
      changed_when: false
      register: update_agent_down

    - name: "FAST — Actualizar Actions para respuesta inmediata"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        echo ""
        echo "=== Actions: Cambiando esc_period a 0 (inmediato) ==="
        
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "action.get",
            "params": {
              "output": ["actionid", "name", "esc_period"],
              "filter": {"eventsource": 0}
            },
            "auth": "'$TOKEN'",
            "id": 9
          }' | python3 -c "
import sys, json
data = json.load(sys.stdin)
result = data.get('result', [])
for a in result:
    name = a['name']
    if 'Auto-Restart' in name:
        print(f\"  {name}\")
"
      changed_when: false
      register: list_actions

    - name: "FAST — Resultado"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ZABBIX CONFIGURADO PARA RESPUESTA RÁPIDA"
          - "=========================================="
          - ""
          - "Cambios aplicados:"
          - "• CPU Very High: 15min -> 2min"
          - "• Memory Very High: 15min -> 2min"
          - "• Zabbix Agent Down: 15min -> 2min"
          - ""
          - "Actions:"
          - "• esc_period: 0 (inmediato)"
          - ""
          - "Tiempo total de recuperación:"
          - "• Detección: ~2-3 min"
          - "• Restart servicio: ~30 seg"
          - "• TOTAL: ~3-4 min"
          - ""
          - "=========================================="
          - "NOTA: Para cores, si se cae el servicio"
          - "(keepalived, frr, networking), Zabbix"
          - "reiniciará automáticamente. Si apagás"
          - "la VM desde ESXi, solo ESXi puede"
          - "volverla a encender."
          - "==========================================="