---
- name: "Configurar vm-storage01 con AD y SMB shares"
  hosts: vm-storage01
  become: true
  gather_facts: true

  vars:
    ad_domain: "AXIOM.local"
    ad_realm: "AXIOM.LOCAL"
    ad_workgroup: "AXIOM"
    ad_server: "192.168.16.10"
    ad_admin_pass: "admin123!"

  tasks:
    - name: "1. Detener servicios Samba"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - smbd
        - nmbd
        - winbind
      ignore_errors: true

    - name: "2. Limpiar cache Samba"
      shell: |
        rm -f /var/lib/samba/*.tdb
        rm -f /var/lib/samba/private/*.tdb
        echo "Cache limpiado"

    - name: "3. Configurar nsswitch.conf con winbind"
      copy:
        dest: /etc/nsswitch.conf
        content: |
          passwd:         files systemd winbind
          group:          files systemd winbind
          shadow:         files
          hosts:          files dns
          networks:       files
          protocols:      db files
          services:       db files
          ethers:         db files
          rpc:            db files
          netgroup:       nis
        mode: "0644"

    - name: "4. Configurar smb.conf completo"
      copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
             workgroup = {{ ad_workgroup }}
             realm = {{ ad_realm }}
             server string = Storage Server AXIOM
             security = ADS

             idmap config * : backend = tdb
             idmap config * : range = 2000-9999
             idmap config {{ ad_workgroup }} : backend = rid
             idmap config {{ ad_workgroup }} : range = 10000-20000

             winbind enum users = yes
             winbind enum groups = yes
             winbind use default domain = yes
             winbind offline logon = no

             template shell = /bin/bash
             template homedir = /srv/samba/homes/%U

             log file = /var/log/samba/log.%m
             max log size = 1000
             logging = file

             unix charset = UTF8
             dos charset = CP850

          [Jefatura]
             path = /srv/samba/Jefatura
             browseable = yes
             read only = no
             create mask = 0770
             directory mask = 0770
             force group = AXIOM-Administradores
             valid users = @AXIOM-Administradores
             hosts allow = 192.168.0.0/16
             comment = Jefatura - Solo personal administrativo

          [Secretaria]
             path = /srv/samba/Secretaria
             browseable = yes
             read only = no
             create mask = 0775
             directory mask = 0775
             force group = AXIOM-Secretaria
             valid users = @AXIOM-Secretaria @AXIOM-Administradores
             hosts allow = 192.168.0.0/16
             comment = Secretaria

          [Usuarios]
             path = /srv/samba/Usuarios
             browseable = yes
             read only = no
             create mask = 0775
             directory mask = 0775
             force group = AXIOM-Usuarios
             valid users = @AXIOM-Usuarios @AXIOM-Secretaria @AXIOM-Administradores
             hosts allow = 192.168.0.0/16
             comment = Acceso general

          [homes]
             path = /srv/samba/homes/%U
             browseable = no
             read only = no
             create mask = 0700
             directory mask = 0700
             valid users = %S

          [Publico]
             path = /srv/samba/Publico
             browseable = yes
             read only = yes
             create mask = 0755
             directory mask = 0755
             valid users = @AXIOM-Usuarios @AXIOM-Secretaria @AXIOM-Administradores
             hosts allow = 192.168.0.0/16
             comment = Carpeta publica - Solo lectura
        mode: "0644"

    - name: "5. Configurar DNS del AD"
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ ad_server }}
          search {{ ad_domain }}
        mode: "0644"

    - name: "6. Limpiar Kerberos cache"
      shell: kdestroy 2>/dev/null || true

    - name: "7. Obtener ticket Kerberos"
      shell: |
        echo "{{ ad_admin_pass }}" | kinit Administrator@{{ ad_realm }}
        klist
      ignore_errors: true

    - name: "8. Join al dominio AD"
      shell: |
        net ads leave -U Administrator%{{ ad_admin_pass }} 2>/dev/null || true
        sleep 1
        net ads join -U Administrator%{{ ad_admin_pass }} -S vm-dc01.{{ ad_domain }}
        net ads testjoin
      ignore_errors: true

    - name: "9. Iniciar winbind primero"
      systemd:
        name: winbind
        state: started
        enabled: yes

    - name: "10. Esperar y verificar winbind"
      shell: |
        sleep 5
        wbinfo --ping-dc
        wbinfo -u | head -10
        wbinfo -g | grep -i axiom

    - name: "11. Iniciar smbd y nmbd"
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - smbd
        - nmbd

    - name: "12. Verificar getent"
      shell: |
        echo "=== getent passwd (usuarios AD) ==="
        getent passwd | grep -i axiom
        echo ""
        echo "=== getent group (grupos AD) ==="
        getent group | grep -i axiom

    - name: "13. Crear carpetas de shares con permisos correctos"
      shell: |
        mkdir -p /srv/samba/{Jefatura,Secretaria,Usuarios,Publico,homes}
        mkdir -p /srv/samba/Jefatura/{Proyectos,Finanzas}
        mkdir -p /srv/samba/Secretaria/{Actas,Correspondencia}
        mkdir -p /srv/samba/Usuarios/General
        chown root:root /srv/samba
        chown root:"AXIOM-Administradores" /srv/samba/Jefatura
        chown root:"AXIOM-Secretaria" /srv/samba/Secretaria
        chown root:"AXIOM-Usuarios" /srv/samba/Usuarios
        chown root:root /srv/samba/Publico
        chown root:root /srv/samba/homes
        chmod 0770 /srv/samba/Jefatura
        chmod 0775 /srv/samba/Secretaria
        chmod 0775 /srv/samba/Usuarios
        chmod 0755 /srv/samba/Publico
        chmod 0775 /srv/samba/homes

    - name: "14. Testear acceso a share con smbclient"
      shell: |
        echo "=== Test smbclient Secretaria ==="
        smbclient '//127.0.0.1/Secretaria' -U 'AXIOM\secretaria%secre.123' -c 'ls'
      ignore_errors: true

    - name: "15. Resumen final"
      debug:
        msg:
          - "=========================================="
          - "STORAGE CONFIGURADO CON AD"
          - "=========================================="
          - ""
          - "SERVIDOR: 192.168.14.11"
          - "DOMINIO: {{ ad_domain }}"
          - "WORKGROUP: {{ ad_workgroup }}"
          - ""
          - "SHARES:"
          - '  \\192.168.14.11\Jefatura    - AXIOM\jefazo / jefazo123!'
          - '  \\192.168.14.11\Secretaria  - AXIOM\secretaria / secre.123'
          - '  \\192.168.14.11\Usuarios    - AXIOM\contador / contador123!'
          - '  \\192.168.14.11\Publico     - Solo lectura'
          - '  \\192.168.14.11\homes       - Carpeta personal'
          - "=========================================="
