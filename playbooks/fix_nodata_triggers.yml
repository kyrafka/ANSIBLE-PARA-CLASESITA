---
- name: "FIX — Crear triggers nodata"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "1. Login"
      shell: |
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])" > /tmp/zbx_token
        echo "Token guardado"

    - name: "2. Obtener hosts"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          > /tmp/zbx_hosts.json
        echo "Hosts guardados"
        python3 -c "import json; d=json.load(open('/tmp/zbx_hosts.json')); [print(h['hostid'],h['name']) for h in d['result']]"

    - name: "3. Crear triggers"
      copy:
        dest: /tmp/create_triggers.py
        content: |
          #!/usr/bin/env python3
          import json
          import urllib.request

          API = "http://192.168.17.11/zabbix/api_jsonrpc.php"
          TOKEN = open("/tmp/zbx_token").read().strip()

          def api(method, params, tid):
              payload = {"jsonrpc":"2.0","method":method,"params":params,"auth":TOKEN,"id":tid}
              data = json.dumps(payload).encode()
              req = urllib.request.Request(API, data, {"Content-Type":"application/json-rpc"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          with open("/tmp/zbx_hosts.json") as f:
              hosts = json.load(f)["result"]

          print(f"Hosts: {len(hosts)}")

          for h in hosts:
              hname = h["name"]
              hid = h["hostid"]
              tname = f"{hname}: Agent no responde — PowerOn ESXi"
              expr = f"nodata(/{hname}/agent.ping,60s)=1"

              print(f"Procesando: {hname}")

              # Buscar si ya existe
              existing = api("trigger.get", {"filter":{"description":[tname]}, "hostids":[hid]}, 10)

              if existing.get("result"):
                  tid = existing["result"][0]["triggerid"]
                  api("trigger.delete", [tid], 11)
                  print(f"  Eliminada previa")

              # Crear
              try:
                  r = api("trigger.create", {
                      "description": tname,
                      "expression": expr,
                      "priority": "4",
                      "manual_close": "1",
                      "tags": [{"tag":"scope","value":"availability"},{"tag":"auto_recovery","value":"poweron"}]
                  }, 12)
                  print(f"  CREADA: {r['result']['triggerids'][0]}")
              except Exception as e:
                  print(f"  ERROR: {e}")

          print("FIN")

    - name: "4. Ejecutar script"
      shell: |
        python3 /tmp/create_triggers.py
      register: result

    - debug:
        var: result.stdout_lines

    - name: "5. Verificar"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== TRIGGERS NODATA ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\"],\"search\":{\"description\":\"no responde\"}},\"auth\":\"$TOKEN\",\"id\":20}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['description'][:60]) for t in d.get('result',[])]" || echo "NO HAY"