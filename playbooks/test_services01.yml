---
- name: "Test Mail Server - vm-services01"
  hosts: vm-services01
  become: true
  gather_facts: false

  tasks:
    - name: "1. Estado de servicios de correo"
      ansible.builtin.shell: |
        echo "=== MySQL ==="
        systemctl is-active mysql 2>/dev/null || echo "INACTIVE"
        echo "=== Apache2 ==="
        systemctl is-active apache2 2>/dev/null || echo "INACTIVE"
        echo "=== Postfix ==="
        systemctl is-active postfix 2>/dev/null || echo "INACTIVE"
        echo "=== Dovecot ==="
        systemctl is-active dovecot 2>/dev/null || echo "INACTIVE"
      register: mail_services

    - name: "Mostrar servicios"
      ansible.builtin.debug:
        msg: "{{ mail_services.stdout_lines }}"

    - name: "2. MySQL - Verificar axiom_web"
      ansible.builtin.shell: |
        echo "=== Bases de datos ==="
        mysql -u root -p'AdminMail123!' -e "SHOW DATABASES;" 2>/dev/null
        echo ""
        echo "=== Usuario axiom_web ==="
        mysql -u root -p'AdminMail123!' -e "SELECT user,host FROM mysql.user WHERE user='axiom_web';" 2>/dev/null
      register: mysql_check

    - name: "Mostrar MySQL"
      ansible.builtin.debug:
        msg: "{{ mysql_check.stdout_lines }}"

    - name: "3. Verificar Postfix"
      ansible.builtin.shell: |
        postconf -n | grep -E 'myhostname|inet_interfaces|mydomain' 2>/dev/null || echo "Postfix no responde"
      register: postfix_conf
      ignore_errors: true

    - name: "Mostrar Postfix config"
      ansible.builtin.debug:
        msg: "{{ postfix_conf.stdout_lines }}"

    - name: "4. Verificar Roundcube"
      ansible.builtin.shell: |
        echo "=== Roundcube accesible ==="
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost/roundcube/ 2>/dev/null || echo "No responde"
      register: roundcube_check
      ignore_errors: true

    - name: "Mostrar Roundcube"
      ansible.builtin.debug:
        msg: "{{ roundcube_check.stdout }}"

    - name: "5. Puertos listening"
      ansible.builtin.shell: |
        ss -tlnp | grep -E ':25 |:993 |:995 |:3306 |:80 |:443 '
      register: ports
      ignore_errors: true

    - name: "Mostrar puertos"
      ansible.builtin.debug:
        msg: "{{ ports.stdout if ports.stdout else 'Sin datos' }}"

    - name: "6. Probar configuracion de email"
      ansible.builtin.shell: |
        echo "=== Hosts de邮件 ==="
        postconf -n | grep -E '^myhostname|^mydomain|^myorigin' 2>/dev/null
      register: email_config
      ignore_errors: true

    - name: "Mostrar config email"
      ansible.builtin.debug:
        msg: "{{ email_config.stdout_lines }}"