---
- name: "Test Web Server - vm-web01"
  hosts: vm-web01
  become: true
  gather_facts: false

  tasks:
    - name: "1. Estado de servicios"
      ansible.builtin.shell: |
        echo "=== NGINX ==="
        systemctl is-active nginx 2>/dev/null || echo "INACTIVE"
        echo "=== PHP-FPM ==="
        systemctl is-active php8.3-fpm 2>/dev/null || echo "INACTIVE"
        echo "=== MariaDB Local ==="
        systemctl is-active mariadb 2>/dev/null || echo "INACTIVE"
      register: services_status

    - name: "Mostrar estado de servicios"
      ansible.builtin.debug:
        msg: "{{ services_status.stdout_lines }}"

    - name: "2. Probar acceso web"
      ansible.builtin.shell: |
        echo "=== HTTP Response ==="
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost/
        echo "=== Contenido /index.html (primeras 3 lineas) ==="
        curl -s http://localhost/index.html | head -3
      register: web_test

    - name: "Mostrar resultado web"
      ansible.builtin.debug:
        msg: "{{ web_test.stdout_lines }}"

    - name: "3. Verificar wp-config.php"
      ansible.builtin.shell: |
        grep -E 'DB_NAME|DB_USER|DB_HOST|DB_PASSWORD' /var/www/axiom/wp-config.php 2>/dev/null | head -5 || echo "wp-config no existe"
      register: wp_config
      ignore_errors: true

    - name: "Mostrar wp-config"
      ansible.builtin.debug:
        msg: "{{ wp_config.stdout_lines }}"

    - name: "4. Conectar a MySQL remoto en vm-services01"
      ansible.builtin.shell: |
        mysql -h 192.168.13.11 -u axiom_web -p'Ax1omWeb!2024' -e "SELECT 'CONEXION_OK' as test;" 2>&1
      register: mysql_conn
      ignore_errors: true

    - name: "Mostrar conectividad MySQL"
      ansible.builtin.debug:
        msg: "{{ mysql_conn.stdout }}"

    - name: "5. Puerto 80 listening"
      ansible.builtin.shell: |
        ss -tlnp | grep ':80 '
      register: port_80
      ignore_errors: true

    - name: "Mostrar puerto 80"
      ansible.builtin.debug:
        msg: "{{ port_80.stdout if port_80.stdout else 'Sin datos' }}"

    - name: "6. Archivos en /var/www/axiom"
      ansible.builtin.shell: |
        ls -la /var/www/axiom/ | head -10
      register: www_dir

    - name: "Mostrar contenido de /var/www/axiom"
      ansible.builtin.debug:
        msg: "{{ www_dir.stdout_lines }}"