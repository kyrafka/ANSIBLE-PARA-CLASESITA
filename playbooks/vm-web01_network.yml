---
# ============================================================================
# vm-web01_network.yml — Solo red (PARTE 1)
# ============================================================================
# Bond0 (ens34+ens35) active-backup hacia cores (trunk ESXi VLAN 10)
# IP: 192.168.11.11/27 en bond0
# ============================================================================

- name: "Configurar RED vm-web01 — Bond0 + VLAN 10 DMZ"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    server_ip: "192.168.11.11"
    server_gateway: "192.168.11.1"
    dns_server: "192.168.16.10"

  tasks:
    - name: "NET — Detener NetworkManager"
      ansible.builtin.shell: |
        systemctl is-active NetworkManager >/dev/null 2>&1 && systemctl stop NetworkManager || true
        systemctl is-enabled NetworkManager >/dev/null 2>&1 && systemctl disable NetworkManager || true
        echo "OK"

    - name: "NET — Backup netplan"
      ansible.builtin.shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.bak.$(date +%s)
        echo "Backup done"

    - name: "NET — Crear netplan con Bond0 (ens34+ens35) active-backup"
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          # vm-web01 — Bond0 active-backup hacia cores (VLAN 10 via ESXi trunk)
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens34:
                dhcp4: no
                optional: true
              ens35:
                dhcp4: no
                optional: true
            bonds:
              bond0:
                interfaces: [ens34, ens35]
                addresses:
                  - {{ server_ip }}/27
                routes:
                  - to: default
                    via: {{ server_gateway }}
                nameservers:
                  addresses:
                    - {{ dns_server }}
                    - 8.8.8.8
                parameters:
                  mode: active-backup
                  mii-monitor-interval: 100
                  primary: ens34
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Aplicar netplan"
      ansible.builtin.shell: |
        netplan generate
        netplan apply
        sleep 5
      changed_when: true

    - name: "NET — Verificar y corregir enslave de interfaces al bond"
      ansible.builtin.shell: |
        echo "=== Intentando netplan apply ==="
        netplan apply
        sleep 5

        echo "=== Estado actual del bond ==="
        if [ -f /proc/net/bonding/bond0 ]; then
          SLAVES=$(cat /proc/net/bonding/bond0 | grep "Slave Interface" | awk '{print $4}')
          echo "Slaves: $SLAVES"
          ACTIVE=$(cat /proc/net/bonding/bond0 | grep "Currently Active Slave" | awk '{print $5}')
          echo "Active: $ACTIVE"
        else
          echo "Bond0 no existe aun"
        fi

        echo "=== Verificar si ens34/ens35 son slaves ==="
        for iface in ens34 ens35; do
          MASTER=$(cat /sys/class/net/$iface/master 2>/dev/null || echo "none")
          echo "$iface master: $MASTER"
        done

        echo "=== Si bond0 existe pero no tiene slaves, forzar enslave ==="
        if [ -f /proc/net/bonding/bond0 ]; then
          SLAVE_COUNT=$(cat /proc/net/bonding/bond0 | grep -c "Slave Interface")
          if [ "$SLAVE_COUNT" -eq 0 ]; then
            echo "Forzando enslave de ens34 y ens35..."
            ip link set ens34 down
            ip link set ens35 down
            ip link set ens34 master bond0 2>/dev/null || true
            ip link set ens35 master bond0 2>/dev/null || true
            ip link set ens34 up
            ip link set ens35 up
            sleep 3
            SLAVE_COUNT2=$(cat /proc/net/bonding/bond0 | grep -c "Slave Interface")
            echo "Slaves ahora: $SLAVE_COUNT2"
          fi
        fi

        echo "=== Subir bond0 ==="
        ip link set bond0 up
        sleep 2

        echo "=== Estado bond0 ==="
        ip addr show bond0 | grep "inet "
        echo "=== RUTAS ==="
        ip route | grep default
      changed_when: false
      register: bond_debug

    - name: "VERIF — Ping a gateway"
      ansible.builtin.shell: |
        ping -c 3 {{ server_gateway }}
      changed_when: false
      ignore_errors: true
      register: ping_gw

    - name: "VERIF — Ping a DNS"
      ansible.builtin.shell: |
        ping -c 3 {{ dns_server }}
      changed_when: false
      ignore_errors: true
      register: ping_dns

    - name: "VERIF — Ping a internet"
      ansible.builtin.shell: |
        ping -c 3 8.8.8.8
      changed_when: false
      ignore_errors: true
      register: ping_net

    - name: "RESULT — Debug bond"
      ansible.builtin.debug:
        msg: "{{ bond_debug.stdout_lines }}"

    - name: "RESULT — Conectividad"
      ansible.builtin.debug:
        msg:
          - "Gateway {{ server_gateway }}: {{ 'OK' if ping_gw.rc == 0 else 'FALLO' }}"
          - "DNS {{ dns_server }}: {{ 'OK' if ping_dns.rc == 0 else 'FALLO' }}"
          - "Internet 8.8.8.8: {{ 'OK' if ping_net.rc == 0 else 'FALLO' }}"