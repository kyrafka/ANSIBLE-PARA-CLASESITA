---
# ============================================================================
# vm-web01_network.yml — Solo red (PARTE 1)
# ============================================================================
# Ens34 en ESXi port group VLAN 10 (tagged en vSwitch 4095)
# IP: 192.168.11.11/27 — SIN crear VLAN dentro del guest
# Gateway: 192.168.11.1 (pfSense VIP en VLAN 10)
# ============================================================================

- name: "Configurar RED vm-web01 — VLAN 10 DMZ"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    server_ip: "192.168.11.11"
    server_gateway: "192.168.11.1"
    dns_server: "192.168.16.10"

  tasks:
    - name: "NET — Detener NetworkManager"
      ansible.builtin.shell: |
        systemctl is-active NetworkManager >/dev/null 2>&1 && systemctl stop NetworkManager || true
        systemctl is-enabled NetworkManager >/dev/null 2>&1 && systemctl disable NetworkManager || true
        echo "OK"

    - name: "NET — Backup netplan"
      ansible.builtin.shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.bak.$(date +%s)
        echo "Backup done"

    - name: "NET — Crear netplan simple (ens34 directo, SIN VLAN dentro del guest)"
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          # vm-web01 — VLAN 10 DMZ
          # Ens34 está en ESXi port group VLAN 10 (taggeado por vSwitch)
          # El guest recibe tráfico untagged — no necesita crear VLAN internamente
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens34:
                dhcp4: no
                optional: true
                addresses:
                  - {{ server_ip }}/27
                gateway4: {{ server_gateway }}
                nameservers:
                  addresses:
                    - {{ dns_server }}
                    - 8.8.8.8
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Aplicar netplan"
      ansible.builtin.shell: |
        netplan generate
        netplan apply
        sleep 3
      changed_when: true

    - name: "VERIF — Estado de red"
      ansible.builtin.shell: |
        echo "=== ENS34 ==="
        ip addr show ens34 | grep "inet " || echo "Sin IP en ens34"
        echo "=== RUTAS ==="
        ip route | grep default
        echo "=== PING GATEWAY ==="
        ping -c 2 {{ server_gateway }} || echo "GATEWAY: NO ALCANZA"
        echo "=== PING DNS ==="
        ping -c 2 {{ dns_server }} || echo "DNS: NO ALCANZA"
        echo "=== PING INTERNET ==="
        ping -c 2 8.8.8.8 || echo "INTERNET: NO ALCANZA"
      changed_when: false
      failed_when: false
      register: verif

    - name: "RESULT — Mostrar estado"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"