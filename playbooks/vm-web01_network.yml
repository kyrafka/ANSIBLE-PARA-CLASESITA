---
# ============================================================================
# vm-web01_network.yml — Solo red (PARTE 1)
# ============================================================================
# Ens34 en trunk hacia core con VLAN 10 tagging
# IP: 192.168.11.11/27
# ============================================================================

- name: "Configurar RED vm-web01 — VLAN 10 DMZ"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    server_ip: "192.168.11.11"
    server_gateway: "192.168.11.1"
    vlan_id: 10

  tasks:
    - name: "NET — Backup netplan"
      ansible.builtin.shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.bak.$(date +%s)
        echo "Backup done"

    - name: "NET — Crear netplan simple (ens34 + VLAN 10)"
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          # vm-web01 — VLAN 10 DMZ
          # Ens34: trunk hacia cores (VLAN 10 tagged)
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens34:
                dhcp4: no
                optional: true
            vlans:
              vlan{{ vlan_id }}:
                id: {{ vlan_id }}
                link: ens34
                addresses:
                  - {{ server_ip }}/27
                gateway4: {{ server_gateway }}
                nameservers:
                  addresses:
                    - 192.168.16.10
                    - 192.168.16.1
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Aplicar netplan"
      ansible.builtin.shell: |
        netplan generate
        netplan apply
        sleep 3
      changed_when: true

    - name: "VERIF — Estado de red"
      ansible.builtin.shell: |
        echo "=== VLAN{{ vlan_id }} ==="
        ip addr show vlan{{ vlan_id }} | grep "inet " || echo "Sin IP"
        echo "=== RUTAS ==="
        ip route | grep default
        echo "=== PING GATEWAY ==="
        ping -c 2 {{ server_gateway }} || echo "GATEWAY: NO ALCANZA"
        echo "=== PING DNS ==="
        ping -c 2 192.168.16.10 || echo "DNS: NO ALCANZA"
        echo "=== PING INTERNET ==="
        ping -c 2 8.8.8.8 || echo "INTERNET: NO ALCANZA"
      changed_when: false
      failed_when: false
      register: verif

    - name: "RESULT — Mostrar estado"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"