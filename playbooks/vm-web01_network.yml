---
# ============================================================================
# vm-web01_network.yml — Solo red (PARTE 1)
# ============================================================================
# Bond0 (ens34+ens35) active-backup hacia cores/trunk ESXi VLAN 10
# IP: 192.168.11.11/27 en bond0
# Gateway: 192.168.11.1 (pfSense VIP VLAN 10)
# ============================================================================

- name: "Configurar RED vm-web01 — Bond0 + VLAN 10 DMZ"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    server_ip: "192.168.11.11"
    server_gateway: "192.168.11.1"
    dns_server: "192.168.16.10"

  tasks:
    - name: "NET — Detener NetworkManager"
      ansible.builtin.shell: |
        systemctl is-active NetworkManager >/dev/null 2>&1 && systemctl stop NetworkManager || true
        systemctl is-enabled NetworkManager >/dev/null 2>&1 && systemctl disable NetworkManager || true
        echo "OK"

    - name: "NET — Backup netplan"
      ansible.builtin.shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.bak.$(date +%s)
        echo "Backup done"

    - name: "NET — Crear netplan con Bond0 (ens34+ens35) active-backup"
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          # vm-web01 — Bond0 active-backup hacia cores (VLAN 10 via ESXi trunk)
          # El trunk VLAN 10 viaja por el bond hacia los cores L2
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens34:
                dhcp4: no
                optional: true
              ens35:
                dhcp4: no
                optional: true
            bonds:
              bond0:
                interfaces: [ens34, ens35]
                addresses:
                  - {{ server_ip }}/27
                routes:
                  - to: default
                    via: {{ server_gateway }}
                nameservers:
                  addresses:
                    - {{ dns_server }}
                    - 8.8.8.8
                parameters:
                  mode: active-backup
                  mii-monitor-interval: 100
                  primary: ens34
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Aplicar netplan"
      ansible.builtin.shell: |
        netplan generate
        netplan apply
        sleep 5
      changed_when: true
      register: netplan_result

    - name: "NET — Verificar bond0"
      ansible.builtin.shell: |
        if [ -f /proc/net/bonding/bond0 ]; then
          MODE=$(cat /proc/net/bonding/bond0 | grep "Bonding Mode" | awk '{print $3}')
          ACTIVE=$(cat /proc/net/bonding/bond0 | grep "Currently Active Slave" | awk '{print $4}')
          echo "Bond mode: $MODE, Active: $ACTIVE"
        else
          echo "Bond0 NO existe"
        fi
      changed_when: false
      register: bond_status

    - name: "VERIF — Estado de red"
      ansible.builtin.shell: |
        echo "=== BOND0 ==="
        ip addr show bond0 | grep "inet " || echo "Sin IP en bond0"
        echo "=== ENS34 ==="
        ip addr show ens34 | grep "inet " || echo "Sin IP en ens34"
        echo "=== ENS35 ==="
        ip addr show ens35 | grep "inet " || echo "Sin IP en ens35"
        echo "=== RUTAS ==="
        ip route | grep default
        echo "=== PING GATEWAY ==="
        ping -c 2 {{ server_gateway }} || echo "GATEWAY: NO ALCANZA"
        echo "=== PING DNS ==="
        ping -c 2 {{ dns_server }} || echo "DNS: NO ALCANZA"
        echo "=== PING INTERNET ==="
        ping -c 2 8.8.8.8 || echo "INTERNET: NO ALCANZA"
      changed_when: false
      failed_when: false
      register: verif

    - name: "RESULT — Bond status"
      ansible.builtin.debug:
        msg: "{{ bond_status.stdout_lines }}"

    - name: "RESULT — Mostrar estado"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"