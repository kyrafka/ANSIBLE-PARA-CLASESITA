---
- name: "CHECK — Agentes Zabbix"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "Login"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        echo "$TOKEN" > /tmp/zbx_token

    - name: "Hosts y status"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== HOSTS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\",\"available\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(h['available'],h['name']) for h in d.get('result',[])]"

    - name: "Items agent.ping"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== AGENT.PING ITEMS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"item.get\",\"params\":{\"output\":[\"hostid\",\"key_\",\"lastvalue\",\"state\"],\"search\":{\"key_\":\"agent.ping\"}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['hostid'],t['key_'],'val:',t.get('lastvalue','?'),'state:',t.get('state','?')) for t in d.get('result',[])]"

    - name: "Last data agent.ping"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== ULTIMO VALOR agent.ping ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"item.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"lastvalue\",\"lastclock\"],\"search\":{\"key_\":\"agent.ping\"}},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['hostid'],'val:',t.get('lastvalue','?'),'clock:',t.get('lastclock','?')) for t in d.get('result',[])]"

    - name: "Problemas"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== PROBLEMAS ACTIVOS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":[\"name\",\"severity\",\"clock\"],\"limit\":20},\"auth\":\"$TOKEN\",\"id\":5}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(p['severity'],p['name'][:55]) for p in d.get('result',[])]"