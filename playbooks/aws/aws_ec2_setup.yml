---
# ============================================================================
# aws_ec2_setup.yml — Desplegar Dolibarr ERP en AWS EC2
# ============================================================================
# Ejecutar en una máquina con ansible-core + boto3
# AWS_PROFILE=tu-profile aws ec2 create-key-pair --key-name mi-key --query 'KeyMaterial' --output text > mi-key.pem
# ============================================================================

- name: "Desplegar Dolibarr ERP en AWS EC2"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    aws_region: "us-east-1"
    vpc_cidr: "10.0.0.0/16"
    public_subnet_cidr: "10.0.1.0/24"
    private_subnet_cidr: "10.0.2.0/24"
    instance_type: "t3.medium"
    ami_id: "ami-0c55b159cbfafe1f0"  # Ubuntu Server 24.04 LTS
    key_name: "tuempresa-key"
    security_group_name: "dolibarr-sg"
    ec2_name: "vm-dolibarr-aws"
    erp_domain: "erp.AJ.local"

  tasks:
    - name: "AWS — Verificar boto3"
      ansible.builtin.shell: |
        python3 -c "import boto3; print('boto3 OK')" 2>/dev/null || pip3 install boto3
      changed_when: false

    - name: "AWS — Crear VPC"
      amazon.aws.ec2_vpc_net:
        name: "tuempresa-vpc"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        tags:
          Name: "tuempresa-vpc"
          Environment: "Production"
      register: vpc

    - name: "AWS — Crear Subnet pública"
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        region: "{{ aws_region }}"
        map_public: true
        tags:
          Name: "tuempresa-public-subnet"
      register: public_subnet

    - name: "AWS — Crear Subnet privada"
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_cidr }}"
        region: "{{ aws_region }}"
        tags:
          Name: "tuempresa-private-subnet"
      register: private_subnet

    - name: "AWS — Crear Internet Gateway"
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "tuempresa-igw"
      register: igw

    - name: "AWS — Crear Route Table pública"
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway.id }}"
        tags:
          Name: "tuempresa-public-rt"
      register: public_rt

    - name: "AWS — Crear Security Group"
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Security group for Dolibarr ERP"
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - type: ssh
            from_port: 22
            to_port: 22
            cidr: "0.0.0.0/0"
          - type: http
            from_port: 80
            to_port: 80
            cidr: "0.0.0.0/0"
          - type: https
            from_port: 443
            to_port: 443
            cidr: "0.0.0.0/0"
        tags:
          Name: "{{ security_group_name }}"
      register: sg

    - name: "AWS — Lanzar instancia EC2"
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        region: "{{ aws_region }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        ami: "{{ ami_id }}"
        subnet_id: "{{ public_subnet.subnet.id }}"
        security_group: "{{ sg.group_id }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 40
              volume_type: gp3
        wait: true
        tags:
          Name: "{{ ec2_name }}"
          Environment: "Production"
      register: ec2

    - name: "AWS — Mostrar información de la instancia"
      ansible.builtin.debug:
        msg:
          - "Instancia creada: {{ ec2.instances[0].instance_id }}"
          - "IP Pública: {{ ec2.instances[0].public_ip_address }}"
          - "IP Privada: {{ ec2.instances[0].private_ip_address }}"
          - "Conectar: ssh -i {{ key_name }}.pem ubuntu@{{ ec2.instances[0].public_ip_address }}"

    - name: "LOCAL — Esperar que SSH esté disponible"
      ansible.builtin.wait_for:
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300
      when: ec2.instances[0].public_ip_address is defined

    - name: "REMOTE — Instalar Dolibarr en EC2"
      ansible.builtin.import_tasks: tasks/install_dolibarr.yml
      when: ec2.instances[0].public_ip_address is defined

    - name: "RESULT — Resumen"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Dolibarr ERP desplegado en AWS"
          - "URL: http://{{ ec2.instances[0].public_ip_address }}"
          - "ERP Domain: {{ erp_domain }}"
          - "============================================"
          - "SIGUIENTE PASO:"
          - "1. Configurar DNS en Route 53 (erp.AJ.local → {{ ec2.instances[0].public_ip_address }})"
          - "2. Configurar RDS MySQL"
          - "3. Crear VPN site-to-site"