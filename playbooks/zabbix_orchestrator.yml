---
# ============================================================================
# zabbix_orchestrator.yml — Zabbix 7 completo con auto-recovery ESXi via govc
# ============================================================================

- name: "Configurar Zabbix 7 — Orchestrator Completo"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_pass: "zabbix"
    esxi_host: "168.121.48.254"
    esxi_port: "10112"
    esxi_user: "root"
    esxi_pass: "qwe123$"

  tasks:

    # =========================================================================
    # 1. INSTALAR DEPENDENCIAS
    # =========================================================================
    - name: "DEPS — Instalar sshpass"
      ansible.builtin.apt:
        name: sshpass
        state: present
        update_cache: false

    - name: "DEPS — Permitir a zabbix ejecutar scripts sin sudo password"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/zabbix-scripts
        mode: "0440"
        content: |
          zabbix ALL=(ALL) NOPASSWD: /usr/local/bin/vm-poweron.sh
          zabbix ALL=(ALL) NOPASSWD: /usr/local/bin/service-restart.sh

    - name: "DEPS — Verificar si govc esta instalado"
      ansible.builtin.stat:
        path: /usr/local/bin/govc
      register: govc_stat

    - name: "DEPS — Instalar govc"
      ansible.builtin.shell: |
        curl -sSL https://github.com/vmware/govmomi/releases/latest/download/govc_Linux_x86_64.tar.gz \
          | tar -xz -C /usr/local/bin govc
        chmod +x /usr/local/bin/govc
      args:
        executable: /bin/bash
      when: not govc_stat.stat.exists

    # =========================================================================
    # 2. SCRIPT vm-poweron.sh — usa govc para hablar SOAP con ESXi 8
    # =========================================================================
    - name: "ESXI — Crear script vm-poweron.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/vm-poweron.sh
        mode: "0755"
        content: |
          #!/bin/bash
          VM_NAME="$1"
          export GOVC_URL="https://{{ esxi_user }}:{{ esxi_pass | replace('$', '\$') }}@{{ esxi_host }}:{{ esxi_port }}"
          export GOVC_INSECURE=1

          if [ -z "$VM_NAME" ]; then
            echo "ERROR: Se requiere nombre de VM"
            exit 1
          fi

          echo "[$(date)] Verificando VM: $VM_NAME"

          POWER=$(govc vm.info "/ha-datacenter/vm/$VM_NAME" 2>/dev/null | grep "Power state" | awk '{print $3}')
          echo "Estado actual: ${POWER:-desconocido}"

          if [ "$POWER" = "poweredOn" ]; then
            echo "VM ya esta encendida"
            exit 0
          fi

          echo "Encendiendo VM..."
          govc vm.power -on "/ha-datacenter/vm/$VM_NAME"
          if [ $? -eq 0 ]; then
            echo "[$(date)] OK — $VM_NAME encendida"
          else
            echo "ERROR: fallo encendiendo $VM_NAME"
            exit 1
          fi

    # =========================================================================
    # 3. SCRIPT service-restart.sh — SSH a la VM y reinicia el servicio
    # =========================================================================
    - name: "SSH — Crear script service-restart.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/service-restart.sh
        mode: "0755"
        content: |
          #!/bin/bash
          HOST_IP="$1"
          SERVICE="$2"

          if [ -z "$HOST_IP" ] || [ -z "$SERVICE" ]; then
            echo "ERROR: uso: service-restart.sh <ip> <servicio>"
            exit 1
          fi

          echo "[$(date)] Reiniciando $SERVICE en $HOST_IP..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -o BatchMode=yes \
              ubuntu@$HOST_IP "sudo systemctl restart $SERVICE && sudo systemctl is-active $SERVICE"

          if [ $? -eq 0 ]; then
            echo "[$(date)] OK — $SERVICE reiniciado en $HOST_IP"
          else
            echo "ERROR: fallo reiniciando $SERVICE en $HOST_IP"
            exit 1
          fi

    # =========================================================================
    # 4. COPIAR Y EJECUTAR CONFIGURACION ZABBIX
    # =========================================================================
    - name: "ZABBIX — Copiar script de configuracion"
      ansible.builtin.copy:
        src: files/zabbix_setup.py
        dest: /tmp/zabbix_setup.py
        mode: "0755"

    - name: "ZABBIX — Ejecutar configuracion completa"
      ansible.builtin.command:
        cmd: >-
          python3 /tmp/zabbix_setup.py
          {{ zabbix_api }}
          {{ zabbix_user }}
          {{ zabbix_pass }}
          josedario.zuniga@gmail.com
      register: zabbix_config
      changed_when: false

    - name: "RESULT — Mostrar resultado"
      ansible.builtin.debug:
        var: zabbix_config.stdout_lines
