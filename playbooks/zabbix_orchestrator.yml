---
# ============================================================================
# zabbix_orchestrator.yml — Zabbix 7 completo con auto-recovery ESXi
# ============================================================================

- name: "Configurar Zabbix 7 — Orchestrator Completo"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_pass: "zabbix"
    esxi_host: "172.17.25.12"
    esxi_port: "443"
    esxi_user: "root"
    esxi_pass: "qwe123$"

  tasks:

    # =========================================================================
    # 1. INSTALAR DEPENDENCIAS
    # =========================================================================
    - name: "DEPS — Instalar sshpass"
      ansible.builtin.apt:
        name: sshpass
        state: present
        update_cache: false

    # =========================================================================
    # 2. SCRIPT vm-poweron.sh — conecta al ESXi y enciende la VM por nombre
    # =========================================================================
    - name: "ESXI — Crear script vm-poweron.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/vm-poweron.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # vm-poweron.sh — Enciende una VM en ESXi via API REST (no requiere SSH)
          VM_NAME="$1"
          ESXI_HOST="{{ esxi_host }}"
          ESXI_PORT="{{ esxi_port }}"
          ESXI_USER="{{ esxi_user }}"
          ESXI_PASS="{{ esxi_pass }}"
          BASE="https://$ESXI_HOST:$ESXI_PORT"

          if [ -z "$VM_NAME" ]; then
            echo "ERROR: Se requiere nombre de VM"
            exit 1
          fi

          echo "[$(date)] Buscando VM: $VM_NAME via API REST ESXi $ESXI_HOST:$ESXI_PORT"

          # Intentar auth con /api/session (ESXi 7+) primero, luego /rest/ (ESXi 6.x)
          TOKEN=$(curl -sk -X POST "$BASE/api/session" \
            -H "Content-Type: application/json" \
            -u "$ESXI_USER:$ESXI_PASS" | tr -d '"')

          API_VER="v7"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] || echo "$TOKEN" | grep -q "errorType"; then
            # Fallback a ESXi 6.x /rest/
            TOKEN=$(curl -sk -X POST "$BASE/rest/com/vmware/cis/session" \
              -u "$ESXI_USER:$ESXI_PASS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))" 2>/dev/null)
            API_VER="v6"
          fi

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: No se pudo autenticar en ESXi API (intentado v7 y v6)"
            exit 1
          fi
          echo "Auth OK (ESXi API $API_VER)"

          # Listar VMs según versión API
          if [ "$API_VER" = "v7" ]; then
            VMS=$(curl -sk -X GET "$BASE/api/vcenter/vm" \
              -H "vmware-api-session-id: $TOKEN")
          else
            VMS=$(curl -sk -X GET "$BASE/rest/vcenter/vm" \
              -H "vmware-api-session-id: $TOKEN" \
              | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin).get('value',[])))" 2>/dev/null)
          fi

          # Buscar VM por nombre (case insensitive)
          VM_ID=$(echo "$VMS" | python3 -c "import sys,json; vms=json.load(sys.stdin); name='$VM_NAME'.lower(); [print(v['vm']) for v in vms if v.get('name','').lower()==name or v.get('name','').lower().startswith(name)]" 2>/dev/null | head -1)

          if [ -z "$VM_ID" ]; then
            echo "ERROR: VM '$VM_NAME' no encontrada"
            echo "VMs disponibles:"
            echo "$VMS" | python3 -c "import sys,json; [print('  '+v['name']) for v in json.load(sys.stdin)]" 2>/dev/null
            curl -sk -X DELETE "$BASE/api/session" -H "vmware-api-session-id: $TOKEN" > /dev/null
            exit 1
          fi
          echo "VM encontrada: $VM_ID"

          # Verificar estado
          POWER=$(curl -sk -X GET "$BASE/api/vcenter/vm/$VM_ID/power" \
            -H "vmware-api-session-id: $TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))" 2>/dev/null)
          echo "Estado actual: $POWER"

          if [ "$POWER" = "POWERED_ON" ]; then
            echo "VM ya está encendida"
            curl -sk -X DELETE "$BASE/api/session" -H "vmware-api-session-id: $TOKEN" > /dev/null
            exit 0
          fi

          # Encender VM
          echo "Encendiendo VM..."
          if [ "$API_VER" = "v7" ]; then
            curl -sk -X POST "$BASE/api/vcenter/vm/$VM_ID/power?action=start" \
              -H "vmware-api-session-id: $TOKEN" > /dev/null
            curl -sk -X DELETE "$BASE/api/session" -H "vmware-api-session-id: $TOKEN" > /dev/null
          else
            curl -sk -X POST "$BASE/rest/vcenter/vm/$VM_ID/power/start" \
              -H "vmware-api-session-id: $TOKEN" > /dev/null
            curl -sk -X DELETE "$BASE/rest/com/vmware/cis/session" -H "vmware-api-session-id: $TOKEN" > /dev/null
          fi

          echo "[$(date)] OK — $VM_NAME ($VM_ID) encendida"

    # =========================================================================
    # 3. SCRIPT service-restart.sh — SSH a la VM y reinicia el servicio
    # =========================================================================
    - name: "SSH — Crear script service-restart.sh"
      ansible.builtin.copy:
        dest: /usr/local/bin/service-restart.sh
        mode: "0755"
        content: |
          #!/bin/bash
          HOST_IP="$1"
          SERVICE="$2"

          if [ -z "$HOST_IP" ] || [ -z "$SERVICE" ]; then
            echo "ERROR: uso: service-restart.sh <ip> <servicio>"
            exit 1
          fi

          echo "[$(date)] Reiniciando $SERVICE en $HOST_IP..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -o BatchMode=yes \
              root@$HOST_IP "systemctl restart $SERVICE && systemctl is-active $SERVICE"

          if [ $? -eq 0 ]; then
            echo "[$(date)] OK — $SERVICE reiniciado en $HOST_IP"
          else
            echo "ERROR: fallo reiniciando $SERVICE en $HOST_IP"
            exit 1
          fi

    # =========================================================================
    # 4. COPIAR SCRIPT PYTHON DE CONFIGURACION ZABBIX
    # =========================================================================
    - name: "ZABBIX — Copiar script de configuracion"
      ansible.builtin.copy:
        src: files/zabbix_setup.py
        dest: /tmp/zabbix_setup.py
        mode: "0755"

    # =========================================================================
    # 5. EJECUTAR CONFIGURACION: hosts, scripts, actions, email
    # =========================================================================
    - name: "ZABBIX — Ejecutar configuracion completa"
      ansible.builtin.command:
        cmd: >-
          python3 /tmp/zabbix_setup.py
          {{ zabbix_api }}
          {{ zabbix_user }}
          {{ zabbix_pass }}
          josedario.zuniga@gmail.com
      register: zabbix_config
      changed_when: false

    - name: "RESULT — Mostrar resultado"
      ansible.builtin.debug:
        var: zabbix_config.stdout_lines
