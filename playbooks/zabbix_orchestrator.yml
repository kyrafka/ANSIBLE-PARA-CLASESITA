---
# ============================================================================
# zabbix_orchestrator.yml — Configurar Zabbix 7 completo ( VERSIÓN SIMPLE)
# ============================================================================

- name: "Configurar Zabbix 7 — Orchestrator Completo"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"

  tasks:
    # =========================================================================
    # 1. OBTENER TOKEN Y CONFIGURAR TODO EN UN SOLO SCRIPT
    # =========================================================================
    - name: "ZABBIX — Configurar todo (hosts, triggers, actions, notifications)"
      ansible.builtin.shell: |
        set -e
        API="{{ zabbix_api }}"
        USER="Admin"
        PASS="zabbix"

        echo "=== 1. OBTENER TOKEN ==="
        RESULT=$(curl -s -X POST "$API" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"user.login\",\"params\":{\"username\":\"$USER\",\"password\":\"$PASS\"},\"id\":1}")

        TOKEN=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))" 2>/dev/null || echo "")

        if [ -z "$TOKEN" ]; then
          echo "ERROR: No se pudo autenticar. Response: $RESULT"
          exit 1
        fi
        echo "TOKEN OK: ${TOKEN:0:20}..."

        # Función para hacer llamadas API
        api_call() {
          echo "$1" | curl -s -X POST "$API" \
            -H "Content-Type: application/json-rpc" \
            -d @-
        }

        echo ""
        echo "=== 2. REGISTRAR HOSTS ==="
        hosts=(
          "vm-dc01:192.168.16.10"
          "vm-web01:192.168.11.11"
          "vm-services01:192.168.13.11"
          "vm-storage01:192.168.14.11"
          "vm-voip01:192.168.15.11"
          "vm-monitor01:192.168.17.11"
          "vm-docker01:192.168.13.12"
          "core1:192.168.10.20"
          "core2:192.168.10.30"
        )

        for h in "${hosts[@]}"; do
          NAME=$(echo "$h" | cut -d: -f1)
          IP=$(echo "$h" | cut -d: -f2)

          echo "Registrando $NAME ($IP)..."

          # Obtener template ID de "Linux by Zabbix agent"
          TMPL_ID=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"template.get\",\"params\":{\"filter\":{\"host\":[\"Linux by Zabbix agent\"]}},\"auth\":\"$TOKEN\",\"id\":2}" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['templateid'] if r else '')" 2>/dev/null)

          # Verificar si existe
          EXISTING=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"filter\":{\"host\":[\"$NAME\"]},\"output\":[\"hostid\"],\"selectParentTemplates\":[\"templateid\"]},\"auth\":\"$TOKEN\",\"id\":3}" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['hostid'] if r else '')" 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "  $NAME ya existe (hostid: $EXISTING), verificando template..."
            # Si tiene template ID vacío, asignarla
            if [ -n "$TMPL_ID" ]; then
              api_call "{\"jsonrpc\":\"2.0\",\"method\":\"host.update\",\"params\":{\"hostid\":\"$EXISTING\",\"templates\":[{\"templateid\":\"$TMPL_ID\"}]},\"auth\":\"$TOKEN\",\"id\":3}" | python3 -c "import sys,json; r=json.load(sys.stdin); print('  Template asignada OK' if 'result' in r else '  '+str(r.get('error','')))" 2>/dev/null
            fi
          else
            # Crear host con template
            TMPL_BLOCK=""
            if [ -n "$TMPL_ID" ]; then
              TMPL_BLOCK=",\"templates\": [{\"templateid\": \"$TMPL_ID\"}]"
            fi
            api_call "{
              \"jsonrpc\": \"2.0\",
              \"method\": \"host.create\",
              \"params\": {
                \"host\": \"$NAME\",
                \"groups\": [{\"groupid\": 4}],
                \"interfaces\": [{
                  \"type\": 1,
                  \"main\": 1,
                  \"useip\": 1,
                  \"ip\": \"$IP\",
                  \"dns\": \"\",
                  \"port\": \"10050\"
                }]
                $TMPL_BLOCK
              },
              \"auth\": \"$TOKEN\",
              \"id\": 3
            }" | python3 -c "import sys,json; r=json.load(sys.stdin); print('  CREADO: ' + str(r.get('result',r.get('error',{}))))" 2>/dev/null || echo "  ERROR"
          fi
        done

        echo ""
        echo "=== 3. CREAR TRIGGERS ==="
        # Obtener todos los hosts
        ALL_HOSTS=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\"]},\"auth\":\"$TOKEN\",\"id\":4}" | python3 -c "import sys,json; [print(h['hostid']+':'+h['name']) for h in json.load(sys.stdin).get('result',[])]" 2>/dev/null)

        for line in $ALL_HOSTS; do
          HOSTID=$(echo "$line" | cut -d: -f1)
          NAME=$(echo "$line" | cut -d: -f2)
          echo "Creando triggers para $NAME..."

          # CPU
          api_call "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"trigger.create\",
            \"params\": [{
              \"description\": \"$NAME: CPU usage is too high\",
              \"expression\": \"avg(/Linux by Zabbix agent/system.cpu.util,5m)>95\",
              \"priority\": 2,
              \"hostid\": \"$HOSTID\"
            }],
            \"auth\": \"$TOKEN\",
            \"id\": 5
          }" > /dev/null 2>&1 || true

          # RAM
          api_call "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"trigger.create\",
            \"params\": [{
              \"description\": \"$NAME: High memory utilization\",
              \"expression\": \"avg(/Linux by Zabbix agent/vm.memory.size[available],5m)<1073741824\",
              \"priority\": 2,
              \"hostid\": \"$HOSTID\"
            }],
            \"auth\": \"$TOKEN\",
            \"id\": 6
          }" > /dev/null 2>&1 || true

          # Disk
          api_call "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"trigger.create\",
            \"params\": [{
              \"description\": \"$NAME: Disk space is low\",
              \"expression\": \"last(/Linux by Zabbix agent/vfs.fs.size[/,pfree])<15\",
              \"priority\": 3,
              \"hostid\": \"$HOSTID\"
            }],
            \"auth\": \"$TOKEN\",
            \"id\": 7
          }" > /dev/null 2>&1 || true

          # Agent Down
          api_call "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"trigger.create\",
            \"params\": [{
              \"description\": \"$NAME: Zabbix agent is down\",
              \"expression\": \"nodata(/Linux by Zabbix agent/agent.ping,3m)=0\",
              \"priority\": 4,
              \"hostid\": \"$HOSTID\"
            }],
            \"auth\": \"$TOKEN\",
            \"id\": 8
          }" > /dev/null 2>&1 || true

          echo "  4 triggers creados para $NAME"
        done

        echo ""
        echo "=== 4. CREAR ACTIONS ==="

        # Action 1: Restart Agent
        api_call "{
          \"jsonrpc\": \"2.0\",
          \"method\": \"action.create\",
          \"params\": {
            \"name\": \"AXIOM: Restart Zabbix Agent when Down\",
            \"eventsource\": 0,
            \"status\": 0,
            \"esc_period\": \"5m\",
            \"def_shortdata\": \"Problem: {EVENT.NAME}\",
            \"def_longdata\": \"Host: {HOST.NAME}\nProblem: {EVENT.NAME}\n\nAuto-restart initiated.\",
            \"conditions\": [{\"conditiontype\": 4, \"operator\": 5, \"value\": \"Zabbix agent is down\"}],
            \"operations\": [{
              \"operationtype\": 1,
              \"esc_period\": \"0\",
              \"esc_step_from\": 1,
              \"esc_step_to\": 1,
              \"opcommand\": {\"command\": \"systemctl restart zabbix-agent\", \"execute_on\": 1}
            }]
          },
          \"auth\": \"$TOKEN\",
          \"id\": 9
        }" | python3 -c "import sys,json; r=json.load(sys.stdin); print('Action 1:', 'OK' if 'result' in r else r.get('error',r))"

        # Action 2: Reboot
        api_call "{
          \"jsonrpc\": \"2.0\",
          \"method\": \"action.create\",
          \"params\": {
            \"name\": \"AXIOM: Emergency Reboot\",
            \"eventsource\": 0,
            \"status\": 0,
            \"esc_period\": \"10m\",
            \"def_shortdata\": \"CRITICAL: {EVENT.NAME}\",
            \"def_longdata\": \"Host: {HOST.NAME}\nProblem: {EVENT.NAME}\n\nEmergency reboot if not acknowledged.\",
            \"conditions\": [
              {\"conditiontype\": 4, \"operator\": 5, \"value\": \"Disk space is low\"},
              {\"conditiontype\": 4, \"operator\": 5, \"value\": \"CPU usage is too high\"}
            ],
            \"operations\": [{
              \"operationtype\": 1,
              \"esc_period\": \"0\",
              \"esc_step_from\": 1,
              \"esc_step_to\": 1,
              \"opcommand\": {\"command\": \"reboot\", \"execute_on\": 1}
            }]
          },
          \"auth\": \"$TOKEN\",
          \"id\": 10
        }" | python3 -c "import sys,json; r=json.load(sys.stdin); print('Action 2:', 'OK' if 'result' in r else r.get('error',r))"

        echo ""
        echo "=== 5. CONFIGURAR NOTIFICACIONES ==="

        # Obtener user Admin
        USER_RESULT=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"user.get\",\"params\":{\"filter\":{\"username\":[\"Admin\"]}},\"auth\":\"$TOKEN\",\"id\":11}")
        USERID=$(echo "$USER_RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',[{}])[0].get('userid','1'))" 2>/dev/null)

        # Crear/verificar media type
        MT_RESULT=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"mediatype.get\",\"params\":{\"filter\":{\"name\":[\"Email\"]}},\"auth\":\"$TOKEN\",\"id\":12}")
        MT_ID=$(echo "$MT_RESULT" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['mediatypeid'] if r else '')" 2>/dev/null)

        if [ -z "$MT_ID" ]; then
          MT_CREATE=$(api_call "{\"jsonrpc\":\"2.0\",\"method\":\"mediatype.create\",\"params\":{\"type\":0,\"name\":\"Email\",\"smtp_server\":\"localhost\",\"smtp_port\":25,\"smtp_helo\":\"zabbix.aj.local\",\"smtp_email\":\"zabbix@aj.local\"},\"auth\":\"$TOKEN\",\"id\":13}")
          MT_ID=$(echo "$MT_CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('mediatypeids',['1'])[0])" 2>/dev/null)
          echo "Media type Email creado: $MT_ID"
        else
          echo "Media type Email ya existe: $MT_ID"
        fi

        # Asignar email al usuario
        api_call "{
          \"jsonrpc\": \"2.0\",
          \"method\": \"user.update\",
          \"params\": {
            \"userid\": \"$USERID\",
            \"user_medias\": [{
              \"mediatypeid\": $MT_ID,
              \"send_to\": \"josedario.zuniga@gmail.com\",
              \"severity\": 63,
              \"active\": 0,
              \"period\": \"1-7,00:00-24:00\"
            }]
          },
          \"auth\": \"$TOKEN\",
          \"id\": 14
        }" > /dev/null 2>&1
        echo "Email josedario.zuniga@gmail.com asignado a Admin"

        echo ""
        echo "=========================================="
        echo "ZABBIX 7 CONFIGURADO EXITOSAMENTE"
        echo "=========================================="
        echo ""
        echo "Hosts: 9 (vm-dc01, vm-web01, vm-services01, vm-storage01,"
        echo "         vm-voip01, vm-monitor01, vm-docker01, core1, core2)"
        echo "Triggers: 4 por host (CPU, RAM, Disk, Agent Down)"
        echo "Actions: Restart Agent, Emergency Reboot"
        echo "Notifications: josedario.zuniga@gmail.com"
        echo ""
        echo "Acceso: http://192.168.17.11/zabbix"
        echo "User: Admin | Pass: zabbix"
        echo "=========================================="

      args:
        executable: /bin/bash
      changed_when: false
      register: zabbix_config

    - name: "RESULT — Mostrar resultado"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ZABBIX 7 CONFIGURADO"
          - "=========================================="
          - "{{ zabbix_config.stdout_lines }}"