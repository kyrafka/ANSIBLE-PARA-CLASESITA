---
- name: "Configurar OSPF en pfSense (FRR package)"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    pfsense_ip: "192.168.16.1"
    pfsense_user: "admin"
    pfsense_pass: "qwe123$"

  tasks:
    - name: "OSPF PfSense — GUIA: Instalar FRR en pfSense"
      debug:
        msg:
          - "=========================================="
          - "OSPF EN pfSense — ROUTING HÍBRIDO"
          - "=========================================="
          - ""
          - "PASO 1: Instalar FRR package"
          - "  System > Package Manager > Available Packages"
          - "  Buscar 'FRR' > Install"
          - ""
          - "PASO 2: Habilitar FRR"
          - "  Services > FRR > Settings"
          - "  Enable FRR: ✓"
          - "  Zebra Password: {{ pfsense_pass }}"
          - "  Save"
          - ""
          - "PASO 3: Configurar OSPF"
          - "  Services > FRR > OSPF"
          - "  Enable OSPF: ✓"
          - "  Router ID: 192.168.16.1"
          - "  Area: 0.0.0.0 (Backbone)"
          - ""
          - "  Agregar Networks:"
          - "  - 192.168.0.0/16  area 0.0.0.0  (toda la red interna)"
          - "  - 192.168.12.0/25  area 0.0.0.0"
          - "  - 192.168.11.0/27  area 0.0.0.0"
          - "  - 192.168.13.0/25  area 0.0.0.0"
          - "  - 192.168.14.0/26  area 0.0.0.0"
          - "  - 192.168.15.0/26  area 0.0.0.0"
          - "  - 192.168.16.0/27  area 0.0.0.0"
          - "  - 192.168.17.0/27  area 0.0.0.0"
          - ""
          - "PASO 4: Configurar Passive Interface"
          - "  Passive Interface: WAN1, WAN2 (no anunciar ISPs)"
          - ""
          - "PASO 5: Redistribuir rutas"
          - "  Redistribute: Connected ✓"
          - "  Default Route: Originate (para que cores aprendan GW default)"
          - ""
          - "PASO 6: Guardar y aplicar"
          - "  Save > Apply Changes"
          - ""
          - "PASO 7: Verificar desde pfSense (CLI ssh):"
          - "  vtysh -c 'show ip ospf neighbor'"
          - "  vtysh -c 'show ip ospf route'"
          - "  vtysh -c 'show ip route ospf'"
          - ""
          - "=========================================="
          - "DESDE LOS CORES (core1/core2), verificar:"
          - "  vtysh -c 'show ip ospf neighbor'"
          - "  vtysh -c 'show ip ospf route'"
          - "  ip route | grep ^O"
          - "=========================================="

    - name: "OSPF — Topología híbrida esperada"
      debug:
        msg:
          - "=========================================="
          - "TOPOLOGÍA OSPF ESPERADA"
          - "=========================================="
          - ""
          - "        [pfSense OSPF Router]  192.168.16.1"
          - "              Area 0.0.0.0"
          - "           /     |     \\"
          - "    core1 OSPF  core2 OSPF  (futuro: AWS)"
          - "    192.168.10.20   192.168.10.30"
          - "         |    \\   /"
          - "         |     \\ /"
          - "    [VLAN trunks]"
          - "         |"
          - "    [VMs: dc01, web01, storage, etc]"
          - ""
          - "CORE1 (OSPF DR)     CORE2 (OSPF BDR)"
          - "Priority: 100       Priority: 50"
          - "Ads: todas las VLANs que conecta"
          - ""
          - "FLUJO DE RUTAS:"
          - "  1. Core1/core2 aprenden rutas de pfSense (default route)"
          - "  2. pfSense aprende rutas de cores (192.168.x.0/24)"
          - "  3. Si un link falla, OSPF reconverge automáticamente"
          - "  4. Failover automático entre ISPs"
          - ""
          - "=========================================="