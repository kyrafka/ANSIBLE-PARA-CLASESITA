---
# ============================================================================
# INTEGRACION ACTIVE DIRECTORY - Samba + Dovecot + Roundcube
# ============================================================================
# REQUISITO: vm-storage01 y vm-services01 deben tener acceso a vm-dc01
# Password de todos los usuarios AD: rol.123
# ============================================================================

- name: "Verificar conexion con AD"
  hosts: vm-storage01,vm-services01
  become: true
  gather_facts: true

  vars:
    ad_domain: "AXIOM.local"
    ad_realm: "AXIOM.LOCAL"
    ad_workgroup: "AXIOM"
    ad_server: "192.168.16.10"
    ad_admin_pass: "admin123!"
    user_pass: "rol.123"

  tasks:
    - name: "Verificar conexion con AD"
      shell: |
        echo "=== Verificando conectividad con AD ==="
        nc -zv {{ ad_server }} 389 2>&1 && echo "LDAP (389): OK" || echo "LDAP (389): FAIL"
        nc -zv {{ ad_server }} 636 2>&1 && echo "LDAPS (636): OK" || echo "LDAPS (636): FAIL"
        nc -zv {{ ad_server }} 88 2>&1 && echo "KRB (88): OK" || echo "KRB (88): FAIL"
        echo "=== Resolucion DNS ==="
        nslookup vm-dc01.{{ ad_domain }} {{ ad_server }} 2>/dev/null | head -4
      changed_when: false
      ignore_errors: true

# ============================================================================
# PARTE 1: SAMBA EN vm-storage01 CON AD
# ============================================================================
- name: "CONFIGURAR SAMBA CON AD - vm-storage01"
  hosts: vm-storage01
  become: true
  gather_facts: true

  vars:
    ad_domain: "AXIOM.local"
    ad_realm: "AXIOM.LOCAL"
    ad_workgroup: "AXIOM"
    ad_server: "192.168.16.10"
    ad_admin_pass: "admin123!"
    user_pass: "rol.123"

  tasks:
    - name: "SMB+AD — Instalar dependencias"
      apt:
        name:
          - samba
          - samba-common-bin
          - smbclient
          - winbind
          - krb5-user
          - libpam-winbind
          - libnss-winbind
          - libpam-krb5
        state: present

    - name: "SMB+AD — Configurar krb5.conf"
      copy:
        dest: /etc/krb5.conf
        content: |
          [libdefaults]
              default_realm = {{ ad_realm }}
              dns_lookup_realm = false
              dns_lookup_kdc = true
              ticket_lifetime = 24h
              renew_lifetime = 7d
              forwardable = true
              rdns = false

          [realms]
              {{ ad_realm }} = {
                  kdc = {{ ad_server }}
                  admin_server = {{ ad_server }}
                  default_domain = {{ ad_domain }}
              }

          [domain_realm]
              .{{ ad_domain | lower }} = {{ ad_realm }}
              {{ ad_domain | lower }} = {{ ad_realm }}

    - name: "SMB+AD — Detener servicios"
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - smbd
        - nmbd
        - winbind
      ignore_errors: true

    - name: "SMB+AD — Limpiar cache Samba"
      shell: |
        rm -f /var/lib/samba/*.tdb
        rm -f /var/lib/samba/private/*.tdb

    - name: "SMB+AD — Configurar nsswitch.conf"
      copy:
        dest: /etc/nsswitch.conf
        content: |
          passwd:         files systemd winbind
          group:          files systemd winbind
          shadow:         files
          hosts:          files dns
          networks:       files
          protocols:      db files
          services:       db files
          ethers:         db files
          rpc:            db files
          netgroup:       nis

    - name: "SMB+AD — Configurar smb.conf con AD"
      copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
             workgroup = {{ ad_workgroup }}
             realm = {{ ad_realm }}
             server string = Storage Server AXIOM
             security = ADS

             idmap config * : backend = tdb
             idmap config * : range = 2000-9999
             idmap config {{ ad_workgroup }} : backend = rid
             idmap config {{ ad_workgroup }} : range = 10000-20000

             winbind enum users = yes
             winbind enum groups = yes
             winbind use default domain = yes
             winbind offline logon = no

             template shell = /bin/bash
             template homedir = /srv/samba/homes/%U

             log file = /var/log/samba/log.%m
             max log size = 1000
             logging = file

             unix charset = UTF8
             dos charset = CP850

          [Jefatura]
             path = /srv/samba/Jefatura
             browseable = yes
             read only = no
             create mask = 0770
             directory mask = 0770
             force group = axiom-administradores
             valid users = @axiom-administradores
             hosts allow = 192.168.0.0/16
             comment = Jefatura - Solo personal administrativo

          [Secretaria]
             path = /srv/samba/Secretaria
             browseable = yes
             read only = no
             create mask = 0775
             directory mask = 0775
             force group = axiom-secretaria
             valid users = @axiom-secretaria @axiom-administradores
             hosts allow = 192.168.0.0/16
             comment = Secretaria

          [Usuarios]
             path = /srv/samba/Usuarios
             browseable = yes
             read only = no
             create mask = 0775
             directory mask = 0775
             force group = axiom-usuarios
             valid users = @axiom-usuarios @axiom-secretaria @axiom-administradores
             hosts allow = 192.168.0.0/16
             comment = Acceso general

          [homes]
             path = /srv/samba/homes/%U
             browseable = no
             read only = no
             create mask = 0700
             directory mask = 0700
             valid users = %S

          [Publico]
             path = /srv/samba/Publico
             browseable = yes
             read only = yes
             create mask = 0755
             directory mask = 0755
             valid users = @axiom-usuarios @axiom-secretaria @axiom-administradores
             hosts allow = 192.168.0.0/16
             comment = Carpeta publica - Solo lectura

    - name: "SMB+AD — Configurar DNS del AD"
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ ad_server }}
          search {{ ad_domain }}

    - name: "SMB+AD — Obtener ticket Kerberos y unirse al dominio"
      shell: |
        kdestroy 2>/dev/null || true
        echo "{{ ad_admin_pass }}" | kinit Administrator@{{ ad_realm }}
        net ads leave -U Administrator%{{ ad_admin_pass }} 2>/dev/null || true
        sleep 1
        net ads join -U Administrator%{{ ad_admin_pass }} -S vm-dc01.{{ ad_domain }}
        net ads testjoin
      ignore_errors: true

    - name: "SMB+AD — Iniciar winbind primero"
      systemd:
        name: winbind
        state: started
        enabled: yes

    - name: "SMB+AD — Esperar winbind"
      shell: |
        sleep 5
        wbinfo --ping-dc
        wbinfo -u | head -10
        wbinfo -g | grep -i axiom
      ignore_errors: true

    - name: "SMB+AD — Iniciar smbd y nmbd"
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - smbd
        - nmbd

    - name: "SMB+AD — Verificar getent"
      shell: |
        echo "=== getent passwd (AD) ==="
        getent passwd | grep -i axiom
        echo ""
        echo "=== getent group (AD) ==="
        getent group | grep -i axiom

    - name: "SMB+AD — Crear carpetas con permisos correctos"
      shell: |
        mkdir -p /srv/samba/Jefatura
        mkdir -p /srv/samba/Secretaria
        mkdir -p /srv/samba/Usuarios
        mkdir -p /srv/samba/Publico
        mkdir -p /srv/samba/homes
        mkdir -p /srv/samba/Jefatura/Proyectos
        mkdir -p /srv/samba/Jefatura/Finanzas
        mkdir -p /srv/samba/Secretaria/Actas
        mkdir -p /srv/samba/Secretaria/Correspondencia
        mkdir -p /srv/samba/Usuarios/General
        chown root:root /srv/samba
        chown root:"axiom-administradores" /srv/samba/Jefatura
        chown root:"axiom-secretaria" /srv/samba/Secretaria
        chown root:"axiom-usuarios" /srv/samba/Usuarios
        chown root:root /srv/samba/Publico
        chown root:root /srv/samba/homes
        chmod 0770 /srv/samba/Jefatura
        chmod 0775 /srv/samba/Secretaria
        chmod 0775 /srv/samba/Usuarios
        chmod 0755 /srv/samba/Publico
        chmod 0775 /srv/samba/homes

    - name: "SMB+AD — Test smbclient"
      shell: |
        smbclient '//127.0.0.1/Secretaria' -U 'AXIOM\secretaria%{{ user_pass }}' -c 'ls' 2>&1
      ignore_errors: true

    - name: "SMB+AD — Resultado"
      debug:
        msg:
          - "=========================================="
          - "SAMBA CON AD CONFIGURADO"
          - "=========================================="
          - ""
          - "SHARES:"
          - '  \\192.168.14.11\Jefatura    - AXIOM\jefazo / {{ user_pass }}'
          - '  \\192.168.14.11\Secretaria  - AXIOM\secretaria / {{ user_pass }}'
          - '  \\192.168.14.11\Usuarios    - AXIOM\contador / {{ user_pass }}'
          - '  \\192.168.14.11\Publico     - Solo lectura'
          - '  \\192.168.14.11\homes       - Carpeta personal'
          - "=========================================="

# ============================================================================
# PARTE 2: DOVECOT + AD EN vm-services01
# ============================================================================
- name: "CONFIGURAR DOVECOT CON AD - vm-services01"
  hosts: vm-services01
  become: true
  gather_facts: true

  vars:
    ad_domain: "AXIOM.local"
    ad_realm: "AXIOM.LOCAL"
    ad_workgroup: "AXIOM"
    ad_server: "192.168.16.10"
    ad_admin_pass: "admin123!"

  tasks:
    - name: "DOVECOT+AD — Instalar dependencias"
      apt:
        name:
          - samba
          - winbind
          - krb5-user
          - libpam-winbind
          - libnss-winbind
        state: present

    - name: "DOVECOT+AD — Configurar krb5.conf"
      copy:
        dest: /etc/krb5.conf
        content: |
          [libdefaults]
              default_realm = {{ ad_realm }}
              dns_lookup_realm = false
              dns_lookup_kdc = true
              ticket_lifetime = 24h
              renew_lifetime = 7d
              forwardable = true
              rdns = false

          [realms]
              {{ ad_realm }} = {
                  kdc = {{ ad_server }}
                  admin_server = {{ ad_server }}
              }

          [domain_realm]
              .{{ ad_domain | lower }} = {{ ad_realm }}
              {{ ad_domain | lower }} = {{ ad_realm }}

    - name: "DOVECOT+AD — Configurar smb.conf minimo para AD"
      copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
             workgroup = {{ ad_workgroup }}
             realm = {{ ad_realm }}
             security = ADS

             idmap config * : backend = tdb
             idmap config * : range = 2000-9999
             idmap config {{ ad_workgroup }} : backend = rid
             idmap config {{ ad_workgroup }} : range = 10000-20000

             winbind enum users = yes
             winbind enum groups = yes
             winbind use default domain = yes
             winbind offline logon = no

             template shell = /bin/bash
             template homedir = /home/%U

             log file = /var/log/samba/log.%m
             max log size = 1000

    - name: "DOVECOT+AD — Configurar nsswitch"
      copy:
        dest: /etc/nsswitch.conf
        content: |
          passwd:         files systemd winbind
          group:          files systemd winbind
          shadow:         files
          hosts:          files dns
          networks:       files
          protocols:      db files
          services:       db files
          ethers:         db files
          rpc:            db files
          netgroup:       nis

    - name: "DOVECOT+AD — Configurar resolv.conf"
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ ad_server }}
          search {{ ad_domain }}

    - name: "DOVECOT+AD — Detener servicios"
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - smbd
        - winbind
      ignore_errors: true

    - name: "DOVECOT+AD — Limpiar cache"
      shell: |
        rm -f /var/lib/samba/*.tdb
        rm -f /var/lib/samba/private/*.tdb

    - name: "DOVECOT+AD — Join al dominio AD"
      shell: |
        kdestroy 2>/dev/null || true
        echo "{{ ad_admin_pass }}" | kinit Administrator@{{ ad_realm }}
        net ads leave -U Administrator%{{ ad_admin_pass }} 2>/dev/null || true
        sleep 1
        net ads join -U Administrator%{{ ad_admin_pass }} -S vm-dc01.{{ ad_domain }}
        net ads testjoin
      ignore_errors: true

    - name: "DOVECOT+AD — Iniciar winbind"
      systemd:
        name: winbind
        state: started
        enabled: yes

    - name: "DOVECOT+AD — Verificar winbind"
      shell: |
        sleep 5
        wbinfo --ping-dc
        wbinfo -u | head -5
        getent passwd | grep -i axiom | head -3
      ignore_errors: true

    - name: "DOVECOT+AD — Configurar PAM para winbind"
      copy:
        dest: /etc/pam.d/dovecot
        content: |
          auth       required     pam_winbind.so nullok
          account    required     pam_winbind.so use_first_pass
          password   required     pam_winbind.so nullok
          session    required     pam_winbind.so

    - name: "DOVECOT+AD — Reiniciar servicios"
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - dovecot
        - postfix
        - winbind

    - name: "DOVECOT+AD — Resultado"
      debug:
        msg:
          - "=========================================="
          - "DOVECOT CON AD CONFIGURADO"
          - "=========================================="
          - ""
          - "Webmail auth contra AD via PAM/winbind"
          - "Usuarios: jefazo, secretaria, contador"
          - "Password: rol.123"
          - ""
          - "Webmail: http://192.168.13.11/webmail/"
          - "=========================================="
