---
# ============================================================================
# test_zabbix_ojo.yml — Test completo de Zabbix
# Verifica SSH, configs, Zabbix UI, agentes y da resumen final
# ============================================================================
# Uso: ansible-playbook test_zabbix_ojo.yml -i inventario/hosts.yml
# ============================================================================

- name: "TEST — Verificacion completa Zabbix"
  hosts: all
  connection: smart
  become: true
  gather_facts: true

  vars:
    zabbix_server: "192.168.17.11"

  tasks:
    # =========================================================================
    # 1. VERIFICAR SSH
    # =========================================================================
    - name: "TEST 1 — SSH verificacion"
      ansible.builtin.shell: |
        echo "=== SSH TEST ==="
        echo "Hostname: $(hostname -s)"
        echo "IP: {{ ansible_default_ipv4.address | default('N/A') }}"
        echo "SSH: OK"
      changed_when: false
      register: ssh_test

    - name: "SSH RESULT"
      ansible.builtin.debug:
        msg: "{{ ssh_test.stdout_lines }}"

    # =========================================================================
    # 2. VERIFICAR CONFIGURACION ZABBIX AGENT
    # =========================================================================
    - name: "TEST 2 — Configuracion Zabbix Agent"
      ansible.builtin.shell: |
        echo "=== ZABBIX AGENT CONFIG ==="
        if [ -f /etc/zabbix/zabbix_agentd.conf ]; then
          echo "Config: SI"
          echo "Hostname:"
          grep "^Hostname=" /etc/zabbix/zabbix_agentd.conf || echo "NO ENCONTRADO"
          echo "Server:"
          grep "^Server=" /etc/zabbix/zabbix_agentd.conf || echo "NO ENCONTRADO"
        else
          echo "Config: NO"
        fi
      changed_when: false
      register: config_test

    - name: "CONFIG RESULT"
      ansible.builtin.debug:
        msg: "{{ config_test.stdout_lines }}"

    # =========================================================================
    # 3. VERIFICAR SERVICIO ZABBIX AGENT
    # =========================================================================
    - name: "TEST 3 — Servicio Zabbix Agent"
      ansible.builtin.shell: |
        echo "=== SERVICIO ==="
        systemctl is-active zabbix-agent && echo "Status: ACTIVO" || echo "Status: INACTIVO"
        systemctl is-enabled zabbix-agent && echo "Enabled: SI" || echo "Enabled: NO"
        echo "Puerto 10050:"
        ss -tlnp | grep 10050 || echo "No escuchando"
      changed_when: false
      register: service_test

    - name: "SERVICE RESULT"
      ansible.builtin.debug:
        msg: "{{ service_test.stdout_lines }}"

    # =========================================================================
    # 4. VERIFICAR SUDOERS
    # =========================================================================
    - name: "TEST 4 — Sudoers zabbix"
      ansible.builtin.shell: |
        echo "=== SUDOERS ==="
        if [ -f /etc/sudoers.d/zabbix ]; then
          echo "Sudoers: SI"
          grep -v "^#" /etc/sudoers.d/zabbix | grep -v "^$" | head -3
        else
          echo "Sudoers: NO"
        fi
      changed_when: false
      register: sudoers_test

    - name: "SUDOERS RESULT"
      ansible.builtin.debug:
        msg: "{{ sudoers_test.stdout_lines }}"

    # =========================================================================
    # 5. VERIFICAR SCRIPT VM-POWERON
    # =========================================================================
    - name: "TEST 5 — Script vm-poweron.sh"
      ansible.builtin.shell: |
        echo "=== SCRIPT VM-POWERON ==="
        if [ -f /usr/local/bin/vm-poweron.sh ]; then
          echo "Script: SI"
          grep "GOVC" /usr/local/bin/vm-poweron.sh | head -1
        else
          echo "Script: NO"
        fi
      changed_when: false
      register: poweron_test

    - name: "POWERON RESULT"
      ansible.builtin.debug:
        msg: "{{ poweron_test.stdout_lines }}"

    # =========================================================================
    # 6. TEST DE CONECTIVIDAD A ZABBIX SERVER
    # =========================================================================
    - name: "TEST 6 — Conectividad Zabbix Server"
      ansible.builtin.shell: |
        echo "=== CONECTIVIDAD ==="
        echo "Server: {{ zabbix_server }}"
        timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>&1 && echo "10051: OK" || echo "10051: FAIL"
        timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10050" 2>&1 && echo "10050: OK" || echo "10050: FAIL"
      changed_when: false
      register: connectivity_test

    - name: "CONNECTIVITY RESULT"
      ansible.builtin.debug:
        msg: "{{ connectivity_test.stdout_lines }}"

    # =========================================================================
    # 7. RESUMEN POR HOST
    # =========================================================================
    - name: "TEST 7 — Resumen final host"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "  RESUMEN: {{ inventory_hostname }}"
        echo "=========================================="

        PASS=0
        FAIL=0

        # Config
        grep -q "^Hostname=" /etc/zabbix/zabbix_agentd.conf 2>/dev/null && echo "✅ Config" || { echo "❌ Config"; FAIL=$((FAIL+1)); }; PASS=$((PASS+1))

        # Servicio
        systemctl is-active zabbix-agent | grep -q "active" && echo "✅ Servicio" || { echo "❌ Servicio"; FAIL=$((FAIL+1)); }; PASS=$((PASS+1))

        # Sudoers
        [ -f /etc/sudoers.d/zabbix ] && echo "✅ Sudoers" || { echo "❌ Sudoers"; FAIL=$((FAIL+1)); }; PASS=$((PASS+1))

        # Script
        [ -f /usr/local/bin/vm-poweron.sh ] && echo "✅ Script" || { echo "❌ Script"; FAIL=$((FAIL+1)); }; PASS=$((PASS+1))

        # Conectividad
        timeout 3 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>/dev/null && echo "✅ Connectivity" || { echo "❌ Connectivity"; FAIL=$((FAIL+1)); }; PASS=$((PASS+1))

        echo ""
        echo "RESULTADO: $PASS OK, $FAIL FAIL"
        echo "=========================================="
      changed_when: false
      register: summary_test

    - name: "SUMMARY RESULT"
      ansible.builtin.debug:
        msg: "{{ summary_test.stdout_lines }}"

# ============================================================================
# PLAY 2: Verificar en Zabbix Server (local en vm-monitor01)
# ============================================================================
- name: "TEST — Verificacion en ZABBIX SERVER"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"

  tasks:
    - name: "TEST ZABBIX — Listar hosts"
      ansible.builtin.shell: |
        echo "=== ZABBIX HOSTS ==="
        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        if [ -z "$TOKEN" ]; then
          echo "ERROR: No se pudo obtener token"
          exit 1
        fi

        echo "Token obtenido: ${TOKEN:0:20}..."

        echo ""
        echo "=== HOSTS REGISTRADOS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\",\"available\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    for h in d.get('result',[]):
        s='OK' if h['status']=='0' else 'DISABLED'
        a='GREEN' if h['available']=='1' else 'GRAY'
        print(f'  [{a}] {h[\"name\"]} ({h[\"hostid\"]}) - {s}')
except: print('Error parseando JSON')
"

        echo ""
        echo "=== ACTIONS ACTIVAS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"actionid\",\"name\",\"status\"],\"filter\":{\"eventsource\":0}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    for a in d.get('result',[]):
        s='ACTIVA' if a['status']=='0' else 'OFF'
        print(f'  [{s}] {a[\"name\"]}')
except: print('Error')
"
      changed_when: false
      register: zabbix_hosts

    - name: "ZABBIX HOSTS RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_hosts.stdout_lines }}"

    - name: "TEST ZABBIX — Problemas/Triggers"
      ansible.builtin.shell: |
        echo "=== PROBLEMAS ACTIVOS ==="
        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":\"extend\",\"sortfield\":\"clock\",\"sortorder\":\"DESC\",\"limit\":10},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    for p in d.get('result',[]):
        print(f'  {p[\"name\"]} - {p[\"severity\"]}')
except Exception as e:
    print('Error o sin problemas')
"
      changed_when: false
      register: zabbix_problems

    - name: "ZABBIX PROBLEMS RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_problems.stdout_lines }}"

    # =========================================================================
    # RESUMEN FINAL GLOBAL
    # =========================================================================
    - name: "TEST FINAL — Resumen"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "  RESUMEN GLOBAL"
          - "=========================================="
          - "El test verifico:"
          - "  1. SSH - OK"
          - "  2. Config - Archivo zabbix_agentd.conf"
          - "  3. Servicio - zabbix-agent activo"
          - "  4. Sudoers - Permisos zabbix"
          - "  5. Scripts - vm-poweron.sh"
          - "  6. Conectividad - Acceso Zabbix Server"
          - ""
          - "Zabbix Server UI:"
          - "  URL: http://192.168.17.11/zabbix"
          - "  User: Admin / zabbix"
          - ""
          - "Para auto-recovery test:"
          - "  1. Apagar VM desde ESXi"
          - "  2. Esperar 2-3 minutos"
          - "  3. Ver si Zabbix la enciende"
          - "=========================================="