---
# ============================================================================
# zabbix_notifications.yml
# Configura Media Type SMTP hacia SMTP2GO y Notificaciones Zabbix
# ============================================================================

- name: "Configurar Notificaciones Zabbix via SMTP2GO"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_password: "Zabbix123"
    smtp_server: "mail.smtp2go.com"
    smtp_port: "2525"
    smtp_user: "alertas.ZyA.Sede-Lima"
    smtp_pass: "123456"
    smtp_from: "Zabbix Alerts <alertas.ZyA.Sede-Lima@smtp2go.com>"
    alert_email: "josedario.zuniga@gmail.com"

  tasks:
    - name: "NOTIF — Verificar que Zabbix está corriendo"
      ansible.builtin.shell: |
        systemctl is-active zabbix-server && echo "OK" || echo "FAIL"
        ss -tlnp | grep 10051 && echo "Port 10051 OK" || echo "Port 10051 FAIL"
      changed_when: false
      register: zabbix_status

    - name: "NOTIF — Verificar acceso a Zabbix API"
      ansible.builtin.shell: |
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"apiinfo.version","id":1,"auth":null,"params":{}}' \
          2>&1 | head -3
      changed_when: false
      register: api_check

    - name: "NOTIF — Obtener token de autenticación"
      ansible.builtin.shell: |
        RESULT=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "user.login",
            "params": {"username": "Admin", "password": "{{ zabbix_password }}"},
            "id": 1
          }')
        echo "$RESULT"
        TOKEN=$(echo "$RESULT" | grep -o '"result":"[^"]*"' | cut -d'"' -f4)
        echo "TOKEN=$TOKEN"
        echo "$TOKEN" > /tmp/zabbix_token
      changed_when: false
      register: login_result

    - name: "NOTIF — Crear Media Type SMTP2GO"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token 2>/dev/null || echo "")
        if [ -z "$TOKEN" ]; then
          echo "ERROR: No hay token"
          exit 1
        fi

        RESULT=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"mediatype.create\",
            \"params\": {
              \"type\": 0,
              \"name\": \"SMTP2GO\",
              \"smtp_server\": \"{{ smtp_server }}\",
              \"smtp_port\": {{ smtp_port }},
              \"smtp helo\": \"zabbix.lima.aj\",
              \"smtp_email\": \"{{ smtp_from }}\",
              \"content_type\": 1,
              \"messages_dir\": \"\"
            },
            \"auth\": \"$TOKEN\",
            \"id\": 2
          }")
        echo "$RESULT"
        echo "$RESULT" | grep -o '"mediatypeids":\[[0-9]*\]' || echo "Creado o ya existe"
      changed_when: false
      register: mediatype_create

    - name: "NOTIF — Obtener ID del Media Type creado"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"mediatype.get\",
            \"params\": {
              \"filter\": {\"name\": [\"SMTP2GO\"]}
            },
            \"auth\": \"$TOKEN\",
            \"id\": 3
          }" | tee /tmp/mediatype_result.json
        echo ""
        MEDIA_ID=$(cat /tmp/mediatype_result.json | grep -o '"mediatypeid":[0-9]*' | head -1 | cut -d':' -f2)
        echo "MEDIA_ID=$MEDIA_ID"
      changed_when: false
      register: get_mediatype

    - name: "NOTIF — Obtener User ID de Admin"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"user.get\",
            \"params\": {
              \"filter\": {\"username\": [\"Admin\"]}
            },
            \"auth\": \"$TOKEN\",
            \"id\": 4
          }" | tee /tmp/user_result.json
        echo ""
        USER_ID=$(cat /tmp/user_result.json | grep -o '"userid":"[^"]*"' | head -1 | cut -d'"' -f4)
        echo "USER_ID=$USER_ID"
      changed_when: false
      register: get_user

    - name: "NOTIF — Actualizar medio de comunicación del usuario (email)"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        MEDIA_ID=$(cat /tmp/mediatype_result.json | grep -o '"mediatypeid":[0-9]*' | head -1 | cut -d':' -f2)
        USER_ID=$(cat /tmp/user_result.json | grep -o '"userid":"[^"]*"' | head -1 | cut -d'"' -f4)

        if [ -z "$MEDIA_ID" ] || [ -z "$USER_ID" ]; then
          echo "ERROR: MEDIA_ID=$MEDIA_ID, USER_ID=$USER_ID"
          exit 1
        fi

        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"user.update\",
            \"params\": {
              \"userid\": \"$USER_ID\",
              \"user_medias\": [
                {
                  \"mediatypeid\": $MEDIA_ID,
                  \"send_to\": \"{{ alert_email }}\",
                  \"severity\": 63,
                  \"active\": 0,
                  \"period\": \"1-7,00:00-24:00\"
                }
              ]
            },
            \"auth\": \"$TOKEN\",
            \"id\": 5
          }"
        echo ""
        echo "Email {{ alert_email }} asignado a usuario Admin"
      changed_when: false
      register: update_user_media

    - name: "NOTIF — Verificar configuración de Action Recovery"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        echo "=== Actions actuales ==="
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"action.get\",
            \"params\": {
              \"filter\": {\"eventsource\": 0}
            },
            \"auth\": \"$TOKEN\",
            \"id\": 6
          }" | grep -o '"name":"[^"]*"' | head -5
        echo ""
        echo "=== Recovery actions ==="
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"action.get\",
            \"params\": {
              \"filter\": {\"eventsource\": 0, \"recovery_mode\": 0}
            },
            \"auth\": \"$TOKEN\",
            \"id\": 7
          }" | grep -o '"name":"[^"]*"'
      changed_when: false
      register: actions_check

    - name: "NOTIF — Habilitar Recovery Notifications"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)

        ACTION_ID=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"action.get\",
            \"params\": {
              \"filter\": {\"eventsource\": 0, \"name\": \"Report problems to Zabbix administrators\"}
            },
            \"auth\": \"$TOKEN\",
            \"id\": 8
          }" | grep -o '"actionid":"[^"]*"' | head -1 | cut -d'"' -f4)

        if [ -z "$ACTION_ID" ]; then
          echo "Action default no encontrada, saltando"
          exit 0
        fi

        echo "Action ID: $ACTION_ID"

        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{
            \"jsonrpc\": \"2.0\",
            \"method\": \"action.update\",
            \"params\": {
              \"actionid\": $ACTION_ID,
              \"recovery_operations\": [
                {
                  \"operationtype\": 0,
                  \"opmessage\": {
                    \"mediatypeid\": 1
                  }
                }
              ]
            },
            \"auth\": \"$TOKEN\",
            \"id\": 9
          }"
        echo ""
        echo "Recovery notifications habilitadas"
      changed_when: false
      register: enable_recovery

    - name: "NOTIF — Resultado final"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "NOTIFICACIONES CONFIGURADAS"
          - "=========================================="
          - "SMTP Server: {{ smtp_server }}:{{ smtp_port }}"
          - "Usuario SMTP: {{ smtp_user }}"
          - "Email destino: {{ alert_email }}"
          - "Tipo: SMTP2GO"
          - ""
          - "Espera recibir:"
          - "- Alertas cuando CPU>95% x 15min"
          - "- Alertas cuando RAM>95% x 15min"
          - "- Alertas cuando disco < 10%"
          - "- Recovery cuando el problema se resuelve"
          - ""
          - "{{ zabbix_status.stdout }}"
          - "{{ api_check.stdout }}"