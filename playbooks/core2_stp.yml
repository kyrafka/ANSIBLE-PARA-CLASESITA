---
- name: "Configurar STP (Spanning Tree) en core2 — Backup Root"
  hosts: core2
  become: true
  gather_facts: true

  vars:
    bridge_ports:
      - ens36
      - ens37
    bridge_name: "br0"
    stp_priority: "36864"
    stp_fwd_delay: "4"
    stp_hello_time: "2"

  tasks:
    - name: "STP — Instalar bridge-utils"
      apt:
        name:
          - bridge-utils
        state: present
        update_cache: yes

    - name: "STP — Crear bridge br0 con STP habilitado"
      shell: |
        brctl addbr br0 2>/dev/null || echo "br0 ya existe"
        brctl stp br0 on
        brctl setfwd br0 2
        brctl sethello br0 {{ stp_hello_time }}
        brctl maxage br0 20
        echo "STP habilitado en br0"

    - name: "STP — Asignar prioridad (BACKUP ROOT - prioridad mas alta)"
      shell: |
        brctl setbridgeprio br0 {{ stp_priority }}
        PRIO=$(brctl show br0 | grep br0 | awk '{print $2}')
        echo "Bridge br0 priority: $PRIO"

    - name: "STP — Agregar puertos al bridge"
      shell: |
        for port in {{ bridge_ports | join(' ') }}; do
          ip link set $port up 2>/dev/null || true
          brctl addif br0 $port 2>/dev/null && echo "Agregado $port a br0" || echo "$port ya estaba en br0"
        done

    - name: "STP — Configurar netplan con STP"
      copy:
        dest: /etc/netplan/60-stp-bridge.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            bridges:
              br0:
                interfaces: [{{ bridge_ports | join(', ') }}]
                parameters:
                  stp: true
                  priority: {{ stp_priority }}
                  forward-delay: {{ stp_fwd_delay }}
                  hello-time: {{ stp_hello_time }}
                addresses:
                  - "192.168.10.30/24"
                routes:
                  - to: default
                    via: "192.168.10.1"
                nameservers:
                  addresses:
                    - "192.168.16.10"
                dhcp: false
        owner: root
        group: root
        mode: "0600"

    - name: "STP — Aplicar netplan"
      shell: |
        netplan generate
        netplan apply
        sleep 5
        echo "Netplan aplicado"

    - name: "STP — Verificar estado final"
      shell: |
        echo "=== STP en core2 ==="
        brctl show
        echo ""
        echo "=== STP details ==="
        brctl showstp br0 2>/dev/null | grep -E "^ br0|priority|state|designated" | head -15
      register: stp_final
      changed_when: false

    - name: "STP — Mostrar resultado"
      debug:
        msg: "{{ stp_final.stdout_lines }}"