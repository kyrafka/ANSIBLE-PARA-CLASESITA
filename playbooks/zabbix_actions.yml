    - name: "ACT — Listar Actions creadas"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        echo "=== Actions de Auto-Restart ==="
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "action.get",
            "params": {
              "output": ["actionid", "name", "status", "eventsource"],
              "filter": {"eventsource": 0}
            },
            "auth": "'$TOKEN'",
            "id": 20
          }' | python3 -c "
import sys, json
data = json.load(sys.stdin)
result = data.get('result', [])
for a in result:
    status = 'DISABLED' if a.get('status') == '1' else 'ENABLED'
    print(f\"  [{status}] {a['name']}\")
"
      changed_when: false
      register: list_actions

