---
# ============================================================================
# zabbix_actions.yml
# Crea Actions para AUTO-REINICIAR servicios cuando caen
# Usa Remote Commands a través de Zabbix Agent
# ============================================================================

- name: "Crear Actions de Auto-Restart para Zabbix"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_password: "Zabbix123"

  tasks:
    - name: "ACT — Obtener token Zabbix"
      ansible.builtin.shell: |
        RESULT=$(curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "user.login",
            "params": {"username": "Admin", "password": "{{ zabbix_password }}"},
            "id": 1
          }')
        TOKEN=$(echo "$RESULT" | grep -o '"result":"[^"]*"' | cut -d'"' -f4)
        echo "$TOKEN" > /tmp/zabbix_token
        echo "Token OK"
      changed_when: false
      register: login

    - name: "ACT — Obtener host IDs de los servicios"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)

        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "host.get",
            "params": {
              "output": ["hostid", "name", "host"],
              "filter": {}
            },
            "auth": "'$TOKEN'",
            "id": 2
          }' | python3 -c "
import sys, json
data = json.load(sys.stdin)
result = data.get('result', [])
hosts = {}
for h in result:
    name = h['name']
    hostid = h['hostid']
    hosts[name] = hostid
    print(f\"{name}: {hostid}\")
with open('/tmp/zabbix_hosts.json', 'w') as f:
    json.dump(hosts, f)
"
        echo ""
        echo "Hosts guardados"
      changed_when: false
      register: get_hosts

    - name: "ACT — Obtener grupo Linux servers ID"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "hostgroup.get",
            "params": {
              "filter": {"name": ["Linux servers"]}
            },
            "auth": "'$TOKEN'",
            "id": 3
          }' | tee /tmp/hostgroup.json
        GROUP_ID=$(cat /tmp/hostgroup.json | grep -o '"groupid":"[^"]*"' | head -1 | cut -d'"' -f4)
        echo "GROUP_ID=$GROUP_ID"
        echo "$GROUP_ID" > /tmp/linux_group_id
      changed_when: false
      register: get_group

    - name: "ACT — Crear Action: Restart Apache"
      ansible.builtin.shell: |
        TOKEN=$(cat /tmp/zabbix_token)
        GROUP_ID=$(cat /tmp/linux_group_id)

        curl -s -X POST http://localhost/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{
            "jsonrpc": "2.0",
            "method": "action.create",
            "params": {
              "name": "Auto-Restart Apache if down",
              "eventsource": 0,
              "status": 0,
              "esc_period": "10m",
              "def_shortdata": "Apache DOWN on {HOST.NAME}",
              "def_longdata": "Apache service is not responding on {HOST.NAME}. Zabbix will attempt to restart it automatically.\n\nLast value: {ITEM.LASTVALUE1}\nTime: {EVENT.TIME}\nDate: {EVENT.DATE}",
              "conditions": [
                {"conditiontype": 4, "operator": 5, "value": "apache"}
              ],
              "operations": [
                {
                  "operationtype": 1,
                  "esc_period": "0",
                  "esc_step_from": 1,
                  "esc_step_to": 1,
                  "opcommand": {
                    "command": "systemctl restart apache2",
                    "type": 0,
                    "execute_on": 1
                  },
                  "opcommand_hst": {
                    "hostid": 0
                  }
                }
              ]
            },
            "auth": "'$TOKEN'",
            "id": 10
          }'
        echo ""
      changed_when: false
      register: action_apache

