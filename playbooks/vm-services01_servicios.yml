---
# ============================================================================
# vm-services01_servicios.yml — Servidor de Correo
# ============================================================================
# Ejecutar DESPUES de vm-services01_network.yml
# ============================================================================

- name: "Configurar SERVICIOS vm-services01 — Correo"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    domain_name: "AJ.local"
    mail_password: "AdminMail123!"
    mysql_root_password: "AdminMail123!"
    server_ip: "192.168.13.11"
    dns_server: "192.168.16.10"

  tasks:
    - name: "MAIL — Actualizar apt"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "MAIL — Instalar paquetes de correo"
      ansible.builtin.apt:
        name:
          - postfix
          - postfix-mysql
          - dovecot-core
          - dovecot-imapd
          - dovecot-pop3d
          - dovecot-mysql
          - dovecot-lmtpd
          - mysql-server
          - roundcube
          - roundcube-core
          - roundcube-mysql
          - php
          - php-mysql
          - php-imap
          - php-mbstring
          - php-xml
          - php-curl
          - php-json
          - apache2
          - libapache2-mod-php
          - mailutils
        state: present
        update_cache: yes

    - name: "MAIL — Configurar hostname"
      ansible.builtin.shell: |
        hostnamectl set-hostname mail.{{ domain_name }}
        sed -i '/^127.0.1.1/d' /etc/hosts
        echo "127.0.1.1 mail.{{ domain_name }} mail" >> /etc/hosts
        hostname -f
        echo "Hostname configurado"

    - name: "MAIL — Configurar Postfix"
      ansible.builtin.copy:
        dest: /etc/postfix/main.cf
        content: |
          myhostname = mail.{{ domain_name }}
          mydomain = {{ domain_name }}
          myorigin = $mydomain
          inet_interfaces = all
          inet_protocols = ipv4
          home_mailbox = Maildir/
          mailbox_size_limit = 0
          message_size_limit = 52428800
          mynetworks = 127.0.0.0/8 192.168.0.0/16 10.0.0.0/8
          smtpd_sasl_auth_enable = yes
          smtpd_sasl_type = dovecot
          smtpd_sasl_path = private/auth
          broken_sasl_auth_clients = yes
        force: yes

    - name: "MAIL — Habilitar Submission en Postfix"
      ansible.builtin.copy:
        dest: /etc/postfix/master.cf
        content: |
          smtp      inet  n       -       y       -       -       smtpd
          submission inet n       -       y       -       -       smtpd
            -o syslog_name=postfix/submission
            -o smtpd_tls_security_level=encrypt
            -o smtpd_sasl_auth_enable=yes
          pickup    unix  n       -       y       60      1       pickup
          qmgr      unix  n       -       n       300     1       qmgr
          tlsmgr    unix  -       -       y       1000?   1       tlsmgr
          relay     unix  -       -       y       -       -       smtp
          local     unix  -       n       n       -       -       local
        force: yes

    - name: "MAIL — Crear usuario admin"
      ansible.builtin.shell: |
        useradd -m -s /bin/bash admin 2>/dev/null || true
        mkdir -p /home/admin/Maildir/{new,cur,tmp}
        chown -R admin:admin /home/admin
        chmod -R 700 /home/admin/Maildir
        echo "admin:$(openssl passwd -1 {{ mail_password }})" | chpasswd
        echo "Usuario admin creado"

    - name: "MAIL — Configurar MySQL"
      ansible.builtin.shell: |
        # Configurar bind-address para escuchar en todas las interfaces
        sed -i "s/^bind-address.*/bind-address = 0.0.0.0/" /etc/mysql/mysql.conf.d/mysqld.cnf
        systemctl enable mysql
        systemctl restart mysql
        sleep 3
        mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';"
        mysql -e "CREATE DATABASE IF NOT EXISTS postfix;"
        # Verificar si axiom_web ya existe
        if mysql -u root -p'{{ mysql_root_password }}' -e "USE axiom_web;" 2>/dev/null; then
          echo "axiom_web ya existe - skipping"
          # Actualizar permisos por si el host cambió
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'%' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'192.168.11.11' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'192.168.13.11' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "FLUSH PRIVILEGES;"
        else
          mysql -u root -p'{{ mysql_root_password }}' -e "CREATE DATABASE axiom_web CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -u root -p'{{ mysql_root_password }}' -e "CREATE USER IF NOT EXISTS 'axiom_web'@'%' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "CREATE USER IF NOT EXISTS 'axiom_web'@'localhost' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "CREATE USER IF NOT EXISTS 'axiom_web'@'192.168.11.11' IDENTIFIED BY 'Ax1omWeb!2024';"
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'%';"
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'localhost';"
          mysql -u root -p'{{ mysql_root_password }}' -e "GRANT ALL PRIVILEGES ON axiom_web.* TO 'axiom_web'@'192.168.11.11';"
          mysql -u root -p'{{ mysql_root_password }}' -e "FLUSH PRIVILEGES;"
          echo "axiom_web creada"
        fi
        echo "MySQL configurado con bind-address 0.0.0.0"

    - name: "MAIL — Configurar Dovecot"
      ansible.builtin.copy:
        dest: /etc/dovecot/dovecot.conf
        content: |
          protocols = imap pop3 lmtp
          listen = *
          disable_plaintext_auth = no
          mail_location = maildir:~/Maildir
          namespace inbox {
            inbox = yes
          }
          service lmtp {
            unix_listener /var/spool/postfix/private/dovecot-lmtp {
              mode = 0600
              user = postfix
              group = postfix
            }
          }
          service auth {
            unix_listener /var/spool/postfix/private/auth {
              mode = 0600
              user = postfix
              group = postfix
            }
          }
          passdb {
            driver = passwd
          }
          userdb {
            driver = passwd
          }
        force: yes

    - name: "MAIL — Configurar Apache"
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/mail.conf
        content: |
          <VirtualHost *:80>
              ServerName mail.{{ domain_name }}
              DocumentRoot /var/lib/roundcube
              <Directory /var/lib/roundcube>
                  Options -FollowSymLinks
                  AllowOverride All
              </Directory>
              Alias /webmail /var/lib/roundcube
              Alias /mail /var/lib/roundcube
          </VirtualHost>
        force: yes

    - name: "MAIL — Habilitar config Apache"
      ansible.builtin.shell: |
        a2ensite mail.conf
        a2enmod rewrite php
        a2dissite 000-default.conf
        systemctl reload apache2
        ln -sf /var/lib/roundcube /var/www/html/webmail 2>/dev/null || true
        echo "Apache configurado"

    - name: "MAIL — Iniciar servicios"
      ansible.builtin.shell: |
        systemctl enable postfix dovecot mysql apache2
        systemctl restart postfix dovecot mysql apache2
        sleep 2
        echo "Servicios iniciados"

    - name: "MAIL — Verificacion"
      ansible.builtin.shell: |
        echo "=== SERVICIOS ==="
        systemctl is-active postfix && echo "Postfix: OK" || echo "Postfix: FAIL"
        systemctl is-active dovecot && echo "Dovecot: OK" || echo "Dovecot: FAIL"
        systemctl is-active mysql && echo "MySQL: OK" || echo "MySQL: FAIL"
        systemctl is-active apache2 && echo "Apache: OK" || echo "Apache: FAIL"
        echo ""
        echo "=== PUERTOS ==="
        ss -tlnp | grep -E "25|80|143|993|995" || echo "Sin puertos"
        echo ""
        echo "=== ACCESOS ==="
        echo "Webmail: http://{{ server_ip }}/webmail/"
        echo "Usuario: admin"
        echo "Password: {{ mail_password }}"
      changed_when: false
      register: verif

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"