---
- name: "Configurar SERVICIOS vm-monitor01 — Zabbix + Grafana"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    zabbix_password: "Zabbix123"
    grafana_password: "Admin123"
    php_ini_path: "/etc/php/8.3/apache2/php.ini"

  tasks:
    - name: "MON — Actualizar apt"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "MON — Instalar dependencias"
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
          - apache2
          - php
          - php-mysql
          - php-gd
          - php-mbstring
          - php-xml
          - php-bcmath
          - libapache2-mod-php
        state: present

    - name: "MON — Instalar Zabbix"
      ansible.builtin.shell: |
        set -e
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        dpkg -i /tmp/zabbix.deb || true
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y zabbix-server-mysql zabbix-sql-scripts zabbix-frontend-php zabbix-apache-conf zabbix-agent
        echo "Zabbix instalado"

    - name: "MON — Instalar MariaDB"
      ansible.builtin.apt:
        name: mariadb-server
        state: present

    - name: "MON — Iniciar MariaDB y crear DB"
      ansible.builtin.shell: |
        systemctl enable mariadb 2>/dev/null || true
        systemctl start mariadb
        sleep 3
        
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "DROP USER IF EXISTS 'zabbix'@'localhost';"
        mysql -e "CREATE USER 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_password }}';"
        mysql -e "GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'localhost';"
        mysql -e "FLUSH PRIVILEGES;"
        echo "DB lista"
      changed_when: false

    - name: "MON — Buscar script SQL de Zabbix"
      ansible.builtin.shell: |
        SCRIPT=$(find /usr -name "server.sql.gz" 2>/dev/null | grep zabbix | head -1)
        if [ -z "$SCRIPT" ]; then
          SCRIPT=$(find /usr -name "mysql.sql.gz" 2>/dev/null | grep zabbix | head -1)
        fi
        if [ -z "$SCRIPT" ]; then
          echo "NONE"
        else
          echo "$SCRIPT"
        fi
      changed_when: false
      register: zabbix_sql_script

    - name: "MON — Importar schema (con verificacion)"
      ansible.builtin.shell: |
        set -e
        SCRIPT="{{ zabbix_sql_script.stdout }}"
        
        if [ "$SCRIPT" = "NONE" ] || [ -z "$SCRIPT" ]; then
          echo "ERROR: No se encontro script SQL de Zabbix"
          find /usr -name "*.gz" 2>/dev/null | grep -i zabbix | head -5
          exit 1
        fi
        
        echo "Usando script: $SCRIPT"
        
        echo "Verificando DB existente..."
        COUNT=$(mysql -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix'" 2>/dev/null || echo "0")
        echo "Tablas existentes: $COUNT"
        
        if [ "$COUNT" -lt 10 ]; then
          echo "Importando schema fresco..."
          zcat "$SCRIPT" | mysql -uzabbix -p'{{ zabbix_password }}' zabbix
          echo "Import completado"
        else
          echo "Schema ya existe, saltando import"
        fi
        
        TABLES=$(mysql -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix'" 2>/dev/null || echo "0")
        echo "Tablas en DB: $TABLES"
        
        if [ "$TABLES" -lt 10 ]; then
          echo "ERROR: Schema no se importo"
          exit 1
        fi
        
        mysql -uzabbix -p'{{ zabbix_password }}' -e "SELECT COUNT(*) AS user_count FROM users" zabbix
        echo "Schema OK"

    - name: "MON — Crear directorio zabbix"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: zabbix
        group: zabbix
        mode: "0755"
      loop:
        - /run/zabbix
        - /var/log/zabbix

    - name: "MON — Configurar Zabbix Server"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_server.conf
        content: |
          LogFile=/var/log/zabbix/zabbix_server.log
          DBHost=localhost
          DBName=zabbix
          DBUser=zabbix
          DBPassword={{ zabbix_password }}
          Timeout=30
        mode: "0644"

    - name: "MON — Detectar version PHP"
      ansible.builtin.shell: |
        if [ -f /etc/php/8.3/apache2/php.ini ]; then
          echo "8.3"
        elif [ -f /etc/php/8.2/apache2/php.ini ]; then
          echo "8.2"
        elif [ -f /etc/php/8.1/apache2/php.ini ]; then
          echo "8.1"
        else
          ls /etc/php/ 2>/dev/null || echo "none"
        fi
      changed_when: false
      register: php_version

    - name: "MON — Configurar PHP (detectado {{ php_version.stdout }})"
      ansible.builtin.shell: |
        PHPINI="/etc/php/{{ php_version.stdout }}/apache2/php.ini"
        if [ -f "$PHPINI" ]; then
          sed -i 's/;date.timezone =/date.timezone = "America\/Lima"/' "$PHPINI"
          sed -i 's/max_execution_time = 30/max_execution_time = 300/' "$PHPINI"
          sed -i 's/memory_limit = -1/memory_limit = 128M/' "$PHPINI"
          echo "PHP configurado en $PHPINI"
        else
          echo "WARNING: $PHPINI no existe"
          ls /etc/php/ 2>/dev/null || true
        fi

    - name: "MON — Configurar Apache para Zabbix"
      ansible.builtin.shell: |
        if [ -f /usr/share/zabbix/apache.conf ]; then
          cp /usr/share/zabbix/apache.conf /etc/apache2/conf-available/zabbix.conf
          echo "Config Apache copiado"
        else
          echo "WARNING: /usr/share/zabbix/apache.conf no existe"
          ls /usr/share/zabbix/ 2>/dev/null | head -5
        fi

    - name: "MON — Habilitar Apache"
      ansible.builtin.shell: |
        rm -f /var/www/html/zabbix
        ln -sf /usr/share/zabbix /var/www/html/zabbix
        
        a2enmod php{{ php_version.stdout }} rewrite 2>/dev/null || true
        a2enconf zabbix 2>/dev/null || true
        a2dissite 000-default.conf 2>/dev/null || true
        
        systemctl restart apache2
        sleep 2
        
        echo "=== Apache status ==="
        systemctl status apache2 --no-pager || true
        echo "=== Listening 80 ==="
        ss -tlnp | grep ':80' || echo "Ninguno en :80"
        echo "=== Test web ==="
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost/zabbix/
        curl -s http://localhost/zabbix/ | head -3

    - name: "MON — Instalar Grafana"
      ansible.builtin.shell: |
        wget -q -O - https://packages.grafana.com/gpg.key | apt-key add -
        echo "deb https://packages.grafana.com/oss/deb stable main" > /etc/apt/sources.list.d/grafana.list
        apt-get update -qq
        apt-get install -y grafana
        echo "Grafana instalado"

    - name: "MON — Iniciar Grafana"
      ansible.builtin.service:
        name: grafana-server
        enabled: yes
        state: started

    - name: "MON — Iniciar Zabbix"
      ansible.builtin.service:
        name: zabbix-server
        enabled: yes
        state: started
      async: 60
      poll: 5

    - name: "MON — Esperar y verificar Zabbix"
      ansible.builtin.shell: |
        sleep 10
        echo "=== Zabbix status ==="
        systemctl status zabbix-server --no-pager || true
        echo ""
        echo "=== Zabbix log (ultimas 15 lineas) ==="
        tail -15 /var/log/zabbix/zabbix_server.log 2>/dev/null || echo "Log no existe"
        echo ""
        echo "=== Puerto 10051 ==="
        ss -tlnp | grep 10051 || echo "10051 no escuchando"
        echo ""
        echo "=== Test acceso ==="
        curl -s -o /dev/null -w "Zabbix HTTP: %{http_code}\n" http://localhost/zabbix/
        curl -s -o /dev/null -w "Grafana HTTP: %{http_code}\n" http://localhost:3000/
      changed_when: false
      register: verif

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"