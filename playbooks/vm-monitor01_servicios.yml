---
# ============================================================================
# vm-monitor01_servicios.yml — Zabbix + Grafana (PARTE 2)
# ============================================================================

- name: "Configurar SERVICIOS vm-monitor01 — Zabbix + Grafana"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    zabbix_password: "AdminZbx123!"
    grafana_password: "AdminGrafana123!"

  tasks:
    - name: "MON — Actualizar apt"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "MON — Instalar dependencias"
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
          - apache2
          - php
          - php-mysql
          - php-gd
          - php-mbstring
          - php-xml
          - php-bcmath
        state: present

    - name: "MON — Instalar Zabbix"
      ansible.builtin.shell: |
        wget -q https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb -O /tmp/zabbix.deb
        dpkg -i /tmp/zabbix.deb
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y zabbix-server-mysql zabbix-frontend-php zabbix-apache-conf zabbix-agent
        echo "Zabbix instalado"

    - name: "MON — Instalar MariaDB"
      ansible.builtin.apt:
        name: mariadb-server
        state: present

    - name: "MON — Configurar MariaDB primero"
      ansible.builtin.shell: |
        systemctl enable mariadb
        systemctl start mariadb
        sleep 3

    - name: "MON — Crear DB Zabbix (sin password root)"
      ansible.builtin.shell: |
        mysql << 'EOSQL'
        CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
        CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_password }}';
        CREATE USER IF NOT EXISTS 'zabbix'@'%' IDENTIFIED BY '{{ zabbix_password }}';
        GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'localhost';
        GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'%';
        FLUSH PRIVILEGES;
        ALTER USER 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_password }}';
        ALTER USER 'zabbix'@'%' IDENTIFIED BY '{{ zabbix_password }}';
        FLUSH PRIVILEGES;
        EOSQL
        echo "DB configurada"

    - name: "MON — Importar schema de Zabbix"
      ansible.builtin.shell: |
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql --user=zabbix --password={{ zabbix_password }} zabbix
        echo "Schema importado"

    - name: "MON — Crear directorio zabbix con permisos"
      ansible.builtin.shell: |
        mkdir -p /run/zabbix
        chown zabbix:zabbix /run/zabbix
        chmod 755 /run/zabbix
        ls -la /run/ | grep zabbix

    - name: "MON — Configurar Zabbix Server"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_server.conf
        content: |
          LogType=console
          DBHost=localhost
          DBName=zabbix
          DBUser=zabbix
          DBPassword={{ zabbix_password }}
          Timeout=30
          LogSlowQueries=3000
        force: yes

    - name: "MON — Configurar Apache para Zabbix"
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/zabbix.conf
        content: |
          php_value max_execution_time 300
          php_value memory_limit 128M
          php_value post_max_size 16M
          php_value upload_max_filesize 2M
          php_value max_input_vars = 5000
          php_value date.timezone = America/Lima
        force: yes

    - name: "MON — Habilitar sitios"
      ansible.builtin.shell: |
        a2enconf zabbix
        a2enmod php
        a2dissite 000-default.conf
        systemctl reload apache2

    - name: "MON — Instalar Grafana"
      ansible.builtin.shell: |
        wget -q -O - https://packages.grafana.com/gpg.key | apt-key add -
        echo "deb https://packages.grafana.com/oss/deb stable main" > /etc/apt/sources.list.d/grafana.list
        apt-get update
        apt-get install -y grafana

    - name: "MON — Configurar Grafana"
      ansible.builtin.shell: |
        sed -i 's/;http_port = 3000/http_port = 3000/' /etc/grafana/grafana.ini
        systemctl enable grafana-server
        systemctl start grafana-server

    - name: "MON — Iniciar Zabbix Server"
      ansible.builtin.shell: |
        systemctl enable zabbix-server
        systemctl restart zabbix-server
        sleep 5
        systemctl status zabbix-server --no-pager || true
        echo "=== Zabbix status ==="
        ps aux | grep zabbix_server | grep -v grep

    - name: "MON — Verificacion"
      ansible.builtin.shell: |
        echo "=== SERVICIOS ==="
        systemctl is-active zabbix-server && echo "Zabbix Server: OK" || echo "Zabbix Server: FAIL"
        systemctl is-active grafana-server && echo "Grafana: OK" || echo "Grafana: FAIL"
        systemctl is-active apache2 && echo "Apache: OK" || echo "Apache: FAIL"
        systemctl is-active mariadb && echo "MariaDB: OK" || echo "MariaDB: FAIL"
        echo ""
        echo "=== PUERTOS ==="
        ss -tlnp | grep -E "80|3000|10051" || echo "Sin puertos"
        echo ""
        echo "=== ZABBIX PROCESO ==="
        ps aux | grep zabbix_server | grep -v grep || echo "Sin proceso zabbix_server"
        echo ""
        echo "=== DIRECTORIO PID ==="
        ls -la /run/zabbix/
        echo ""
        echo "=== ACCESOS ==="
        echo "Zabbix: http://192.168.17.11/zabbix/"
        echo "Grafana: http://192.168.17.11:3000"
        echo "Zabbix User: Admin / zabbix"
        echo "Grafana User: admin / admin"
      changed_when: false
      register: verif

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"