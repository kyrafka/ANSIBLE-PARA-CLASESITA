---
# ============================================================================
# pfsense_static_routes.yml — Rutas estaticas en pfSense (sin BGP/FRR)
# ============================================================================
# pfSense GUI: System > Routing > Static Routes
# Gateway Groups: System > Routing > Gateway Groups
# ============================================================================
#
# ESQUEMA:
#   ISP1 (172.17.25.49) -> LAN 192.168.2.0/24 -> pfSense WAN1 192.168.2.2
#   ISP2 (172.17.25.88) -> LAN 192.168.1.0/24 -> pfSense WAN2 192.168.1.2
#
# Gateway Group:
#   Tier 1: ISP2 (192.168.1.1) - el bueno
#   Tier 2: ISP1 (192.168.2.1) - backup
# ============================================================================

- name: "Configurar rutas estaticas en pfSense (sin BGP)"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    pfsense_ip: "192.168.16.1"
    pfsense_user: "admin"
    pfsense_pass: "qwe123$"

  tasks:
    - name: "AVISO — Configurar por GUI de pfSense"
      debug:
        msg:
          - "=========================================="
          - "CONFIGURACION ESTATICA EN pfSense"
          - "=========================================="
          - ""
          - "1. DESINSTALAR FRR/BGP (si esta instalado):"
          - "   System > Package Manager > Installed Packages"
          - "   Buscar 'FRR' y desinstalar"
          - ""
          - "2. CREAR GATEWAYS:"
          - "   System > Routing > Gateways > Add"
          - "   - Name: ISP1_GW"
          - "     Interface: WAN1"
          - "     Gateway: 192.168.2.1"
          - "     Monitor: 8.8.8.8"
          - ""
          - "   - Name: ISP2_GW"
          - "     Interface: WAN2"
          - "     Gateway: 192.168.1.1"
          - "     Monitor: 8.8.4.4"
          - ""
          - "3. CREAR GATEWAY GROUP:"
          - "   System > Routing > Gateway Groups > Add"
          - "   - Name: MultiWAN"
          - "   - ISP2_GW: Tier 1 (principal)"
          - "   - ISP1_GW: Tier 2 (backup)"
          - "   - Trigger: Member Down"
          - ""
          - "4. RUTAS ESTATICAS (si necesarias):"
          - "   System > Routing > Static Routes"
          - "   (Normalmente no se necesitan si los gateways estan bien)"
          - ""
          - "5. ASIGNAR GATEWAY GROUP:"
          - "   Firewall > Rules > LAN"
          - "   Editar regla default LAN -> Gateway: MultiWAN"
          - ""
          - "6. VERIFICAR:"
          - "   System > Routing > Gateways"
          - "   Ver que ambos gateways estan Online"
          - ""
          - "ACCESO GUI: https://{{ pfsense_ip }}/"
          - "=========================================="

    - name: "Desactivar FRR/BGP en los ISPs"
      debug:
        msg:
          - "=========================================="
          - "DESACTIVAR BGP EN LOS ISP"
          - "=========================================="
          - ""
          - "En ISP_CREATE1 (172.17.25.49):"
          - "  sudo systemctl stop frr"
          - "  sudo systemctl disable frr"
          - "  sudo vtysh -c 'configure terminal' -c 'no router bgp 65001'"
          - ""
          - "En ISP_CREATE2 (172.17.25.88):"
          - "  sudo systemctl stop frr"
          - "  sudo systemctl disable frr"
          - "  sudo vtysh -c 'configure terminal' -c 'no router bgp 65002'"
          - ""
          - "El NAT sigue funcionando, solo quitamos BGP"
          - "=========================================="
