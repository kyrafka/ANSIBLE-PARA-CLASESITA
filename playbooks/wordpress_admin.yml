---
- name: "Setup WordPress Admin User - vm-web01"
  hosts: vm-web01
  become: true
  gather_facts: false

  vars:
    wp_admin_user: admin
    wp_admin_email: admin@axiom.tech
    wp_admin_password: "AxiomAdmin123!"
    wp_admin_display_name: "Administrador AXIOM"

  tasks:
    - name: "1. Verificar wp-config.php"
      ansible.builtin.shell: |
        echo "=== wp-config.php ==="
        ls -la /var/www/axiom/wp-config.php 2>/dev/null || echo "NO EXISTE"
        grep -E "DB_NAME|DB_HOST" /var/www/axiom/wp-config.php 2>/dev/null
      register: wp_config_check

    - name: "Mostrar wp-config"
      ansible.builtin.debug:
        msg: "{{ wp_config_check.stdout_lines }}"

    - name: "2. Verificar conexión MySQL"
      ansible.builtin.shell: |
        mysql -h 192.168.13.11 -u axiom_web -p'Ax1omWeb!2024' -e "SELECT 'MySQL OK' as status;" 2>&1
      register: mysql_test

    - name: "Mostrar MySQL"
      ansible.builtin.debug:
        msg: "{{ mysql_test.stdout }}"

    - name: "3. Contar tablas WordPress"
      ansible.builtin.shell: |
        COUNT=$(mysql -h 192.168.13.11 -u axiom_web -p'Ax1omWeb!2024' axiom_web -e "SHOW TABLES;" 2>/dev/null | wc -l)
        echo "Tablas: $COUNT"
        if [ "$COUNT" -lt 5 ]; then
          echo "SIN_TABLAS"
        else
          echo "CON_TABLAS"
        fi
      register: tables_check

    - name: "Mostrar tablas"
      ansible.builtin.debug:
        msg: "{{ tables_check.stdout }}"

    - name: "4. Instalar WP-CLI"
      ansible.builtin.shell: |
        if ! command -v wp &>/dev/null; then
          curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          mv wp-cli.phar /usr/local/bin/wp
          echo "WP-CLI instalado"
        else
          echo "WP-CLI ya existe"
        fi
      register: wp_cli_install

    - name: "5. Descargar WordPress core si falta"
      ansible.builtin.shell: |
        if [ ! -f /var/www/axiom/wp-load.php ]; then
          echo "Descargando WordPress..."
          rm -rf /tmp/wordpress /tmp/latest.tar.gz 2>/dev/null
          wget -q https://wordpress.org/latest.tar.gz -O /tmp/latest.tar.gz
          tar -xzf /tmp/latest.tar.gz -C /tmp/
          cp -r /tmp/wordpress/* /var/www/axiom/
          chown -R www-data:www-data /var/www/axiom
          echo "WordPress descargado"
        else
          echo "WordPress ya existe"
        fi
      register: wp_download

    - name: "6. Instalar WordPress (crear tablas y admin)"
      ansible.builtin.shell: |
        cd /var/www/axiom
        wp --allow-root core install \
          --url="http://192.168.11.11" \
          --title="AXIOM TECH" \
          --admin_user="admin" \
          --admin_password="AxiomAdmin123!" \
          --admin_email="admin@axiom.tech" \
          --skip-email 2>&1
      register: wp_install
      when: "tables_check.stdout is search('SIN_TABLAS')"

    - name: "Mostrar instalación"
      ansible.builtin.debug:
        msg: "{{ wp_install.stdout_lines if wp_install is defined else 'N/A' }}"

    - name: "7. Verificar tables creadas"
      ansible.builtin.shell: |
        mysql -h 192.168.13.11 -u axiom_web -p'Ax1omWeb!2024' axiom_web -e "SHOW TABLES;" 2>/dev/null | head -10
      register: tables_verify

    - name: "Mostrar tablas finales"
      ansible.builtin.debug:
        msg: "{{ tables_verify.stdout_lines }}"

    - name: "8. Resultado"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "WORDPRESS LOGIN"
          - "=========================================="
          - "URL: http://192.168.11.11/wp-admin"
          - "Usuario: admin"
          - "Password: AxiomAdmin123!"
          - "=========================================="