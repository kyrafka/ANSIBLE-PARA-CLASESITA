---
# ============================================================================
# isp_setup.yml — Configura ISP_CREATE1 o ISP_CREATE2
# ============================================================================
# Solo configura: netplan + NAT (sin BGP)
# Rutas estaticas se manejan en pfSense
#
# Uso:
#   ISP_CREATE1: sudo ansible-playbook playbooks/isp_setup.yml -e "isp_id=1"
#   ISP_CREATE2: sudo ansible-playbook playbooks/isp_setup.yml -e "isp_id=2"
# ============================================================================

- name: "Configurar ISP — Netplan + NAT (sin BGP)"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    isp_id: 1

    isp_config:
      "1":
        wan_ip: "172.17.25.49/24"
        wan_gw: "172.17.25.121"
        wan_iface: "ens34"
        lan_iface: "ens35"
        lan_ip: "192.168.2.1/24"
      "2":
        wan_ip: "172.17.25.88/24"
        wan_gw: "172.17.25.121"
        wan_iface: "ens34"
        lan_iface: "ens35"
        lan_ip: "192.168.1.1/24"

    current_isp: "{{ isp_config[isp_id | string] }}"

  tasks:
    - name: "ISP — Extraer parametros"
      set_fact:
        isp_wan_iface: "{{ current_isp.wan_iface }}"
        isp_lan_iface: "{{ current_isp.lan_iface }}"
        isp_lan_ip: "{{ current_isp.lan_ip }}"

    - name: "NET — Backup netplan anterior"
      shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.isp.bak.$(date +%s)
        echo "Backup done"

    - name: "NET — Crear netplan para ISP {{ isp_id }}"
      copy:
        dest: "/etc/netplan/50-cloud-init.yaml"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ current_isp.wan_iface }}:
                addresses:
                  - {{ current_isp.wan_ip }}
                gateway4: {{ current_isp.wan_gw }}
                optional: true
              {{ current_isp.lan_iface }}:
                addresses:
                  - {{ current_isp.lan_ip }}
                optional: true
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Generar y aplicar netplan"
      shell: |
        netplan generate
        netplan apply
        sleep 3
        echo "Netplan applied"

    - name: "NET — Verificar interfaces"
      shell: |
        echo "=== WAN ({{ isp_wan_iface }}) ==="
        ip addr show {{ isp_wan_iface }} | grep "inet "
        echo "=== LAN ({{ isp_lan_iface }}) ==="
        ip addr show {{ isp_lan_iface }} | grep "inet "
        echo "=== RUTA DEFAULT ==="
        ip route | grep default

    - name: "NAT — Habilitar IP Forwarding"
      shell: |
        echo 1 > /proc/sys/net/ipv4/ip_forward
        echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/99-isp-nat.conf
        sysctl -p /etc/sysctl.d/99-isp-nat.conf

    - name: "NAT — Aplicar MASQUERADE (lan -> wan)"
      shell: |
        iptables -t nat -C POSTROUTING -o {{ current_isp.wan_iface }} -j MASQUERADE 2>/dev/null || \
        iptables -t nat -A POSTROUTING -o {{ current_isp.wan_iface }} -j MASQUERADE
        echo "NAT MASQUERADE applied on {{ current_isp.wan_iface }}"

    - name: "NAT — Permitir forwarding entre interfaces"
      shell: |
        iptables -C FORWARD -i {{ current_isp.lan_iface }} -o {{ current_isp.wan_iface }} -j ACCEPT 2>/dev/null || \
        iptables -I FORWARD -i {{ current_isp.lan_iface }} -o {{ current_isp.wan_iface }} -j ACCEPT
        iptables -C FORWARD -i {{ current_isp.wan_iface }} -o {{ current_isp.lan_iface }} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
        iptables -I FORWARD -i {{ current_isp.wan_iface }} -o {{ current_isp.lan_iface }} -m state --state RELATED,ESTABLISHED -j ACCEPT
        echo "Forward rules applied"

    - name: "NAT — Guardar reglas persistente"
      apt:
        name:
          - iptables-persistent
          - netfilter-persistent
        state: present
        update_cache: yes

    - name: "NAT — Guardar reglas iptables"
      shell: |
        netfilter-persistent save 2>/dev/null || true

    - name: "DNS — Deshabilitar systemd-resolved"
      systemd:
        name: systemd-resolved
        state: stopped
        enabled: no
      ignore_errors: true

    - name: "DNS — Crear resolv.conf"
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          nameserver 1.1.1.1
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "BGP — Desactivar FRR (no necesitamos BGP)"
      shell: |
        systemctl stop frr 2>/dev/null || true
        systemctl disable frr 2>/dev/null || true
        echo "FRR/BGP desactivado"
      ignore_errors: true

    - name: "VERIF — Estado final"
      shell: |
        echo "=============================================="
        echo "ISP_CREATE{{ isp_id }} - RESUMEN (Solo NAT)"
        echo "=============================================="
        echo ""
        echo "INTERFACES:"
        echo "  WAN  ({{ current_isp.wan_iface }}): $(ip addr show {{ current_isp.wan_iface }} | grep 'inet ' | awk '{print $2}')"
        echo "  LAN  ({{ current_isp.lan_iface }}): $(ip addr show {{ current_isp.lan_iface }} | grep 'inet ' | awk '{print $2}')"
        echo ""
        echo "NAT:"
        iptables -t nat -L POSTROUTING -n | grep MASQUERADE
        echo ""
        echo "BGP: DESACTIVADO (rutas estaticas en pfSense)"
        echo ""
        echo "FRR STATUS:"
        systemctl is-active frr 2>/dev/null || echo "inactivo"
        echo "=============================================="
      changed_when: false
      register: verif

    - name: "VERIF — Mostrar resultado"
      debug:
        msg: "{{ verif.stdout_lines }}"
