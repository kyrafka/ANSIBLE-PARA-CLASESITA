---
# ============================================================================
# vm-web01_servicios.yml — AXIOM TECH Corporate Website & Blog
# ============================================================================
# Empresa: AXIOM TECH
# Blog corporativo con contenido sobre nuestra infraestructura real
# MySQL: vm-services01 (192.168.13.11)
# ============================================================================

- name: "Configurar AXIOM TECH Website — WordPress + Blog Corporativo"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # ===== CONFIGURACIÓN RED =====
    web_ip: "192.168.11.11"
    mysql_host: "192.168.13.11"
    mysql_db: "axiom_web"
    mysql_user: "axiom_web"
    mysql_pass: "Ax1omWeb!2024"

    # ===== DOMINIO =====
    web_domain: "axiom.tech"
    web_url: "http://{{ web_ip }}"

    # ===== CONTENIDO EMPRESA =====
    company_name: "AXIOM TECH"
    company_tagline: "Infraestructura Inteligente para América Latina"
    company_description: "AXIOM TECH es una empresa líder en soluciones de infraestructura tecnológica, especializada en redes empresariales de alta disponibilidad, monitoreo 24/7 y comunicaciones unificadas. Operamos en Lima, Arequipa y Trujillo, conectando empresas con tecnología de vanguardia."

  tasks:
    # =========================================================================
    # 1. ACTUALIZACIÓN Y DEPENDENCIAS
    # =========================================================================
    - name: "APT — Actualizar índice"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "APT — Detectar versión de PHP disponible"
      ansible.builtin.shell: |
        PHP_VERSION=""
        for version in 8.3 8.2 8.1 8.0 7.4; do
          if apt-cache show php${version}-fpm &>/dev/null; then
            PHP_VERSION="${version}"
            break
          fi
        done
        if [ -z "$PHP_VERSION" ]; then
          echo "Buscando en PPA..."
          apt-get update -qq 2>/dev/null
          for version in 8.3 8.2 8.1 8.0 7.4; do
            if apt-cache show php${version}-fpm &>/dev/null; then
              PHP_VERSION="${version}"
              break
            fi
          done
        fi
        if [ -z "$PHP_VERSION" ]; then
          echo "PHP_NONE"
        else
          echo "php${PHP_VERSION}"
        fi
      changed_when: false
      register: php_version_check

    - name: "APT — Agregar PPA de PHP si no está disponible"
      ansible.builtin.shell: |
        if ! grep -q "ondrej/php" /etc/apt/sources.list.d/*.list 2>/dev/null; then
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:ondrej/php
          apt-get update -qq
        fi
        echo "PPA_AGREGADO"
      changed_when: false
      register: php_ppa_added
      when: "'PHP_NONE' in php_version_check.stdout"

    - name: "APT — Detectar PHP disponible (después de agregar PPA)"
      ansible.builtin.shell: |
        for version in 8.3 8.2 8.1 8.0 7.4; do
          if apt-cache show php${version}-fpm &>/dev/null; then
            echo "php${version}"
            break
          fi
        done
      changed_when: false
      register: php_version_detected
      when: "'PPA_AGREGADO' in php_ppa_added.stdout"

    - name: "Set PHP version fact"
      ansible.builtin.set_fact:
        php_version: "{{ php_version_check.stdout if 'php' in php_version_check.stdout else php_version_detected.stdout }}"

    - name: "APT — Instalar dependencias PHP + MySQL client"
      ansible.builtin.shell: |
        PHP_VER="{{ php_version }}"
        PHP_PKG="${PHP_VER}-fpm ${PHP_VER}-mysql ${PHP_VER}-curl ${PHP_VER}-gd ${PHP_VER}-mbstring ${PHP_VER}-xml ${PHP_VER}-zip ${PHP_VER}-intl ${PHP_VER}-cli mysql-client nginx wget unzip"
        apt-get install -y $PHP_PKG
      changed_when: false
      register: php_installed

    - name: "APT — Instalar servidor MySQL local (fallback)"
      ansible.builtin.apt:
        name: mariadb-server
        state: present
      ignore_errors: true

    # =========================================================================
    # 2. CONFIGURAR MySQL (remoto en vm-services01)
    # =========================================================================
    - name: "MYSQL — Verificar conexión a MySQL remoto"
      ansible.builtin.shell: |
        echo "Verificando conexión a MySQL en {{ mysql_host }}..."
        if timeout 5 bash -c "cat < /dev/null > /dev/tcp/{{ mysql_host }}/3306" 2>/dev/null; then
          echo "CONEXION_OK"
        else
          echo "CONEXION_FALLO - Probando MySQL local"
        fi
      changed_when: false
      register: mysql_conn_check

    - name: "MYSQL — Crear base de datos WordPress"
      ansible.builtin.shell: |
        echo "Creando base de datos {{ mysql_db }}..."

        # Intentar en MySQL remoto primero
        mysql -h {{ mysql_host }} -u root -p'Admin123!' -e "
        CREATE DATABASE IF NOT EXISTS {{ mysql_db }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ mysql_user }}'@'%' IDENTIFIED BY '{{ mysql_pass }}';
        CREATE USER IF NOT EXISTS '{{ mysql_user }}'@'localhost' IDENTIFIED BY '{{ mysql_pass }}';
        GRANT ALL PRIVILEGES ON {{ mysql_db }}.* TO '{{ mysql_user }}'@'%';
        GRANT ALL PRIVILEGES ON {{ mysql_db }}.* TO '{{ mysql_user }}'@'localhost';
        FLUSH PRIVILEGES;
        SHOW DATABASES;
        " 2>&1 && echo "DB_REMOTA_OK" || echo "DB_REMOTA_FALLO"
      changed_when: false
      register: mysql_db_creation
      failed_when: false

    - name: "MYSQL — Crear DB local si remoto falla"
      ansible.builtin.shell: |
        echo "Configurando MySQL local como fallback..."
        systemctl enable mariadb 2>/dev/null || true
        systemctl start mariadb 2>/dev/null || true
        sleep 3

        mysql -u root -e "
        CREATE DATABASE IF NOT EXISTS {{ mysql_db }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ mysql_user }}'@'localhost' IDENTIFIED BY '{{ mysql_pass }}';
        GRANT ALL PRIVILEGES ON {{ mysql_db }}.* TO '{{ mysql_user }}'@'localhost';
        FLUSH PRIVILEGES;
        " 2>&1
        echo "DB_LOCAL_CONFIGURADA"
      changed_when: false
      register: mysql_local_setup
      when: "'DB_REMOTA_FALLO' in mysql_db_creation.stdout"

    # =========================================================================
    # 3. DESCARGAR E INSTALAR WORDPRESS
    # =========================================================================
    - name: "WP — Crear directorio web"
      ansible.builtin.file:
        path: /var/www/axiom
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: "WP — Descargar WordPress latest"
      ansible.builtin.shell: |
        cd /tmp
        if [ -d wordpress ]; then
          rm -rf wordpress
        fi
        wget -q https://wordpress.org/latest.tar.gz
        tar -xzf latest.tar.gz
        cp -r wordpress/* /var/www/axiom/
        chown -R www-data:www-data /var/www/axiom
        chmod -R 755 /var/www/axiom
        rm -rf /tmp/wordpress /tmp/latest.tar.gz
        echo "WORDPRESS_DESCARGADO"
      changed_when: false
      register: wp_download

    - name: "WP — Crear wp-config.php"
      ansible.builtin.copy:
        dest: /var/www/axiom/wp-config.php
        content: |
          <?php
          define( 'DB_NAME', '{{ mysql_db }}' );
          define( 'DB_USER', '{{ mysql_user }}' );
          define( 'DB_PASSWORD', '{{ mysql_pass }}' );
          define( 'DB_HOST', '{{ mysql_host }}' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', 'utf8mb4_unicode_ci' );

          define('AUTH_KEY',         'put your unique phrase here');
          define('SECURE_AUTH_KEY',    'put your unique phrase here');
          define('LOGGED_IN_KEY',      'put your unique phrase here');
          define('NONCE_KEY',          'put your unique phrase here');
          define('AUTH_SALT',          'put your unique phrase here');
          define('SECURE_AUTH_SALT',   'put your unique phrase here');
          define('LOGGED_IN_SALT',     'put your unique phrase here');
          define('NONCE_SALT',         'put your unique phrase here');

          $table_prefix = 'axm_';

          define( 'WP_DEBUG', false );

          if ( !defined( 'ABSPATH' ) ) {
              define( 'ABSPATH', __DIR__ . '/' );
          }

          require_once ABSPATH . 'wp-settings.php';
        owner: www-data
        group: www-data
        mode: "0644"

    - name: "WP — Generar salts de seguridad"
      ansible.builtin.shell: |
        SALTS=$(curl -s https://api.wordpress.org/secret-key/1.1/salt/)
        if [ -n "$SALTS" ]; then
          cp /var/www/axiom/wp-config.php /tmp/wp-config.tmp
          cat /tmp/wp-config.tmp | sed -e '/put your unique phrase/d' > /var/www/axiom/wp-config.php
          printf '\n%s\n' "$SALTS" >> /var/www/axiom/wp-config.php
          echo "SALTS_GENERADOS"
        else
          echo "SALTS_DEFAULT"
        fi
      changed_when: false
      register: wp_salts
      when: "'DB_REMOTA_OK' in mysql_db_creation.stdout"

    # =========================================================================
    # 4. CONFIGURAR NGINX
    # =========================================================================
    - name: "NGINX — Crear vhost para AXIOM TECH"
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/axiom
        content: |
          server {
              listen 80;
              server_name {{ web_ip }};

              root /var/www/axiom;
              index index.php index.html;

              access_log /var/log/nginx/axiom_access.log;
              error_log /var/log/nginx/axiom_error.log;

              client_max_body_size 100M;

              location / {
                  try_files $uri $uri/ /index.php?$args;
              }

              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.1-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  include fastcgi_params;
              }

              location ~ /\.ht {
                  deny all;
              }

              location = /favicon.ico {
                  log_not_found off;
                  access_log off;
              }
          }
        mode: "0644"

    - name: "NGINX — Habilitar sitio y deshabilitar default"
      ansible.builtin.shell: |
        ln -sf /etc/nginx/sites-available/axiom /etc/nginx/sites-enabled/axiom
        rm -f /etc/nginx/sites-enabled/default
        nginx -t && systemctl reload nginx
        echo "NGINX_CONFIGURADO"
      changed_when: false
      register: nginx_setup

    - name: "PHP-FPM — Iniciar servicio"
      ansible.builtin.systemd:
        name: php8.1-fpm
        state: started
        enabled: yes

    # =========================================================================
    # 5. CONFIGURAR WORDPRESS VIA WP-CLI
    # =========================================================================
    - name: "WP-CLI — Instalar WP-CLI"
      ansible.builtin.shell: |
        curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x wp-cli.phar
        mv wp-cli.phar /usr/local/bin/wp
        wp --allow-root --version
      changed_when: false
      ignore_errors: true
      register: wp_cli_install

    # =========================================================================
    # 6. INSTALAR TEMA ASTRA Y PLUGINS
    # =========================================================================
    - name: "THEME — Descargar e instalar tema Astra"
      ansible.builtin.shell: |
        cd /tmp
        wget -q https://downloads.wordpress.org/theme/astra.zip
        unzip -q astra.zip
        cp -r astra /var/www/axiom/wp-content/themes/
        chown -R www-data:www-data /var/www/axiom/wp-content/themes/astra
        rm -rf astra.zip astra
        echo "ASTRA_INSTALADO"
      changed_when: false
      register: astra_install
      ignore_errors: true

    - name: "PLUGINS — Descargar plugins esenciales"
      ansible.builtin.shell: |
        PLUGINS_DIR="/var/www/axiom/wp-content/plugins"

        # Elementor
        cd /tmp
        wget -q https://downloads.wordpress.org/plugin/elementor.latest-stable.zip
        unzip -q -o elementor.latest-stable.zip -d "$PLUGINS_DIR"
        rm elementor.latest-stable.zip
        echo "ELEMENTOR_DESCARGADO"

        # Contact Form 7
        cd /tmp
        wget -q https://downloads.wordpress.org/plugin/contact-form-7.latest-stable.zip
        unzip -q -o contact-form-7.latest-stable.zip -d "$PLUGINS_DIR"
        rm contact-form-7.latest-stable.zip
        echo "CF7_DESCARGADO"

        # Yoast SEO
        cd /tmp
        wget -q https://downloads.wordpress.org/plugin/wordpress-seo.latest-stable.zip
        unzip -q -o wordpress-seo.latest-stable.zip -d "$PLUGINS_DIR"
        rm wordpress-seo.latest-stable.zip
        echo "YOAST_DESCARGADO"

        chown -R www-data:www-data "$PLUGINS_DIR"
        echo "PLUGINS_DESCARGADOS"
      changed_when: false
      register: plugins_download
      ignore_errors: true

    # =========================================================================
    # 7. PERMISOS FINALES
    # =========================================================================
    - name: "PERMS — Ajustar permisos"
      ansible.builtin.shell: |
        chown -R www-data:www-data /var/www/axiom
        chmod -R 755 /var/www/axiom
        chmod -R 775 /var/www/axiom/wp-content
        chmod -R 775 /var/www/axiom/wp-content/themes
        chmod -R 775 /var/www/axiom/wp-content/plugins
        echo "PERMISOS_AJUSTADOS"
      changed_when: false
      register: perms_fix

    - name: "PERMS — Crear uploads directory"
      ansible.builtin.file:
        path: /var/www/axiom/wp-content/uploads
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    # =========================================================================
    # 8. CONTENIDO CORPORATIVO - LÍDERES (fotos anime)
    # =========================================================================
