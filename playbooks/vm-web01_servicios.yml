    # =========================================================================
    # 9. CREAR ARCHIVO HTML ESTÁTICO (FALLBACK SI WP NO FUNCIONA)
    # =========================================================================
    - name: "HTML — Crear página principal HTML"
      ansible.builtin.copy:
        dest: /var/www/axiom/index.html
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>AXIOM TECH — Infraestructura Inteligente para América Latina</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
                  .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 100px 20px; text-align: center; }
                  .hero h1 { font-size: 3.5em; color: #00d4ff; margin-bottom: 20px; }
                  .hero p { font-size: 1.3em; color: #aaa; max-width: 700px; margin: 0 auto 40px; }
                  .cta { display: inline-block; background: #00d4ff; color: #000; padding: 15px 40px; text-decoration: none; border-radius: 5px; font-weight: bold; }
                  .section { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
                  .section h2 { font-size: 2.5em; color: #00d4ff; margin-bottom: 40px; text-align: center; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
                  .card { background: #1a1a2e; padding: 30px; border-radius: 10px; border: 1px solid #333; }
                  .card h3 { color: #00d4ff; margin-bottom: 15px; font-size: 1.4em; }
                  .card p { color: #ccc; }
                  .leaders { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
                  .leader { background: #1a1a2e; padding: 30px; border-radius: 10px; text-align: center; width: 280px; }
                  .leader img { width: 150px; height: 150px; border-radius: 50%; margin-bottom: 15px; border: 3px solid #00d4ff; }
                  .leader h4 { color: #00d4ff; font-size: 1.2em; }
                  .leader .role { color: #888; font-size: 0.9em; margin: 5px 0; }
                  .leader .bio { color: #ccc; font-size: 0.85em; margin-top: 10px; }
                  .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 50px; margin: 40px 0; }
                  .stat { text-align: center; }
                  .stat-number { font-size: 3em; color: #00d4ff; font-weight: bold; }
                  .stat-label { color: #888; }
                  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
                  .project { background: #1a1a2e; padding: 25px; border-radius: 10px; border-left: 4px solid #00d4ff; }
                  .project h4 { color: #00d4ff; margin-bottom: 10px; }
                  .project .tech { background: #333; padding: 5px 10px; border-radius: 3px; font-size: 0.8em; color: #00d4ff; display: inline-block; margin: 5px 5px 5px 0; }
                  .project p { color: #ccc; font-size: 0.95em; }
                  .blog-list { max-width: 800px; margin: 0 auto; }
                  .blog-post { background: #1a1a2e; padding: 30px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #00d4ff; }
                  .blog-post h4 { color: #00d4ff; font-size: 1.3em; margin-bottom: 10px; }
                  .blog-post .meta { color: #666; font-size: 0.85em; margin-bottom: 15px; }
