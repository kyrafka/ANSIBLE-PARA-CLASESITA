    # =========================================================================
    # 10. VERIFICACIÓN FINAL
    # =========================================================================
    - name: "VERIFY — Estado de servicios"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "AXIOM TECH — VERIFICACIÓN FINAL"
        echo "=========================================="
        echo ""
        echo "=== ESTADO DE SERVICIOS ==="
        echo "Nginx:    $(systemctl is-active nginx 2>/dev/null || echo 'INACTIVE')"
        echo "PHP-FPM:  $(systemctl is-active php8.1-fpm 2>/dev/null || echo 'INACTIVE')"
        echo "MariaDB:  $(systemctl is-active mariadb 2>/dev/null || echo 'INACTIVE')"
        echo ""
        echo "=== PUERTOS ==="
        ss -tlnp | grep -E ":80 |:8080 " || echo "Puerto 80 no detectado"
        echo ""
        echo "=== CONECTIVIDAD ==="
        echo "MySQL {{ mysql_host }}: $(timeout 2 bash -c 'cat < /dev/null > /dev/tcp/{{ mysql_host }}/3306' 2>/dev/null && echo 'ALCANZABLE' || echo 'NO ALCANZABLE')"
        echo ""
        echo "=== ACCESO WEB ==="
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost/ || echo "FAIL"
        echo ""
        echo "=========================================="
      changed_when: false
      register: final_verif

    - name: "RESULT — Mostrar estado"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "AXIOM TECH WEB — CONFIGURACIÓN COMPLETA"
          - "=========================================="
          - "URL: http://{{ web_ip }}"
          - "DB MySQL: {{ mysql_host }}"
          - "WordPress:Instalado en /var/www/axiom"
          - "Tema: Astra"
          - "Plugins: Elementor, Contact Form 7, Yoast SEO"
          - ""
          - "CONTENIDO CORPORATIVO:"
          - "• 4 Líderes con fotos anime"
          - "• 5 Proyectos de infraestructura"
          - "• Misión, Visión y Valores"
          - "• 4 Artículos de blog técnico"
          - "• 5 Estadísticas de empresa"
          - ""
          - "{{ final_verif.stdout_lines }}"

    - name: "RESULT — URLs de acceso"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ACCESO WEB"
          - "=========================================="
          - "Sitio: http://{{ web_ip }}"
          - "Dashboard: http://{{ web_ip }}/wp-admin"
          - "Stats Nginx: http://{{ web_ip }}/nginx_status"
          - ""
          - "NOTA: Si WordPress no conecta a DB, el sitio HTML estático funciona en:"
          - "http://{{ web_ip }}/index.html"