---
# ============================================================================
# vm-web01_servicios.yml — Nginx + Balanceador (PARTE 2)
# ============================================================================
# Ejecutar DESPUES de vm-web01_network.yml
# ============================================================================

- name: "Configurar SERVICIOS vm-web01 — Nginx + Balanceador"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    web_domain: "web.AJ.local"
    backend_servers:
      - "127.0.0.1:8080"

  tasks:
    - name: "WEB — Actualizar apt"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "WEB — Instalar Nginx"
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: "WEB — Instalar HAProxy"
      ansible.builtin.apt:
        name: haproxy
        state: present

    - name: "WEB — Crear pagina de prueba"
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>vm-web01 - AJ.local</title></head>
          <body>
            <h1>vm-web01 — Servidor Web + Balanceador</h1>
            <p>Dominio: {{ web_domain }}</p>
            <p>IP: 192.168.11.11</p>
            <p>Fecha: {{ ansible_date_time.iso8601 }}</p>
          </body>
          </html>
        mode: "0644"

    - name: "WEB — Configurar Nginx en puerto 8080"
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/reverse-proxy.conf
        content: |
          server {
              listen 8080;
              server_name {{ web_domain }};

              root /var/www/html;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /health {
                  return 200 "OK\n";
                  add_header Content-Type text/plain;
              }
          }
        mode: "0644"

    - name: "WEB — Habilitar sitio Nginx"
      ansible.builtin.file:
        src: /etc/nginx/sites-available/reverse-proxy.conf
        dest: /etc/nginx/sites-enabled/reverse-proxy.conf
        state: link

    - name: "WEB — Deshabilitar sitio default de Nginx"
      ansible.builtin.file:
        dest: /etc/nginx/sites-enabled/default
        state: absent

    - name: "WEB — Configurar HAProxy balanceador"
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin
              stats timeout 30s
              user haproxy
              group haproxy
              daemon

          defaults
              log global
              mode http
              option httplog
              option dontlognull
              timeout connect 5000ms
              timeout client 50000ms
              timeout server 50000ms

          listen stats
              bind *:8404
              stats enable
              stats uri /stats
              stats refresh 30s

          frontend http_front
              bind *:80
              default_backend web_servers

          backend web_servers
              balance roundrobin
              option forwardfor
              http-check expect status 200
              {% for server in backend_servers %}
              server web{{ loop.index }} {{ server }} check inter 3s rise 2 fall 3
              {% endfor %}
        mode: "0644"
        force: yes

    - name: "WEB — Iniciar servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - nginx
        - haproxy

    - name: "WEB — Verificacion completa"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "VERIFICACION DE SERVICIOS vm-web01"
        echo "=========================================="
        echo ""
        echo "=== 1. ESTADO DE SERVICIOS ==="
        nginx_status=$(systemctl is-active nginx 2>/dev/null)
        haproxy_status=$(systemctl is-active haproxy 2>/dev/null)
        echo "Nginx:  $nginx_status"
        echo "HAProxy: $haproxy_status"
        if [ "$nginx_status" != "active" ] || [ "$haproxy_status" != "active" ]; then
          echo "ERROR: Alg servicio no esta activo"
        fi
        echo ""

        echo "=== 2. PUERTOS ESCUCHANDO ==="
        ss -tlnp | grep -E "80 |8080 |8404" || echo "No hay puertos en 80/8080/8404"
        echo ""

        echo "=== 3. TEST NGINX (localhost:8080) ==="
        nginx_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
        echo "HTTP Code: $nginx_code"
        if [ "$nginx_code" = "200" ]; then
          echo "OK: Nginx responde correctamente"
          curl -s http://localhost:8080/ | head -3
        else
          echo "FAIL: Nginx no responde"
        fi
        echo ""

        echo "=== 4. TEST NGINX HEALTH (localhost:8080/health) ==="
        health_resp=$(curl -s http://localhost:8080/health)
        echo "Response: $health_resp"
        echo ""

        echo "=== 5. TEST HAPROXY (localhost:80) ==="
        haproxy_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
        echo "HTTP Code: $haproxy_code"
        if [ "$haproxy_code" = "200" ]; then
          echo "OK: HAProxy balancea correctamente"
          curl -s http://localhost/ | head -3
        elif [ "$haproxy_code" = "503" ]; then
          echo "WARN: HAProxy devuelve 503 - backend no disponible"
          echo "Revisar configuracion de backend y health check"
        else
          echo "FAIL: HAProxy no responde correctamente"
        fi
        echo ""

        echo "=== 6. TEST HAPROXY STATS (localhost:8404/stats) ==="
        stats_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8404/stats)
        echo "HTTP Code: $stats_code"
        if [ "$stats_code" = "200" ]; then
          echo "OK: Stats accesible"
        else
          echo "FAIL: Stats no accesible"
        fi
        echo ""

        echo "=== 7. TEST DESDE OTRO HOST (si hay red) ==="
        ping -c 1 -W 1 192.168.11.1 >/dev/null 2>&1 && echo "Gateway: OK" || echo "Gateway: FAIL"
        echo ""

        echo "=========================================="
        echo "RESUMEN"
        echo "=========================================="
        if [ "$nginx_status" = "active" ] && [ "$haproxy_status" = "active" ] && [ "$nginx_code" = "200" ] && [ "$haproxy_code" = "200" ]; then
          echo "TODO OK - Web funcionando"
        else
          echo "HAY PROBLEMAS - Revisar arriba"
        fi
      changed_when: false
      register: verif

    - name: "RESULT — Mostrar verificacion"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"

    - name: "WEB — Debug HAProxy si hay errores"
      ansible.builtin.shell: |
        echo "=== CONFIG ACTUAL DE HAPROXY ==="
        cat /etc/haproxy/haproxy.cfg
        echo ""
        echo "=== LOGS RECIENTES DE HAPROXY ==="
        journalctl -u haproxy --no-pager -n 20 2>/dev/null || tail -20 /var/log/haproxy.log 2>/dev/null || echo "Sin logs disponibles"
      changed_when: false
      when: verif.stdout_lines is defined and "'OK' not in verif.stdout"
      register: debug_haproxy