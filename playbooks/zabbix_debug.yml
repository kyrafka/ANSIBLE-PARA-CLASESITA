}
with urllib.request.urlopen(req) as resp:
    result = json.loads(resp.read().decode('utf-8'))
    actions = result.get("result", [])
    print("=== ACTIONS FINALES ===")
    print("Total:", len(actions))
    for a in actions:
        print("  -", a.get("name"))
PYEOF