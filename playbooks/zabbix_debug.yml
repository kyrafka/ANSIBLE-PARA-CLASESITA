---
# ============================================================================
# zabbix_debug.yml
# Diagnostico rapido de Zabbix API
# ============================================================================

- name: "Zabbix API Debug"
  hosts: localhost
  connection: local
  become: true

  vars:
    zabbix_password: "Zabbix123"

  tasks:
    - name: "1. Login a Zabbix API"
      ansible.builtin.shell: |
        echo "=== LOGIN ==="
        python3 << 'PYEOF'
import json
import urllib.request

ZBX_URL = "http://localhost/zabbix/api_jsonrpc.php"
data = {
    "jsonrpc": "2.0",
    "method": "user.login",
    "params": {"username": "Admin", "password": "Zabbix123"},
    "id": 1
}
req = urllib.request.Request(
    ZBX_URL,
    data=json.dumps(data).encode('utf-8'),
    headers={"Content-Type": "application/json-rpc"}
)
with urllib.request.urlopen(req) as resp:
    result = json.loads(resp.read().decode('utf-8'))
    print(result)
    auth = result.get("result", "")
    with open("/tmp/zbx_token", "w") as f:
        f.write(auth)
    print("Token guardado:", auth[:20], "...")
PYEOF

    - name: "2. Contar actions existentes"
      ansible.builtin.shell: |
        python3 << 'PYEOF'
import json
import urllib.request

with open("/tmp/zbx_token") as f:
    auth = f.read().strip()

ZBX_URL = "http://localhost/zabbix/api_jsonrpc.php"
data = {
    "jsonrpc": "2.0",
    "method": "action.get",
    "params": {"filter": {"eventsource": 0}},
    "auth": auth,
    "id": 2
}
req = urllib.request.Request(
    ZBX_URL,
    data=json.dumps(data).encode('utf-8'),
    headers={"Content-Type": "application/json-rpc"}
)
with urllib.request.urlopen(req) as resp:
    result = json.loads(resp.read().decode('utf-8'))
    actions = result.get("result", [])
    print("=== ACTIONS ACTUALES ===")
    print("Total:", len(actions))
    for a in actions:
        print("  -", a.get("name"), "| status:", a.get("status"))
PYEOF

    - name: "3. Crear UNA action de prueba"
      ansible.builtin.shell: |
        python3 << 'PYEOF'
import json
import urllib.request

with open("/tmp/zbx_token") as f:
    auth = f.read().strip()

ZBX_URL = "http://localhost/zabbix/api_jsonrpc.php"
data = {
    "jsonrpc": "2.0",
    "method": "action.create",
    "params": {
        "name": "TEST: Restart Apache",
        "eventsource": 0,
        "status": 0,
        "esc_period": "2m",
        "def_shortdata": "Apache DOWN",
        "def_longdata": "Test action",
        "conditions": [],
        "operations": [
            {
                "operationtype": 1,
                "esc_period": "0",
                "esc_step_from": 1,
                "esc_step_to": 1,
                "opcommand": {
                    "command": "systemctl restart apache2",
                    "type": 0,
                    "execute_on": 1
                },
                "opcommand_hst": {"hostid": 0}
            }
        ]
    },
    "auth": auth,
    "id": 3
}
req = urllib.request.Request(
    ZBX_URL,
    data=json.dumps(data).encode('utf-8'),
    headers={"Content-Type": "application/json-rpc"}
)
with urllib.request.urlopen(req) as resp:
    result = json.loads(resp.read().decode('utf-8'))
    print("=== ACTION CREADA ===")
    print(result)
PYEOF

    - name: "4. Verificar actions finales"
      ansible.builtin.shell: |
        python3 << 'PYEOF'
