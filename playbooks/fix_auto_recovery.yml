---
- name: "FIX Auto Recovery"
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: "1. Ver script"
      shell: |
        echo "=== SCRIPT ==="
        cat /usr/local/bin/vm-poweron.sh | head -10
        echo ""
        echo "=== TEST ==="
        sudo -u zabbix /usr/local/bin/vm-poweron.sh vm-web01
      register: r1

    - debug:
        var: r1.stdout_lines

    - name: "2. Triggers nodata"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        echo "=== NODATA TRIGGERS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\"],\"search\":{\"description\":\"no responde\"}},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; [print(t['description']) for t in json.load(sys.stdin).get('result',[])]" || echo "NO HAY"
      register: r2

    - debug:
        var: r2.stdout_lines

    - name: "3. Actions"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        echo "=== ACTIONS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"]}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "import sys,json; [print('ON' if a['status']=='0' else 'OFF', a['name']) for a in json.load(sys.stdin).get('result',[])]"
      register: r3

    - debug:
        var: r3.stdout_lines

    - name: "4. Host IP"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
        echo "=== vm-web01 INTERFACES ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"hostinterface.get\",\"params\":{\"output\":[\"ip\"],\"filter\":{\"host\":[\"vm-web01\"]}},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; [print('IP:',i['ip']) for i in json.load(sys.stdin).get('result',[])]" || echo "NO HAY"
      register: r4

    - debug:
        var: r4.stdout_lines