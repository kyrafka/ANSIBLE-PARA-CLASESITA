---
- name: "FIX — Triggers nodata"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "Login"
      shell: |
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])" > /tmp/zbx_token

    - name: "1. Obtener hosts"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          > /tmp/zbx_hosts.json

    - name: "2. Limpiar y crear triggers"
      copy:
        dest: /tmp/fix_triggers2.py
        content: |
          #!/usr/bin/env python3
          import json
          import urllib.request

          API = "http://192.168.17.11/zabbix/api_jsonrpc.php"
          TOKEN = open("/tmp/zbx_token").read().strip()

          def api(method, params, tid):
              payload = {"jsonrpc":"2.0","method":method,"params":params,"auth":TOKEN,"id":tid}
              data = json.dumps(payload).encode()
              req = urllib.request.Request(API, data, {"Content-Type":"application/json-rpc"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"error": str(e)}

          with open("/tmp/zbx_hosts.json") as f:
              hosts = json.load(f)["result"]

          print(f"Hosts: {len(hosts)}")

          # Primero limpiar triggers existentes
          print("\n=== LIMPIEZA ===")
          all_triggers = api("trigger.get", {"output":["triggerid","description"]}, 10)
          for t in all_triggers.get("result", []):
              if "Agent no responde" in t["description"]:
                  print(f"  Eliminando: {t['description'][:50]}...")
                  api("trigger.delete", [t["triggerid"]], 11)

          print("\n=== CREAR TRIGGERS ===")

          for h in hosts:
              hname = h["name"]
              hid = h["hostid"]

              if hname == "Zabbix server":
                  print(f"Skip {hname} (es el server)")
                  continue

              print(f"\nProcesando: {hname} (hid={hid})")

              # Crear trigger con expression simple
              tname = f"{hname}: Agent no responde — PowerOn ESXi"
              # Usar el formato correcto: nodata(/host/key,interval)=1
              expr = f"nodata(/{hname}/agent.ping,60s)=1"

              print(f"  Expression: {expr}")

              try:
                  r = api("trigger.create", {
                      "description": tname,
                      "expression": expr,
                      "priority": "4",
                      "manual_close": "1",
                      "tags": [
                          {"tag": "scope", "value": "availability"},
                          {"tag": "auto_recovery", "value": "poweron"}
                      ]
                  }, 20)

                  if "result" in r:
                      print(f"  CREADA: {r['result']['triggerids'][0]}")
                  else:
                      print(f"  ERROR API: {r.get('error', r)}")

              except Exception as e:
                  print(f"  ERROR: {e}")

          print("\n=== FIN ===")

    - name: "2b. Ejecutar fix"
      shell: |
        python3 /tmp/fix_triggers2.py
      register: result

    - debug:
        var: result.stdout_lines

    - name: "3. Verificar triggers"
      shell: |
        TOKEN=$(cat /tmp/zbx_token)
        echo "=== TRIGGERS CREADAS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"priority\",\"state\"]},\"search\":{\"description\":\"Agent no responde\"}},\"auth\":\"$TOKEN\",\"id\":30}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('['+str(t['priority'])+']',t['description']) for t in d.get('result',[])]" || echo "NO HAY"

      register: verify

    - debug:
        var: verify.stdout_lines