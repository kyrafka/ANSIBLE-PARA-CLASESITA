---
# ============================================================================
# zabbix_diagnostic.yml — Diagnostico completo: que agarra Zabbix y que NO
# ============================================================================
# Ejecutar desde vm-monitor01:
#   ansible-playbook zabbix_diagnostic.yml -i inventario/hosts.yml
#
# Ejecutar en VM individual:
#   ansible-playbook zabbix_diagnostic.yml -i inventario/hosts.yml --limit vm-web01
# ============================================================================

- name: "DIAGNOSTIC — Zabbix: Que agarra y que NO"
  hosts: all
  connection: smart
  become: true
  gather_facts: true

  vars:
    zabbix_server: "192.168.17.11"

  tasks:
    # =========================================================================
    # 1. HOSTNAME vs INVENTORY
    # =========================================================================
    - name: "1. HOSTNAME vs INVENTORY"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "HOSTNAME CHECK"
        echo "=========================================="
        REAL_HOSTNAME=$(hostname -s)
        CONFIG_HOSTNAME=$(grep "^Hostname=" /etc/zabbix/zabbix_agentd.conf 2>/dev/null | cut -d= -f2)
        echo "Inventory name: {{ inventory_hostname }}"
        echo "System hostname: $REAL_HOSTNAME"
        echo "Agent configured: ${CONFIG_HOSTNAME:-NO CONFIG}"
        if [ "$REAL_HOSTNAME" = "$CONFIG_HOSTNAME" ]; then
          echo "STATUS: MATCH"
        else
          echo "STATUS: MISMATCH"
        fi
      changed_when: false
      register: hostname_check

    - name: "HOSTNAME RESULT"
      ansible.builtin.debug:
        msg: "{{ hostname_check.stdout_lines }}"

    # =========================================================================
    # 2. AGENTE STATUS
    # =========================================================================
    - name: "2. AGENTE STATUS"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "AGENTE ZABBIX"
        echo "=========================================="
        systemctl is-active zabbix-agent 2>/dev/null && echo "Service: ACTIVE" || echo "Service: INACTIVE"
        systemctl is-enabled zabbix-agent 2>/dev/null && echo "Enabled: YES" || echo "Enabled: NO"
        echo "Port 10050:"
        ss -tlnp 2>/dev/null | grep 10050 && echo "STATUS: LISTENING" || echo "STATUS: NOT LISTENING"
      changed_when: false
      register: agent_status

    - name: "AGENT RESULT"
      ansible.builtin.debug:
        msg: "{{ agent_status.stdout_lines }}"

    # =========================================================================
    # 3. CONECTIVIDAD A ZABBIX SERVER
    # =========================================================================
    - name: "3. CONECTIVIDAD ZABBIX SERVER"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "CONECTIVIDAD"
        echo "=========================================="
        echo "Zabbix Server: {{ zabbix_server }}"
        echo -n "Port 10051: "
        timeout 2 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10051" 2>&1 && echo "OPEN" || echo "CLOSED"
        echo -n "Port 10050: "
        timeout 2 bash -c "echo > /dev/tcp/{{ zabbix_server }}/10050" 2>&1 && echo "OPEN" || echo "CLOSED"
      changed_when: false
      register: connectivity

    - name: "CONNECTIVITY RESULT"
      ansible.builtin.debug:
        msg: "{{ connectivity.stdout_lines }}"

    # =========================================================================
    # 4. ZABBIX_GET TESTS
    # =========================================================================
    - name: "4. ZABBIX_GET TESTS"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "ZABBIX_GET TESTS"
        echo "=========================================="
        if ! command -v zabbix_get &>/dev/null; then
          echo "zabbix_get: NOT INSTALLED"
        else
          echo "zabbix_get: AVAILABLE"
          echo -n "agent.ping: "
          timeout 5 zabbix_get -s 127.0.0.1 -k agent.ping 2>/dev/null && echo " OK" || echo " FAIL"
          echo -n "system.hostname: "
          timeout 5 zabbix_get -s 127.0.0.1 -k system.hostname 2>/dev/null || echo "FAIL"
          echo -n "proc.num[dockerd]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[dockerd] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[nfsd]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[nfsd] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[nginx]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[nginx] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[mariadb]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[mariadb] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[mysql]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[mysql] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[postfix]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[postfix] 2>/dev/null || echo "FAIL (not running or wrong name)"
          echo -n "proc.num[dovecot]: "
          timeout 5 zabbix_get -s 127.0.0.1 -k proc.num[dovecot] 2>/dev/null || echo "FAIL (not running or wrong name)"
        fi
      changed_when: false
      register: zabbix_get_tests

    - name: "ZABBIX_GET RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_get_tests.stdout_lines }}"

    # =========================================================================
    # 5. PROCESOS REALES CORRIENDO
    # =========================================================================
    - name: "5. PROCESOS REALES"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "PROCESOS CORRIENDO"
        echo "=========================================="
        echo "nginx:     $(ps aux | grep -c [n]ginx 2>/dev/null || echo 0) processes"
        echo "mariadb:   $(ps aux | grep -c [m]ariadb 2>/dev/null || echo 0) processes"
        echo "mysql:     $(ps aux | grep -c [m]ysqld 2>/dev/null || echo 0) processes"
        echo "docker:    $(ps aux | grep -c [d]ockerd 2>/dev/null || echo 0) processes"
        echo "nfsd:      $(ps aux | grep -c [n]fsd 2>/dev/null || echo 0) processes"
        echo "postfix:   $(ps aux | grep -c [p]ostfix 2>/dev/null || echo 0) processes"
        echo "dovecot:   $(ps aux | grep -c [d]ovecot 2>/dev/null || echo 0) processes"
        echo "asterisk:  $(ps aux | grep -c [a]sterisk 2>/dev/null || echo 0) processes"
        echo "freepbx:   $(ps aux | grep -c [f]reepbx 2>/dev/null || echo 0) processes"
        echo "grafana:   $(ps aux | grep -c [g]rafana 2>/dev/null || echo 0) processes"
        echo "zabbix_server: $(ps aux | grep -c [z]abbix_server 2>/dev/null || echo 0) processes"
      changed_when: false
      register: real_processes

    - name: "PROCESSES RESULT"
      ansible.builtin.debug:
        msg: "{{ real_processes.stdout_lines }}"

# ============================================================================
# PLAY 2: Verificar en ZABBIX SERVER (solo localhost)
# ============================================================================
- name: "DIAGNOSTIC — Zabbix Server-side check"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"

  tasks:
    # =========================================================================
    # 6. ZABBIX UI — HOSTS y STATUS
    # =========================================================================
    - name: "6. ZABBIX UI — HOSTS STATUS"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "ZABBIX UI — HOST STATUS"
        echo "=========================================="

        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        if [ -z "$TOKEN" ]; then
          echo "ERROR: No se pudo obtener token Zabbix"
          exit 1
        fi
        echo "Token: ${TOKEN:0:15}..."

        echo ""
        echo "=== HOSTS REGISTRADOS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\",\"available\"],\"selectInterfaces\":[\"ip\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
for h in d.get('result',[]):
    ip = h.get('interfaces',[{}])[0].get('ip','N/A') if h.get('interfaces') else 'N/A'
    status = 'ENABLED' if h['status']=='0' else 'DISABLED'
    avail = 'GREEN' if h['available']=='1' else 'GRAY' if h['available']=='0' else 'UNKNOWN'
    print(f'[{avail}] {h["name"]:20} IP:{ip} - {status}')
PYEOF

        echo ""
        echo "=== PROBLEMAS ACTIVOS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":\"extend\",\"sortfield\":\"clock\",\"sortorder\":\"DESC\",\"limit\":20},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
if not d.get('result'):
    print('Sin problemas activos')
for p in d.get('result',[]):
    sev = {'0':'OK','1':'INFO','2':'WARN','3':'AVG','4':'HIGH','5':'DIS'}.get(p.get('severity','0'), p.get('severity','0'))
    name = p.get('name','?')[:60]
    host = p.get('hostname','?') or p.get('host','?')
    print(f'[{sev}] {name} - {host}')
PYEOF
      changed_when: false
      register: zabbix_ui_hosts

    - name: "ZABBIX UI RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_ui_hosts.stdout_lines }}"

    # =========================================================================
    # 7. ZABBIX — ITEMS CONFIGURADOS vs AGARRA
    # =========================================================================
    - name: "7. ZABBIX — ITEMS CON ERRORES"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "ZABBIX — ITEMS CONFIGURADOS"
        echo "=========================================="

        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        echo ""
        echo "=== ITEMS con errores (state=1) ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"item.get\",\"params\":{\"output\":[\"itemid\",\"name\",\"key_\",\"state\"],\"filter\":{\"state\":\"1\"},\"limit\":20},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
items = d.get('result',[])
if not items:
    print('Sin items con errores')
for i in items:
    print(f'ERROR: {i["name"]} (key: {i["key_"]})')
PYEOF

        echo ""
        echo "=== Ultimo agent.ping por host ==="
        for host in vm-dc01 vm-services01 vm-web01 vm-voip01 vm-storage01 vm-docker01 vm-monitor01 core1 core2; do
          VALUE=$(curl -s -X POST "{{ zabbix_api }}" \
            -H "Content-Type: application/json-rpc" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"item.get\",\"params\":{\"output\":[\"lastvalue\"],\"host\":\"$host\",\"search\":{\"key_\":\"agent.ping\"},\"limit\":1},\"auth\":\"$TOKEN\",\"id\":5}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',[{}])[0].get('lastvalue','NO DATA') if d.get('result') else 'NOT FOUND')" 2>/dev/null)
          if [ "$VALUE" != "NOT FOUND" ] && [ "$VALUE" != "NO DATA" ]; then
            echo "  OK: $host agent.ping = $VALUE"
          else
            echo "  NO DATA: $host"
          fi
        done
      changed_when: false
      register: zabbix_items

    - name: "ZABBIX ITEMS RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_items.stdout_lines }}"

    # =========================================================================
    # 8. LOG ERRORS desde Zabbix Server
    # =========================================================================
    - name: "8. ZABBIX SERVER LOG ERRORS"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "ZABBIX SERVER LOG — ULTIMOS ERRORES"
        echo "=========================================="
        if [ -f /var/log/zabbix/zabbix_server.log ]; then
          echo "Errores en ultimas 100 lineas:"
          grep -i "error\|fail\|cannot\|not found\|unavailable" /var/log/zabbix/zabbix_server.log 2>/dev/null | tail -30 | head -20
        else
          echo "Log no encontrado en /var/log/zabbix/zabbix_server.log"
        fi
      changed_when: false
      register: zabbix_errors

    - name: "ZABBIX ERRORS RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_errors.stdout_lines }}"

    # =========================================================================
    # 9. TRIGGERS CONFIGURADOS
    # =========================================================================
    - name: "9. ZABBIX — TRIGGERS CONFIGURADOS"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "ZABBIX — TRIGGERS"
        echo "=========================================="

        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        echo ""
        echo "=== Triggers de auto-recovery ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"triggerid\",\"description\",\"status\",\"state\"],\"search\":{\"description\":\"power\"},\"limit\":20},\"auth\":\"$TOKEN\",\"id\":6}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
triggers = d.get('result',[])
if not triggers:
    print('No hay triggers con power en el nombre')
for t in triggers:
    state = 'OK' if t.get('state','0')=='0' else 'UNKNOWN'
    status = 'ENABLED' if t['status']=='0' else 'DISABLED'
    print(f'[{status}] {t["description"]}')
PYEOF
      changed_when: false
      register: zabbix_triggers

    - name: "ZABBIX TRIGGERS RESULT"
      ansible.builtin.debug:
        msg: "{{ zabbix_triggers.stdout_lines }}"

    # =========================================================================
    # 10. RESUMEN FINAL
    # =========================================================================
    - name: "10. RESUMEN FINAL"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "  RESUMEN DIAGNOSTICO ZABBIX"
          - "=========================================="
          - ""
          - "PROBLEMAS CONOCIDOS:"
          - "  - core1/core2: host [ubuntu] not found"
          - "    Causa: Hostname en agent no coincide"
          - "    Fix: grep Hostname /etc/zabbix/zabbix_agentd.conf"
          - ""
          - "  - Varias VMs: interface unavailable"
          - "    Causa: Agente down o firewall"
          - "    Fix: systemctl restart zabbix-agent"
          - ""
          - "  - Items con nombres wrong:"
          - "    - proc.num[nfs-server] -> debe ser nfsd"
          - "    - proc.num[docker] -> debe ser dockerd"
          - ""
          - "QUE AGARRA BIEN:"
          - "  - agent.ping si hostname coincide"
          - "  - system.hostname"
          - "  - CPU/disk/net si agente activo"
          - ""
          - "COMANDOS UTILES:"
          - "  ansible-playbook zabbix_diagnostic.yml -i inventario/hosts.yml --limit vm-web01"
          - "  systemctl restart zabbix-agent"
          - "  tail -f /var/log/zabbix/zabbix_server.log"
          - "=========================================="