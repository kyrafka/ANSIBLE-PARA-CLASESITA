---
- name: "CHECK Zabbix Triggers y Actions"
  hosts: localhost
  connection: local
  become: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"

  tasks:
    - name: "CHECK — Triggers y Actions"
      shell: |
        echo "=== LOGIN ==="
        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")
        echo "Token: ${TOKEN:0:15}..."

        echo ""
        echo "=== ACTIONS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"actionid\",\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"]}},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
for a in d.get('result',[]):
    s='ON' if a['status']=='0' else 'OFF'
    print(f"  [{s}] {a['name']}")
PYEOF

        echo ""
        echo "=== TRIGGERS (primeras 10) ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"triggerid\",\"description\",\"priority\",\"state\"],\"limit\":10},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 << 'PYEOF'
import sys,json
d=json.load(sys.stdin)
for t in d.get('result',[]):
    print(f"  [{t['priority']}] {t['description'][:70]}")
PYEOF
      register: result

    - debug:
        msg: "{{ result.stdout_lines }}"