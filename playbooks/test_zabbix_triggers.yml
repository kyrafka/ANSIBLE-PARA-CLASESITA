---
- name: "CHECK Zabbix"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "Get Token"
      shell: |
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          > /tmp/zabbix_login.json
        TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/zabbix_login.json'))['result'])")
        echo "Token: $TOKEN"
        echo "$TOKEN" > /tmp/zabbix_token

    - name: "Show All"
      shell: |
        TOKEN=$(cat /tmp/zabbix_token)

        echo "=== HOSTS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"name\",\"available\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(h['available'],h['name']) for h in d.get('result',[])]"

        echo ""
        echo "=== ACTIONS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"]}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('ON' if a['status']=='0' else 'OFF', a['name']) for a in d.get('result',[])]"

        echo ""
        echo "=== TRIGGERS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"priority\"],\"limit\":40},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['priority'],t['description'][:55]) for t in d.get('result',[])]"

        echo ""
        echo "=== PROBLEMS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":[\"name\",\"severity\"],\"limit\":20},\"auth\":\"$TOKEN\",\"id\":5}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(p['severity'],p['name'][:50]) for p in d.get('result',[])]"