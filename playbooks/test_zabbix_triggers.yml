---
# ============================================================================
# test_zabbix_triggers.yml — Verificar triggers y actions de Zabbix
# ============================================================================

- name: "CHECK Zabbix Triggers y Actions"
  hosts: localhost
  connection: local
  become: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    zabbix_user: "Admin"
    zabbix_pass: "zabbix"

  tasks:
    - name: "CHECK — Triggers y Actions"
      ansible.builtin.shell: |
        echo "============================================"
        echo "CHECK: Triggers y Actions Zabbix"
        echo "============================================"
        echo ""

        # Login
        TOKEN=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"{{ zabbix_user }}","password":"{{ zabbix_pass }}"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))")

        if [ -z "$TOKEN" ]; then
          echo "ERROR: No se pudo hacer login"
          exit 1
        fi
        echo "Token: ${TOKEN:0:15}..."
        echo ""

        # Triggers relacionadas con PowerOn/AutoRecovery
        echo "=== TRIGGERS DE AUTO-RECOVERY ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"triggerid\",\"description\",\"priority\",\"state\"],\"search\":{\"description\":\"PowerOn\"},\"limit\":20},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "
import sys,json
d=json.load(sys.stdin)
triggers = d.get('result',[])
if not triggers:
    print('  No hay triggers con PowerOn')
for t in triggers:
    print(f'  [{t[\"priority\"]}] {t[\"description\"]}')
"

        echo ""

        # Triggers de Agent Down (nodata)
        echo "=== TRIGGERS DE AGENT DOWN (nodata) ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"triggerid\",\"description\",\"priority\",\"state\",\"expression\"]},\"search\":{\"description\":\"Agent no responde\"},\"limit\":20},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "
import sys,json
d=json.load(sys.stdin)
triggers = d.get('result',[])
print(f'  Total: {len(triggers)} triggers')
for t in triggers[:10]:
    print(f'  [{t[\"priority\"]}] {t[\"description\"]}')
    print(f'    Expression: {t.get(\"expression\",\"\")[:60]}...')
"

        echo ""

        # Actions
        echo "=== ACTIONS ==="
        curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"actionid\",\"name\",\"status\",\"eventsource\"],\"selectOperations\":\"extend\",\"selectRecoveryOperations\":\"extend\"},\"filter\":{\"eventsource\":[\"0\"]},\"limit\":20},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "
import sys,json
d=json.load(sys.stdin)
actions = d.get('result',[])
print(f'  Total: {len(actions)} actions')
for a in actions:
    status = 'ON' if a['status']=='0' else 'OFF'
    ops = a.get('operations',[])
    print(f'  [{status}] {a[\"name\"]}')
    print(f'    Operations: {len(ops)}')
    for op in ops[:2]:
        if op.get('opcommand'):
            print(f'      - Command: {op[\"opcommand\"].get(\"scriptid\",\"?\")}')
"
        echo ""
        echo "============================================"
      changed_when: false
      register: check_result

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ check_result.stdout_lines }}"