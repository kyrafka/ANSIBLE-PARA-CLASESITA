---
- name: "CHECK Zabbix"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "Show all"
      shell: |
        set -e
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")

        echo "=========================================="
        echo "HOSTS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('ID:',h['hostid'],'Name:',h['name']) for h in d.get('result',[])]"

        echo ""
        echo "=========================================="
        echo "ACTIONS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"]}},\"auth\":\"$TOKEN\",\"id\":3}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('ON' if a['status']=='0' else 'OFF', a['name']) for a in d.get('result',[])]"

        echo ""
        echo "=========================================="
        echo "TRIGGERS con 'no responde' (nodata)"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"priority\",\"state\"],\"search\":{\"description\":\"no responde\"}},\"auth\":\"$TOKEN\",\"id\":4}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['priority'],t['description'][:55]) for t in d.get('result',[])]" || echo "NO HAY TRIGGERS"

        echo ""
        echo "=========================================="
        echo "ALL TRIGGERS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"priority\"],\"limit\":50},\"auth\":\"$TOKEN\",\"id\":5}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(t['priority'],t['description'][:55]) for t in d.get('result',[])]"

        echo ""
        echo "=========================================="
        echo "PROBLEMS"
        echo "=========================================="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":[\"name\",\"severity\"],\"limit\":20},\"auth\":\"$TOKEN\",\"id\":6}" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(p['severity'],p['name'][:50]) for p in d.get('result',[])]" || echo "SIN PROBLEMAS"

      changed_when: false
      register: zabbix_info

    - debug:
        var: zabbix_info.stdout_lines