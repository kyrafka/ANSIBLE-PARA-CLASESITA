---
- name: "CHECK Zabbix"
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: "Login y obtener token"
      shell: |
        TOKEN=$(curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}' \
          | grep -o '"result":"[^"]*"' | cut -d'"' -f4)
        echo "TOKEN=$TOKEN"
        echo "$TOKEN" > /tmp/zabbix_token.txt
      register: login

    - debug:
        msg: "{{ login.stdout }}"

    - name: "Hosts"
      shell: |
        TOKEN=$(cat /tmp/zabbix_token.txt)
        echo "=== HOSTS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"host.get\",\"params\":{\"output\":[\"hostid\",\"name\",\"status\",\"available\"]},\"auth\":\"$TOKEN\",\"id\":2}" \
          > /tmp/zabbix_hosts.json
        python3 -c "
import json
with open('/tmp/zabbix_hosts.json') as f:
    d = json.load(f)
for h in d.get('result',[]):
    print(h['available'], h['name'])
"

    - name: "Actions"
      shell: |
        TOKEN=$(cat /tmp/zabbix_token.txt)
        echo "=== ACTIONS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"name\",\"status\"],\"filter\":{\"eventsource\":[\"0\"]}},\"auth\":\"$TOKEN\",\"id\":3}" \
          > /tmp/zabbix_actions.json
        python3 -c "
import json
with open('/tmp/zabbix_actions.json') as f:
    d = json.load(f)
for a in d.get('result',[]):
    s = 'ON' if a['status']=='0' else 'OFF'
    print('[' + s + ']', a['name'])
"

    - name: "Triggers"
      shell: |
        TOKEN=$(cat /tmp/zabbix_token.txt)
        echo "=== TRIGGERS (todas) ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"trigger.get\",\"params\":{\"output\":[\"description\",\"expression\",\"priority\"],\"limit\":30},\"auth\":\"$TOKEN\",\"id\":4}" \
          > /tmp/zabbix_triggers.json
        python3 -c "
import json
with open('/tmp/zabbix_triggers.json') as f:
    d = json.load(f)
for t in d.get('result',[]):
    print('[' + str(t['priority']) + ']', t['description'][:60])
"

    - name: "Problemas activos"
      shell: |
        TOKEN=$(cat /tmp/zabbix_token.txt)
        echo "=== PROBLEMAS ACTIVOS ==="
        curl -s -X POST http://192.168.17.11/zabbix/api_jsonrpc.php \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"problem.get\",\"params\":{\"output\":[\"name\",\"severity\",\"hostname\"],\"limit\":20},\"auth\":\"$TOKEN\",\"id\":5}" \
          > /tmp/zabbix_problems.json
        python3 -c "
import json
with open('/tmp/zabbix_problems.json') as f:
    d = json.load(f)
for p in d.get('result',[]):
    name = p.get('name', '?')[:50]
    sev = p.get('severity', '?')
    host = p.get('hostname', p.get('host', '?'))
    print('[' + str(sev) + ']', name, '-', host)
"