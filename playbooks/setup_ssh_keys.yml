---
# ============================================================================
# setup_ssh_keys.yml — Distribuye clave SSH de vm-monitor01 a todas las VMs
# ============================================================================
# Uso: sudo ansible-playbook playbooks/setup_ssh_keys.yml -i inventario/hosts.yml
# ============================================================================

- name: "SSH KEYS — Generar clave en vm-monitor01"
  hosts: vm-monitor01
  become: true
  gather_facts: false

  tasks:
    - name: "Generar clave SSH para root si no existe"
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ""
        creates: /root/.ssh/id_ed25519

    - name: "Generar clave SSH para zabbix si no existe"
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /var/lib/zabbix/.ssh/id_ed25519 -N ""
        creates: /var/lib/zabbix/.ssh/id_ed25519
      become_user: zabbix
      ignore_errors: true

    - name: "Leer clave publica root"
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: root_pubkey

    - name: "Leer clave publica zabbix (si existe)"
      ansible.builtin.slurp:
        src: /var/lib/zabbix/.ssh/id_ed25519.pub
      register: zabbix_pubkey
      ignore_errors: true

    - name: "Guardar claves como facts"
      ansible.builtin.set_fact:
        root_pub: "{{ root_pubkey.content | b64decode | trim }}"
        zabbix_pub: "{{ zabbix_pubkey.content | b64decode | trim if not zabbix_pubkey.failed else '' }}"

    - name: "Mostrar clave publica root"
      ansible.builtin.debug:
        msg: "root pubkey: {{ root_pub[:60] }}..."


- name: "SSH KEYS — Distribuir clave a todas las VMs"
  hosts: lima_servers
  become: true
  gather_facts: false

  vars:
    monitor_host: vm-monitor01

  tasks:
    - name: "Asegurar directorio .ssh existe"
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"
        owner: root

    - name: "Autorizar clave root de vm-monitor01"
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ hostvars[monitor_host]['root_pub'] }}"

    - name: "Autorizar clave root en sysadmin tambien"
      ansible.posix.authorized_key:
        user: sysadmin
        state: present
        key: "{{ hostvars[monitor_host]['root_pub'] }}"
      ignore_errors: true

    - name: "Autorizar clave zabbix (si existe)"
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ hostvars[monitor_host]['zabbix_pub'] }}"
      when: hostvars[monitor_host]['zabbix_pub'] != ''
      ignore_errors: true

    - name: "Test SSH desde vm-monitor01"
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes
          root@{{ ansible_host }} "echo SSH_OK_$(hostname)"
      delegate_to: "{{ monitor_host }}"
      register: ssh_test
      failed_when: false
      changed_when: false

    - name: "Resultado SSH"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ssh_test.stdout if ssh_test.rc == 0 else 'FALLO — ' + ssh_test.stderr }}"
