---
# ============================================================================
# setup_ssh_keys.yml — Distribuye clave SSH de vm-monitor01 a todas las VMs
# ============================================================================
# Uso: sudo ansible-playbook playbooks/setup_ssh_keys.yml -i inventario/hosts.yml
# ============================================================================

- name: "SSH KEYS — Generar clave en vm-monitor01"
  hosts: vm-monitor01
  become: true
  gather_facts: false

  tasks:
    - name: "Generar clave SSH para root si no existe"
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ""
        creates: /root/.ssh/id_ed25519

    - name: "Leer clave publica root"
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: root_pubkey

    - name: "Guardar clave como fact"
      ansible.builtin.set_fact:
        root_pub: "{{ root_pubkey.content | b64decode | trim }}"

    - name: "Mostrar clave publica root"
      ansible.builtin.debug:
        msg: "root pubkey: {{ root_pub[:60] }}..."


- name: "SSH KEYS — Distribuir clave a todas las VMs"
  hosts: lima_servers
  become: true
  gather_facts: false

  vars:
    monitor_host: vm-monitor01

  tasks:
    - name: "Asegurar directorio .ssh existe"
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        mode: "0700"
        owner: ubuntu

    - name: "Autorizar clave de vm-monitor01 en ubuntu"
      ansible.posix.authorized_key:
        user: ubuntu
        state: present
        key: "{{ hostvars[monitor_host]['root_pub'] }}"

    - name: "Test SSH desde vm-monitor01 como ubuntu"
      ansible.builtin.command:
        cmd: >
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes
          ubuntu@{{ ansible_host }} "echo SSH_OK_$(hostname)"
      delegate_to: "{{ monitor_host }}"
      register: ssh_test
      failed_when: false
      changed_when: false

    - name: "Resultado SSH"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ssh_test.stdout if ssh_test.rc == 0 else 'FALLO — ' + ssh_test.stderr }}"
