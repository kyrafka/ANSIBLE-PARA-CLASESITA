---
# ============================================================================
# vm-voip01_servicios.yml — VitalPBX VoIP (Asterisk + GUI)
# ============================================================================
# IP: 192.168.15.11 (VLAN 50)
# GUI: https://192.168.15.11
# ============================================================================

- name: "Configurar SERVICIOS vm-voip01 — VitalPBX VoIP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    voip_domain: "voip.AJ.local"
    admin_password: "Admin123"

  tasks:
    - name: "VOIP — Actualizar apt"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "VOIP — Detener NetworkManager y servicios innecesarios"
      ansible.builtin.shell: |
        systemctl stop NetworkManager 2>/dev/null || true
        systemctl disable NetworkManager 2>/dev/null || true
        systemctl stop systemd-resolved 2>/dev/null || true
        echo "Servicios de red detenidos para configuración manual"

    - name: "VOIP — Detectar versión de PHP"
      ansible.builtin.shell: |
        if [ -f /etc/php/8.3/apache2/php.ini ]; then
          echo "8.3"
        elif [ -f /etc/php/8.2/apache2/php.ini ]; then
          echo "8.2"
        elif [ -f /etc/php/8.1/apache2/php.ini ]; then
          echo "8.1"
        else
          ls /etc/php/ 2>/dev/null || echo "none"
        fi
      changed_when: false
      register: php_version

    - name: "VOIP — Instalar dependencias"
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
          - curl
          - apache2
          - php
          - php-mysql
          - php-gd
          - php-mbstring
          - php-xml
          - php-bcmath
          - php-curl
          - libapache2-mod-php
          - mariadb-server
          - fail2ban
          - htop
          - net-tools
          - iputils-ping
          - socat
          - ssl-cert
        state: present

    - name: "VOIP — Instalar Asterisk"
      ansible.builtin.apt:
        name: asterisk
        state: present
        update_cache: yes

    - name: "VOIP — Iniciar MariaDB"
      ansible.builtin.shell: |
        systemctl enable mariadb
        systemctl start mariadb
        sleep 2
        echo "MariaDB iniciado"

    - name: "VOIP — Configurar hostname y DNS"
      ansible.builtin.shell: |
        hostnamectl set-hostname vm-voip01 --static
        echo "vm-voip01" > /etc/hostname
        
        if ! grep -q "192.168.15.11.*voip.AJ.local" /etc/hosts; then
          echo "192.168.15.11 voip.AJ.local vm-voip01" >> /etc/hosts
        fi
        
        echo "Hostname configurado"
        hostname

    - name: "VOIP — Configurar PHP (detectado {{ php_version.stdout }})"
      ansible.builtin.shell: |
        PHPINI="/etc/php/{{ php_version.stdout }}/apache2/php.ini"
        
        if [ -f "$PHPINI" ]; then
          sed -i 's/;date.timezone =/date.timezone = "America\/Lima"/' "$PHPINI"
          sed -i 's/max_execution_time = 30/max_execution_time = 300/' "$PHPINI"
          sed -i 's/memory_limit = -1/memory_limit = 256M/' "$PHPINI"
          sed -i 's/upload_max_filesize = 2M/upload_max_filesize = 64M/' "$PHPINI"
          echo "PHP configurado en $PHPINI"
        else
          echo "WARNING: $PHPINI no existe"
        fi

    - name: "VOIP — Configurar Apache para VitalPBX"
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/vitalpbx.conf
        content: |
          <VirtualHost *:80>
              ServerName voip.AJ.local
              Redirect permanent / https://voip.AJ.local/
          </VirtualHost>

          <VirtualHost *:443>
              ServerName voip.AJ.local
              DocumentRoot /var/www/html/vitalpbx

              <Directory /var/www/html/vitalpbx>
                  Options -Indexes +FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>

              SSLEngine on
              SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
              SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
          </VirtualHost>
        force: yes
        mode: "0644"

    - name: "VOIP — Habilitar Apache VitalPBX"
      ansible.builtin.shell: |
        a2enmod php{{ php_version.stdout }} rewrite ssl headers 2>/dev/null || true
        a2dissite 000-default.conf 2>/dev/null || true
        a2ensite vitalpbx.conf 2>/dev/null || true
        
        if [ ! -f /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then
          apt-get install -y ssl-cert
        fi
        
        systemctl restart apache2
        echo "Apache configurado y reiniciado"

    - name: "VOIP — Configurar fail2ban para SIP"
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5
          
          [sshd]
          enabled = true
          port = 22
          filter = sshd
          logpath = /var/log/auth.log
          
          [asterisk]
          enabled = true
          port = 5060,5061
          filter = asterisk
          logpath = /var/log/asterisk/full
          maxretry = 10
          bantime = 7200
        force: yes

    - name: "VOIP — Configurar firewall UFW"
      ansible.builtin.shell: |
        systemctl enable ufw 2>/dev/null || true
        ufw --force enable
        
        ufw allow 22/tcp comment 'SSH'
        ufw allow 80/tcp comment 'HTTP'
        ufw allow 443/tcp comment 'HTTPS'
        ufw allow 5060/tcp comment 'SIP'
        ufw allow 5060/udp comment 'SIP UDP'
        ufw allow 5061/tcp comment 'SIP TLS'
        ufw allow 10000:20000/udp comment 'RTP Audio'
        
        ufw reload
        ufw status numbered
        echo "Firewall configurado"

    - name: "VOIP — Configurar Asterisk"
      ansible.builtin.shell: |
        mkdir -p /etc/asterisk
        chown -R asterisk:asterisk /etc/asterisk

    - name: "VOIP — Configurar sip.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/sip.conf
        content: |
          [general]
          context=from-external
          bindport=5060
          bindaddr=0.0.0.0
          srvlookup=yes
          qualify=yes
          nat=no
          directrtpsetup=yes
          disallow=all
          allow=ulaw
          allow=alaw
          allow=g729
          alwaysauthreject=yes
          canreinvite=no
          pedantic=no
          
          [100]
          type=friend
          host=dynamic
          secret=100secret
          context=from-internal
          callerid="Extension 100" <100>
          
          [101]
          type=friend
          host=dynamic
          secret=101secret
          context=from-internal
          callerid="Extension 101" <101>
          
          [102]
          type=friend
          host=dynamic
          secret=102secret
          context=from-internal
          callerid="Extension 102" <102>
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Configurar extensions.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/extensions.conf
        content: |
          [from-external]
          exten => 100,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()

          [from-internal]
          include => from-external
          exten => 100,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
          exten => 101,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
          exten => 102,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Configurar modules.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/modules.conf
        content: |
          [modules]
          autoload=yes
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Configurar manager.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/manager.conf
        content: |
          [admin]
          secret = admin123
          read = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
          write = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Iniciar Asterisk"
      ansible.builtin.shell: |
        systemctl enable asterisk
        systemctl restart asterisk
        
        sleep 5
        
        echo "=== Asterisk Status ==="
        asterisk -rx "core show version" 2>/dev/null || echo "Asterisk CLI no responde"
        
        systemctl status asterisk --no-pager || true

    - name: "VOIP — Crear página web de acceso"
      ansible.builtin.shell: |
        mkdir -p /var/www/html/vitalpbx/admin
        chown -R www-data:www-data /var/www/html/vitalpbx

    - name: "VOIP — Index HTML"
      ansible.builtin.copy:
        dest: /var/www/html/vitalpbx/index.html
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>VitalPBX - VoIP</title>
              <style>
                  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                  .container { text-align: center; background: #16213e; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
                  h1 { color: #e94560; font-size: 2.5em; }
                  .info { margin: 20px 0; font-size: 1.2em; }
                  .btn { display: inline-block; padding: 15px 40px; background: #e94560; color: #fff; text-decoration: none; border-radius: 5px; font-size: 1.2em; margin: 10px; }
                  .btn:hover { background: #c7304a; }
                  .credentials { background: #0f3460; padding: 15px; border-radius: 5px; margin-top: 20px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>VoIP</h1>
                  <p class="info">Central VoIP - vm-voip01</p>
                  <p class="info">Dominio: voip.AJ.local</p>
                  <div class="credentials">
                      <p><strong>Extensiones SIP:</strong></p>
                      <p>100 / 100secret</p>
                      <p>101 / 101secret</p>
                      <p>102 / 102secret</p>
                  </div>
              </div>
          </body>
          </html>
        force: yes
        mode: "0644"
        owner: www-data
        group: www-data

    - name: "VOIP — Admin redirect"
      ansible.builtin.copy:
        dest: /var/www/html/vitalpbx/admin/index.php
        content: |
          <?php
          header('Location: /');
          exit;
        force: yes
        mode: "0644"
        owner: www-data
        group: www-data

    - name: "VOIP — Recargar Asterisk"
      ansible.builtin.shell: |
        asterisk -rx "core reload" 2>/dev/null || true
        echo "Asterisk recargado"

    - name: "VOIP — Verificacion"
      ansible.builtin.shell: |
        echo "=== SERVICIOS ==="
        systemctl is-active asterisk && echo "Asterisk: OK" || echo "Asterisk: FAIL"
        systemctl is-active apache2 && echo "Apache: OK" || echo "Apache: FAIL"
        systemctl is-active mariadb && echo "MariaDB: OK" || echo "MariaDB: FAIL"
        systemctl is-active fail2ban && echo "Fail2ban: OK" || echo "Fail2ban: FAIL"
        systemctl is-active ufw && echo "UFW: OK" || echo "UFW: FAIL"
        echo ""
        echo "=== PUERTOS ==="
        ss -tlnp | grep -E '80|:443|5060|10000'
        echo ""
        echo "=== ACCESOS ==="
        echo "Web GUI: https://192.168.15.11/"
        echo "Asterisk CLI: sudo asterisk -r"
        echo ""
        echo "=== EXTENSIONES SIP ==="
        echo "  100 (secret: 100secret)"
        echo "  101 (secret: 101secret)"
        echo "  102 (secret: 102secret)"
      changed_when: false
      register: verif

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"