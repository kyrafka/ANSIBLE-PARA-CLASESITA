---
# ============================================================================
# vm-voip01_servicios.yml — Asterisk VoIP + GUI
# ============================================================================
# IP: 192.168.15.11 (VLAN 50)
# Extensiones: 100, 101, 102 (secret: 100secret, 101secret, 102secret)
# ============================================================================

- name: "Configurar SERVICIOS vm-voip01 — Asterisk VoIP"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    voip_domain: "voip.AJ.local"
    admin_password: "Admin123"

  tasks:
    - name: "VOIP — Verificar espacio en disco"
      ansible.builtin.shell: |
        DF=$(df -h / | tail -1 | awk '{print $5}' | sed 's/%//')
        echo "Disco usado: ${DF}%"
        if [ "$DF" -gt 90 ]; then
          echo "WARNING: Disco casi lleno, intentando expandir..."
        else
          echo "Espacio OK"
        fi
      changed_when: false
      register: disk_check

    - name: "VOIP — Expandir filesystem LVM"
      ansible.builtin.shell: |
        set -e
        echo "=== Antes ==="
        df -h / | tail -1
        
        # Intentar growpart
        sudo growpart /dev/sda 3 2>/dev/null || echo "growpart no necesario"
        
        # Extender PV
        sudo pvresize /dev/sda3 2>/dev/null || echo "pvresize no necesario"
        
        # Ver espacio libre en VG
        VFREE=$(sudo vgs --noheadings -o v_free --units g ubuntu-vg 2>/dev/null | tr -d ' g\n' || echo 0)
        echo "VG espacio libre: ${VFREE}"
        
        if [ ! -z "$VFREE" ] && [ "$VFREE" != "0" ]; then
          echo "Expandiendo LV..."
          sudo lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv 2>/dev/null || echo "lvextend falló"
          sudo resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv 2>/dev/null || echo "resize2fs falló"
          echo "LV expandido"
        else
          echo "LV ya está expandido o no hay espacio libre"
        fi
        
        echo "=== Despues ==="
        df -h / | tail -1
      changed_when: false
      register: disk_expand

    - name: "VOIP — Limpiar dpkg e instalar dependencias"
      ansible.builtin.shell: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        export APT_LISTCHANGES_FRONTEND=none
        
        # Responder preguntas de conffile de asterisk ANTES de instalar
        echo "asterisk-config asterisk-config/replace_files boolean true" | debconf-set-selections
        echo "asterisk asterisk/replace_files boolean true" | debconf-set-selections
        
        dpkg --configure -a 2>/dev/null || true
        
        for pkg in asterisk asterisk-config asteriskk asterisk-modules; do
          dpkg --remove --force-remove-reinstreq $pkg 2>/dev/null || true
        done
        
        apt-get clean
        apt-get autoremove -y 2>/dev/null || true
        
        echo "dpkg limpio"
        
        # Instalar asterisk-config
        DEBIAN_FRONTEND=noninteractive apt-get install -y asterisk-config
        echo "asterisk-config instalado"
        
        # Instalar asterisk
        DEBIAN_FRONTEND=noninteractive apt-get install -y asterisk
        echo "asterisk instalado"
        
        # Arreglar dependencias rotas
        DEBIAN_FRONTEND=noninteractive apt-get install -f -y
        
        # Instalar resto
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          wget gnupg curl apache2 php php-mysql php-gd php-mbstring \
          php-xml php-bcmath php-curl libapache2-mod-php \
          fail2ban htop net-tools iputils-ping socat \
          ssl-cert
        
        echo "Dependencias instaladas"

    - name: "VOIP — Verificar Asterisk instalado"
      ansible.builtin.shell: |
        set -e
        echo "=== Verificando Asterisk ==="
        which asterisk && echo "asterisk bin: OK" || { echo "ERROR: asterisk no encontrado"; exit 1; }
        /usr/sbin/asterisk -V 2>&1 || /usr/sbin/asterisk -v 2>&1 || { echo "ERROR: asterisk no corre"; exit 1; }
        echo "Asterisk instalado OK"
      changed_when: false
      register: verif_asterisk

    - name: "VOIP — Crear usuario asterisk"
      ansible.builtin.group:
        name: asterisk
        state: present
      failed_when: false

    - name: "VOIP — Crear usuario asterisk"
      ansible.builtin.user:
        name: asterisk
        group: asterisk
        system: yes
        shell: /usr/sbin/nologin
        home: /var/lib/asterisk
        create_home: no
      failed_when: false

    - name: "VOIP — Iniciar MariaDB (opcional)"
      ansible.builtin.shell: |
        systemctl enable mariadb 2>/dev/null || true
        systemctl restart mariadb 2>/dev/null || true
        sleep 2
        echo "MariaDB (opcional) iniciado"

    - name: "VOIP — Configurar hostname y DNS"
      ansible.builtin.shell: |
        hostnamectl set-hostname vm-voip01 --static
        echo "vm-voip01" > /etc/hostname
        if ! grep -q "192.168.15.11.*voip.AJ.local" /etc/hosts; then
          echo "192.168.15.11 voip.AJ.local vm-voip01" >> /etc/hosts
        fi
        echo "Hostname: $(hostname)"

    - name: "VOIP — Configurar PHP"
      ansible.builtin.shell: |
        PHPINI="/etc/php/8.3/apache2/php.ini"
        if [ -f "$PHPINI" ]; then
          sed -i 's/;date.timezone =/date.timezone = "America\/Lima"/' "$PHPINI"
          sed -i 's/max_execution_time = 30/max_execution_time = 300/' "$PHPINI"
          sed -i 's/memory_limit = -1/memory_limit = 256M/' "$PHPINI"
          sed -i 's/upload_max_filesize = 2M/upload_max_filesize = 64M/' "$PHPINI"
          echo "PHP configurado"
        else
          echo "WARNING: PHP ini no encontrado"
        fi

    - name: "VOIP — Configurar Apache"
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/vitalpbx.conf
        content: |
          <VirtualHost *:80>
              ServerName voip.AJ.local
              DocumentRoot /var/www/html/vitalpbx
              <Directory /var/www/html/vitalpbx>
                  Options -Indexes +FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
        force: yes
        mode: "0644"

    - name: "VOIP — Habilitar Apache"
      ansible.builtin.shell: |
        a2enmod php8.3 rewrite ssl headers 2>/dev/null || true
        a2dissite 000-default.conf 2>/dev/null || true
        a2ensite vitalpbx.conf 2>/dev/null || true
        if [ ! -f /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then
          apt-get install -y ssl-cert
        fi
        systemctl restart apache2
        systemctl status apache2 --no-pager | head -5
        echo "Apache OK"

    - name: "VOIP — Configurar fail2ban"
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5
          
          [sshd]
          enabled = true
          port = 22
          filter = sshd
          logpath = /var/log/auth.log
          
          [asterisk]
          enabled = true
          port = 5060,5061
          filter = asterisk
          logpath = /var/log/asterisk/full
          maxretry = 10
          bantime = 7200
        force: yes

    - name: "VOIP — Iniciar fail2ban"
      ansible.builtin.service:
        name: fail2ban
        enabled: yes
        state: started

    - name: "VOIP — Desactivar UFW (pfSense maneja el firewall)"
      ansible.builtin.shell: |
        systemctl stop ufw 2>/dev/null || true
        systemctl disable ufw 2>/dev/null || true
        ufw disable 2>/dev/null || true
        echo "UFW desactivado - pfSense maneja el firewall"

    - name: "VOIP — Crear directorios Asterisk"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: asterisk
        group: asterisk
        mode: "0755"
      loop:
        - /etc/asterisk
        - /var/lib/asterisk
        - /var/log/asterisk
        - /var/spool/asterisk

    - name: "VOIP — Configurar sip.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/sip.conf
        content: |
          [general]
          context=from-external
          bindport=5060
          bindaddr=0.0.0.0
          srvlookup=yes
          qualify=yes
          nat=no
          directrtpsetup=yes
          disallow=all
          allow=ulaw
          allow=alaw
          alwaysauthreject=yes
          canreinvite=no

          [100]
          type=friend
          host=dynamic
          secret=100secret
          context=from-internal
          callerid="Extension 100" <100>

          [101]
          type=friend
          host=dynamic
          secret=101secret
          context=from-internal
          callerid="Extension 101" <101>

          [102]
          type=friend
          host=dynamic
          secret=102secret
          context=from-internal
          callerid="Extension 102" <102>
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Configurar extensions.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/extensions.conf
        content: |
          [from-internal]
          exten => 100,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
          exten => 101,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
          exten => 102,1,Answer()
          same => n,Wait(1)
          same => n,Playback(hello-world)
          same => n,Hangup()
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Configurar manager.conf"
      ansible.builtin.copy:
        dest: /etc/asterisk/manager.conf
        content: |
          [admin]
          secret = admin123
          read = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
          write = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
        force: yes
        mode: "0644"
        owner: asterisk
        group: asterisk

    - name: "VOIP — Iniciar Asterisk"
      ansible.builtin.shell: |
        systemctl enable asterisk
        systemctl restart asterisk
        sleep 5
        echo "=== Asterisk status ==="
        systemctl status asterisk --no-pager | head -10
        echo "=== Asterisk version ==="
        asterisk -rx "core show version" 2>/dev/null || echo "CLI no responde"
        echo "Asterisk iniciado"

    - name: "VOIP — Recargar Asterisk"
      ansible.builtin.shell: |
        asterisk -rx "sip reload" 2>/dev/null || true
        asterisk -rx "dialplan reload" 2>/dev/null || true
        sleep 2
        echo "Asterisk recargado"

    - name: "VOIP — Crear pagina web"
      ansible.builtin.copy:
        dest: /var/www/html/vitalpbx/index.html
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>VoIP - vm-voip01</title>
              <style>
                  body { font-family: Arial; background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                  .container { text-align: center; background: #16213e; padding: 40px; border-radius: 10px; }
                  h1 { color: #e94560; }
                  .cred { background: #0f3460; padding: 15px; border-radius: 5px; margin-top: 20px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ASTERISK VoIP</h1>
                  <p>vm-voip01 - VLAN 50</p>
                  <div class="cred">
                      <p><strong>Extensiones SIP:</strong></p>
                      <p>100 / 100secret</p>
                      <p>101 / 101secret</p>
                      <p>102 / 102secret</p>
                  </div>
              </div>
          </body>
          </html>
        force: yes
        mode: "0644"
        owner: www-data
        group: www-data

    - name: "VOIP — Verificacion final"
      ansible.builtin.shell: |
        echo "=== SERVICIOS ==="
        systemctl is-active asterisk && echo "Asterisk: OK" || echo "Asterisk: FAIL"
        systemctl is-active apache2 && echo "Apache: OK" || echo "Apache: FAIL"
        systemctl is-active fail2ban && echo "Fail2ban: OK" || echo "Fail2ban: FAIL"
        echo ""
        echo "=== PUERTOS ==="
        ss -tlnp | grep -E '80|:443|5060|10000' || echo "Ninguno"
        echo ""
        echo "=== ACCESOS ==="
        echo "Web: http://192.168.15.11/"
        echo "Asterisk CLI: sudo asterisk -r"
        echo ""
        echo "=== EXTENSIONES ==="
        asterisk -rx "sip show peers" 2>/dev/null || echo "No se pudo mostrar peers"
      changed_when: false
      register: verif

    - name: "RESULT"
      ansible.builtin.debug:
        msg: "{{ verif.stdout_lines }}"