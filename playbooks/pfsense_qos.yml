---
- name: "Configurar QoS Traffic Shaper en pfSense"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    pfsense_ip: "192.168.16.1"
    pfsense_user: "admin"
    pfsense_pass: "qwe123$"

  tasks:
    - name: "QoS — GUIA: Configurar Traffic Shaper en pfSense (GUI)"
      debug:
        msg:
          - "=========================================="
          - "QoS — TRAFFIC SHAPER EN pfSense"
          - "=========================================="
          - ""
          - "ACCESO: https://{{ pfsense_ip }}/"
          - "Usuario: {{ pfsense_user }}"
          - "Contraseña: {{ pfsense_pass }}"
          - ""
          - "PASO 1: wizard del traffic shaper"
          - "  Firewall > Traffic Shaper > Wizards"
          - "  Seleccionar: 'Multiple LAN/WAN' o 'By Interface'"
          - ""
          - "PASO 2: configurar colas (queues)"
          - "  Disciplina: HFSC (recomendado para VoIP+Web)"
          - ""
          - "  --- COLAS RECOMENDADAS ---"
          - ""
          - "  qLink       (prioridad 7) - traffic de управления (ICMP, BGP)"
          - "  qACK        (prioridad 6) - TCP acknowledgments"
          - "  qVoIP       (prioridad 6) - Asterisk/SIP (puerto 5060, 10000-20000)"
          - "  qWeb        (prioridad 5) - HTTP/HTTPS (80, 443)"
          - "  qMail       (prioridad 4) - SMTP/IMAP (25, 993, 995)"
          - "  qBurst      (prioridad 3) - descargas temporales"
          - "  qDefault    (prioridad 2) - resto del tráfico"
          - "  qP2P        (prioridad 1) - BitTorrent, P2P (bajo)"
          - ""
          - "PASO 3: asignar reglas por IP/servicio"
          - "  Firewall > Traffic Shaper > Rules"
          - ""
          - "  --- REGLAS ---"
          - ""
          - "  VoIP (vm-voip01 192.168.15.11):"
          - "    Source: 192.168.15.11/32  >  Queue: qVoIP"
          - "    Dest:   192.168.15.11/32  >  Queue: qVoIP"
          - ""
          - "  Web (vm-web01 192.168.11.11):"
          - "    Protocol: TCP > Port: 80,443 > Queue: qWeb"
          - ""
          - "  Email (vm-services01 192.168.13.11):"
          - "    Protocol: TCP > Port: 25,993,995 > Queue: qMail"
          - ""
          - "  General LAN:"
          - "    Any > Queue: qDefault"
          - ""
          - "PASO 4: límite de ancho (bandwidth limits)"
          - ""
          - "  WAN1 (ISP2): 100Mbps"
          - "  WAN2 (ISP1 - backup): 50Mbps"
          - ""
          - "  VoIP garantiza: 2Mbps simétrico"
          - "  Web garantiza: 10Mbps down, 5Mbps up"
          - ""
          - "PASO 5: verificar"
          - "  Status > Queues"
          - "  VerTraffic.sh (Diagnostics > Traffic Shaper)"
          - ""
          - "=========================================="

    - name: "QoS — Comandos para verificar estado actual"
      debug:
        msg:
          - "=========================================="
          - "PARA VERIFICAR QoS ACTUAL EN pfSense:"
          - "=========================================="
          - ""
          - "1. Ver si hay colas activas:"
          - "   Status > Queues"
          - ""
          - "2. Ver reglas del shaper:"
          - "   Firewall > Traffic Shaper > Rules"
          - ""
          - "3. Por CLI (ssh a pfSense):"
          - "   ipfw pipe list        # ver pipes de ancho"
          - "   ipfw queue list      # ver colas"
          - ""
          - "4. Diagnóstico rápido:"
          - "   Diagnostics > Tables > sin翘"
          - ""
          - "NOTA: Sin QoS configurado, pfSense hace FIFO básico."
          - "=========================================="