---
# vm-dc01.yml — Samba 4 AD DC + DNS + ISC-DHCP Server

- name: "Configura vm-dc01 — Samba 4 AD + DNS + DHCP"
  hosts: vm-dc01
  become: true
  gather_facts: true

  vars:
    domain_name: "AJ.local"
    realm: "AJ.LOCAL"
    netbios_name: "AJ"
    domain_pass: "Admin123"
    server_ip: "192.168.16.10"

  tasks:
    # 1. CONFIGURAR RED (BONDING CON NETPLAN)
    - name: "NET — Detener NetworkManager si existe"
      ansible.builtin.systemd:
        name: NetworkManager
        state: stopped
        enabled: no
      failed_when: false

    - name: "NET — Respaldar configuración netplan actual"
      ansible.builtin.shell: |
        [ -f /etc/netplan/*.yaml ] && cp /etc/netplan/*.yaml /tmp/netplan.bak
        echo "Backup done"
      changed_when: false

    - name: "NET — Crear configuración netplan para bonding"
      ansible.builtin.copy:
        dest: /etc/netplan/60-bonding.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            bonds:
              bond0:
                interfaces: [ens34, ens35]
                addresses: [192.168.16.10/27]
                gateway4: 192.168.16.1
                nameservers:
                  addresses: [192.168.16.10, 8.8.8.8]
                parameters:
                  mode: active-backup
                  mii-monitor-interval: 100
            ethernets:
              ens34:
                dhcp4: false
              ens35:
                dhcp4: false
        force: yes

    - name: "NET — Generar y aplicar netplan"
      ansible.builtin.shell: |
        sudo netplan generate
        sudo netplan apply
        echo "NETPLAN_DONE"
      changed_when: true
      register: netplan_result

    - name: "NET — Verificar que bond0 existe"
      ansible.builtin.wait_for:
        timeout: 10
        delay: 2
        sleep: 2
      changed_when: false

    - name: "NET — Mostrar estado de interfaces"
      ansible.builtin.shell: "ip a show bond0 2>&1 || ip a"
      changed_when: false
      register: bond_status

    - name: "NET — Debug bond0 status"
      ansible.builtin.debug:
        msg: "{{ bond_status.stdout }}"

    # 2. INSTALAR PAQUETES
    - name: "PRE — Actualizar APT"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "PRE — Instalar paquetes"
      ansible.builtin.apt:
        name:
          - samba
          - bind9
          - bind9-utils
          - isc-dhcp-server
          - krb5-user
          - libpam-krb5
          - winbind
          - libpam-winbind
          - libnss-winbind
        state: present

    # 2. CONFIGURAR BIND9
    - name: "DNS — Respaldar config anterior"
      ansible.builtin.shell: |
        [ -f /etc/bind/named.conf ] && mv /etc/bind/named.conf /etc/bind/named.conf.bak
        [ -f /etc/bind/named.conf.options ] && mv /etc/bind/named.conf.options /etc/bind/named.conf.options.bak
      changed_when: false

    - name: "DNS — Crear named.conf.options"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";
              forwarders { 8.8.8.8; 8.8.4.4; };
              dnssec-validation no;
              auth-nxdomain no;
              listen-on-v6 { any; };
          };
        owner: root
        group: bind
        mode: "0640"
        force: yes

    - name: "DNS — Crear named.conf"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf
        content: |
          include "/etc/bind/named.conf.options";
        owner: root
        group: bind
        mode: "0644"
        force: yes

    - name: "DNS — Verificar config"
      ansible.builtin.shell: "named-checkconf 2>&1"
      changed_when: false

    - name: "DNS — Iniciar bind9"
      ansible.builtin.systemd:
        name: bind9
        state: started
        enabled: yes

    # 3. PROVISIONAR SAMBA 4 AD
    - name: "SAMBA — Detener servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - smbd
        - nmbd
        - winbind
      failed_when: false

    - name: "SAMBA — Provisionar dominio AD"
      ansible.builtin.shell: |
        samba-tool domain provision \
          --realm={{ realm }} \
          --domain={{ domain_name }} \
          --server-role=dc \
          --dns-backend=BIND9_DLZ \
          --adminpass='{{ domain_pass }}' \
          --use-rfc2307 \
          --quiet 2>&1
        echo "DONE"
      args:
        creates: /etc/samba/smb.conf
      register: samba_result

    - name: "SAMBA — Verificar si archivo DLZ existe"
      ansible.builtin.stat:
        path: /var/lib/samba/bind-dns/named.conf
      register: dlz_check

    - name: "SAMBA — Agregar include DLZ al named.conf (si existe)"
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        line: 'include "/var/lib/samba/bind-dns/named.conf";'
        state: present
      when: dlz_check.stat.exists
      failed_when: false

    - name: "SAMBA — Iniciar servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - smbd
        - nmbd
        - winbind

    - name: "SAMBA — Verificar dominio"
      ansible.builtin.shell: "samba-tool domain info 127.0.0.1 2>&1 || echo 'CHECK_DONE'"
      changed_when: false

    - name: "SAMBA — Reiniciar bind9 para cargar DLZ (si existe)"
      ansible.builtin.systemd:
        name: bind9
        state: restarted
      when: dlz_check.stat.exists
      failed_when: false

    # 4. CONFIGURAR DHCP
    - name: "DHCP — Crear dhcpd.conf"
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          ddns-update-style none;
          authoritative;
          log-facility local7;
          option domain-name "{{ domain_name }}";
          option domain-name-servers {{ server_ip }};
          subnet 192.168.12.0 netmask 255.255.255.0 {
              option routers 192.168.12.1;
              option subnet-mask 255.255.255.0;
              range 192.168.12.81 192.168.12.200;
          }
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "DHCP — Configurar interfaces (bond0)"
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="bond0"
        force: yes

    - name: "DHCP — Iniciar"
      ansible.builtin.systemd:
        name: isc-dhcp-server
        state: started
        enabled: yes

    # 5. VERIFICACION FINAL
    - name: "FINAL — Estado de servicios"
      ansible.builtin.shell: |
        echo "bind9:   $(systemctl is-active bind9)"
        echo "smbd:    $(systemctl is-active smbd)"
        echo "nmbd:    $(systemctl is-active nmbd)"
        echo "DHCP:    $(systemctl is-active isc-dhcp-server)"
        echo "DLZ existe: $([ -f /var/lib/samba/bind-dns/named.conf ] && echo SI || echo NO)"
      changed_when: false