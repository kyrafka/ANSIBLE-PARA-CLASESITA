---
# ============================================================================
# vm-dc01.yml — Samba 4 AD DC + DNS + ISC-DHCP Server
# ============================================================================
# VLAN: 60 (gestion)
# IP: 192.168.16.10/27
# Dominio: AJ.local
# Realm: AJ.LOCAL
# HA: Bonding ens34 + ens35 (active-backup)
# DHCP: Sirve a VLAN 20 via pfSense DHCP Relay
# ============================================================================

- name: "Configura vm-dc01 — Samba 4 AD + DNS + DHCP"
  hosts: vm-dc01
  become: true
  gather_facts: true

  vars:
    # Identidad del dominio
    domain_name: "AJ.local"
    realm: "AJ.LOCAL"
    netbios_name: "AJ"
    domain_pass: "D0mainP@ss2026!"  # Cambiar en producción

    # Interfaces HA (bonding active-backup)
    # ens34 → pfSense Master (LANT-1)
    # ens35 → pfSense Backup (LANT-2)
    bond_name: "bond0"
    nic_primary: "ens34"
    nic_secondary: "ens35"

    # Configuración de red
    server_ip: "192.168.16.10"
    server_mask: "255.255.255.224"    # /27
    server_gateway: "192.168.16.1"
    dns_forwarders:
      - "8.8.8.8"
      - "8.8.4.4"

    # DNS del dominio (propio + Google)
    nameservers:
      - "192.168.16.10"
      - "8.8.8.8"

    # Configuración DHCP
    # Todos los pools para VLAN 20 (usuarios) 192.168.12.0/25
    dhcp_subnets:
      - name: "usuarios_vlan20"
        network: "192.168.12.0"
        netmask: "255.255.255.0"
        gateway: "192.168.12.1"
        broadcast: "192.168.12.255"
        dns_server: "192.168.16.4"
        domain_name: "{{ domain_name }}"
        pools:
          - name: "admins_devs"
            range_start: "192.168.12.5"
            range_end: "192.168.12.14"
            description: "Admins y Devs - acceso total"
            options:
              - "option routers 192.168.12.1"
              - "option subnet-mask 255.255.255.0"
              - "option domain-name-servers 192.168.16.4"

          - name: "pool_devs"
            range_start: "192.168.12.15"
            range_end: "192.168.12.30"
            description: "Desarrollo"
            options:
              - "option routers 192.168.12.1"
              - "option subnet-mask 255.255.255.0"
              - "option domain-name-servers 192.168.16.4"

          - name: "pool_rrhh_finanzas"
            range_start: "192.168.12.31"
            range_end: "192.168.12.50"
            description: "RRHH y Finanzas"
            options:
              - "option routers 192.168.12.1"
              - "option subnet-mask 255.255.255.0"
              - "option domain-name-servers 192.168.16.4"

          - name: "pool_operaciones"
            range_start: "192.168.12.51"
            range_end: "192.168.12.80"
            description: "Operaciones"
            options:
              - "option routers 192.168.12.1"
              - "option subnet-mask 255.255.255.0"
              - "option domain-name-servers 192.168.16.4"

          - name: "pool_general"
            range_start: "192.168.12.81"
            range_end: "192.168.12.200"
            description: "Usuarios generales"
            options:
              - "option routers 192.168.12.1"
              - "option subnet-mask 255.255.255.0"
              - "option domain-name-servers 192.168.16.4"

  tasks:
    # =========================================================================
    # 1. PRERREQUISITOS
    # =========================================================================
    - name: "PRE — Actualizar APT"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "PRE — Instalar Samba 4, Bind9, ISC-DHCP y dependencias"
      ansible.builtin.apt:
        name:
          - samba
          - bind9
          - bind9-utils
          - bind9-doc
          - isc-dhcp-server
          - isc-dhcp-common
          - ntp
          - ntpdate
          - dnsutils
          - krb5-user
          - libpam-krb5
          - winbind
          - libpam-winbind
          - libnss-winbind
        state: present

    # =========================================================================
    # 2. CONFIGURACIÓN DE RED CON BONDING (HA)
    # =========================================================================
    - name: "NET — Crear archivo de configuración de bonding"
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "bonding"
        state: present
      changed_when: false

    - name: "NET — Detener NetworkManager (si existe)"
      ansible.builtin.systemd:
        name: NetworkManager
        state: stopped
        enabled: no
      failed_when: false

    - name: "NET — Configurar interfaces ens34 y ens35 como slaves del bond"
      ansible.builtin.template:
        src: "interfaces-bonding.j2"
        dest: /etc/network/interfaces
        mode: "0644"
        force: yes
      notify: "Restart networking"

    - name: "NET — Configurar resolv.conf"
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        regexp: "^domain|^search|^nameserver"
        state: absent
      changed_when: false

    - name: "NET — Establecer search domain y nameserver"
      ansible.builtin.blockinfile:
        path: /etc/resolv.conf
        block: |
          search {{ domain_name }}
          nameserver {{ server_ip }}
          nameserver {{ dns_forwarders[0] }}
        marker: "# {mark} Ansible managed"
        state: present

    - name: "NET — Desactivar systemd-resolved"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: no
      failed_when: false

    # =========================================================================
    # 3. NTP — Sincronización de hora (crítico para Kerberos)
    # =========================================================================
    - name: "NTP — Configurar timezone America/Lima"
      community.general.timezone:
        name: America/Lima

    - name: "NTP — Instalar y configurar NTP"
      ansible.builtin.apt:
        name:
          - chrony
        state: present

    - name: "NTP — Configurar chrony"
      ansible.builtin.template:
        src: "chrony.conf.j2"
        dest: /etc/chrony/chrony.conf
        mode: "0644"
      notify: "Restart chrony"

    # =========================================================================
    # 4. SAMBA 4 COMO ACTIVE DIRECTORY DOMAIN CONTROLLER
    # =========================================================================
    - name: "SAMBA — Detener servicios existentes antes de provisioning"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - smbd
        - nmbd
        - winbind
      failed_when: false

    - name: "SAMBA — Respaldar configuración previa"
      ansible.builtin.shell: |
        [ -f /etc/samba/smb.conf ] && cp /etc/samba/smb.conf /etc/samba/smb.conf.bak-$(date +%Y%m%d)
        echo "Backup done"
      changed_when: false

    - name: "SAMBA — Provisionar dominio AD (solo si no existe)"
      ansible.builtin.shell: |
        samba-tool domain provision \
          --server-role=dc \
          --realm={{ realm }} \
          --domain={{ domain_name }} \
          --netbios-name={{ netbios_name }} \
          --adminpass='{{ domain_pass }}' \
          --dns-backend=BIND9_DLZ \
          --use-rfc2307 \
          --quiet
        echo "Domain provisioned"
      args:
        creates: /etc/samba/smb.conf
      register: samba_provision

    - name: "SAMBA — Habilitar e iniciar servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - smbd
        - nmbd
        - winbind

# =========================================================================
    # 5. CONFIGURAR BIND9 (DNS básico - sin DLZ aún)
    # =========================================================================
    - name: "DNS — Configurar named.conf.options"
      ansible.builtin.template:
        src: "named.conf.options.j2"
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0640"
      notify: "Restart bind9"

    - name: "DNS — Habilitar e iniciar bind9"
      ansible.builtin.systemd:
        name: bind9
        state: started
        enabled: yes

    # =========================================================================
    # 6. KERBEROS - Configurar para que funcione con AD
    # =========================================================================
    - name: "KERBEROS — Configurar krb5.conf"
      ansible.builtin.template:
        src: "krb5.conf.j2"
        dest: /etc/krb5.conf
        owner: root
        group: root
        mode: "0644"
      notify: "Restart winbind"

    # =========================================================================
    # 7. CONFIGURAR DHCP SERVER CON POOLS POR ROL
    # =========================================================================
    - name: "DHCP — Detener DHCP antes de configurar"
      ansible.builtin.systemd:
        name: isc-dhcp-server
        state: stopped

    - name: "DHCP — Configurar dhcpd.conf con pools por rol"
      ansible.builtin.template:
        src: "dhcpd.conf.j2"
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: "0644"
        force: yes
      notify: "Restart dhcpd"

    - name: "DHCP — Configurar interfaces de escucha (solo VLAN 60)"
      ansible.builtin.lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: "^INTERFACESv4="
        line: 'INTERFACESv4="eth0"'
        state: present

    - name: "DHCP — Habilitar e iniciar"
      ansible.builtin.systemd:
        name: isc-dhcp-server
        state: started
        enabled: yes

    # =========================================================================
    # 8. USUARIOS Y GRUPOS INICIALES DEL DOMINIO
    # =========================================================================
    - name: "AD — Crear grupos por rol"
      ansible.builtin.shell: |
        samba-tool group add "{{ item.name }}" --description="{{ item.description }}" 2>/dev/null || echo "Group may exist"
      loop:
        - { name: "Domain Admins", description: "Administradores del dominio" }
        - { name: "Domain Users", description: "Usuarios del dominio" }
        - { name: "Domain Computers", description: "Equipos del dominio" }
        - { name: "GG_Devs", description: "Grupo de Desarrollo" }
        - { name: "GG_RRHH", description: "Grupo de RRHH y Finanzas" }
        - { name: "GG_Operaciones", description: "Grupo de Operaciones" }
        - { name: "GG_Gerencia", description: "Grupo de Gerencia" }
      register: ad_groups

    - name: "AD — Crear usuario administrador inicial"
      ansible.builtin.shell: |
        samba-tool user create admin '{{ domain_pass }}' \
          --given-name="Administrator" \
          --surname="Admin" \
          --description="Administrator del dominio" \
          2>/dev/null || echo "User may exist"
        samba-tool group addmembers "Domain Admins" admin 2>/dev/null || echo "Already member"
        echo "Admin user created"
      register: ad_admin_user

    # =========================================================================
    # 9. CUIDADOS FINALES
    # =========================================================================
    - name: "FINAL — Verificar que Samba está corriendo"
      ansible.builtin.command: "smbstatus --version"
      changed_when: false
      register: smb_version

    - name: "FINAL — Verificar DNS"
      ansible.builtin.command: "host -t SRV _kerberos._tcp.{{ domain_name }}"
      changed_when: false
      register: dns_check
      failed_when: false

    - name: "FINAL — Probar Kerberos"
      ansible.builtin.command: "kinit -k -t /var/lib/samba/private/secrets.keytab HOST/dc01.{{ domain_name }}"
      changed_when: false
      register: kinit_check
      failed_when: false

    - name: "FINAL — Mostrar resumen"
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "vm-dc01 configurado exitosamente!"
          - "=============================================="
          - "Dominio: {{ domain_name }}"
          - "Realm: {{ realm }}"
          - "IP: {{ server_ip }}/27"
          - "Gateway: {{ server_gateway }}"
          - "=============================================="
          - "Servicios activos:"
          - "  - Samba AD DC: $(systemctl is-active smbd)"
          - "  - Bind9 DNS: $(systemctl is-active bind9)"
          - "  - ISC-DHCP: $(systemctl is-active isc-dhcp-server)"
          - "  - Chrony NTP: $(systemctl is-active chrony)"
          - "=============================================="
          - "POOLs DHCP configurados:"
          - "  - admins_devs: 192.168.12.5-14"
          - "  - pool_devs: 192.168.12.15-30"
          - "  - pool_rrhh_finanzas: 192.168.12.31-50"
          - "  - pool_operaciones: 192.168.12.51-80"
          - "  - pool_general: 192.168.12.81-200"
          - "=============================================="

    # =========================================================================
    # 9. INICIAR SERVICIOS AL FINAL (después de Samba provisioning)
    # =========================================================================
    - name: "FINAL — Iniciar Bind9 DNS (después de Samba)"
      ansible.builtin.systemd:
        name: bind9
        state: started
        enabled: yes

    - name: "FINAL — Verificar si archivo DLZ existe (luego de provisioning)"
      ansible.builtin.stat:
        path: /var/lib/samba/bind-dns/named.conf
      register: dlz_file_check

    - name: "FINAL — Agregar include DLZ solo si existe"
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        line: 'include "/var/lib/samba/bind-dns/named.conf";'
        state: present
      when: dlz_file_check.stat.exists
      notify: "Restart bind9"

  handlers:
    - name: "Restart bind9"
      ansible.builtin.systemd:
        name: bind9
        state: restarted

    - name: "Restart dhcpd"
      ansible.builtin.systemd:
        name: isc-dhcp-server
        state: restarted

    - name: "Restart chrony"
      ansible.builtin.systemd:
        name: chrony
        state: restarted

    - name: "Restart winbind"
      ansible.builtin.systemd:
        name: winbind
        state: restarted

    - name: "Restart networking"
      ansible.builtin.shell: |
        ifdown --force {{ nic_primary }} 2>/dev/null || true
        ifdown --force {{ nic_secondary }} 2>/dev/null || true
        ifup {{ bond_name }}
        echo "Networking restarted"
      changed_when: true