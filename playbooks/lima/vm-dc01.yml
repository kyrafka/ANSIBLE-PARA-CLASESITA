---
# ============================================================================
# vm-dc01.yml — Samba 4 AD DC + DNS + ISC-DHCP Server (v3 Final)
# ============================================================================
# vm-dc01 tiene:
#   ens34 + ens35 → bond0 (trunks VLAN, active-backup)
#   bond0.60 → VLAN 60 con IP 192.168.16.10/27
#   ens38 → WiFi temporal (NO TOCAR)
# ============================================================================

- name: "Configura vm-dc01 — Samba 4 AD + DNS + DHCP"
  hosts: vm-dc01
  become: true
  gather_facts: true

  vars:
    domain_name: "AJ.local"
    realm: "AJ.LOCAL"
    netbios_name: "AJ"
    domain_pass: "Admin123"
    server_ip: "192.168.16.10"
    pfSense_ip: "192.168.16.1"    # Gateway VLAN 60
    server_hostname: "vm-dc01"
    iface_bond_slaves:
      - "ens34"
      - "ens35"

  tasks:
    # === 0. PREPARACIÓN DEL SISTEMA ===
    - name: "PRE — Deshabilitar systemd-resolved (conflicta con Bind9)"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: no
      ignore_errors: true

    - name: "PRE — Configurar resolv.conf manual"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          # Generado por Ansible para vm-dc01
          nameserver 127.0.0.1
          nameserver {{ pfSense_ip }}
          search {{ domain_name }}
          options ndots:0
        owner: root
        group: root
        mode: "0644"
        force: yes

    # === 1. INSTALAR PAQUETES (primero — con red original intacta) ===
    - name: "PKGS — Instalar samba"
      ansible.builtin.apt:
        name: samba
        state: present
        install_recommends: yes
      changed_when: false

    - name: "PKGS — Instalar bind9"
      ansible.builtin.apt:
        name: bind9
        state: present
        install_recommends: yes
      changed_when: false

    - name: "PKGS — Instalar isc-dhcp-server"
      ansible.builtin.apt:
        name: isc-dhcp-server
        state: present
        install_recommends: yes
      changed_when: false

    - name: "PKGS — Instalar krb5 y winbind"
      ansible.builtin.apt:
        name:
          - krb5-user
          - libpam-krb5
          - winbind
          - libpam-winbind
          - libnss-winbind
        state: present
        install_recommends: yes
      changed_when: false

    # === 2. CONFIGURAR RED (BONDING + ENS36 TEMPORAL) ===
    - name: "NET — Detener NetworkManager si existe"
      ansible.builtin.shell: |
        systemctl is-active NetworkManager >/dev/null 2>&1 && systemctl stop NetworkManager || true
        systemctl is-enabled NetworkManager >/dev/null 2>&1 && systemctl disable NetworkManager || true
        echo "OK"
      changed_when: false

    - name: "NET — Backup config netplan anterior"
      ansible.builtin.shell: |
        [ -d /etc/netplan ] && cp -r /etc/netplan /tmp/netplan.bak.$(date +%s)
        echo "Backup done"
      changed_when: false

    - name: "NET — Crear netplan con Bond0 (ens34+ens35) + Internet temp (ens36)"
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        content: |
          # vm-dc01 — Red con Bond0 (active-backup) + Internet temporal
          # Bond0: ens34+ens35 hacia gestion VLAN 60 (IP fija)
          # ens36: internet temporal (DHCP)
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens34:
                dhcp4: no
                optional: true
              ens35:
                dhcp4: no
                optional: true
              ens36:
                dhcp4: true
                optional: true
            bonds:
              bond0:
                interfaces: [ens34, ens35]
                addresses:
                  - {{ server_ip }}/27
                gateway4: {{ pfSense_ip }}
                nameservers:
                  addresses:
                    - 127.0.0.1
                    - {{ pfSense_ip }}
                  search:
                    - {{ domain_name }}
                parameters:
                  mode: active-backup
                  mii-monitor-interval: 100
                  primary: ens34
        owner: root
        group: root
        mode: "0600"
        force: yes

    - name: "NET — Aplicar netplan"
      ansible.builtin.shell: |
        sudo netplan generate
        sudo netplan apply
        sleep 3
      changed_when: true

    - name: "NET — Regenerar resolv.conf (DHCP de ens36 lo pudo sobreescribir)"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 127.0.0.1
          nameserver {{ pfSense_ip }}
          search {{ domain_name }}
          options ndots:0
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "NET — Habilitar IP Forwarding (para que funcione como router)"
      ansible.builtin.shell: |
        echo 1 > /proc/sys/net/ipv4/ip_forward
        echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/99-vm-dc01.conf
        sysctl -p /etc/sysctl.d/99-vm-dc01.conf
        echo "IP Forwarding enabled"
      changed_when: false

    - name: "NET — Verificar que bond0 tiene IP"
      ansible.builtin.shell: |
        ip addr show bond0 | grep "{{ server_ip }}"
      changed_when: false
      register: net_check

    - name: "NET — Debug estado de red"
      ansible.builtin.debug:
        msg: "{{ net_check.stdout }}"

    # === 3. CONFIGURAR BIND9 (DNS) ===
    - name: "DNS — Backup config anterior"
      ansible.builtin.shell: |
        [ -d /etc/bind ] && cp -r /etc/bind /tmp/bind.bak.$(date +%s)
        echo "backup done"
      changed_when: false

    - name: "DNS — Crear named.conf.options"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";

              # Forwarders: pfSense primero, fallback a Google
              forwarders {
                  {{ pfSense_ip }};
                  8.8.8.8;
                  8.8.4.4;
              };
              forward only;

              # Escuchar en todas las interfaces internas
              listen-on { any; };
              listen-on-v6 { none; };

              # Permitir consultas de redes internas
              allow-query {
                  localhost;
                  127.0.0.1;
                  192.168.0.0/16;
              };

              dnssec-validation no;
              auth-nxdomain no;
              recursion yes;
          };
        owner: root
        group: bind
        mode: "0640"
        force: yes

    - name: "DNS — Crear zona local AJ.local"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.local
        content: |
          # Zona directa AJ.local
          zone "AJ.local" {
              type master;
              file "/etc/bind/zones/db.AJ.local";
              allow-transfer { any; };
          };

          # Zona reversa 192.168.16.0/27
          zone "16.168.192.in-addr.arpa" {
              type master;
              file "/etc/bind/zones/db.192.168.16";
              allow-transfer { any; };
          };
        owner: root
        group: bind
        mode: "0640"
        force: yes

    - name: "DNS — Crear directorio de zonas"
      ansible.builtin.file:
        path: /etc/bind/zones
        state: directory
        owner: root
        group: bind
        mode: "0755"

    - name: "DNS — Crear archivo de zona directa db.AJ.local"
      ansible.builtin.copy:
        dest: /etc/bind/zones/db.AJ.local
        content: |
          ; Zona directa AJ.local
          ; Generado por Ansible
          $TTL    604800
          @       IN      SOA     vm-dc01.AJ.local. admin.AJ.local. (
                              3         ; Serial (YYYYMMDDNN)
                              604800    ; Refresh
                              86400     ; Retry
                              2419200   ; Expire
                              604800 )  ; Negative Cache TTL

          ; Nameservers
          @       IN      NS      vm-dc01.AJ.local.

          ; Registros A principales
          vm-dc01         IN      A       192.168.16.10
          pfsense         IN      A       192.168.16.1
          core1           IN      A       192.168.10.20
          core2           IN      A       192.168.10.30
          interlink       IN      A       10.0.0.1

          ; Alias (CNAMEs)
          www             IN      CNAME   vm-dc01
          archivos        IN      CNAME   vm-dc01
          correo          IN      CNAME   vm-dc01
          erp             IN      CNAME   vm-dc01
        owner: root
        group: bind
        mode: "0644"

    - name: "DNS — Crear archivo de zona reversa 192.168.16"
      ansible.builtin.copy:
        dest: /etc/bind/zones/db.192.168.16
        content: |
          ; Zona reversa 192.168.16.0/27
          ; Generado por Ansible
          $TTL    604800
          @       IN      SOA     vm-dc01.AJ.local. admin.AJ.local. (
                              3         ; Serial
                              604800    ; Refresh
                              86400     ; Retry
                              2419200   ; Expire
                              604800 )  ; Negative Cache TTL

          @       IN      NS      vm-dc01.AJ.local.

          ; Registros PTR
          10      IN      PTR     vm-dc01.AJ.local.
          1       IN      PTR     pfsense.AJ.local.
        owner: root
        group: bind
        mode: "0644"

    - name: "DNS — Actualizar named.conf para incluir zonas"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf
        content: |
          include "/etc/bind/named.conf.options";
          include "/etc/bind/named.conf.local";
        owner: root
        group: bind
        mode: "0644"
        force: yes

    - name: "DNS — Crear archivo de zona reversa 192.168.12 (VLAN 20)"
      ansible.builtin.copy:
        dest: /etc/bind/zones/db.192.168.12
        content: |
          ; Zona reversa 192.168.12.0/24 (VLAN 20 usuarios)
          ; Generado por Ansible
          $TTL    604800
          @       IN      SOA     vm-dc01.AJ.local. admin.AJ.local. (
                              3         ; Serial
                              604800    ; Refresh
                              86400     ; Retry
                              2419200   ; Expire
                              604800 )  ; Negative Cache TTL

          @       IN      NS      vm-dc01.AJ.local.
          ; PTR records se agregan automaticamente o manualmente segun IPs asignadas
        owner: root
        group: bind
        mode: "0644"

    - name: "DNS — Verificar sintaxis de zonas"
      ansible.builtin.shell: |
        named-checkzone AJ.local /etc/bind/zones/db.AJ.local 2>&1 || echo "Zona directa: ERROR"
        named-checkzone 16.168.192.in-addr.arpa /etc/bind/zones/db.192.168.16 2>&1 || echo "Zona reversa 16: ERROR"
        named-checkzone 12.168.192.in-addr.arpa /etc/bind/zones/db.192.168.12 2>&1 || echo "Zona reversa 12: ERROR"
      changed_when: false

    - name: "DNS — Verificar sintaxis global"
      ansible.builtin.shell: "named-checkconf 2>&1 || echo 'named-checkconf falló'"
      changed_when: false

    - name: "DNS — Reiniciar bind9 con nuevas zonas"
      ansible.builtin.systemd:
        name: named
        state: restarted
        enabled: yes

    # === 4. SAMBA 4 AD DOMAIN CONTROLLER ===
    - name: "SAMBA — Detener servicios previos"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - smbd
        - nmbd
        - winbind
      ignore_errors: true

    - name: "SAMBA — Backup smb.conf anterior"
      ansible.builtin.shell: |
        [ -f /etc/samba/smb.conf ] && mv /etc/samba/smb.conf /etc/samba/smb.conf.bak.$(date +%s)
        echo "backup done"
      changed_when: false
      ignore_errors: true

    - name: "SAMBA — Provisionar dominio Active Directory"
      ansible.builtin.shell: |
        samba-tool domain provision \
          --realm={{ realm }} \
          --domain={{ netbios_name }} \
          --server-role=dc \
          --dns-backend=BIND9_DLZ \
          --adminpass='{{ domain_pass }}' \
          --use-rfc2307 \
          --quiet 2>&1 || echo "PROVISION_DONE"
      ignore_errors: true
      changed_when: false

    - name: "SAMBA — Iniciar Samba AD DC"
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: started
        enabled: yes

    # === 5. INTEGRACIÓN BIND9 + SAMBA DLZ ===
    - name: "DLZ — Verificar si existe archivo de Samba"
      ansible.builtin.stat:
        path: /var/lib/samba/bind-dns/named.conf
      register: dlz_file

    - name: "DLZ — Incluir en Bind9 si existe"
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        line: 'include "/var/lib/samba/bind-dns/named.conf";'
        state: present
      when: dlz_file.stat.exists
      ignore_errors: true

    - name: "DLZ — Reiniciar named para cargar DLZ"
      ansible.builtin.systemd:
        name: named
        state: restarted
      when: dlz_file.stat.exists
      ignore_errors: true

    # === 6. CONFIGURAR DHCP SERVER ===
    - name: "DHCP — Crear dhcpd.conf"
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          # Configuración DHCP para vm-dc01
          # VLAN 60: Gestion (servidores)
          # VLAN 20: Usuarios ( PCs de empleados)
          ddns-update-style none;
          authoritative;
          log-facility local7;

          option domain-name "AJ.local";
          option domain-name-servers 192.168.16.10, 192.168.16.1;
          default-lease-time 3600;
          max-lease-time 7200;

          # Subnet de gestion (VLAN 60 — local, servidor DC)
          subnet 192.168.16.0 netmask 255.255.255.224 {
              option routers 192.168.16.1;
              option subnet-mask 255.255.255.224;
              option broadcast-address 192.168.16.31;
              option domain-name-servers 192.168.16.10, 192.168.16.1;
              range 192.168.16.11 192.168.16.30;
          }

          # Subnet de usuarios (VLAN 20 — via pfSense DHCP Relay)
          subnet 192.168.12.0 netmask 255.255.255.0 {
              option routers 192.168.12.1;
              option subnet-mask 255.255.255.0;
              option broadcast-address 192.168.12.255;
              option domain-name-servers 192.168.16.10, 192.168.16.1;
              option domain-name "AJ.local";
              range 192.168.12.81 192.168.12.200;
          }
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "DHCP — Configurar interfaz de escucha"
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="bond0"
        force: yes

    - name: "DHCP — Iniciar isc-dhcp-server (con reintento si falla)"
      ansible.builtin.shell: |
        sleep 2
        systemctl enable isc-dhcp-server
        systemctl restart isc-dhcp-server || systemctl start isc-dhcp-server
        systemctl is-active isc-dhcp-server
      register: dhcp_result
      changed_when: true
      ignore_errors: true

    # === 7. VERIFICACIÓN FINAL ===
    - name: "VERIF — Estado completo de servicios"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "=== ESTADO DE SERVICIOS vm-dc01 ==="
        echo "=========================================="
        for s in named samba-ad-dc isc-dhcp-server; do
          echo "$s: $(systemctl is-active $s 2>/dev/null || echo 'NO_INSTALADO')"
        done
        echo ""
        echo "=== DNS TEST ==="
        nslookup google.com 127.0.0.1 || echo "⚠ DNS interno FALLA"
        nslookup google.com {{ pfSense_ip }} 2>/dev/null || echo "⚠ DNS pfSense FALLA"
        echo ""
        echo "=== INTERFACES ==="
        ip addr show bond0 || echo "⚠ bond0 no tiene IP"
        ip addr show ens34 || echo "⚠ ens34 no tiene IP"
        echo ""
        echo "=== RUTA DEFAULT ==="
        ip route | grep default || echo "⚠ NO HAY DEFAULT GATEWAY"
        echo "=========================================="
      changed_when: false
      register: verif_final

    - name: "VERIF — Mostrar resultados"
      ansible.builtin.debug:
        msg: "{{ verif_final.stdout_lines }}"