---
# ============================================================================
# vm-dc01.yml — Samba 4 AD DC + DNS + ISC-DHCP Server
# ============================================================================

- name: "Configura vm-dc01 — Samba 4 AD + DNS + DHCP"
  hosts: vm-dc01
  become: true
  gather_facts: true

  vars:
    domain_name: "AJ.local"
    realm: "AJ.LOCAL"
    netbios_name: "AJ"
    domain_pass: "Admin123"
    server_ip: "192.168.16.10"

  tasks:
    # =========================================================================
    # 1. INSTALAR PAQUETES
    # =========================================================================
    - name: "PRE — Actualizar APT"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "PRE — Instalar paquetes"
      ansible.builtin.apt:
        name:
          - samba
          - bind9
          - bind9-utils
          - isc-dhcp-server
          - krb5-user
          - libpam-krb5
          - winbind
          - libpam-winbind
          - libnss-winbind
        state: present

    # =========================================================================
    # 2. CONFIGURAR BIND9 (DNS)
    # =========================================================================
    - name: "DNS — Respaldar configuración bind9 anterior"
      ansible.builtin.shell: |
        [ -f /etc/bind/named.conf ] && mv /etc/bind/named.conf /etc/bind/named.conf.bak
        [ -f /etc/bind/named.conf.options ] && mv /etc/bind/named.conf.options /etc/bind/named.conf.options.bak
        echo "Backup done"
      changed_when: false

    - name: "DNS — Crear named.conf.options limpio"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";
              forwarders { 8.8.8.8; 8.8.4.4; };
              dnssec-validation no;
              auth-nxdomain no;
              listen-on-v6 { any; };
          };
        owner: root
        group: bind
        mode: "0640"
        force: yes

    - name: "DNS — Crear named.conf principal"
      ansible.builtin.copy:
        dest: /etc/bind/named.conf
        content: |
          include "/etc/bind/named.conf.options";
        owner: root
        group: bind
        mode: "0644"
        force: yes

    - name: "DNS — Verificar y crear zona para el dominio"
      ansible.builtin.shell: |
        named-checkconf 2>&1
        echo "CHECK_OK"
      changed_when: false
      register: dns_check

    - name: "DNS — Iniciar bind9"
      ansible.builtin.systemd:
        name: bind9
        state: started
        enabled: yes
      register: bind9_result

    # =========================================================================
    # 3. PROVISIONAR SAMBA 4 AD
    # =========================================================================
    - name: "SAMBA — Detener servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - smbd
        - nmbd
        - winbind
      failed_when: false

    - name: "SAMBA — Provisionar dominio AD"
      ansible.builtin.shell: |
        samba-tool domain provision \
          --realm={{ realm }} \
          --domain={{ domain_name }} \
          --server-role=dc \
          --dns-backend=BIND9_DLZ \
          --adminpass='{{ domain_pass }}' \
          --use-rfc2307 \
          --quiet 2>&1
        echo "DONE:$?"
      args:
        creates: /etc/samba/smb.conf
      register: samba_result

    - name: "SAMBA — Agregar include DLZ al named.conf"
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        line: 'include "/var/lib/samba/bind-dns/named.conf";'
        state: present
      when: true
      failed_when: false
      notify: Restart bind9

    - name: "SAMBA — Iniciar servicios"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - smbd
        - nmbd
        - winbind

    - name: "SAMBA — Verificar dominio"
      ansible.builtin.shell: |
        samba-tool domain info 127.0.0.1 2>&1 || echo "DOMAIN_CHECK_DONE"
      changed_when: false
      register: domain_info

    - name: "SAMBA — Mostrar info del dominio"
      ansible.builtin.debug:
        msg: "{{ domain_info.stdout }}"

    # =========================================================================
    # 4. CONFIGURAR DHCP
    # =========================================================================
    - name: "DHCP — Crear dhcpd.conf"
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          ddns-update-style none;
          authoritative;
          log-facility local7;
          option domain-name "{{ domain_name }}";
          option domain-name-servers {{ server_ip }};
          subnet 192.168.12.0 netmask 255.255.255.0 {
              option routers 192.168.12.1;
              option subnet-mask 255.255.255.0;
              range 192.168.12.81 192.168.12.200;
          }
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "DHCP — Configurar interfaces"
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="eth0"
        force: yes

    - name: "DHCP — Iniciar"
      ansible.builtin.systemd:
        name: isc-dhcp-server
        state: started
        enabled: yes
      register: dhcp_result

    # =========================================================================
    # 5. VERIFICACIÓN FINAL
    # =========================================================================
    - name: "FINAL — Estado de servicios"
      ansible.builtin.shell: |
        echo "=========================================="
        echo "bind9:   $(systemctl is-active bind9)"
        echo "smbd:    $(systemctl is-active smbd)"
        echo "nmbd:    $(systemctl is-active nmbd)"
        echo "winbind: $(systemctl is-active winbind)"
        echo "DHCP:    $(systemctl is-active isc-dhcp-server)"
        echo "=========================================="
      changed_when: false

  handlers:
    - name: Restart bind9
      ansible.builtin.systemd:
        name: bind9
        state: restarted