---
# ============================================================================
# vm-dns02_zabbix_agent.yml — Agregar Zabbix Agent2 a vm-dns02
# ============================================================================
# Correr DENTRO de vm-dns02 (192.168.16.11)
# ============================================================================

- name: "vm-dns02 — Instalar Zabbix Agent2"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    zabbix_server: "192.168.17.11"
    hostname_agent: "vm-dns02"

  tasks:
    - name: "PKG — Agregar repo Zabbix"
      ansible.builtin.apt:
        deb: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb"
        state: present
      ignore_errors: true

    - name: "PKG — Update + instalar zabbix-agent2"
      ansible.builtin.apt:
        update_cache: yes
        name: zabbix-agent2
        state: present

    - name: "AGENT — Configurar zabbix_agent2.conf"
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_agent2.conf
        content: |
          Server={{ zabbix_server }},127.0.0.1
          ServerActive={{ zabbix_server }}
          Hostname={{ hostname_agent }}
          ListenPort=10050
          ListenIP=0.0.0.0
          LogFile=/var/log/zabbix/zabbix_agent2.log
          LogFileSize=10
          DebugLevel=3
          Timeout=30
          AllowUnsupportedParameters=1
        owner: zabbix
        group: zabbix
        mode: "0644"
        force: yes

    - name: "AGENT — Reiniciar zabbix-agent2"
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
        enabled: yes

    - name: "AGENT — Verificar"
      ansible.builtin.shell: |
        systemctl is-active zabbix-agent2
      changed_when: false
      register: agent_status

    - name: "AGENT — Resultado"
      ansible.builtin.debug:
        msg: "zabbix-agent2: {{ agent_status.stdout }}"
