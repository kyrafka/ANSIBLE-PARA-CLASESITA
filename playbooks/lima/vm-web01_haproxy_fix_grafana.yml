---
# ============================================================================
# vm-web01_haproxy_fix_grafana.yml — Fix HAProxy para Grafana/Portainer sin loop
# ============================================================================
# Correr DENTRO de vm-web01 (192.168.11.11)
# Solucion: use_backend con path_beg + replace-path en backend + Location header fix
# ============================================================================

- name: "vm-web01 — Fix HAProxy Grafana/Portainer"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: "HAProxy — Nueva configuracion"
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin
              stats timeout 30s
              user haproxy
              group haproxy
              daemon
              maxconn 4096

          defaults
              log     global
              mode    http
              option  httplog
              option  dontlognull
              option  http-server-close
              option  forwardfor except 127.0.0.0/8
              option  redispatch
              retries 3
              timeout connect 5000
              timeout client  50000
              timeout server  50000

          frontend http_front
              bind *:80

              # === ACLs ===
              acl is_grafana path_beg /grafana/
              acl is_portainer path_beg /portainer/
              acl is_dolibarr path_beg /dolibarr/
              acl is_wordpress path_beg /wp- /wp-content /wp-includes /
              acl is_webmail path_beg /webmail /roundcube /mail
              acl is_voip path_beg /voip /asterisk /pbx

              # === Routing (orden importa) ===
              use_backend grafana_backend if is_grafana
              use_backend portainer_backend if is_portainer
              use_backend dolibarr_backend if is_dolibarr
              use_backend wordpress_backend if is_wordpress
              use_backend webmail_backend if is_webmail
              use_backend voip_backend if is_voip
              default_backend wordpress_backend

          backend wordpress_backend
              option forwardfor
              balance roundrobin
              server web01 127.0.0.1:8080 check
              server web02 192.168.11.12:8080 check

          backend grafana_backend
              option forwardfor
              http-request replace-path ^/grafana/(.*) /\1
              http-response replace-value Location ^http://[^/]+/grafana http://%[hdr(host)] if { res.hdr(Location) -m found }
              server grafana 192.168.13.12:3000 check

          backend portainer_backend
              option forwardfor
              http-request replace-path ^/portainer/(.*) /\1
              server portainer 192.168.13.12:9000 check

          backend dolibarr_backend
              option forwardfor
              http-request replace-path ^/dolibarr/(.*) /\1
              server dolibarr 192.168.13.11:80 check

          backend webmail_backend
              option forwardfor
              server webmail 192.168.13.11:80 check

          backend voip_backend
              option forwardfor
              server voip 192.168.15.11:80 check

          listen stats
              bind 0.0.0.0:8404
              mode http
              stats enable
              stats uri /haproxy
              stats refresh 30s
              stats auth admin:H4proxy2024!
        owner: root
        group: root
        mode: "0644"
        force: yes

    - name: "HAProxy — Validar"
      ansible.builtin.shell: |
        haproxy -c -f /etc/haproxy/haproxy.cfg 2>&1
      changed_when: false
      register: check

    - name: "HAProxy — Resultado"
      ansible.builtin.debug:
        msg: "{{ check.stdout }}"

    - name: "HAProxy — Reiniciar"
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
      when: "'Configuration file is valid' in check.stdout"

    - name: "HAProxy — Verificar"
      ansible.builtin.shell: |
        systemctl is-active haproxy
      changed_when: false
      register: status

    - name: "HAProxy — Estado"
      ansible.builtin.debug:
        msg: "{{ status.stdout }}"