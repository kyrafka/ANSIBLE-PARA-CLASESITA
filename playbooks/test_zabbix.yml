---
# ============================================================================
# test_zabbix.yml — Prueba conectividad, govc, scripts y Zabbix
# ============================================================================
# Uso: sudo ansible-playbook playbooks/test_zabbix.yml -i inventario/hosts.yml
# ============================================================================

- name: "TEST — Zabbix + ESXi via govc"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    esxi_host: "172.17.25.12"
    esxi_port: "443"
    esxi_user: "root"
    esxi_pass: "qwe123$"
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"
    vms:
      - { name: "vm-dc01",       ip: "192.168.16.10" }
      - { name: "vm-web01",      ip: "192.168.11.11" }
      - { name: "vm-services01", ip: "192.168.13.11" }
      - { name: "vm-storage01",  ip: "192.168.14.11" }
      - { name: "vm-voip01",     ip: "192.168.15.11" }
      - { name: "vm-monitor01",  ip: "192.168.17.11" }
      - { name: "vm-docker01",   ip: "192.168.13.12" }

  tasks:

    # =========================================================================
    # 1. Zabbix API
    # =========================================================================
    - name: "TEST 1 — Zabbix API"
      ansible.builtin.uri:
        url: "{{ zabbix_api }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "apiinfo.version"
          params: {}
          id: 1
        status_code: 200
      register: api_test
      failed_when: false

    - name: "TEST 1 — Resultado"
      ansible.builtin.debug:
        msg: "Zabbix API: {{ 'OK — v' + api_test.json.result if api_test.status == 200 else 'FALLO' }}"

    # =========================================================================
    # 2. Ping a VMs
    # =========================================================================
    - name: "TEST 2 — Ping a VMs"
      ansible.builtin.command:
        cmd: "ping -c 1 -W 2 {{ item.ip }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: ping_results
      failed_when: false
      changed_when: false

    - name: "TEST 2 — Resultados ping"
      ansible.builtin.debug:
        msg: "{{ item.item.name }} ({{ item.item.ip }}): {{ 'OK' if item.rc == 0 else 'NO RESPONDE' }}"
      loop: "{{ ping_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # =========================================================================
    # 3. govc instalado
    # =========================================================================
    - name: "TEST 3 — govc instalado"
      ansible.builtin.stat:
        path: /usr/local/bin/govc
      register: govc_stat

    - name: "TEST 3 — Version govc"
      ansible.builtin.command:
        cmd: govc version
      register: govc_ver
      failed_when: false
      changed_when: false
      when: govc_stat.stat.exists

    - name: "TEST 3 — Resultado govc"
      ansible.builtin.debug:
        msg: "govc: {{ govc_ver.stdout if govc_stat.stat.exists else 'NO INSTALADO' }}"

    # =========================================================================
    # 4. govc conecta al ESXi y lista VMs
    # =========================================================================
    - name: "TEST 4 — Listar VMs en ESXi via govc"
      ansible.builtin.command:
        cmd: govc vm.list
      environment:
        GOVC_URL: "https://{{ esxi_user }}:{{ esxi_pass }}@{{ esxi_host }}:{{ esxi_port }}"
        GOVC_INSECURE: "1"
      register: govc_vms
      failed_when: false
      changed_when: false

    - name: "TEST 4 — VMs en ESXi"
      ansible.builtin.debug:
        msg: "ESXi VMs: {{ govc_vms.stdout_lines if govc_vms.rc == 0 else 'FALLO — ' + govc_vms.stderr }}"

    # =========================================================================
    # 5. Estado de vm-web01 en ESXi
    # =========================================================================
    - name: "TEST 5 — Estado de vm-web01"
      ansible.builtin.command:
        cmd: govc vm.info vm-web01
      environment:
        GOVC_URL: "https://{{ esxi_user }}:{{ esxi_pass }}@{{ esxi_host }}:{{ esxi_port }}"
        GOVC_INSECURE: "1"
      register: web01_info
      failed_when: false
      changed_when: false

    - name: "TEST 5 — Resultado vm-web01"
      ansible.builtin.debug:
        msg: "{{ web01_info.stdout_lines if web01_info.rc == 0 else 'FALLO: ' + web01_info.stderr }}"

    # =========================================================================
    # 6. Scripts existen y son ejecutables
    # =========================================================================
    - name: "TEST 6 — Scripts"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/vm-poweron.sh
        - /usr/local/bin/service-restart.sh
      register: scripts_stat

    - name: "TEST 6 — Resultado scripts"
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'OK' if item.stat.exists and item.stat.executable else 'FALTA' }}"
      loop: "{{ scripts_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # =========================================================================
    # 7. Simular vm-poweron.sh con vm-web01 (dry-run — solo info)
    # =========================================================================
    - name: "TEST 7 — Simular PowerOn vm-web01 (solo muestra estado)"
      ansible.builtin.command:
        cmd: govc vm.info vm-web01
      environment:
        GOVC_URL: "https://{{ esxi_user }}:{{ esxi_pass }}@{{ esxi_host }}:{{ esxi_port }}"
        GOVC_INSECURE: "1"
      register: poweron_dry
      failed_when: false
      changed_when: false

    - name: "TEST 7 — Si vm-web01 esta apagada, la enciende"
      ansible.builtin.command:
        cmd: /usr/local/bin/vm-poweron.sh vm-web01
      register: poweron_result
      failed_when: false
      changed_when: false
      become: true
      when: "'poweredOff' in (poweron_dry.stdout | default(''))"

    - name: "TEST 7 — Resultado PowerOn"
      ansible.builtin.debug:
        msg: "{{ poweron_result.stdout_lines | default(['vm-web01 ya estaba encendida o no aplica']) }}"

    # =========================================================================
    # 8. RESUMEN
    # =========================================================================
    - name: "RESUMEN — Estado general"
      ansible.builtin.debug:
        msg:
          - "======================================="
          - "RESUMEN TEST ZABBIX + ESXi (govc)"
          - "======================================="
          - "Zabbix API:  {{ 'OK' if api_test.status == 200 else 'FALLO' }}"
          - "govc:        {{ 'OK' if govc_stat.stat.exists else 'NO INSTALADO' }}"
          - "ESXi conexion: {{ 'OK' if govc_vms.rc == 0 else 'FALLO' }}"
          - "Script PowerOn: {{ 'OK' if scripts_stat.results[0].stat.exists else 'FALTA' }}"
          - "VMs por ping:"
          - "{% for r in ping_results.results %}  {{ r.item.name }}: {{ 'OK' if r.rc == 0 else 'NO' }}{% endfor %}"
          - "VMs en ESXi:"
          - "{% for v in govc_vms.stdout_lines | default([]) %}  {{ v }}{% endfor %}"
          - "======================================="
