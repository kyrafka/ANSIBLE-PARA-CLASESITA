---
# ============================================================================
# isp_bgp.yml — Configura FRR + BGP en ISP_CREATE1 o ISP_CREATE2
# ============================================================================
# Uso:
#   # Para ISP_CREATE1 (192.168.2.1/24, AS65001):
#   sudo ansible-playbook playbooks/isp_bgp.yml
#
#   # Para ISP_CREATE2 (192.168.1.1/24, AS65002):
#   sudo ansible-playbook playbooks/isp_bgp.yml -e "isp_id=2"
#
# Pre-requisitos:
#   - ISP_CREATE1 o ISP_CREATE2 ya tiene netplan aplicado
#   - pfSense conectado a eth0/ens35 con IP estática (.2)
# ============================================================================

- name: "Configurar ISP con FRR y eBGP hacia pfSense"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # -------------------------------------------------------------------------
    # EDITAR estas variables según el ISP que estás configurando
    # -------------------------------------------------------------------------
    # isp_id: 1  -> ISP_CREATE1 (192.168.2.0/24, AS65001, eth0)
    # isp_id: 2  -> ISP_CREATE2 (192.168.1.0/24, AS65002, ens35)
    # -------------------------------------------------------------------------
    isp_id: 1

    # Mapeo de variables según ISP
    isp_config:
      "1":
        as: "65001"
        wan_ip: "172.17.25.95/24"
        wan_ip2: "172.17.25.36/24"
        wan_gw: "172.17.25.121"
        lan_interface: "eth0"
        lan_ip: "192.168.2.1/24"
        pf_ip: "192.168.2.2"        # IP del pfSense en esta red
      "2":
        as: "65002"
        wan_ip: "172.17.25.88/24"
        wan_gw: "172.17.25.121"
        lan_interface: "ens35"
        lan_ip: "192.168.1.1/24"
        pf_ip: "192.168.1.2"        # IP del pfSense en esta red

    # Configuración pfSense (igual para ambos)
    pf_as: "65000"

    # Extraer config del ISP actual
    current_isp: "{{ isp_config[isp_id | string] }}"

  tasks:
    - name: "BGP — Extraer parámetros del ISP actual"
      ansible.builtin.set_fact:
        isp_as: "{{ current_isp.as }}"
        isp_lan_if: "{{ current_isp.lan_interface }}"
        isp_lan_ip: "{{ current_isp.lan_ip }}"
        isp_pf_ip: "{{ current_isp.pf_ip }}"
        isp_wan_ip: "{{ current_isp.wan_ip }}"
        isp_wan_gw: "{{ current_isp.wan_gw }}"

    - name: "BGP — Instalar FRR"
      ansible.builtin.apt:
        name:
          - frr
        state: present
        update_cache: true

    - name: "BGP — Crear directorio de log FRR si no existe"
      ansible.builtin.file:
        path: "/var/log/frr"
        state: directory
        owner: frr
        group: frr
        mode: "0755"

    - name: "BGP — Renderizar frr.conf para ISP con eBGP"
      ansible.builtin.template:
        src: "frr_isp.conf.j2"
        dest: "/etc/frr/frr.conf"
        owner: frr
        group: frr
        mode: "0640"
        backup: yes
      vars:
        hostname: "ISP-CREATE{{ isp_id }}"
        router_id: "{{ isp_lan_ip | ansible.utils.ipaddr('address') }}"
        bgp_local_as: "{{ isp_as }}"
        bgp_neighbor_ip: "{{ isp_pf_ip }}"
        bgp_neighbor_as: "{{ pf_as }}"
        lan_network: "{{ isp_lan_ip }}"
        wan_network: "{{ isp_wan_ip }}"
      notify: "Restart FRR"

    - name: "BGP — Habilitar bgpd en daemons"
      ansible.builtin.template:
        src: "daemons_bgp.j2"
        dest: "/etc/frr/daemons"
        owner: frr
        group: frr
        mode: "0640"
      notify: "Restart FRR"

    - name: "BGP — Asegurar que FRR está corriendo"
      ansible.builtin.systemd:
        name: frr
        state: started
        enabled: yes
        daemon_reload: yes

    - name: "BGP — Verificar estado de FRR"
      ansible.builtin.command: "systemctl status frr --no-pager"
      changed_when: false
      register: frr_status

    - name: "BGP — Mostrar estado"
      ansible.builtin.debug:
        msg:
          - "ISP_CREATE{{ isp_id }} configurado correctamente."
          - "AS Local: {{ isp_as }}"
          - "Neighbor: {{ isp_pf_ip }} (AS{{ pf_as }})"
          - "Red LAN: {{ isp_lan_ip }}"
          - "FRR Status: {{ frr_status.stdout_lines[0] | default('Unknown') }}"

  handlers:
    - name: "Restart FRR"
      ansible.builtin.systemd:
        name: frr
        state: restarted
        daemon_reload: yes