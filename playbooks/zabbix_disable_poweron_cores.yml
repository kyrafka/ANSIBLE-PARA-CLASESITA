---
# ============================================================================
# zabbix_disable_poweron_cores.yml
# Deshabilita temporalmente las acciones de PowerOn para evitar bucles
# ============================================================================

- name: "Deshabilitar acciones de PowerOn para cores"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    zabbix_api: "http://192.168.17.11/zabbix/api_jsonrpc.php"

  tasks:
    - name: "AUTH — Obtener token"
      ansible.builtin.shell: |
        RESULT=$(curl -s -X POST "{{ zabbix_api }}" \
          -H "Content-Type: application/json-rpc" \
          -d '{"jsonrpc":"2.0","method":"user.login","params":{"username":"Admin","password":"zabbix"},"id":1}')
        echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',''))"
      changed_when: false
      register: token_raw

    - name: "AUTH — Guardar token"
      ansible.builtin.set_fact:
        zabbix_token: "{{ token_raw.stdout }}"

    - name: "ACTIONS — Deshabilitar acciones de PowerOn"
      ansible.builtin.shell: |
        TOKEN="{{ zabbix_token }}"
        API="{{ zabbix_api }}"

        echo "=== Buscando actions de PowerOn ==="

        # Buscar y deshabilitar action "AXIOM: VMware PowerOn"
        ACTION_ID=$(curl -s -X POST "$API" \
          -H "Content-Type: application/json-rpc" \
          -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"filter\":{\"name\":[\"AXIOM: VMware PowerOn\"]}},\"auth\":\"$TOKEN\",\"id\":1}" \
          | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['actionid'] if r else '')")

        if [ -n "$ACTION_ID" ]; then
          echo "Deshabilitando action ID: $ACTION_ID"
          curl -s -X POST "$API" \
            -H "Content-Type: application/json-rpc" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.update\",\"params\":{\"actionid\":$ACTION_ID,\"status\":1},\"auth\":\"$TOKEN\",\"id\":2}"
          echo "Action deshabilitada"
        else
          echo "Action no encontrada, buscando otra..."
          # Buscar cualquier action con "PowerOn"
          curl -s -X POST "$API" \
            -H "Content-Type: application/json-rpc" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"action.get\",\"params\":{\"output\":[\"actionid\",\"name\",\"status\"]},\"auth\":\"$TOKEN\",\"id\":3}" \
            | python3 -c "import sys,json; [print(a['actionid'], a['name'], 'DISABLED' if a['status']=='1' else 'ENABLED') for a in json.load(sys.stdin).get('result',[])]"
        fi

        echo "=== Done ==="
      changed_when: false
      register: disable_result

    - name: "RESULT"
      ansible.builtin.debug:
        msg:
          - "Acciones de PowerOn DESHABILITADAS para evitar bucles"
          - "{{ disable_result.stdout }}"
          - ""
          - "NOTA: Una vez que los agentes de cores estén estables,"
          - "ejecutar el playbook de nuevo con state=present para habilitar."