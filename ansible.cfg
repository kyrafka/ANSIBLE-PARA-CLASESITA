[defaults]
inventory = inventario/hosts.yml
transport = local
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
nocows = 1
deprecation_warnings = False
interpreter_python = auto_silent
timeout = 60

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_timeout = 60